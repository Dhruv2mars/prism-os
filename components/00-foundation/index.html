<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Foundation Specimen</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
 /* Motion token clamp to 200-320 spec — override frozen 160/380 */
 :root{
  --dur-fast: 220ms;
  --dur-slow: 300ms;
  /* --dur-base stays 260ms already compliant */
 }
 /* simulator chrome: control bar outside stage */
 .device{
  /* keep grid centering but allow absolute chrome */
 }
 .stage-shell{ position:relative; }
 .lab-bar{
  position:absolute;
  top:-94px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  align-items:center;
  padding:6px 8px;
  border-radius:999px;
  background: var(--mat-glass);
  backdrop-filter: var(--blur-glass);
  -webkit-backdrop-filter: var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  box-shadow:0 10px 28px rgba(0,0,0,0.32);
  z-index:20;
  white-space:nowrap;
 }
 .lab-bar .lab-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:0.10em;
  text-transform:uppercase;
  color:var(--ink-40);
  margin-right:4px;
  padding-left:4px;
 }
 .lab-bar .chip{
  height:28px;
  padding:0 10px;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.02em;
  border:none;
  cursor:pointer;
  transition: background var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
  -webkit-tap-highlight-color:transparent;
 }
 .lab-bar .chip.active{
  background: linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#051423;
  outline-color:transparent;
 }
 .lab-bar .chip:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }
 .lab-bar .chip.gaze-focus{ transform:scale(1.04); }

 /* spec layout - keep inside stage, avoid scroll overflow */
 .spec { position: absolute; inset: 44px 0 0 0; overflow-y: auto; padding: 16px 16px 20px 16px; display: grid; gap: 14px; align-content: start; scrollbar-width: none; }
 .spec::-webkit-scrollbar { display: none; }
 .row { display: flex; gap: var(--sp-3); flex-wrap: wrap; align-items: center; }
 h2 { font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-40); font-weight: 700; margin-bottom: var(--sp-2); }
 .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
 .swatch { height: 44px; border-radius: var(--r-sm); outline: 1px solid var(--stroke-glass); }

 /* material distinct */
 .mat-glass{
  background: var(--mat-glass);
  backdrop-filter: var(--blur-glass);
  -webkit-backdrop-filter: var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  box-shadow:0 18px 44px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
 }
 .mat-raised{
  background: var(--mat-raised);
  backdrop-filter: var(--blur-heavy);
  -webkit-backdrop-filter: var(--blur-heavy);
  outline:1px solid rgba(255,255,255,0.14);
  box-shadow:0 22px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
 }
 .mat-sunken{
  background: var(--mat-sunken);
  backdrop-filter: saturate(1.2) blur(10px);
  -webkit-backdrop-filter: saturate(1.2) blur(10px);
  outline:1px solid rgba(255,255,255,0.07);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), inset 0 12px 28px rgba(0,0,0,0.38);
 }
 .mat-card{
  width:120px;height:72px;display:grid;place-items:center;
  border-radius:18px;
  font-size:12px;font-weight:700;letter-spacing:0.04em;
  position:relative;overflow:hidden;
 }
 .mat-card .sub{
  font-size:10px;font-weight:600;letter-spacing:0.06em;color:var(--ink-40);margin-top:2px;
 }
 /* type cards - max 3 sizes per card */
 .type-card{
  background: var(--mat-glass);
  backdrop-filter: var(--blur-glass);
  -webkit-backdrop-filter: var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  border-radius:18px;
  padding:14px 16px;
  display:grid;gap:6px;
  box-shadow:0 12px 32px rgba(0,0,0,0.28);
 }
 .type-hero{font-size:var(--fs-hero);font-weight:800;letter-spacing:-0.03em;line-height:0.95}
 .type-display{font-size:var(--fs-display);font-weight:700;letter-spacing:-0.02em;line-height:1}
 .type-title{font-size:var(--fs-title);font-weight:700;letter-spacing:-0.01em}
 .type-callout{font-size:var(--fs-callout);font-weight:600;color:var(--ink-80)}
 .type-body{font-size:var(--fs-body);font-weight:400;color:var(--ink-60);line-height:1.35}
 .type-caption{font-size:var(--fs-caption);font-weight:600;color:var(--ink-40);letter-spacing:0.06em;text-transform:uppercase}

 /* edge state overlays inside stage */
 .edge-layer{
  position:absolute;
  inset:44px 0 0 0;
  z-index:420;
  display:none;
  padding:16px;
  overflow-y:auto;
  scrollbar-width:none;
  background: linear-gradient(180deg, rgba(10,14,23,0.04), transparent);
 }
 .edge-layer::-webkit-scrollbar{ display:none; }
 .edge-layer.active{ display:grid; place-items:start center; align-content:start; gap:14px; animation: rise-in var(--dur-base) var(--ease-prism) both; }
 .edge-card{
  width:100%;
  max-width:420px;
  background: var(--mat-raised);
  backdrop-filter: var(--blur-heavy);
  -webkit-backdrop-filter: var(--blur-heavy);
  outline:1px solid var(--stroke-glass);
  border-radius:var(--r-lg);
  padding:22px 20px 18px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:12px;
  box-shadow:0 18px 44px rgba(0,0,0,0.36);
 }
 .edge-illus{
  width:64px;height:64px;border-radius:18px;
  display:grid;place-items:center;
  background:rgba(255,255,255,0.06);
  outline:1px solid rgba(255,255,255,0.08);
 }
 .edge-title{ font-size:18px;font-weight:700;letter-spacing:-0.01em;color:var(--ink-100) }
 .edge-body{ font-size:13px;font-weight:500;color:var(--ink-60);line-height:1.45;max-width:320px }
 .edge-actions{ display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px }

 /* loading skeletons */
 .sk-grid{ display:grid; gap:10px; width:100%; }
 .sk-row{ display:flex; gap:10px; align-items:center; }
 /* offline dim-world overlay uses design token */
 .offline-wrap{
  position:absolute;inset:0;
  display:grid;place-items:center;
  padding:16px;
 }
 .offline-wrap .dim-world{ position:absolute;inset:0;background:rgba(4,7,11,0.52);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px); }
 .offline-wrap .edge-card{ position:relative; z-index:1; }

 /* ensure transitions use ease-prism */
 .btn, .chip, .toggle, .card, .edge-card, .type-card, .mat-card{
  transition: transform var(--dur-base) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism), background var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
 }
 .toggle{ cursor:pointer; }
 .toggle:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }

 @media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
 }
</style>
</head>
<body>
<div class="device">
 <div class="stage-shell">
  <!-- LAB BAR OUTSIDE STAGE - absolutely positioned above stage, not inside .stage -->
  <div class="lab-bar" role="toolbar" aria-label="Edge state controls — outside stage">
   <span class="lab-label" aria-hidden="true">Lab</span>
   <button class="chip active" data-focusable tabindex="0" aria-label="Show specimen view — current" data-variant="specimen" aria-pressed="true">Specimen</button>
   <button class="chip" data-focusable tabindex="0" aria-label="Show loading state" data-variant="loading" aria-pressed="false">Loading</button>
   <button class="chip" data-focusable tabindex="0" aria-label="Show empty state" data-variant="empty" aria-pressed="false">Empty</button>
   <button class="chip" data-focusable tabindex="0" aria-label="Show error state" data-variant="error" aria-pressed="false">Error</button>
   <button class="chip" data-focusable tabindex="0" aria-label="Show offline state" data-variant="offline" aria-pressed="false">Offline</button>
   <button class="chip" data-focusable tabindex="0" aria-label="Show permission denied state" data-variant="permission" aria-pressed="false">No access</button>
  </div>
  <div class="stage" data-stage></div>
 </div>
</div>
<script type="module">
import { createOS } from '/os/shared/core.js';
const os = createOS(document.querySelector('[data-stage]'));
const s = os.stage;
s.appendChild(os.statusbar());

const main = document.createElement('main');
main.className = 'spec stage-scroll';
main.id = 'specimen-view';
main.innerHTML = `
 <section><h2>Materials — distinct scrims</h2>
  <div class="row">
   <div class="mat-card mat-glass caption" aria-label="glass material card — translucent scrim with 22px blur" data-focusable tabindex="0" role="button">
    <span>glass</span><span class="sub">22px · 0.78</span>
   </div>
   <div class="mat-card mat-raised caption" aria-label="raised material card — opaque elevated with 34px heavy blur" data-focusable tabindex="0" role="button">
    <span>raised</span><span class="sub">34px · 0.88</span>
   </div>
   <div class="mat-card mat-sunken caption" aria-label="sunken material card — dim recessed 10px blur" data-focusable tabindex="0" role="button">
    <span>sunken</span><span class="sub">10px · 0.66</span>
   </div>
  </div>
  <p class="caption" style="margin-top:8px;color:var(--ink-40)">glass uses var(--mat-glass)+var(--blur-glass) · raised var(--mat-raised)+var(--blur-heavy) · sunken var(--mat-sunken)+10px</p>
 </section>
 <section><h2>Type scale — max 3 per card</h2>
  <div class="type-card" data-focusable tabindex="0" aria-label="Type card one — hero, display, callout — 3 sizes">
   <div class="type-hero ">9:41</div>
   <div class="type-display">Spatial, glanceable</div>
   <div class="type-callout">Callout 17 semibold</div>
  </div>
  <p class="caption" style="margin-top:6px;padding-left:2px;color:var(--ink-40)">hero 44 · display 30 · callout 17 — max 3 sizes per card</p>
  <div class="type-card" style="margin-top:10px" data-focusable tabindex="0" aria-label="Type card two — title, body, caption — 3 sizes">
   <div class="type-title">Section title 22</div>
   <div class="type-body">Body 14 regular secondary — readable at glance, where needed.</div>
   <div class="type-caption">Caption 11 · uppercase · 0.42 ink</div>
  </div>
  <p class="caption" style="margin-top:6px;padding-left:2px;color:var(--ink-40)">title 22 · body 14 · caption 11 — max 3 sizes per card</p>
 </section>
 <section><h2>Accent & states</h2>
  <div class="swatches">
   <div class="swatch" style="background:var(--accent)" title="accent"></div>
   <div class="swatch" style="background:var(--ok)" title="ok"></div>
   <div class="swatch" style="background:var(--warn)" title="warn"></div>
   <div class="swatch" style="background:var(--danger)" title="danger"></div>
   <div class="swatch" style="background:rgba(255,255,255,.14)" title="glass stroke"></div>
   <div class="swatch" style="background:var(--accent-wash)" title="wash"></div>
  </div></section>
 <section><h2>Controls</h2>
  <div class="row">
   <button class="btn primary" data-focusable aria-label="Primary action">Primary</button>
   <button class="btn" data-focusable aria-label="Default action">Default</button>
   <button class="btn ghost" data-focusable aria-label="Ghost action">Ghost</button>
   <button class="btn destructive" data-focusable aria-label="Delete item">Delete</button>
   <span class="chip" data-focusable tabindex="0" role="button" aria-label="Example chip">chip</span>
   <div class="toggle" role="switch" aria-checked="true" aria-label="example switch on" data-focusable tabindex="0"></div>
   <div class="toggle" role="switch" aria-checked="false" aria-label="example switch off" data-focusable tabindex="0"></div>
  </div></section>
 <section><h2>Motion tokens</h2>
  <p class="caption">fast 220ms · base 260ms · slow 300ms · ease cubic-bezier(.32,.72,0,1) — uses var(--ease-prism) everywhere</p>
  <div class="row" style="margin-top:12px">
   <button class="btn" id="toastDemo" data-focusable aria-label="Show banner">Show banner</button>
  </div></section>`;

s.appendChild(main);

// ----- Edge state layers (inside stage, absolute inset 44 0 0 0) -----
function createEdgeLayer(id, label, html){
 const el=document.createElement('section');
 el.className='edge-layer';
 el.id=id;
 el.setAttribute('aria-label', label);
 el.setAttribute('role','region');
 el.innerHTML=html;
 return el;
}

// Loading — skeletons with shimmer
const loadingLayer = createEdgeLayer('state-loading','Loading state',`
 <div style="width:100%;max-width:420px;display:grid;gap:12px">
  <div class="edge-card" style="padding:18px;align-items:stretch;text-align:left;gap:14px">
   <div style="display:flex;align-items:center;gap:12px">
    <div class="skeleton" style="width:48px;height:48px;border-radius:50%;flex:none"></div>
    <div style="flex:1;display:grid;gap:8px">
     <div class="skeleton" style="height:14px;width:72%;border-radius:8px"></div>
     <div class="skeleton" style="height:12px;width:92%;border-radius:8px"></div>
    </div>
   </div>
   <div style="display:grid;gap:8px">
    <div class="skeleton" style="height:12px;border-radius:8px"></div>
    <div class="skeleton" style="height:12px;width:84%;border-radius:8px"></div>
    <div class="skeleton" style="height:12px;width:68%;border-radius:8px"></div>
   </div>
   <div style="display:flex;gap:8px">
    <div class="skeleton" style="height:36px;flex:1;border-radius:999px"></div>
    <div class="skeleton" style="height:36px;flex:1;border-radius:999px"></div>
   </div>
   <div style="display:flex;align-items:center;gap:8px;justify-content:center;margin-top:2px">
    <span class="skeleton" style="width:16px;height:16px;border-radius:50%"></span>
    <span class="caption">Loading — shimmer 1.2s · skeleton · var(--ease-prism)</span>
   </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
   <div class="skeleton" style="height:72px;border-radius:16px"></div>
   <div class="skeleton" style="height:72px;border-radius:16px"></div>
   <div class="skeleton" style="height:72px;border-radius:16px"></div>
  </div>
  <div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:10px">
   <span class="skeleton" style="width:28px;height:28px;border-radius:10px;flex:none"></span>
   <span class="caption" style="color:var(--ink-60)">Skeleton pattern uses .skeleton + shimmer — no spinner</span>
  </div>
 </div>
`);
s.appendChild(loadingLayer);

// Empty — humane illustration + retry
const emptyLayer = createEdgeLayer('state-empty','Empty state',`
 <div class="edge-card">
  <div class="edge-illus" aria-hidden="true">
   <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="13" rx="2.8" stroke="white" stroke-opacity="0.9" stroke-width="1.6"/><path d="M7 14.5l3-3.2 2.6 2.2 2.2-1.6 4 3.2" stroke="white" stroke-opacity="0.78" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.6" cy="9" r="1.4" stroke="white" stroke-opacity="0.86" stroke-width="1.4"/><path d="M12 16.5v-2" stroke="white" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round"/></svg>
  </div>
  <div class="edge-title">Nothing here yet</div>
  <div class="edge-body">This space is ready for your first capture. Create something and it will appear here, beautifully presented on glass.</div>
  <div class="edge-actions">
   <button class="btn primary" data-focusable aria-label="Create first item" data-action="retry-empty">Create first</button>
   <button class="btn ghost" data-focusable aria-label="Learn more about empty state">Learn more</button>
  </div>
  <p class="caption" style="margin-top:2px;color:var(--ink-40)">Humane illustration · humane copy · clear retry</p>
 </div>
 <div class="card" style="width:100%;max-width:420px;padding:12px 14px;display:flex;align-items:center;gap:10px">
  <span class="dot ok" aria-hidden="true"></span><span class="caption">Empty uses .card · not default browser empty</span>
 </div>
`);
s.appendChild(emptyLayer);

// Error — red wash + retry, uses .banner pattern
const errorLayer = createEdgeLayer('state-error','Error state',`
 <div class="edge-card" style="background: linear-gradient(180deg, rgba(255,93,93,0.14), rgba(255,93,93,0.06)); backdrop-filter:var(--blur-glass); -webkit-backdrop-filter:var(--blur-glass); outline-color:rgba(255,93,93,0.28); box-shadow:0 18px 44px rgba(0,0,0,0.36), 0 0 0 1px rgba(255,93,93,0.10) inset">
  <div class="edge-illus" style="background:rgba(255,93,93,0.10);outline-color:rgba(255,93,93,0.18)" aria-hidden="true">
   <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 3.5L21.5 19H2.5L12 3.5z" stroke="#ff8a8a" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 9.5v4.2" stroke="#ffb3b3" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.25" fill="#ffb3b3"/></svg>
  </div>
  <div class="edge-title">Can’t load content</div>
  <div class="edge-body">Prism couldn’t reach your space. Check connection and try again — your work is safe and recoverable.</div>
  <div class="banner" style="position:relative;left:auto;right:auto;top:auto;z-index:auto;animation:none;background:rgba(255,93,93,0.10);outline:1px solid rgba(255,93,93,0.18);backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);width:100%;margin-top:2px" role="alert">
   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="#ff8a8a" stroke-width="1.5"/><path d="M12 8v5" stroke="#ffb3b3" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="15.8" r="1.1" fill="#ffb3b3"/></svg>
   <span class="caption" style="color:#ffb3b3;font-weight:600">Error PR-FOUND-503 · 9:41 AM — banner pattern .banner</span>
  </div>
  <div class="edge-actions">
   <button class="btn primary" data-focusable aria-label="Retry loading" data-action="retry-error">Retry</button>
   <button class="btn ghost" data-focusable aria-label="Dismiss error and return to specimen">Dismiss</button>
  </div>
 </div>
`);
s.appendChild(errorLayer);

// Offline — dim-world scrim + retry
const offlineLayer = createEdgeLayer('state-offline','Offline state',`
 <div class="offline-wrap">
  <div class="dim-world" aria-hidden="true"></div>
  <div class="edge-card">
   <div class="edge-illus" aria-hidden="true">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M3.5 9.5a9 9 0 0117 0" stroke="white" stroke-opacity="0.9" stroke-width="1.6" stroke-linecap="round"/><path d="M6 12.5a6 6 0 0112 0" stroke="white" stroke-opacity="0.8" stroke-width="1.6" stroke-linecap="round"/><path d="M8.8 15.5a2.8 2.8 0 016.4 0" stroke="white" stroke-opacity="0.78" stroke-width="1.6" stroke-linecap="round"/><path d="M2 2l20 20" stroke="#ffc247" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="17.8" r="1.25" fill="white"/></svg>
   </div>
   <div class="edge-title">You’re offline</div>
   <div class="edge-body">The world behind is dimmed with .dim-world scrim. Home needs connection to sync — launcher still works.</div>
   <div style="width:100%;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:10px 12px">
    <span class="dot bad" aria-hidden="true"></span><span style="font-size:13px;font-weight:600;color:var(--ink-80)">No network · scrim 0.52 + 2px blur</span><span class="caption" style="margin-left:auto">dim-world</span>
   </div>
   <div class="edge-actions">
    <button class="btn primary" data-focusable aria-label="Retry connection">Retry</button>
    <button class="btn" data-focusable aria-label="Continue offline">Use offline</button>
   </div>
   <p class="caption">Offline uses .dim-world + .card · recoverable, no dead end</p>
  </div>
 </div>
`);
s.appendChild(offlineLayer);

// Permission denied — lock icon + allow CTA
const permLayer = createEdgeLayer('state-permission','Permission denied state',`
 <div class="edge-card">
  <div class="edge-illus" aria-hidden="true">
   <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="5" y="9.5" width="14" height="10" rx="2.4" stroke="white" stroke-opacity="0.9" stroke-width="1.6"/><path d="M8.5 9.5V7.8a3.5 3.5 0 017 0v1.7" stroke="white" stroke-width="1.5"/><circle cx="12" cy="14.5" r="1.35" fill="white"/><path d="M12 15.85v1.6" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>
  </div>
  <div class="edge-title">Permission needed</div>
  <div class="edge-body">Prism needs access to captures and location to show this content. You can allow access or keep using the foundation without it.</div>
  <div class="edge-actions">
   <button class="btn primary" data-focusable aria-label="Allow access to captures" data-action="allow">Allow access</button>
   <button class="btn ghost" data-focusable aria-label="Not now, dismiss permission">Not now</button>
  </div>
  <p class="caption" style="color:var(--ink-40)">Settings → Privacy → Prism · Captures & Location</p>
  <div style="width:100%;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px">
   <span class="dot warn" aria-hidden="true"></span><span style="font-size:12px;font-weight:600;color:var(--ink-80)">Captures blocked</span><button class="chip" data-focusable aria-label="Open Settings from permission card" style="margin-left:auto;height:28px">Open Settings</button>
  </div>
 </div>
`);
s.appendChild(permLayer);

// ----- control logic -----
const labBar = document.querySelector('.lab-bar');
const variantChips = [...labBar.querySelectorAll('[data-variant]')];
const layers = {
 specimen: main,
 loading: loadingLayer,
 empty: emptyLayer,
 error: errorLayer,
 offline: offlineLayer,
 permission: permLayer
};

function setVariant(v){
 // update chips
 variantChips.forEach(c=>{
  const isActive = c.dataset.variant===v;
  c.classList.toggle('active', isActive);
  c.setAttribute('aria-pressed', String(isActive));
  if(isActive) c.setAttribute('aria-label', c.textContent.trim()+' — current');
  else c.setAttribute('aria-label', 'Show '+c.textContent.trim()+' state');
 });
 // toggle layers: specimen is main, others are edge-layers
 Object.entries(layers).forEach(([key,el])=>{
  if(key==='specimen'){
   el.style.display = (v==='specimen') ? '' : 'none';
   el.setAttribute('aria-hidden', v==='specimen' ? 'false':'true');
  } else {
   el.classList.toggle('active', key===v);
   el.style.display = (key===v) ? 'grid' : 'none';
   el.setAttribute('aria-hidden', key===v ? 'false':'true');
  }
 });
 // scroll reset
 if(v==='specimen') main.scrollTo({top:0, behavior:'smooth'});
 // banner feedback for delight? subtle
 if(v!=='specimen'){
  // gentle banner to confirm variant—not required but shows dependability
  // use neutral banner, timeout short
 }
 window.__foundationVariant = v;
}
window.__setFoundationVariant = setVariant;
variantChips.forEach(chip=>{
 chip.addEventListener('click', ()=> setVariant(chip.dataset.variant));
 chip.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' || e.key===' '){ e.preventDefault(); chip.click(); }
 });
});

// expose for probe manual
setVariant('specimen');

// ----- existing interactions -----
document.querySelectorAll('.toggle').forEach((t) => {
 const toggleAction = () => t.setAttribute('aria-checked', t.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
 t.addEventListener('click', toggleAction);
 t.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggleAction(); }
 });
});
s.querySelector('#toastDemo')?.addEventListener('click', () =>
 os.banner('<strong>Banner</strong><span class="caption">tap to dismiss · auto 4.2s · var(--ease-prism)</span>', { timeout: 0 }));

// retry buttons in edge cards — recover to specimen or simulate
document.querySelectorAll('[data-action="retry-empty"], [data-action="retry-error"], [data-action="allow"]').forEach(btn=>{
 btn.addEventListener('click', ()=>{
  const isAllow = btn.dataset.action==='allow';
  btn.textContent = isAllow ? 'Allowing…' : 'Retrying…';
  setTimeout(()=>{
   setVariant('specimen');
   os.banner(isAllow ? '<strong>Access granted</strong><span class="caption">captures restored</span>' : '<strong>Back online</strong><span class="caption">specimen restored</span>', {timeout:1800});
   btn.textContent = isAllow ? 'Allow access' : (btn.dataset.action==='retry-empty' ? 'Create first' : 'Retry');
  }, 700);
 });
});
// dismiss / secondary buttons in edge cards
emptyLayer.querySelectorAll('button')[1]?.addEventListener('click', ()=> os.banner('<strong>Learn more</strong><span class="caption">foundation docs · on-device</span>',{timeout:2000}));
errorLayer.querySelectorAll('button')[1]?.addEventListener('click', ()=> setVariant('specimen'));
offlineLayer.querySelectorAll('button').forEach(b=>{
 b.addEventListener('click', ()=>{
  if(b.textContent.includes('Retry')){
   b.textContent='Retrying…';
   setTimeout(()=>{ os.banner('<strong>Still offline</strong><span class="caption">check Wi-Fi</span>',{timeout:2000}); b.textContent='Retry';},800);
  } else { setVariant('specimen'); os.banner('<strong>Offline mode</strong><span class="caption">specimen only</span>',{timeout:1800}); }
 });
});
permLayer.querySelectorAll('button').forEach(b=>{
 if(b.textContent.trim()==='Not now') b.addEventListener('click', ()=> setVariant('specimen'));
 if(b.textContent.trim()==='Open Settings') b.addEventListener('click', ()=> { b.textContent='Opening…'; setTimeout(()=>{ setVariant('specimen'); os.banner('<strong>Settings</strong><span class="caption">Privacy · Prism</span>',{timeout:1800}); b.textContent='Open Settings';},700); });
});

// material cards subtle interaction
document.querySelectorAll('.mat-card').forEach(c=>{
 c.addEventListener('click', ()=>{
  c.animate([{transform:'scale(1.02)'},{transform:'scale(1)'}],{duration:220, easing:'cubic-bezier(0.32,0.72,0,1)'});
  os.banner('<strong>'+c.textContent.trim().split('\\n')[0]+' material</strong><span class="caption">'+c.querySelector('.sub')?.textContent+' · tapped</span>',{timeout:1400});
 });
 c.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); c.click(); }});
});

// ----- Tab handling: include lab-bar chips in cycle (capture-phase to override core) -----
document.addEventListener('keydown', (e)=>{
 if(e.key!=='Tab') return;
 // Build full focusable set including lab-bar + stage
 const all = [...document.querySelectorAll('[data-focusable],button,a,[role="button"],[role="tab"],input,[role="switch"]')].filter(el=> el.offsetParent!==null && !el.hasAttribute('disabled') && el.getAttribute('aria-hidden')!=='true');
 if(all.length<2) return;
 // Only override if focus is inside stage or lab-bar and would wrap
 // Let core handle stage-only? We intercept to include bar.
 // Determine current index
 const active = document.activeElement;
 const idx = all.indexOf(active);
 // If active not in list, let default happen
 if(idx===-1) return;
 // Check shift? core ignores shift, we respect shift properly
 const forward = !e.shiftKey;
 e.preventDefault();
 e.stopPropagation();
 e.stopImmediatePropagation();
 const next = forward ? (idx+1)%all.length : (idx-1+all.length)%all.length;
 all[next].focus({preventScroll:true});
 // add gaze-focus visual? core does via pointermove, but we also add class
 all.forEach(el=> el.classList.remove('gaze-focus'));
 all[next].classList.add('gaze-focus');
 setTimeout(()=> all[next].classList.remove('gaze-focus'), 900);
}, true);

console.log('Prism foundation ready — lab bar outside stage, 6 variants, motion 220/260/300');
</script>
