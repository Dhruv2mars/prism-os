<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Prism OS — Foundation</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
/* ------------------------------------------------------------------ surface -
   One specimen at a time, filling the stage, over the world layer.
   Every developer control lives in the lab rail, outside the stage. */

.surface {
  position: absolute; inset: 0; z-index: 10;
  overflow: hidden;

  --as: var(--a11y-scale, 1);
  --t-eyebrow: max(10.5px, calc(11px * var(--as)));
  --t-name:    calc(19px * var(--as));
  --t-line:    calc(13.5px * var(--as));
  --t-hero:    calc(46px * var(--as));
  --t-mid:     calc(18px * var(--as));
  --t-small:   calc(13px * var(--as));
}
.surface button { font: inherit; color: inherit; background: none; border: 0; }

/* world dimmer / blackout, painted above the passthrough, below the specimen */
.veil {
  position: absolute; inset: 0; z-index: 0; opacity: 0;
  transition: opacity var(--dur-base) var(--ease-prism);
  pointer-events: none;
}
.surface[data-veil="dim"]  .veil { opacity: 1; background: rgba(4, 7, 11, 0.46); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.surface[data-veil="off"]  .veil { opacity: 1; background: rgba(7, 10, 15, 0.94); }

.eyebrow {
  position: absolute; top: calc(20px * min(var(--as), 1.4)); left: 26px; z-index: 2;
  font-size: var(--t-eyebrow); font-weight: 700;
  letter-spacing: 0.20em; text-transform: uppercase;
  color: rgba(255, 255, 255, 0.34);
}

.area { position: absolute; inset: 52px 46px 54px; z-index: 2; display: grid; place-items: center; }
.stack {
  grid-area: 1 / 1; width: 100%; max-width: 408px;
  display: flex; flex-direction: column; align-items: center;
  gap: calc(17px * min(var(--as), 1.6));
}
.layers { position: relative; width: 100%; min-height: 244px; display: grid; }

/* ----------------------------------------------------------------- glass ---
   0.70 -> 0.79 alpha over the world, saturating blur behind, a 1px specular
   rim on the top edge, and a real two-layer shadow (contact + ambient). */
.plate {
  grid-area: 1 / 1; position: relative;
  width: 100%; min-height: 244px;
  display: grid; place-items: center;
  padding: calc(22px * min(var(--as), 1.5)) calc(26px * min(var(--as), 1.3));
  border-radius: var(--r-lg);
  background: linear-gradient(158deg, rgba(21, 30, 45, 0.70) 0%, rgba(10, 15, 24, 0.79) 100%);
  backdrop-filter: saturate(1.5) blur(20px);
  -webkit-backdrop-filter: saturate(1.5) blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.11);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.30), 0 30px 64px -16px rgba(0, 0, 0, 0.62);
  transition: opacity var(--dur-base) var(--ease-prism),
              transform var(--dur-base) var(--ease-prism),
              box-shadow var(--dur-fast) var(--ease-prism);
}
/* specular rim: a bright hairline riding the top edge + an inner sheen */
.plate::before {
  content: ""; position: absolute; left: 18px; right: 18px; top: 0; height: 1px;
  border-radius: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.52) 20%, rgba(255,255,255,0.62) 58%, transparent);
}
.plate::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.09), transparent 16%),
    radial-gradient(120% 78% at 16% -12%, rgba(150, 200, 255, 0.10), transparent 62%);
}
.plate.is-quiet { opacity: 0.42; transform: scale(0.985); }
.surface[data-tint="fixed"] .plate {
  background: linear-gradient(158deg, rgba(19, 26, 38, 0.90) 0%, rgba(9, 13, 20, 0.94) 100%);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}

/* gaze focus keeps the material shadow and adds the ring + lift */
.stage .plate.gaze-focus, .stage .plate:focus-visible,
.stage .riser.gaze-focus, .stage .riser:focus-visible,
.stage .well.gaze-focus,  .stage .well:focus-visible {
  box-shadow: 0 2px 6px rgba(0,0,0,0.30), 0 34px 74px -16px rgba(0,0,0,0.66),
              0 0 0 2.5px var(--stroke-focus), 0 0 34px rgba(86,184,255,0.34) !important;
  transform: scale(1.014);
}
.stage .well.gaze-focus, .stage .well:focus-visible {
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.62), inset 0 -1px 0 rgba(255,255,255,0.06),
              0 0 0 2.5px var(--stroke-focus), 0 0 30px rgba(86,184,255,0.30) !important;
}
.plate:focus-visible, .riser:focus-visible, .well:focus-visible, .ftile:focus-visible { outline: none; }

/* ---------------------------------------------------------------- raised --- */
.riser {
  grid-area: 1 / 1; place-self: center;
  width: 74%; min-height: calc(112px * min(var(--as), 1.5));
  border-radius: var(--r-md);
  background: linear-gradient(158deg, rgba(47, 61, 86, 0.76) 0%, rgba(24, 34, 51, 0.82) 100%);
  backdrop-filter: saturate(1.6) blur(26px);
  -webkit-backdrop-filter: saturate(1.6) blur(26px);
  border: 1px solid rgba(255, 255, 255, 0.17);
  box-shadow: 0 3px 9px rgba(0, 0, 0, 0.34), 0 36px 72px -18px rgba(0, 0, 0, 0.70);
  transform: translateY(-4px);
  transition: transform var(--dur-base) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism);
}
.riser::before {
  content: ""; position: absolute; left: 16px; right: 16px; top: 0; height: 1px; border-radius: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.62) 26%, rgba(255,255,255,0.70) 62%, transparent);
}
.riser, .well { position: relative; }

/* ---------------------------------------------------------------- sunken --- */
.well {
  grid-area: 1 / 1; place-self: center;
  width: 78%; min-height: calc(108px * min(var(--as), 1.5));
  border-radius: var(--r-md);
  background: rgba(4, 8, 14, 0.55);
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.62),
              inset 0 -1px 0 rgba(255, 255, 255, 0.06),
              inset 0 0 0 1px rgba(0, 0, 0, 0.38);
  transition: box-shadow var(--dur-fast) var(--ease-prism);
}

/* ------------------------------------------------------------------ type --- */
.comp { display: flex; flex-direction: column; align-items: center; gap: calc(4px * var(--as)); text-align: center; }
.t-hero {
  font-size: var(--t-hero); font-weight: 700; letter-spacing: -0.025em; line-height: 1;
  font-variant-numeric: tabular-nums; color: var(--ink-100);
}
.t-mid  { font-size: var(--t-mid); font-weight: 600; letter-spacing: -0.01em; color: rgba(255,255,255,0.88); }
.t-small{ font-size: var(--t-small); font-weight: 500; color: var(--ink-60); }

/* -------------------------------------------------------------- controls --- */
.ctl { display: flex; align-items: center; justify-content: center; gap: calc(14px * min(var(--as),1.4)); flex-wrap: wrap; }
.ctl .btn { min-height: 44px; }
.ctl .chip { height: calc(30px * min(var(--as), 1.5)); font-size: max(10.5px, calc(11px * var(--as))); }
.ctl .toggle { appearance: none; -webkit-appearance: none; border: 0; cursor: pointer; }
.ctl-note { margin-top: calc(14px * var(--as)); font-size: var(--t-small); color: rgba(255,255,255,0.42); text-align: center; }

/* ----------------------------------------------------------------- focus --- */
.ftile {
  grid-area: 1 / 1; place-self: center; position: relative;
  width: 224px; min-height: calc(92px * min(var(--as), 1.5));
  display: grid; place-items: center;
  border-radius: 22px;
  background: linear-gradient(158deg, rgba(47, 61, 86, 0.74), rgba(24, 34, 51, 0.80));
  backdrop-filter: saturate(1.6) blur(24px); -webkit-backdrop-filter: saturate(1.6) blur(24px);
  border: 1px solid rgba(134, 198, 255, 0.55);
  box-shadow: 0 3px 9px rgba(0,0,0,0.34), 0 0 0 2.5px rgba(86,184,255,0.85), 0 0 36px rgba(86,184,255,0.38);
  font-size: var(--t-mid); font-weight: 600; color: var(--ink-100);
  cursor: pointer;
}
.dwell-sweep { position: absolute; inset: -9px; overflow: visible; }
.dwell-sweep rect {
  fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round;
  stroke-dasharray: 100; stroke-dashoffset: 100;
  vector-effect: non-scaling-stroke;
  animation: sweep 1900ms var(--ease-prism) infinite;
}
@keyframes sweep {
  0%   { stroke-dashoffset: 100; opacity: 0.9; }
  62%  { stroke-dashoffset: 0;   opacity: 0.9; }
  84%  { stroke-dashoffset: 0;   opacity: 0; }
  100% { stroke-dashoffset: 100; opacity: 0; }
}

/* --------------------------------------------------------------- caption --- */
.cap { text-align: center; display: flex; flex-direction: column; gap: calc(4px * var(--as)); }
.cap-name { font-size: var(--t-name); font-weight: 600; letter-spacing: -0.012em; color: rgba(255,255,255,0.90); }
.cap-line { font-size: var(--t-line); font-weight: 450; line-height: 1.4; color: rgba(255,255,255,0.56); }
.surface[data-big="1"] .cap-line, .surface[data-big="1"] .eyebrow { display: none; }

/* ------------------------------------------------------------------ pips --- */
.pips {
  position: absolute; left: 0; right: 0; bottom: 20px; z-index: 2;
  display: flex; justify-content: center; align-items: center; gap: 7px;
}
.pip {
  width: 5px; height: 5px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.22);
  transition: width var(--dur-base) var(--ease-prism), background var(--dur-base) var(--ease-prism);
}
.pip.on { width: 17px; background: rgba(134, 198, 255, 0.85); }
.pips[hidden] { display: none; }

/* ------------------------------------------------------------ edge states --- */
.edge { display: flex; flex-direction: column; align-items: center; text-align: center; gap: calc(9px * min(var(--as),1.5)); }
.edge-glyph { width: 30px; height: 30px; opacity: 0.72; }
.edge-title { font-size: var(--t-mid); font-weight: 600; letter-spacing: -0.01em; color: rgba(255,255,255,0.92); }
.edge-line  { font-size: var(--t-small); line-height: 1.45; color: rgba(255,255,255,0.52); max-width: 27ch; }
.edge-acts  { display: flex; align-items: center; gap: 10px; margin-top: calc(6px * var(--as)); flex-wrap: wrap; justify-content: center; }
.edge-acts .btn { min-height: 40px; font-size: max(11px, calc(13px * var(--as))); padding: 0 var(--sp-4); }
.bars { display: flex; flex-direction: column; gap: 10px; width: 76%; }
.bars i { display: block; height: 12px; border-radius: 6px; }
.bars i:nth-child(1) { width: 58%; height: 20px; }
.bars i:nth-child(3) { width: 74%; }

/* larger, more legible gaze cursor than the 10px default */
.stage .gaze-cursor {
  width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.16), 0 0 20px rgba(86, 184, 255, 0.85);
}

/* the lab's reduced-motion switch must behave exactly like the OS setting */
html[data-reduced-motion] *, html[data-reduced-motion] *::before, html[data-reduced-motion] *::after {
  animation-duration: 0.01ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.01ms !important;
}
@media (prefers-reduced-motion: reduce) {
  .dwell-sweep rect { stroke-dashoffset: 0; opacity: 0.9; }
}

/* ------------------------------------------------------- lab rail readout --- */
.lab-readout dl { display: flex; flex-direction: column; gap: 6px; }
.lab-readout .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.lab-readout dt { font-size: 11px; font-weight: 600; color: #59627a; white-space: nowrap; }
.lab-readout dd { font-size: 11px; font-weight: 600; color: #9fb0c9; text-align: right;
                  font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="device"><div class="stage-shell"><div class="stage" data-stage></div></div></div>

<script type="module">
import { createOS } from '/os/shared/core.js';
import { mountLab, mountWorld } from '/os/shared/lab.js';

const stage = document.querySelector('[data-stage]');
const os = createOS(stage, { scale: 1 });

/* ---------------------------------------------------------------- surface -- */
const surface = document.createElement('div');
surface.className = 'surface';
surface.innerHTML =
  '<div class="veil"></div>' +
  '<div class="eyebrow">Foundation</div>' +
  '<div class="area" data-area></div>' +
  '<div class="pips" data-pips></div>';
stage.insertBefore(surface, os.cursor);
const area = surface.querySelector('[data-area]');
const pips = surface.querySelector('[data-pips]');

const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const reduced = () =>
  matchMedia('(prefers-reduced-motion: reduce)').matches ||
  document.documentElement.hasAttribute('data-reduced-motion');

let lastAct = 0;
function act(fn) {
  return (e) => {
    e?.stopPropagation?.();
    const now = performance.now();
    if (now - lastAct < 140) return;      /* gaze click + key press must not double-fire */
    lastAct = now;
    fn();
  };
}
function focal(node, label, fn) {
  node.setAttribute('data-focusable', '');
  node.setAttribute('aria-label', label);
  node.addEventListener('click', act(fn));
  return node;
}

/* ------------------------------------------------------------- specimens --- */
const plate = (opts = {}) => {
  const p = el(opts.tag || 'div', 'plate' + (opts.quiet ? ' is-quiet' : ''));
  if (opts.body) p.appendChild(opts.body);
  return p;
};

let ticker = null;
function departure() {
  const c = el('div', 'comp');
  const hero = el('div', 't-hero', '11:58');
  c.append(hero, el('div', 't-mid', 'Ferry to Sausalito'), el('div', 't-small', 'Pier 41 &middot; Gate 2'));
  let left = 718;
  clearInterval(ticker);
  ticker = setInterval(() => {
    if (!hero.isConnected) { clearInterval(ticker); return; }
    left = left > 0 ? left - 1 : 0;
    hero.textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
  }, 1000);
  return c;
}

function controlRow() {
  const wrap = el('div');
  const row = el('div', 'ctl');
  const go = el('button', 'btn primary');
  go.type = 'button'; go.textContent = 'Board pass';
  focal(go, 'Open your boarding pass', () => note.textContent = 'Boarding pass ready');
  const chip = el('span', 'chip', 'Gate 2');
  const sw = el('button', 'toggle');
  sw.type = 'button';
  sw.setAttribute('role', 'switch');
  sw.setAttribute('aria-checked', 'true');
  focal(sw, 'Departure alerts', () => {
    const on = sw.getAttribute('aria-checked') !== 'true';
    sw.setAttribute('aria-checked', String(on));
    note.textContent = on ? 'Alerts on' : 'Alerts off';
  });
  row.append(go, chip, sw);
  const note = el('div', 'ctl-note', 'Alerts on');
  wrap.append(row, note);
  return wrap;
}

function focusTile() {
  const t = el('button', 'ftile');
  t.type = 'button';
  t.innerHTML =
    '<svg class="dwell-sweep" viewBox="0 0 240 108" preserveAspectRatio="none" aria-hidden="true">' +
    '<rect x="1.5" y="1.5" width="237" height="105" rx="27" pathLength="100"></rect></svg>' +
    '<span>Hold to press</span>';
  return focal(t, 'Hold to press', () => goStep(0, -1));
}

const STEPS = [
  {
    name: 'Glass',
    line: 'the material most surfaces are made of',
    build() {
      const p = plate();
      return { node: p, focal: focal(p, 'Show the next material', () => goStep(1, 1)) };
    },
    tech: [['Fill', '0.70 → 0.79'], ['Behind', 'blur 20px, saturate 1.5'],
           ['Rim', '1px specular, top edge'], ['Shadow', '2px contact + 30px ambient']],
  },
  {
    name: 'Raised',
    line: 'for anything that sits on top of glass',
    build() {
      const p = plate({ quiet: true });
      const r = el('button', 'riser'); r.type = 'button';
      focal(r, 'Show the next material', () => goStep(2, 1));
      return { node: [p, r], focal: r };
    },
    tech: [['Fill', '0.76 → 0.82'], ['Behind', 'blur 26px, saturate 1.6'],
           ['Rim', '1px at 0.70 alpha'], ['Shadow', '3px contact + 36px ambient']],
  },
  {
    name: 'Sunken',
    line: 'for wells that hold content inside a surface',
    build() {
      const p = plate({ quiet: true });
      const w = el('button', 'well'); w.type = 'button';
      focal(w, 'Show the next material', () => goStep(3, 1));
      return { node: [p, w], focal: w };
    },
    tech: [['Fill', '0.55 flat, no blur'], ['Depth', 'inset 0 2px 8px'],
           ['Rim', 'inner 0.06 at the base'], ['Shadow', 'none — it is a hole']],
  },
  {
    name: 'Type',
    line: 'three sizes, one voice, numbers that hold their place',
    build() {
      const p = plate({ body: departure() });
      return { node: p, focal: focal(p, 'Show the next material', () => goStep(4, 1)) };
    },
    tech: [['Sizes', '46 / 18 / 13 px'], ['Weights', '700 / 600 / 500'],
           ['Numerals', 'tabular-nums, live'], ['Scale', 'multiplied by --a11y-scale']],
  },
  {
    name: 'Controls',
    line: 'one button, one chip, one switch — the whole family',
    build() {
      const p = plate({ body: controlRow() });
      return { node: p, focal: p };
    },
    tech: [['Target', '44px minimum'], ['Radius', 'pill, 999px'],
           ['Focus', '2.5px accent ring'], ['Switch', '260ms travel']],
  },
  {
    name: 'Focus',
    line: 'where you look is lit; hold for a moment to press',
    build() {
      const p = plate({ quiet: true });
      const t = focusTile();
      return { node: [p, t], focal: t };
    },
    tech: [['Ring', '2.5px #56b8ff'], ['Halo', '36px bloom at 0.38'],
           ['Dwell', '350ms to activate'], ['Easing', 'cubic-bezier(0.32,0.72,0,1)']],
  },
];

/* ----------------------------------------------------------- edge states --- */
const GLYPH = {
  empty: '<svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.4"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" stroke-dasharray="3 3.4"/></svg>',
  error: '<svg viewBox="0 0 24 24" fill="none" stroke="#ff8f8f" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.6v5"/><path d="M12 16.1h.01"/></svg>',
  offline: '<svg viewBox="0 0 24 24" fill="none" stroke="#ffd27a" stroke-width="1.5" stroke-linecap="round"><path d="M6.4 17.4h10.2a3.6 3.6 0 0 0 .4-7.18A5.4 5.4 0 0 0 7.5 8.6"/><path d="M4 4l16 16"/></svg>',
  denied: '<svg viewBox="0 0 24 24" fill="none" stroke="rgba(134,198,255,.85)" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="10.4" width="14" height="9.2" rx="3"/><path d="M8.4 10.4V8a3.6 3.6 0 0 1 7.2 0"/></svg>',
};

function edgeCard({ glyph, title, line, actions, bars }) {
  const box = el('div', 'edge');
  if (bars) {
    const b = el('div', 'bars', '<i class="skeleton"></i><i class="skeleton"></i><i class="skeleton"></i>');
    box.appendChild(b);
  } else if (glyph) {
    box.appendChild(el('div', 'edge-glyph', GLYPH[glyph]));
  }
  box.appendChild(el('div', 'edge-title', title));
  if (line) box.appendChild(el('div', 'edge-line', line));
  if (actions?.length) {
    const acts = el('div', 'edge-acts');
    actions.forEach((a) => {
      const b = el('button', 'btn ' + (a.kind || 'ghost'));
      b.type = 'button'; b.textContent = a.label;
      focal(b, a.label, a.run);
      acts.appendChild(b);
    });
    box.appendChild(acts);
  }
  return plate({ body: box });
}

const EDGES = {
  loading: {
    tech: [['State', 'waiting on the sample'], ['Way out', 'Cancel, or press back']],
    build: () => edgeCard({
      bars: true, title: 'Preparing the sample',
      line: 'Reading the material from the glasses.',
      actions: [{ label: 'Cancel', run: () => setState('empty') }],
    }),
  },
  empty: {
    tech: [['State', 'nothing chosen yet'], ['Way out', 'Start with glass']],
    build: () => edgeCard({
      glyph: 'empty', title: 'No material chosen',
      line: 'Pick one and you will see exactly what it is made of.',
      actions: [{ label: 'Start with glass', kind: 'primary', run: () => { step = 0; setState('ready'); } }],
    }),
  },
  error: {
    tech: [['State', 'sample could not be read'], ['Way out', 'Try again, or skip it']],
    build: () => edgeCard({
      glyph: 'error', title: 'This sample did not load',
      line: 'The material file could not be read.',
      actions: [
        { label: 'Try again', kind: 'primary', run: () => { setState('loading'); setTimeout(() => setState('ready'), 1100); } },
        { label: 'Skip it', run: () => { step = Math.min(step + 1, STEPS.length - 1); setState('ready'); } },
      ],
    }),
  },
  offline: {
    veil: 'dim',
    tech: [['State', 'no link to the phone'], ['Way out', 'Use the saved set']],
    build: () => edgeCard({
      glyph: 'offline', title: 'You are offline',
      line: 'The six samples saved on your glasses are still here.',
      actions: [{ label: 'Use the saved set', kind: 'primary', run: () => { step = 0; setState('ready'); } }],
    }),
  },
  denied: {
    tech: [['State', 'room sensing refused'], ['Effect', 'glass falls back to a fixed tint'], ['Way out', 'turn it on, or keep the fallback']],
    build: () => edgeCard({
      glyph: 'denied', title: 'Room sensing is off',
      line: 'Glass tunes itself to the light around you. Without that, it holds one fixed tint.',
      actions: [
        { label: 'Turn it on', kind: 'primary', run: () => { tint = 'adaptive'; setState('ready'); } },
        { label: 'Keep the fixed tint', run: () => { tint = 'fixed'; setState('ready'); } },
      ],
    }),
  },
};

/* ------------------------------------------------------------ the runtime -- */
let state = 'ready';
let step = 0;
let tint = 'adaptive';

function goStep(n, dir) {
  step = (n + STEPS.length) % STEPS.length;
  if (state !== 'ready') { lab.setState('ready'); return; }
  render(1, dir);
}
function setState(s) { lab.setState(s); }

function render(animate = 1, dir = 1) {
  clearInterval(ticker);
  area.replaceChildren();
  surface.dataset.tint = tint;

  const entry = state === 'ready' ? STEPS[step] : EDGES[state];
  surface.dataset.veil = state === 'ready' ? (tint === 'fixed' ? 'off' : 'none') : (entry.veil || 'none');

  const stack = el('div', 'stack');
  const layers = el('div', 'layers');

  if (state === 'ready') {
    const built = entry.build();
    (Array.isArray(built.node) ? built.node : [built.node]).forEach((n) => layers.appendChild(n));
    stack.appendChild(layers);
    const cap = el('div', 'cap');
    cap.append(el('div', 'cap-name', entry.name), el('div', 'cap-line', entry.line));
    stack.appendChild(cap);
    pips.hidden = false;
    pips.replaceChildren(...STEPS.map((_, i) => el('span', 'pip' + (i === step ? ' on' : ''))));
  } else {
    layers.appendChild(entry.build());
    stack.appendChild(layers);
    pips.hidden = true;
  }

  area.appendChild(stack);
  readout(entry, state === 'ready' ? entry.name : null);

  if (animate && !reduced()) {
    stack.animate(
      [{ opacity: 0, transform: `translate3d(${dir * 20}px, 0, 0) scale(0.984)`, filter: 'blur(7px)' },
       { opacity: 1, transform: 'none', filter: 'blur(0px)' }],
      { duration: 280, easing: 'cubic-bezier(0.32, 0.72, 0, 1)', fill: 'both' },
    );
  }
}

/* technical values live in the rail, where a developer is the right reader */
let readoutEl = null;
function readout(entry, name) {
  if (!readoutEl) return;
  const rows = entry.tech.map(([k, v]) =>
    `<div class="row"><dt></dt><dd></dd></div>`).join('');
  readoutEl.innerHTML = `<h4></h4><dl>${rows}</dl>`;
  readoutEl.querySelector('h4').textContent = name ? `Specimen — ${name}` : 'Specimen — edge state';
  const dts = readoutEl.querySelectorAll('dt');
  const dds = readoutEl.querySelectorAll('dd');
  entry.tech.forEach(([k, v], i) => { dts[i].textContent = k; dds[i].textContent = v; });
}

/* ------------------------------------------------------------------- lab --- */
const lab = mountLab({
  piece: '00-foundation',
  title: 'Foundation & materials',
  states: ['ready', 'loading', 'empty', 'error', 'offline', 'denied'],
  onState: (s) => { state = s; render(1, 1); },
  actions: [
    { label: 'Next specimen', run: () => goStep(step + 1, 1) },
    { label: 'Previous specimen', run: () => goStep(step - 1, -1) },
    { label: 'Back to the first', run: () => goStep(0, -1) },
  ],
  onScale: (v) => { surface.dataset.big = v >= 1.7 ? '1' : '0'; },
});

readoutEl = document.createElement('div');
readoutEl.className = 'lab-group lab-readout';
lab.rail.insertBefore(readoutEl, lab.rail.querySelector('.lab-note'));
render(0, 1);

/* hardware input: temple swipe / arrows step the language, tap advances,
   the capture button jumps to the focus specimen, back leaves any edge state */
os.on('swiperight', () => { if (state === 'ready') goStep(step + 1, 1); });
os.on('swipeleft', () => { if (state === 'ready') goStep(step - 1, -1); });
os.on('tapvoid', () => { if (state === 'ready') goStep(step + 1, 1); });
os.on('capture', () => { if (state === 'ready') goStep(STEPS.length - 1, 1); });
os.on('back', () => { if (state !== 'ready') setState('ready'); else goStep(step - 1, -1); });
</script>
