<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Boot</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<link rel="stylesheet" href="./boot.css">
</head>
<body>
<div class="device">
 <div class="stage-shell"><div class="stage" data-stage></div></div>
 <div class="console-row" aria-label="Boot controls">
  <button class="cbtn" id="cBoot" data-focusable>replay boot</button>
  <button class="cbtn cwarn" id="cFail" data-focusable>simulate boot failure</button>
  <span class="state-chip" id="stateChip">boot</span>
  <span class="chint">hold: ?hold=boot / ?hold=fail</span>
 </div>
</div>
<script type="module" src="./boot.js"></script>
</body>
</html>
