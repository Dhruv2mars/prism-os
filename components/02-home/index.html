<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Home</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
 /* ----- stage layout ----- */
 .stage{
  background: radial-gradient(120% 90% at 50% 18%, rgba(42,53,80,0.55) 0%, rgba(20,26,40,0.72) 38%, rgba(10,14,23,0.88) 68%),
        radial-gradient(70% 50% at 78% 88%, rgba(86,184,255,0.10), transparent 55%),
        rgba(6,10,16,0.72);
 }
 .stage-scroll{
  scrollbar-width:none;
 }
 .stage-scroll::-webkit-scrollbar{display:none}

 /* scroll container */
 .home-viewport{
  position:absolute;
  inset:44px 0 0 0;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:none;
  padding:12px 16px 86px 16px;
  display:flex;
  flex-direction:column;
  gap:14px;
 }
 .home-viewport::-webkit-scrollbar{display:none}

 /* stage shell — centers stage, hosts dev controls outside stage bounds */
 .stage-shell{
  position:relative;
  width:600px;
  height:600px;
  display:grid;
  place-items:center;
  flex:none;
 }
 /* dev controls — verified outside .stage (probe: boundingBox top > stage bottom) */
 .dev-controls{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  z-index:1000;
  justify-content:center;
  flex-wrap:wrap;
  pointer-events:none;
  padding:8px 12px;
  border-radius:var(--r-pill);
  background: rgba(10,15,23,0.74);
  outline:1px solid var(--stroke-glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 24px rgba(0,0,0,0.32);
  max-width:92vw;
 }
 .dev-controls .chip{
  pointer-events:auto;
  height:26px;
  padding:0 10px;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.02em;
  transition:background var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
  border:none;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
 }
 .dev-controls .chip.active{
  background: linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#051423;
  outline-color:transparent;
 }
 .dev-controls .chip:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .dev-controls .chip.gaze-focus{transform:scale(1.04)}
 /* legacy guard: no toolbar may ever overlay hero inside stage */
 .stage .ctrl-row{display:none !important}

 /* hero */
 .hero{
  display:flex;
  align-items:stretch;
  gap:12px;
  animation: rise-in var(--dur-base) var(--ease-prism) both;
 }
 .hero-timecard{
   flex:1.28;
   background: var(--mat-glass);
   backdrop-filter: var(--blur-glass);
   -webkit-backdrop-filter: var(--blur-glass);
   outline:1px solid var(--stroke-glass);
   border-radius:var(--r-lg);
   padding:16px 18px 14px 18px;
   display:flex;
   flex-direction:column;
   justify-content:center;
   gap:2px;
   box-shadow:0 22px 56px rgba(0,0,0,0.42), 0 0 0 1px rgba(255,255,255,0.04) inset, 0 1px 0 rgba(255,255,255,0.08) inset;
   position:relative;
   overflow:hidden;
   min-height:118px;
   scale:1.02;
   transform-origin:left center;
  }
 .hero-timecard::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg, rgba(255,255,255,0.07) 0%, transparent 42%);
  pointer-events:none;
 }
 .hero-time{
   font-size:48px;
   font-weight:800;
   letter-spacing:-0.04em;
   line-height:0.95;
     font-variant-numeric:tabular-nums;
   display:flex;
   align-items:baseline;
   gap:1px;
   color:var(--ink-100);
   text-shadow:0 2px 18px rgba(0,0,0,0.38), 0 1px 0 rgba(0,0,0,0.22);
   filter:drop-shadow(0 1px 8px rgba(0,0,0,0.18));
  }
 .hero-time .colon{
  font-weight:600;
  opacity:0.95;
  animation: colonPulse 2.4s ease-in-out infinite;
  margin:0 -1px;
 }
 @keyframes colonPulse{
  0%,100%{opacity:1}
  50%{opacity:0.28}
 }
 .hero-meta{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:6px;
  flex-wrap:wrap;
 }
 .hero-date{
  font-size:13px;
  font-weight:600;
  letter-spacing:0.01em;
  color:var(--ink-80);
 }
 .hero-dot-sep{
  width:3px;height:3px;border-radius:50%;background:var(--ink-20);display:inline-block;
 }
 .hero-loc{
  font-size:13px;
  font-weight:500;
  color:var(--ink-60);
 }
 .hero-weather{
  width:146px;
  flex:none;
  background: var(--mat-raised);
  backdrop-filter: var(--blur-glass);
  -webkit-backdrop-filter: var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  border-radius:var(--r-lg);
  padding:14px 14px 12px 14px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:0 16px 38px rgba(0,0,0,0.32);
  position:relative;
  overflow:hidden;
  animation: rise-in var(--dur-base) var(--ease-prism) both;
  animation-delay:60ms;
 }
 .hero-weather::before{
  content:"";
  position:absolute;
  inset:0;
  background: radial-gradient(120% 90% at 80% 12%, rgba(86,184,255,0.14), transparent 55%);
  pointer-events:none;
 }
 .wx-top{
  display:flex;
  align-items:center;
  gap:8px;
  position:relative;
 }
 .wx-icon{
  width:32px;height:32px;
  border-radius:10px;
  display:grid;place-items:center;
  background:rgba(255,255,255,0.08);
  outline:1px solid rgba(255,255,255,0.10);
  flex:none;
 }
 .wx-temp{
  font-size:20px;
  font-weight:700;
  letter-spacing:-0.02em;
  line-height:1;
 }
 .wx-cond{
  font-size:11px;
  font-weight:600;
  color:var(--ink-60);
  letter-spacing:0.02em;
  margin-top:1px;
 }
 .wx-next{
  position:relative;
  margin-top:10px;
  background:rgba(255,255,255,0.07);
  outline:1px solid rgba(255,255,255,0.06);
  border-radius:10px;
  padding:8px 9px;
  display:flex;
  align-items:center;
  gap:8px;
 }
 .wx-next-dot{
  width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(86,184,255,0.7);flex:none;
 }
 .wx-next-text{
  font-size:11px;
  font-weight:600;
  color:var(--ink-80);
  line-height:1.2;
  letter-spacing:0.01em;
 }
 .wx-next-sub{
  font-size:11px;
  font-weight:500;
  color:var(--ink-60);
  letter-spacing:0.02em;
 }

 /* launcher */
 .section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 2px;
  margin-top:2px;
 }
 .section-title{
  font-size:11px;
  font-weight:700;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--ink-60);
 }
 .section-action{
  font-size:11px;
  font-weight:600;
  color:var(--ink-60);
  letter-spacing:0.02em;
 }
 .launcher{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:10px;
  animation: rise-in var(--dur-base) var(--ease-prism) both;
  animation-delay:110ms;
 }
  .app-btn{
   appearance:none;
   -webkit-appearance:none;
   border:none;
   background:var(--mat-glass);
   backdrop-filter:var(--blur-glass);
   -webkit-backdrop-filter:var(--blur-glass);
   outline:1px solid var(--stroke-glass);
   border-radius:18px;
   padding:14px 6px 10px 6px;
   display:flex;
   flex-direction:column;
   align-items:center;
   gap:9px;
   min-height:98px;
   cursor:pointer;
   position:relative;
   overflow:hidden;
   box-shadow:0 10px 28px rgba(0,0,0,0.28);
   transition:transform var(--dur-base) var(--ease-prism), box-shadow var(--dur-base) var(--ease-prism), outline-color var(--dur-base) var(--ease-prism), background var(--dur-base) var(--ease-prism), opacity var(--dur-base) var(--ease-prism);
   text-align:center;
   opacity:1;
  }
  /* parallax dim: when any app is gaze-focused, non-focused apps dim to 0.72 — single focal enforcement */
  .launcher:has(.app-btn.gaze-focus) .app-btn:not(.gaze-focus){
   opacity:0.72;
  }
 .app-btn::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0.06), transparent 46%);
  opacity:0;
  transition:opacity var(--dur-fast) var(--ease-prism);
  pointer-events:none;
 }
 .app-btn:hover::after,
 .app-btn.gaze-focus::after{opacity:1}
 .app-btn:active{transform:scale(0.98)}
   .app-btn.gaze-focus{
    transform:scale(1.08) translateY(-1px);
    outline-color:var(--stroke-focus);
    box-shadow:0 0 0 2.5px var(--stroke-focus), 0 16px 36px rgba(0,0,0,0.38), 0 0 24px rgba(86,184,255,0.32) !important;
    opacity:1 !important;
   }
 .app-icon{
  width:46px;height:46px;
  border-radius:13px;
  display:grid;place-items:center;
  flex:none;
  position:relative;
  box-shadow:0 6px 18px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.10);
  outline:1px solid rgba(255,255,255,0.08);
 }
 .app-icon svg{width:24px;height:24px;display:block}
 .app-label{
  font-size:12px;
  font-weight:600;
  letter-spacing:0.01em;
  color:var(--ink-80);
  line-height:1;
  white-space:nowrap;
 }
 .app-sublabel{
  font-size:11px;
  font-weight:500;
  color:var(--ink-60);
  margin-top:-4px;
  letter-spacing:0.02em;
 }
 /* per-app tint */
 .t-messages{background:linear-gradient(180deg, #2f9dff 0%, #0b5ed7 100%); color:#fff}
 .t-camera{background:linear-gradient(180deg, #3a3d4a 0%, #1c2230 100%); color:#fff}
 .t-maps{background:linear-gradient(180deg, #7ee0a6 0%, #2a9d6a 100%); color:#fff}
 .t-assistant{background:linear-gradient(180deg, #a58bff 0%, #6a4bff 100%); color:#fff}
 .t-captions{background:linear-gradient(180deg, #ff9e6b 0%, #e85d3a 100%); color:#fff}
 .t-settings{background:linear-gradient(180deg, #2b3242 0%, #161c28 100%); color:#fff}
 .t-gallery{background:linear-gradient(180deg, #56d0ff 0%, #0a7bd6 100%); color:#fff}
 .t-music{background:linear-gradient(180deg, #ff6b9d 0%, #d4235a 100%); color:#fff}

 /* recents */
 .recents-wrap{
  margin-top:2px;
  animation: rise-in var(--dur-base) var(--ease-prism) both;
  animation-delay:160ms;
 }
 .recents{
  display:flex;
  gap:10px;
  overflow-x:auto;
  overscroll-behavior-x:contain;
  scroll-snap-type:x proximity;
  scrollbar-width:none;
  padding:10px 2px 6px 2px;
  -webkit-overflow-scrolling:touch;
  mask-image: linear-gradient(to right, black 88%, transparent 100%);
 }
 .recents::-webkit-scrollbar{display:none}
 .recent-btn{
  appearance:none;
  -webkit-appearance:none;
  border:none;
  flex:0 0 124px;
  height:88px;
  border-radius:16px;
  background:var(--mat-glass);
  backdrop-filter:var(--blur-glass);
  -webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  overflow:hidden;
  position:relative;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  box-shadow:0 10px 24px rgba(0,0,0,0.28);
  transition:transform var(--dur-base) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
  text-align:left;
  padding:0;
  scroll-snap-align:start;
 }
 .recent-btn.gaze-focus{
  transform:scale(1.04) translateY(-1px);
  outline-color:var(--stroke-focus);
  box-shadow:0 0 0 2px rgba(86,184,255,0.16), 0 14px 32px rgba(0,0,0,0.36);
 }
 .recent-thumb{
  height:58px;
  position:relative;
  overflow:hidden;
  background: radial-gradient(110% 100% at 30% 20%, rgba(255,255,255,0.14), transparent 60%), linear-gradient(135deg, #1e2a3a 0%, #0f1726 100%);
  display:grid;
  place-items:center;
 }
 .recent-thumb::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, transparent 56%, rgba(0,0,0,0.42));
 }
 .recent-thumb svg{opacity:0.95}
 .recent-meta{
  flex:1;
  padding:7px 10px 8px 10px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:1px;
  background:linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
 }
 .recent-title{
  font-size:11px;
  font-weight:700;
  color:var(--ink-80);
  letter-spacing:0.01em;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
 }
 .recent-sub{
  font-size:11px;
  font-weight:500;
  color:var(--ink-60);
  letter-spacing:0.02em;
  line-height:1;
 }
 .recent-badge{
  position:absolute;
  top:7px;
  right:7px;
  z-index:2;
  background:rgba(0,0,0,0.54);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  outline:1px solid rgba(255,255,255,0.12);
  color:#fff;
  font-size:10px;
  font-weight:700;
  letter-spacing:0.04em;
  text-transform:uppercase;
  padding:3px 6px;
  border-radius:999px;
  line-height:1;
 }

  /* orb — tuned for focus discipline: time hero is primary, orb secondary — dimmed at rest */
  .orb-wrap{
   position:absolute;
   bottom:14px;
   left:50%;
   transform:translateX(-50%);
   z-index:420;
   display:flex;
   flex-direction:column;
   align-items:center;
   gap:6px;
   animation: rise-in var(--dur-base) var(--ease-prism) both;
   animation-delay:420ms;
   opacity:0.78 !important;
  }
  .orb-wrap:has(.orb.gaze-focus){
   opacity:1 !important;
  }
  .orb{
   appearance:none;
   -webkit-appearance:none;
   border:none;
   width:50px;
   height:50px;
   border-radius:50%;
   background:
    radial-gradient(38% 38% at 32% 28%, #ffffff 0%, #dff0ff 14%, #86c8ff 30%, #2f9dff 52%, #0b5ed7 78%);
   box-shadow:
    0 8px 18px rgba(16, 92, 180, 0.22),
    0 0 0 1px rgba(255,255,255,0.14) inset;
   display:grid;
   place-items:center;
   cursor:pointer;
   position:relative;
   transition:transform var(--dur-base) var(--ease-prism), box-shadow var(--dur-base) var(--ease-prism), opacity var(--dur-base) var(--ease-prism);
   opacity:0.78;
  }
 .orb::before{
  content:"";
  position:absolute;
  inset:-8px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(86,184,255,0.22) 0%, transparent 72%);
  opacity:0;
  transition:opacity var(--dur-base) var(--ease-prism);
  pointer-events:none;
 }
  .orb.gaze-focus{
   transform:scale(1.06);
   opacity:1 !important;
   box-shadow:0 12px 28px rgba(16,92,180,0.44), 0 0 0 2.5px var(--stroke-focus), 0 0 20px rgba(86,184,255,0.38) !important;
  }
 .orb.gaze-focus::before{opacity:1}
 .orb:active{transform:scale(0.96)}
 .orb svg{filter:drop-shadow(0 1px 6px rgba(0,0,0,0.22))}
 .orb-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--ink-40);
  opacity:0.88;
 }
 .orb-hint{
  position:absolute;
  bottom:68px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.42);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  outline:1px solid rgba(255,255,255,0.08);
  color:var(--ink-60);
  font-size:10px;
  font-weight:600;
  letter-spacing:0.02em;
  padding:5px 9px;
  border-radius:999px;
  white-space:nowrap;
  opacity:0;
  translate:0 6px;
  transition:opacity var(--dur-base) var(--ease-prism), translate var(--dur-base) var(--ease-prism);
  pointer-events:none;
 }
 .orb-wrap:hover .orb-hint,
 .orb.gaze-focus ~ .orb-hint{opacity:1; translate:0 0}

 /* edge states */
 .view{
  display:none;
  flex-direction:column;
  gap:14px;
  animation: rise-in var(--dur-base) var(--ease-prism) both;
 }
 .view.active{display:flex}
 /* loading skeletons */
 .sk-hero{
  display:flex; gap:12px;
 }
 .sk-card{
  background:var(--mat-glass);
  backdrop-filter:var(--blur-glass);
  -webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  border-radius:var(--r-lg);
  padding:16px;
 }
 .sk-line{height:12px;border-radius:8px}
 .sk-grid{
  display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
 }
 .sk-app{
  height:98px;
  border-radius:18px;
  background:var(--mat-glass);
  backdrop-filter:var(--blur-glass);
  -webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  padding:14px;
  display:grid; justify-items:center; gap:10px;
 }

 /* empty / error / offline / permission cards */
 .state-card{
  background:var(--mat-raised);
  backdrop-filter:var(--blur-heavy);
  -webkit-backdrop-filter:var(--blur-heavy);
  outline:1px solid var(--stroke-glass);
  border-radius:var(--r-lg);
  padding:28px 22px 22px 22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:12px;
  box-shadow:0 18px 44px rgba(0,0,0,0.36);
  min-height:360px;
  justify-content:center;
 }
 .state-illus{
  width:72px;height:72px;
  border-radius:22px;
  display:grid;place-items:center;
  background:rgba(255,255,255,0.06);
  outline:1px solid rgba(255,255,255,0.08);
  margin-bottom:4px;
 }
 .state-title{
  font-size:18px;
  font-weight:700;
  letter-spacing:-0.01em;
  color:var(--ink-100);
 }
 .state-body{
  font-size:13px;
  font-weight:500;
  color:var(--ink-60);
  line-height:1.45;
  max-width:320px;
 }
 .state-actions{
  display:flex;
  gap:10px;
  margin-top:6px;
  flex-wrap:wrap;
  justify-content:center;
 }
 .offline-scrim{
  position:absolute;
  inset:44px 0 0 0;
  background:rgba(4,7,11,0.52);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  z-index:400;
  display:none;
  place-items:center;
  padding:20px;
 }
 .offline-scrim.on{display:grid; animation: rise-in var(--dur-base) var(--ease-prism)}

 /* toast overrides handled by core, but ensure readability */
 .banner strong{font-size:13px}
 .banner .caption{font-size:12px}

 /* focus visible for buttons */
 button:focus-visible, [data-focusable]:focus-visible{outline:2.5px solid var(--stroke-focus); outline-offset:2px}

 /* reduced motion handled in design-system */
 @media (prefers-reduced-motion: reduce){
  .hero-time .colon{animation:none}
 }
</style>
</head>
<body>
<div class="device">
 <div class="stage-shell">
  <div class="stage" data-stage></div>
 </div>
</div>
<script type="module">
import { createOS } from '/os/shared/core.js';
import { hardenGaze } from '/os/shared/lab.js';
const stage = document.querySelector('[data-stage]');
const device = document.querySelector('.device');
const stageShell = document.querySelector('.stage-shell');
const os = createOS(stage, { dwell: true, dwellMs: 350 });
stage.appendChild(os.statusbar());

// helpers
const $ = (s, r=stage)=> r.querySelector(s);
const $$ = (s, r=stage)=> [...r.querySelectorAll(s)];
const h = (tag, attrs={}, ...children)=>{
 const el=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs)){
  if(k==='class') el.className=v;
  else if(k==='html') el.innerHTML=v;
  else if(v!==null && v!==undefined) el.setAttribute(k,v);
 }
 for(const c of children){
  if(c==null) continue;
  if(typeof c==='string') el.appendChild(document.createTextNode(c));
  else el.appendChild(c);
 }
 return el;
};

// time helpers
function fmtTime(d){
 let h=d.getHours(), m=d.getMinutes();
 const am = h<12 ? 'AM' : 'PM';
 h = h%12 || 12;
 const mm = String(m).padStart(2,'0');
 return {h, mm, am};
}
function fmtDate(d){
 return d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
}

// dev controls — outside stage bounds (fixed below stage, not overlaying hero)
const ctrlRow = h('div', {class:'dev-controls', role:'toolbar', 'aria-label':'View state controls'});
const states = [
 {id:'home', label:'Home'},
 {id:'loading', label:'Loading'},
 {id:'empty', label:'Empty'},
 {id:'error', label:'Error'},
 {id:'offline', label:'Offline'},
 {id:'permission', label:'No access'},
];

// state switching
let current='home';
function setState(id){
 current=id;
 [...document.querySelectorAll('.dev-controls .chip, .ctrl-row .chip')].forEach(c=> c.classList.toggle('active', c.dataset.state===id));
 $$('.view').forEach(v=> v.classList.toggle('active', v.id===`view-${id}`));
 // announce
 if(id!=='home'){
  viewport.scrollTo({top:0, behavior:'smooth'});
 }
 // ensure recents scroll hint etc.
 os.emit('statechange', {id});
}
window.__setHomeState = setState; // for probe/manual

// swipe handling for recents
let rx=0;
os.on('swipeleft', ()=>{
 if(current!=='home') return;
 recents.scrollBy({left: 160, behavior:'smooth'});
});
os.on('swiperight', ()=>{
 if(current!=='home') return;
 recents.scrollBy({left: -160, behavior:'smooth'});
});

// keyboard helper: Esc back closes assistant sheet; our wm already handles
// also allow arrow scroll of viewport
stage.addEventListener('keydown', (e)=>{
 if(e.key==='ArrowDown') viewport.scrollBy({top:60, behavior:'smooth'});
 if(e.key==='ArrowUp') viewport.scrollBy({top:-60, behavior:'smooth'});
});

// capture button simulation via Space (core already emits capture)
os.on('capture', ()=>{
 os.banner('<strong>Shutter</strong><span class="caption">capture saved · 12 MP</span>',{timeout:1800});
});

// ensure focus visible after load
requestAnimationFrame(()=> {
 const firstApp = launcher.querySelector('[data-focusable]');
 if(firstApp) { /* don't steal focus automatically, just ensure tab order */ }
});

// expose for probe: ensure at least 6 focusables visible in home
// share subtle drill for gaze cursor dwell test
hardenGaze();
