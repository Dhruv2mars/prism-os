<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Window Manager</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
 /* ---- world-forward stage: the street shows through everything ---- */
 .stage{
  background: radial-gradient(120% 100% at 50% 0%, rgba(30,42,64,0.14), rgba(8,12,20,0.30) 72%);
 }

 /* ---- glass sheet ---- */
 .win-sheet{
  position:absolute;
  display:flex; flex-direction:column;
  background: linear-gradient(165deg, rgba(24,34,50,0.62), rgba(10,16,26,0.72));
  backdrop-filter: saturate(1.5) blur(26px);
  -webkit-backdrop-filter: saturate(1.5) blur(26px);
  border-radius: var(--r-lg);
  outline: 1px solid rgba(255,255,255,0.14);
  box-shadow:
   0 30px 70px rgba(0,0,0,0.44),
   0 6px 18px rgba(0,0,0,0.26),
   inset 0 1px 0 rgba(255,255,255,0.16);
  overflow:hidden;
  transition:
   top var(--dur-base) var(--ease-prism),
   left var(--dur-base) var(--ease-prism),
   width var(--dur-base) var(--ease-prism),
   height var(--dur-base) var(--ease-prism),
   opacity var(--dur-base) var(--ease-prism),
   filter var(--dur-base) var(--ease-prism),
   box-shadow var(--dur-fast) var(--ease-prism),
   outline-color var(--dur-fast) var(--ease-prism);
 }
 .win-sheet.sheet-in{ animation-duration: var(--dur-base); }
 .win-sheet.is-focused{
  outline-color: rgba(86,184,255,0.85);
  box-shadow:
   0 30px 70px rgba(0,0,0,0.44),
   0 0 0 2px var(--accent-wash),
   0 0 30px rgba(86,184,255,0.22),
   inset 0 1px 0 rgba(255,255,255,0.16);
 }
 .win-sheet.gaze-focus{ transform: translateY(-2px); }

 /* titlebar doubles as the gaze rest line: it straddles the stage centre,
    title reads left, actions sit right, the middle stays clear */
 .win-titlebar{
  height:44px; flex:none;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 8px 0 14px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  background: linear-gradient(180deg, rgba(255,255,255,0.07), transparent);
 }
 .win-title-group{ display:flex; align-items:center; gap:9px; min-width:0; }
 .win-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px rgba(86,184,255,0.6); flex:none; }
 .win-dot.dim{ background:var(--ink-20); box-shadow:none; }
 .win-title{ font-size:14px; font-weight:700; letter-spacing:-0.01em; color:var(--ink-100); white-space:nowrap; }
 .win-sub{ font-size:11px; font-weight:600; color:var(--ink-60); white-space:nowrap; }
 .win-actions{ display:flex; gap:6px; align-items:center; flex:none; }
 .win-btn{
  width:28px; height:28px; border-radius:999px;
  border:1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.07);
  color: var(--ink-80);
  display:grid; place-items:center;
  font-size:14px; line-height:1; font-weight:700;
  cursor:pointer;
  transition: background var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism), border-color var(--dur-fast) var(--ease-prism);
 }
 .win-btn:hover{ background: rgba(255,255,255,0.12); }
 .win-btn:active{ transform: scale(0.94); }
 .win-btn.close:hover{ background: rgba(255,93,93,0.16); border-color: rgba(255,93,93,0.28); color:#ffb3b3; }
 .win-btn:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }

 .win-body{
  flex:1; min-height:0; overflow-y:auto; scrollbar-width:none;
  display:flex; flex-direction:column; gap:10px;
  padding:12px 14px 14px 14px;
  position:relative; z-index:1;
 }
 .win-body::-webkit-scrollbar{ display:none; }

 /* ---- body content ---- */
 .head-row{ display:flex; align-items:center; gap:8px; }
 .cap{ font-size:11px; font-weight:500; color:var(--ink-60); letter-spacing:0.01em; }
 .cap.bright{ color:var(--ink-80); }
 .num{ font-variant-numeric: tabular-nums; }
 .msg{ display:flex; gap:10px; align-items:flex-start; background:rgba(255,255,255,0.06); outline:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:10px 12px; }
 .avatar{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(180deg,#2f9dff,#0b5ed7); color:#fff; font-weight:700; font-size:12px; flex:none; }
 .avatar.alt{ background:linear-gradient(180deg,#a58bff,#6a4bff); }
 .msg-main{ flex:1; min-width:0; }
 .msg-top{ display:flex; justify-content:space-between; gap:8px; }
 .msg-name{ font-size:13px; font-weight:700; color:var(--ink-100); }
 .msg-text{ font-size:13px; line-height:1.4; color:var(--ink-80); margin-top:2px; }
 .body-actions{ display:flex; gap:8px; align-items:center; }
 .chip.sm{ height:24px; padding:0 10px; font-size:11px; }
 .chip.sm[data-focusable]{ cursor:pointer; }
 .panel{ background:rgba(255,255,255,0.06); outline:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:12px; display:grid; gap:9px; }
 .cap-line{ font-size:13px; line-height:1.45; color:var(--ink-80); }
 .who{ color:var(--ink-40); font-size:11px; font-weight:700; letter-spacing:0.05em; }
 .map{ height:116px; border-radius:14px; position:relative; overflow:hidden; outline:1px solid rgba(255,255,255,0.10);
  background: radial-gradient(130% 120% at 30% 18%, #c8ecff 0%, #7ec8ff 22%, #2f9dff 44%, #0b3b8a 82%); }
 .map-strip{ position:absolute; bottom:8px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:center;
  background:rgba(0,0,0,0.44); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); outline:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:6px 10px; }
 .map-name{ font-size:11px; font-weight:700; color:#fff; }
 .list-row{ display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.06); outline:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:10px 12px; }
 .row-name{ font-size:13px; font-weight:700; color:var(--ink-100); }
 .tile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
 .tile{ height:84px; border-radius:12px; display:grid; place-items:center; outline:1px solid rgba(255,255,255,0.08); position:relative; overflow:hidden; }
 .tile-tag{ position:absolute; bottom:6px; right:8px; background:rgba(0,0,0,0.48); color:#fff; font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; }
 .art{ width:52px; height:52px; border-radius:14px; display:grid; place-items:center; flex:none; background:linear-gradient(135deg,#ff6b9d 0%, #b4235a 100%); box-shadow:0 8px 18px rgba(180,35,90,0.32); }
 .track-name{ font-size:14px; font-weight:700; letter-spacing:-0.01em; color:var(--ink-100); }
 .progress{ height:6px; border-radius:999px; background:rgba(255,255,255,0.10); overflow:hidden; margin-top:8px; }
 .progress i{ display:block; width:42%; height:100%; background:var(--accent); border-radius:999px; }
 .cam-view{ height:132px; border-radius:14px; outline:1px solid rgba(255,255,255,0.10); display:grid; place-items:center; position:relative; overflow:hidden;
  background: radial-gradient(90% 80% at 50% 30%, #2a3550 0%, #0c1220 70%); }
 .lens{ width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,0.06); outline:1px solid rgba(255,255,255,0.10); display:grid; place-items:center; }
 .lens i{ width:48px; height:48px; border-radius:50%; background:#fff; box-shadow:0 4px 16px rgba(0,0,0,0.28); }

 /* ---- deck of background windows (spines) ---- */
 .deck{ position:absolute; inset:0; z-index:460; pointer-events:none; }
 .spine{
  position:absolute; left:56px; width:488px; height:44px;
  display:flex; align-items:center; gap:10px;
  padding:0 14px; border-radius:14px; border:none;
  background: linear-gradient(160deg, rgba(20,29,42,0.58), rgba(10,16,26,0.66));
  backdrop-filter: saturate(1.4) blur(14px);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  outline:1px solid rgba(255,255,255,0.11);
  box-shadow: 0 10px 24px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.10);
  color:var(--ink-80); text-align:left; cursor:pointer;
  pointer-events:auto;
  animation: rise-in var(--dur-base) var(--ease-prism) both;
  transition: opacity var(--dur-base) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism), top var(--dur-base) var(--ease-prism);
 }
 .spine-title{ font-size:12px; font-weight:700; color:var(--ink-100); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
 .spine-meta{ margin-left:auto; font-size:11px; font-weight:500; color:var(--ink-60); white-space:nowrap; }
 .spine-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; }
 .spine-dot.dim{ background:var(--ink-20); }

 /* ---- dock (minimized) ---- */
 .dock{ position:absolute; left:0; right:0; bottom:10px; z-index:560; display:flex; justify-content:center; gap:8px; pointer-events:none; }
 .dock-chip{
  pointer-events:auto; display:inline-flex; align-items:center; gap:8px;
  height:30px; padding:0 12px; border-radius:999px; border:none;
  background: rgba(10,15,23,0.58);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  outline:1px solid rgba(255,255,255,0.11);
  color: var(--ink-80); font-size:11px; font-weight:700;
  cursor:pointer; box-shadow: 0 8px 22px rgba(0,0,0,0.32);
  transition: transform var(--dur-base) var(--ease-prism);
 }
 .dock-chip.gaze-focus{ transform:scale(1.04); }
 .dock-chip:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }

 /* ---- overview ---- */
 .overview{
  position:absolute; inset:44px 0 0 0; z-index:650;
  display:none; flex-direction:column;
  background: rgba(5,9,15,0.30);
  backdrop-filter: saturate(1.4) blur(16px);
  -webkit-backdrop-filter: saturate(1.4) blur(16px);
  padding:10px 0 8px 0;
 }
 .overview.on{ display:flex; animation: rise-in var(--dur-base) var(--ease-prism); }
 .ov-head{ display:flex; align-items:center; gap:10px; padding:2px 16px 10px 16px; }
 .ov-title{ font-size:13px; font-weight:800; letter-spacing:0.02em; color:var(--ink-100); }
 .ov-grid{ flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; column-gap:28px; row-gap:12px; padding:0 12px; overflow-y:auto; scrollbar-width:none; }
 .ov-grid::-webkit-scrollbar{ display:none; }
 .ov-card{
  height:140px; border-radius:16px; border:none;
  background: linear-gradient(165deg, rgba(22,32,46,0.55), rgba(10,16,26,0.62));
  backdrop-filter: saturate(1.4) blur(18px);
  -webkit-backdrop-filter: saturate(1.4) blur(18px);
  outline:1px solid rgba(255,255,255,0.12);
  padding:10px 12px; display:flex; flex-direction:column; gap:8px;
  cursor:pointer; text-align:left; color:var(--ink-80);
  box-shadow:0 12px 30px rgba(0,0,0,0.26);
  transition: transform var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
 }
 .ov-card.gaze-focus, .ov-card:focus-visible{ transform:scale(1.02); }
 .ov-card-top{ display:flex; align-items:center; gap:8px; }
 .ov-card-name{ font-size:12px; font-weight:700; color:var(--ink-100); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
 .ov-card-sub{ margin-left:auto; font-size:11px; color:var(--ink-60); white-space:nowrap; }
 .ov-preview{ flex:1; border-radius:10px; outline:1px solid rgba(255,255,255,0.08); display:grid; place-items:center; position:relative; overflow:hidden; }
 .ov-kind{ font-size:11px; font-weight:700; color:rgba(255,255,255,0.9); letter-spacing:0.06em; text-transform:uppercase; }
 .ov-size{ position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,0.44); color:#fff; font-size:11px; font-weight:700; padding:2px 6px; border-radius:999px; }
 .ov-hint{ padding:8px 0 2px 0; text-align:center; }

 /* ---- edge states: content splits around the gaze rest line (stage centre) ----
    above-block is bottom-anchored at y=282, below-block top-anchored at y=318,
    so no glyph can ever enter the 288-312 rest band regardless of text wrap */
 .state-layer{ position:absolute; inset:44px 0 0 0; z-index:520; pointer-events:none; }
 .edge-above, .edge-below{
  position:absolute; left:24px; right:24px;
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px;
  pointer-events:auto;
 }
 .edge-above{ bottom:318px; }
 .edge-below{ top:318px; }
 .icon-tile{
  width:56px; height:56px; border-radius:16px; display:grid; place-items:center;
  background:rgba(255,255,255,0.08); outline:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
 }
 .edge-title{ font-size:18px; font-weight:800; letter-spacing:-0.01em; color:var(--ink-100); }
 .edge-text{ font-size:13px; line-height:1.45; color:var(--ink-80); max-width:380px; }
 .edge-actions{ display:flex; gap:10px; }
 .edge-actions .btn{ min-height:36px; padding:0 18px; font-size:13px; }
 .status-pill{ display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.06); outline:1px solid rgba(255,255,255,0.07); border-radius:12px; padding:7px 12px; }

 /* error and loading reuse the sheet spine geometry */
 .edge-sheet{ position:absolute; left:38px; top:280px; width:524px; height:276px; margin:0; }
 .sk-row{ display:flex; align-items:center; justify-content:space-between; padding:0 14px; }
 .ghost-spine{ position:absolute; left:56px; width:488px; height:44px; border-radius:14px; }

 button:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }

 @media (prefers-reduced-motion: reduce){
  .win-sheet, .spine, .ov-card, .dock-chip, .overview{ transition:none !important; animation:none !important; }
 }
 :root[data-reduced-motion] .win-sheet,
 :root[data-reduced-motion] .spine,
 :root[data-reduced-motion] .ov-card,
 :root[data-reduced-motion] .overview{ transition:none !important; animation:none !important; }
</style>
</head>
<body>
<div class="device">
 <div class="stage-shell">
  <div class="stage" data-stage></div>
 </div>
</div>
<script type="module">
import { createOS } from '/os/shared/core.js';
import { mountLab } from '/os/shared/lab.js';

const stage = document.querySelector('[data-stage]');
const os = createOS(stage, { dwell: true, dwellMs: 350 });

/* ---- statusbar ---- */
const sbCountHost = document.createElement('span');
sbCountHost.className = 'cap num';
stage.appendChild(os.statusbar(sbCountHost.outerHTML));
const sbCount = stage.querySelector('.statusbar .cap');

/* ---- helpers ---- */
const h = (tag, attrs={}, ...children)=>{
 const el=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs)){
  if(k==='class') el.className=v;
  else if(k==='html') el.innerHTML=v;
  else if(v!==null && v!==undefined) el.setAttribute(k,v);
 }
 for(const c of children){ if(c==null) continue; el.appendChild(typeof c==='string'?document.createTextNode(c):c); }
 return el;
};

/* ---- state ---- */
let layoutMode = 'stacked';
let overviewMode = false;
let edgeState = 'normal';
let focusedId = null;
let winCounter = 3;
const windowsData = new Map();
let minimized = [];

/* ---- fixed geometry: the gaze rest line is the stage centre (y 300, x 300).
   The focused sheet's titlebar (44px) straddles it; background windows collapse
   to spines above; tiled mode keeps a permanent clear gutter at x 288-312. ---- */
const GX = {
 sheetL:38, sheetW:524, sheetT:280, sheetH:276, barH:44,
 spineTops:[228,170,112,54], spineL:56, spineW:488,
 gutterL:12, gutterR:316, colW:272, fieldT:52, fieldB:556,
};

/* ---- containers ---- */
const deck = h('div', {class:'deck', 'aria-label':'Background windows'});
const dock = h('div', {class:'dock', id:'dock', 'aria-label':'Minimized windows'});
const overview = h('div', {class:'overview', 'aria-label':'Window overview'});
const stateLayer = h('div', {class:'state-layer', 'aria-live':'polite'});
stage.append(deck, dock, overview, stateLayer);

/* ---- window bodies ---- */
function bodyHTML(kind, id){
 if(kind==='messages') return `
  <div class="head-row"><span class="cap">Today · 2 unread</span><span class="dot ok" style="width:6px;height:6px"></span><span class="cap" style="margin-left:auto">Mara is typing</span></div>
  <div class="msg"><div class="avatar" aria-hidden="true">M</div><div class="msg-main">
   <div class="msg-top"><span class="msg-name">Mara</span><span class="cap num">9:41</span></div>
   <div class="msg-text">Lens test at 4pm? I'll bring the mount — need the field-of-view check.</div>
  </div></div>
  <div class="msg"><div class="avatar alt" aria-hidden="true">P</div><div class="msg-main">
   <div class="msg-top"><span class="msg-name">Prism Team</span><span class="cap num">9:12</span></div>
   <div class="msg-text">Build 26A ready — window chrome now sits as glass over the world.</div>
  </div></div>
  <div class="body-actions"><button class="chip sm" data-focusable aria-label="Reply to Mara">Reply</button><button class="chip sm" data-focusable aria-label="Mark all read">Mark read</button></div>`;
 if(kind==='maps') return `
  <div class="map">
   <div style="position:absolute;left:34%;top:24%"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s6.2-5.2 6.2-10.2A6.2 6.2 0 0012 4.6 6.2 6.2 0 005.8 10.8C5.8 15.8 12 21 12 21z" fill="#0b5ed7" stroke="white" stroke-width="1.4"/><circle cx="12" cy="10.8" r="2.2" fill="white"/></svg></div>
   <div style="position:absolute;left:62%;top:48%"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" fill="#ff5d5d" stroke="white" stroke-width="2"/></svg></div>
   <div class="map-strip"><span class="map-name">Prism Lab · 0.2 mi</span><span class="cap num" style="color:rgba(255,255,255,0.75)">2 min</span></div>
  </div>
  <div class="list-row"><div><div class="row-name">Café Prism</div><div class="cap num">0.4 mi · 4.6 ★</div></div><span class="cap bright">5 min</span></div>
  <div class="list-row"><div><div class="row-name">Rooftop deck</div><div class="cap">0.6 mi · open</div></div><button class="chip sm" data-focusable aria-label="Navigate to Rooftop deck">Go</button></div>`;
 if(kind==='captions') return `
  <div class="head-row"><span class="chip sm" style="gap:6px"><span class="dot ok" style="width:6px;height:6px"></span>Live</span><span class="cap">English · on-device</span><span class="cap num" style="margin-left:auto">00:12</span></div>
  <div class="panel">
   <div class="cap-line"><span class="who">MARA</span>&nbsp; Let's test the new spatial audio — can you hear the depth?</div>
   <div class="cap-line"><span class="who">YOU</span>&nbsp; Yes — it floats just in front of the world, not stuck to the lens.</div>
  </div>
  <div class="body-actions"><button class="chip sm" data-focusable aria-label="Pause captions">Pause</button><button class="chip sm" data-focusable aria-label="Copy transcript">Copy</button></div>`;
 if(kind==='gallery') return `
  <div class="tile-grid">
   <div class="tile" style="background:linear-gradient(135deg,#ff8a6b 0%, #d4232a 100%)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2.4" stroke="white" stroke-width="1.6"/><circle cx="8.5" cy="10" r="1.5" fill="white"/><path d="M3 15.5l5-4.2 3.2 2.6 3.2-2.2 5.6 4.3" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg><span class="tile-tag">12 MP</span></div>
   <div class="tile" style="background:linear-gradient(135deg,#7ee0a6 0%, #1e6b4a 100%)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 16.5l3.2-3.8 2.6 2.2 2-1.8 3.2 3.4" stroke="white" stroke-width="1.5" stroke-linecap="round"/><rect x="3" y="5" width="18" height="13" rx="2.4" stroke="white" stroke-width="1.5"/></svg></div>
   <div class="tile" style="background:linear-gradient(135deg,#a58bff 0%, #3a2a8a 100%)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3.2" stroke="white" stroke-width="1.6"/><path d="M12 7V5M12 19v-2M7 12H5M19 12h-2" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg></div>
   <div class="tile" style="background:linear-gradient(135deg,#56b8ff 0%, #0b3b8a 100%)"><span style="font-size:13px;font-weight:800;color:#fff">+124</span><span class="tile-tag" style="right:auto;left:50%;transform:translateX(-50%)">Today</span></div>
  </div>
  <div class="cap num" style="text-align:center">128 items · 12 MP</div>
  <div class="body-actions" style="justify-content:center"><button class="chip sm" data-focusable aria-label="Open capture">Open</button><button class="chip sm" data-focusable aria-label="Share gallery">Share</button></div>`;
 if(kind==='music') return `
  <div style="display:flex;gap:12px;align-items:center">
   <div class="art"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 7v7.2c0 .88-.72 1.6-1.6 1.6-.88 0-1.6-.72-1.6-1.6 0-.88.72-1.6 1.6-1.6.32 0 .62.1.86.26V7h3.4V5h-5.1v8" stroke="white" stroke-width="1.7" stroke-linecap="round"/><circle cx="12.4" cy="14.8" r="1.55" fill="white"/></svg></div>

function sheetHTML(title, sub, kind, id){

/* ---- window management ---- */
function createWindow(id, title, sub, kind){
 windowsData.set(id, {title, sub, kind});
 const layer = os.wm.open(id, (lay)=>{
  lay.setAttribute('aria-label', title);
  Object.assign(lay.style, {display:'block', background:'rgba(4,7,11,0.20)', backdropFilter:'blur(4px)', webkitBackdropFilter:'blur(4px)'});
  lay.addEventListener('click', (e)=>{
   if(e.target===lay && os.wm.top()===lay){ closeWindow(id); }
  });
  const sheet = document.createElement('div');
  sheet.className = 'win-sheet sheet-in';
  sheet.dataset.winId = id;
  sheet.setAttribute('data-focusable','');
  sheet.setAttribute('tabindex','0');
  sheet.setAttribute('role','dialog');
  sheet.setAttribute('aria-label', `${title} window`);
  sheet.innerHTML = sheetHTML(title, sub, kind, id);
  sheet.querySelector('[data-action="close"]')?.addEventListener('click', (e)=>{ e.stopPropagation(); closeWindow(id); });
  sheet.querySelector('[data-action="minimize"]')?.addEventListener('click', (e)=>{ e.stopPropagation(); minimizeWindow(id); });
  sheet.addEventListener('click', (e)=>{ e.stopPropagation(); if(focusedId!==id){ focusedId=id; refresh(); } });
  sheet.addEventListener('keydown', (e)=>{
   if(e.key==='Enter' || e.key===' '){ e.preventDefault(); focusedId=id; refresh(); }
  });
  lay.appendChild(sheet);
 });
 focusedId = id;
 refresh();
 return layer;
}

function closeWindow(id){
 os.wm.close(id);
 setTimeout(()=>{ focusedId=os.wm.top()?.dataset.app||null; refresh(); }, 60);
}

function minimizeWindow(id){
 const idx = os.wm.stack.findIndex(l=>l.dataset.app===id);
 if(idx<0) return;
 const meta = windowsData.get(id) || {title:id, sub:'', kind:'messages'};
 const layer = os.wm.stack[idx];
 const sheet = layer.querySelector('.win-sheet');
 if(sheet) sheet.animate([
  { transform:'translateY(0) scale(1)', opacity:1, filter:'blur(0)' },
  { transform:'translateY(36px) scale(0.9)', opacity:0, filter:'blur(8px)' }
 ], { duration: os.state.reducedMotion?1:240, easing:'cubic-bezier(0.32,0.72,0,1)' });
 const remove = ()=>{
  const still = os.wm.stack.findIndex(l=>l.dataset.app===id);
  if(still>=0){ const [rem]=os.wm.stack.splice(still,1); rem.remove(); }
  minimized.push({id, ...meta});
  if(focusedId===id) focusedId = os.wm.top()?.dataset.app || null;
  refresh(); renderDock(); os.emit('appclose', {id});
 };
 setTimeout(remove, os.state.reducedMotion?0:220);
}

function restoreWindow(id){
 const idx = minimized.findIndex(m=>m.id===id);
 if(idx<0) return;
 const meta = minimized.splice(idx,1)[0];
 if(edgeState!=='normal') setEdgeState('normal');
 if(overviewMode) toggleOverview(false);
 createWindow(meta.id, meta.title, meta.sub, meta.kind);
 renderDock();
}

const TEMPLATES = {
 messages:{title:'Messages', sub:'Mara · now', kind:'messages'},
 maps:{title:'Maps', sub:'Nearby · 3', kind:'maps'},
 captions:{title:'Live Captions', sub:'EN · live', kind:'captions'},
 gallery:{title:'Gallery', sub:'128 items', kind:'gallery'},
 music:{title:'Music', sub:'Prism FM', kind:'music'},
 camera:{title:'Camera', sub:'Lens', kind:'camera'},
};

function openNewWindow(kind){
 if(edgeState!=='normal') setEdgeState('normal');
 if(overviewMode) toggleOverview(false);
 if(os.wm.stack.length>=5){
  os.banner('<strong>Limit reached</strong><span class="caption">close a window first — five sheets is the glasses maximum</span>',{timeout:2000});
  return;
 }
 const keys = Object.keys(TEMPLATES);
 const pick = kind || keys[Math.floor(Math.random()*keys.length)];
 const t = TEMPLATES[pick];
 createWindow(`${pick}-${++winCounter}`, t.title, t.sub, t.kind);
}

function focusWindow(id){
 if(edgeState!=='normal') setEdgeState('normal');
 if(overviewMode) toggleOverview(false);
 const idx = os.wm.stack.findIndex(l=>l.dataset.app===id);
 if(idx<0) return;
 const [lay] = os.wm.stack.splice(idx,1);
 os.wm.stack.push(lay);
 stage.appendChild(lay);
 stage.appendChild(os.cursor);
 os.wm.stack.forEach((l,i)=> l.style.zIndex=String(400+i));
 focusedId = id;
 refresh();
}

function cycleFocus(){
 const stack = os.wm.stack;
 if(stack.length<2){
  os.banner('<strong>Only one window</strong><span class="caption">open another to cycle focus</span>',{timeout:1800});
  return;
 }
 focusWindow(stack[stack.length-2].dataset.app);
}

function toggleOverview(force){
 overviewMode = force===undefined ? !overviewMode : force;
 if(overviewMode && edgeState!=='normal') setEdgeState('normal');
 refresh();
}

/* ---- layout engine ---- */
function updateStatus(n){
 if(sbCount) sbCount.textContent = `WM · ${n} window${n===1?'':'s'}`;
}

function placeFocusedSheet(sheet){
 sheet.classList.add('is-focused');
 Object.assign(sheet.style,{
  display:'flex', position:'absolute',
  left:GX.sheetL+'px', top:GX.sheetT+'px', width:GX.sheetW+'px', height:GX.sheetH+'px',
  transform:'none', filter:'none', opacity:'1',
 });
}

function spineFor(layer, d, tops = GX.spineTops){
 const id = layer.dataset.app;
 const meta = windowsData.get(id) || {title:id, sub:''};
 const b = h('button', {class:'spine', 'data-focusable':'', tabindex:'0', 'aria-label':`Focus ${meta.title} window`});
 b.innerHTML = `<span class="spine-dot${id===focusedId?'':' dim'}"></span><span class="spine-title"></span><span class="spine-meta"></span>`;
 b.querySelector('.spine-title').textContent = meta.title;
 b.querySelector('.spine-meta').textContent = meta.sub || '';
 Object.assign(b.style,{
  top:(tops[d-1] ?? tops[tops.length-1])+'px',
  opacity:String([0.62,0.54,0.46,0.38][d-1]),
  transform:`scale(${1-(d-1)*0.03})`, transformOrigin:'top center',
  filter: d>1 ? `blur(${(d-1)*0.8}px)` : 'none',
  zIndex:String(460-d),
 });
 b.addEventListener('click', ()=>focusWindow(id));
 return b;
}

function layoutStacked(){
 const stack = os.wm.stack;
 const parked = edgeState==='offline' || edgeState==='permission';
 /* parked mode keeps the workspace readable while an offline / permission
    message owns the space below the rest line: the focused sheet collapses
    to its titlebar and spines tuck above the message block */
 const tops = parked ? [166,108,50] : GX.spineTops;
 deck.innerHTML=''; deck.hidden=false;
 for(let i=stack.length-1; i>=0; i--){
  const layer = stack[i];
  const sheet = layer.querySelector('.win-sheet');
  const isTop = i===stack.length-1;
  layer.style.display='block';
  layer.style.background = isTop ? 'rgba(4,7,11,0.20)' : 'rgba(4,7,11,0.05)';
  layer.style.backdropFilter = isTop ? 'blur(4px)' : 'none';
  layer.style.webkitBackdropFilter = isTop ? 'blur(4px)' : 'none';
  layer.style.zIndex = String(400+i);
  if(isTop){
   placeFocusedSheet(sheet);
   if(parked){
    sheet.style.height='44px';
    sheet.style.opacity='0.72';
   }
  }
  else{
   sheet.style.display='none';
   sheet.classList.remove('is-focused');
   const d = stack.length-1-i;
   if(d<=tops.length) deck.appendChild(spineFor(layer, d, tops));
  }
 }
}

function layoutTiled(){
 const stack = os.wm.stack, n = stack.length;
 deck.innerHTML=''; deck.hidden=true;
 if(n===1){ layoutStacked(); return; }
 const rows = Math.ceil(n/2);
 const rowH = (GX.fieldB - GX.fieldT - (rows-1)*12) / rows;
 stack.forEach((layer,i)=>{
  const sheet = layer.querySelector('.win-sheet');
  const row = Math.floor(i/2), col = i%2;
  const isFocused = sheet.dataset.winId===focusedId;
  sheet.classList.toggle('is-focused', isFocused);
  Object.assign(sheet.style,{
   display:'flex', position:'absolute',
   left:(col===0?GX.gutterL:GX.gutterR)+'px',
   top:(GX.fieldT + row*(rowH+12))+'px',
   width:GX.colW+'px', height:rowH+'px',
   transform:'none', filter:'none',
   opacity: isFocused?'1':'0.78',
  });
  layer.style.display='block';
  layer.style.background='rgba(4,7,11,0.05)';
  layer.style.backdropFilter='none';
  layer.style.webkitBackdropFilter='none';
  layer.style.zIndex=String(400+i);
 });
}

const KIND_TINTS = {
 messages:'linear-gradient(135deg,#1e2a3a 0%, #0f1726 100%)',
 maps:'linear-gradient(135deg,#0b3b8a 0%, #2f9dff 100%)',

 music:'linear-gradient(135deg,#3a2a8a 0%, #a58bff 100%)',

};

function renderOverview(){
 overview.innerHTML='';

  empty.innerHTML = `<span class="edge-title" style="font-size:15px">No windows open</span><span class="cap">tap to open one</span>`;
  empty.addEventListener('click', ()=>{ toggleOverview(false); openNewWindow(); });

 } else {

   card.innerHTML = `
    <div class="ov-card-top"><span class="spine-dot${id===focusedId?'':' dim'}"></span><span class="ov-card-name"></span><span class="ov-card-sub"></span></div>
    <div class="ov-preview" style="background:${KIND_TINTS[meta.kind]||KIND_TINTS.messages}"><span class="ov-kind"></span><span class="ov-size num">600×340</span></div>`;
   card.querySelector('.ov-card-name').textContent = meta.title;
   card.querySelector('.ov-card-sub').textContent = meta.sub || '';
   card.querySelector('.ov-kind').textContent = meta.kind;

 const hint = h('div', {class:'cap ov-hint'}, 'Tap a window to focus it');

function dimForState(){
 os.wm.stack.forEach(l=>{
  const s=l.querySelector('.win-sheet');
  if(s && s.style.display!=='none') s.style.opacity='0.72';
 });
 deck.style.opacity='0.8';
}

function refresh(){
 renderDock();
 const n = os.wm.stack.length;
 updateStatus(n);
 deck.style.opacity='';
 overview.classList.remove('on');
 if(edgeState!=='normal' && edgeState!=='offline' && edgeState!=='permission') return;
 if(overviewMode){
  deck.hidden=true;
  os.wm.stack.forEach((layer,i)=>{
   const sheet=layer.querySelector('.win-sheet');
   sheet.classList.remove('is-focused');
   Object.assign(sheet.style,{opacity:'0.16', filter:'blur(6px)', transform:'scale(0.96)'});
   layer.style.background='rgba(4,7,11,0.28)';
   layer.style.zIndex=String(400+i);
  });
  renderOverview();
  overview.classList.add('on');
  return;
 }
 deck.hidden=false;
 os.wm.stack.forEach(l=>{ l.style.pointerEvents='auto'; });
 if(layoutMode==='tiled' && n>1) layoutTiled();
 else layoutStacked();
 if(edgeState==='offline' || edgeState==='permission') dimForState();
}

function renderDock(){
 dock.innerHTML='';
 minimized.forEach(m=>{
  const chip = h('button', {class:'dock-chip', 'data-focusable':'', tabindex:'0', 'aria-label':`Restore ${m.title} window`});
  chip.innerHTML = `<span class="spine-dot"></span><span></span>`;
  chip.querySelector('span:last-child').textContent = m.title;
  chip.addEventListener('click', ()=>restoreWindow(m.id));
  dock.appendChild(chip);
 });
}

/* ---- edge states ----
   Every state splits around the gaze rest line: the .edge-above block is
   bottom-anchored at y 282 and .edge-below top-anchored at y 318, so glyphs
   can never enter the 288-312 centre band, whatever the text does. */
function setEdgeState(state){
 edgeState = state;
 stateLayer.innerHTML='';
 if(overviewMode && state!=='normal') overviewMode=false;
 if(state==='normal'){
  stateLayer.style.display='none';
  if(os.wm.stack.length===0 && minimized.length===0) createInitialWindows();
  else{ os.wm.stack.forEach(l=> l.style.display=''); refresh(); }
  return;
 }
 stateLayer.style.display='block';
 if(state==='empty'){
  [...os.wm.stack].forEach(l=>{ const i=os.wm.stack.indexOf(l); if(i>=0) os.wm.stack.splice(i,1); l.remove(); });
  windowsData.clear(); minimized=[]; focusedId=null;
  deck.innerHTML=''; dock.innerHTML=''; updateStatus(0);
  stateLayer.appendChild(h('div', {class:'edge-above', html:`
   <div class="icon-tile" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="16" height="12" rx="2.6" stroke="white" stroke-opacity="0.92" stroke-width="1.6"/><path d="M7 12h6M7 15.5h3.5M13.5 12h3.5" stroke="white" stroke-opacity="0.72" stroke-width="1.5" stroke-linecap="round"/><circle cx="15" cy="8.2" r="1.5" stroke="white" stroke-opacity="0.86" stroke-width="1.4"/></svg></div>
   <div class="edge-title">No windows open</div>`}));
  const below = h('div', {class:'edge-below', html:`
   <p class="edge-text">Your workspace is clear. Windows are translucent sheets over the world — open one to begin.</p>
   <div class="edge-actions"><button class="btn primary" data-focusable aria-label="Open Messages" data-open="messages">Open Messages</button><button class="btn" data-focusable aria-label="Open Gallery" data-open="gallery">Open Gallery</button></div>`});
  below.querySelectorAll('[data-open]').forEach(b=> b.addEventListener('click', ()=>{ setEdgeState('normal'); openNewWindow(b.dataset.open); }));
  stateLayer.appendChild(below);
  return;
 }
 if(state==='loading'){
  os.wm.stack.forEach(l=> l.style.display='none');
  deck.innerHTML='';
  const skBar = (w)=>`<div class="skeleton" style="width:${w};height:12px;border-radius:6px"></div>`;
  const sheet = h('div', {class:'win-sheet edge-sheet', html:`
   <div class="win-titlebar"><div class="sk-row" style="width:100%;gap:10px"><span class="skeleton" style="width:8px;height:8px;border-radius:50%"></span>${skBar('92px')}<span class="skeleton" style="width:56px;height:24px;border-radius:999px;margin-left:auto"></span></div></div>
   <div class="win-body">${skBar('44%')}${skBar('78%')}<div class="skeleton" style="height:92px;width:100%;border-radius:12px"></div></div>`});
  stateLayer.appendChild(sheet);
  [1,2].forEach(d=>{
   const g=h('div', {class:'ghost-spine skeleton'});
   g.style.top = GX.spineTops[d]+'px';
   g.style.opacity = String(0.4 - d*0.08);
   stateLayer.appendChild(g);
  });
  const note = h('div', {class:'edge-above', style:'padding-bottom:10px', html:`<span class="cap bright" style="display:flex;align-items:center;gap:8px"><span class="dot ok" style="width:6px;height:6px;background:var(--accent)"></span>Restoring your workspace</span>`});
  stateLayer.appendChild(note);
  return;
 }
 if(state==='error'){
  /* all real windows go dark; the error sheet takes the focused slot and
     survivors read as spines above, matching "your other windows are safe" */
  const failed = os.wm.stack.find(l=>String(l.dataset.app).startsWith('maps')) || os.wm.top();
  os.wm.stack.forEach(l=> l.style.display='none');
  deck.innerHTML='';
  const survivors = os.wm.stack.filter(l=>l!==failed).reverse();
  survivors.slice(0,3).forEach((l,i)=> deck.appendChild(spineFor(l, i+1, [228,170,112])));
  deck.hidden=false;
  const sheet = h('div', {class:'win-sheet edge-sheet is-focused', html:`
   <div class="win-titlebar">
    <div class="win-title-group"><span class="win-dot" style="background:var(--danger);box-shadow:0 0 8px rgba(255,93,93,0.5)"></span><span class="win-title">Maps</span><span class="win-sub">failed to load</span></div>
    <div class="win-actions"><button class="win-btn close" data-focusable aria-label="Dismiss error">×</button></div>
   </div>
   <div class="win-body" style="justify-items:center;display:grid;gap:12px;text-align:center;align-content:start">
    <div class="icon-tile" style="background:rgba(255,93,93,0.10);outline-color:rgba(255,93,93,0.20)" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 3.5L21.5 19H2.5L12 3.5z" stroke="#ff8a8a" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 9.5v4" stroke="#ffb3b3" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1.25" fill="#ffb3b3"/></svg></div>
    <div style="display:grid;gap:4px"><div style="font-size:15px;font-weight:800;color:var(--ink-100)">Window failed to load</div><p class="edge-text" style="font-size:12px">Maps couldn't reach the world layer. Your other windows are safe.</p></div>
    <div class="edge-actions"><button class="btn primary" data-focusable aria-label="Retry loading Maps" data-act="retry">Retry</button><button class="btn ghost" data-focusable aria-label="Dismiss error" data-act="dismiss">Dismiss</button></div>
    <div class="status-pill" style="align-self:center"><span class="dot bad" aria-hidden="true"></span><span class="cap bright">Maps · network error</span><span class="cap num" style="margin-left:auto">9:41</span></div>
   </div>`});
  sheet.querySelector('.win-btn').addEventListener('click', ()=> setEdgeState('normal'));
  sheet.querySelector('[data-act="retry"]').addEventListener('click', (e)=>{
   const btn=e.currentTarget; btn.textContent='Retrying…'; btn.setAttribute('disabled','true');
   const body=sheet.querySelector('.win-body');
   body.innerHTML = `<div class="skeleton" style="height:14px;width:52%;border-radius:6px"></div><div class="skeleton" style="height:110px;width:100%;border-radius:12px"></div>`;
   setTimeout(()=>{ setEdgeState('normal'); openNewWindow('maps'); os.banner('<strong>Maps restored</strong><span class="caption">window reloaded</span>',{timeout:1800}); }, 1100);
  });
  sheet.querySelector('[data-act="dismiss"]').addEventListener('click', ()=> setEdgeState('normal'));
  stateLayer.appendChild(sheet);
  return;
 }
 /* offline + permission keep the windows visible but dimmed */
 os.wm.stack.forEach(l=> l.style.display='');
 refresh();
 if(state==='offline'){
  stateLayer.appendChild(h('div', {class:'edge-above', html:`
   <div class="icon-tile" style="background:rgba(255,194,71,0.12);outline-color:rgba(255,194,71,0.20)" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3.5 9.5a9 9 0 0117 0" stroke="white" stroke-opacity="0.92" stroke-width="1.6" stroke-linecap="round"/><path d="M6 12.5a6 6 0 0112 0" stroke="white" stroke-opacity="0.78" stroke-width="1.6" stroke-linecap="round"/><path d="M8.8 15.5a2.8 2.8 0 016.4 0" stroke="white" stroke-opacity="0.76" stroke-width="1.6" stroke-linecap="round"/><path d="M2 2l20 20" stroke="#ffc247" stroke-width="1.7" stroke-linecap="round"/></svg></div>
   <div class="edge-title">You're offline</div>`}));
  const below = h('div', {class:'edge-below', html:`
   <p class="edge-text">Windows keep their last state. New content syncs when the world link returns.</p>
   <div class="edge-actions"><button class="btn primary" data-focusable aria-label="Retry connection" data-act="retry">Retry</button><button class="btn" data-focusable aria-label="Continue offline" data-act="cached">Use cached</button></div>
   <div class="status-pill"><span class="dot bad" aria-hidden="true"></span><span class="cap bright">No network · windows cached</span></div>`});
  below.querySelector('[data-act="retry"]').addEventListener('click', (e)=>{
   const b=e.currentTarget; b.textContent='Retrying…';
   setTimeout(()=>{ os.banner('<strong>Still offline</strong><span class="caption">check the world link · cached windows remain usable</span>',{timeout:2200}); b.textContent='Retry'; }, 900);
  });
  below.querySelector('[data-act="cached"]').addEventListener('click', ()=>{
   setEdgeState('normal');
   os.banner('<strong>Offline mode</strong><span class="caption">cached windows only</span>',{timeout:2000});
  });
  stateLayer.appendChild(below);
  return;
 }
 if(state==='permission'){
  stateLayer.appendChild(h('div', {class:'edge-above', html:`
   <div class="icon-tile" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="5" y="9" width="14" height="10.5" rx="2.4" stroke="white" stroke-opacity="0.92" stroke-width="1.6"/><path d="M8.5 9V7.8a3.5 3.5 0 017 0V9" stroke="white" stroke-width="1.5"/><circle cx="12" cy="14.3" r="1.3" fill="white"/><path d="M12 15.6v1.6" stroke="white" stroke-width="1.3" stroke-linecap="round"/></svg></div>
   <div class="edge-title">Permission needed</div>`}));
  const below = h('div', {class:'edge-below', html:`
   <p class="edge-text">Maps needs location to show nearby places. Nothing is shared until you allow it.</p>
   <div class="edge-actions"><button class="btn primary" data-focusable aria-label="Allow location access" data-act="allow">Allow location</button><button class="btn ghost" data-focusable aria-label="Not now" data-act="later">Not now</button></div>
   <div class="status-pill"><span class="dot warn" aria-hidden="true"></span><span class="cap bright">Location blocked · Maps stays empty</span></div>`});
  below.querySelector('[data-act="allow"]').addEventListener('click', (e)=>{
   const b=e.currentTarget; b.textContent='Allowing…';
   setTimeout(()=>{ setEdgeState('normal'); openNewWindow('maps'); os.banner('<strong>Location allowed</strong><span class="caption">Maps populated</span>',{timeout:1800}); }, 700);
  });
  below.querySelector('[data-act="later"]').addEventListener('click', ()=>{
   setEdgeState('normal');
   os.banner('<strong>Without location</strong><span class="caption">Maps stays empty · allow later in settings</span>',{timeout:2200});
  });
  stateLayer.appendChild(below);
 }
}

/* ---- initial windows (synchronous so URL states apply cleanly) ---- */
function createInitialWindows(){
 [...os.wm.stack].forEach(l=>{ const i=os.wm.stack.indexOf(l); if(i>=0) os.wm.stack.splice(i,1); l.remove(); });
 windowsData.clear(); minimized=[]; focusedId=null; winCounter=3;
 [
  {id:'messages-1', title:'Messages', sub:'Mara · now', kind:'messages'},
  {id:'maps-1', title:'Maps', sub:'Nearby · 3', kind:'maps'},
  {id:'captions-1', title:'Live Captions', sub:'EN · live', kind:'captions'},
 ].forEach(w=> createWindow(w.id, w.title, w.sub, w.kind));
 focusedId='captions-1';
 refresh();
}

/* ---- gestures / keys ---- */
const dismissTop = ()=>{
 if(edgeState!=='normal' || overviewMode) return;
 const top=os.wm.top();
 if(top) closeWindow(top.dataset.app);
};
os.on('swipeleft', dismissTop);
os.on('swiperight', dismissTop);
os.on('back', ()=>{
 if(overviewMode){ toggleOverview(false); return; }
 if(edgeState!=='normal'){ setEdgeState('normal'); return; }
 setTimeout(()=>{ focusedId=os.wm.top()?.dataset.app||null; refresh(); }, 60);
});
os.on('capture', ()=>{
 os.banner('<strong>Capture</strong><span class="caption">window snapshot saved</span>',{timeout:1800});
});
os.on('appclose', ()=> setTimeout(()=>{ focusedId=os.wm.top()?.dataset.app||null; refresh(); }, 40));

/* ---- boot, then the simulator rail (outside the stage) ---- */
createInitialWindows();
mountLab({
 piece:'03-wm',
 title:'Window manager',
 states:['ready','loading','empty','error','offline','denied'],
 onState:(s)=> setEdgeState(s==='ready'?'normal': s==='denied'?'permission': s),
 actions:[
  {label:'Open window', run:()=> openNewWindow()},
  {label:'Cycle focus', run:()=> cycleFocus()},
  {label:'Minimize top', run:()=>{ const t=os.wm.top(); if(t) minimizeWindow(t.dataset.app); }},
  {label:'Close top', run:()=>{ const t=os.wm.top(); if(t) closeWindow(t.dataset.app); }},
  {label:'Toggle overview', run:()=> toggleOverview()},
  {label:'Stacked layout', run:()=>{ layoutMode='stacked'; refresh(); }},
  {label:'Tiled layout', run:()=>{ layoutMode='tiled'; if(overviewMode) toggleOverview(false); refresh(); }},
 ],
 onScale:(v)=>{ stage.style.setProperty('--stage-scale', String(v)); os.state.scale=v; },
 onReducedMotion:(on)=>{ os.state.reducedMotion=on; },
});

window.__wm = { setEdgeState, openNewWindow, cycleFocus, focusWindow, toggleOverview,
 getState: ()=>({edgeState, layoutMode, overviewMode, count: os.wm.stack.length}) };
</script>
</body>
</html>
