<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Gesture Trainer</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
 .stage{
  background:
   radial-gradient(120% 90% at 50% 16%, rgba(42,53,80,0.56) 0%, rgba(20,26,40,0.74) 36%, rgba(10,14,23,0.90) 70%),
   radial-gradient(70% 50% at 78% 88%, rgba(86,184,255,0.08), transparent 55%),
   rgba(6,10,16,0.78);
 }
 .stage-shell{
  position:relative;
  width:600px; height:600px;
  display:grid; place-items:center;
  flex:none;
 }
 /* dev chrome — fixed outside .stage, not inside stage.png (verified: ctrlRow.top > stage.bottom) */
 .ctrl-row{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex; gap:6px;
  z-index:1000;
  justify-content:center;
  pointer-events:none;
  flex-wrap:wrap;
  padding:8px 12px;
  border-radius:999px;
  background: rgba(10,15,23,0.74);
  outline:1px solid var(--stroke-glass);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 24px rgba(0,0,0,0.32);
  max-width:92vw;
 }
 .stage .ctrl-row{ display:none !important; }
 .ctrl-row .chip{
  pointer-events:auto;
  height:26px; padding:0 10px;
  font-size:11px; font-weight:700; letter-spacing:0.02em;
  border:none; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition: background var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
 }
 .ctrl-row .chip.active{
  background: linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#051423; outline-color:transparent;
 }
 .ctrl-row .chip:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .ctrl-row .chip.gaze-focus{transform:scale(1.04)}

 /* trainer viewport — single-focus: practice is hero, others are quiet */
 .trainer{
  position:absolute;
  inset:44px 0 0 0;
  display:flex;
  flex-direction:column;
  padding: 12px 16px 12px 16px;
  gap:8px;
  overflow:hidden;
 }
 .stepper{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:0 2px;
  opacity:0.72;
 }
 .stepper-left{ display:flex; align-items:center; gap:8px; min-width:0; }
 .step-icon{
  width:24px; height:24px; border-radius:8px;
  display:grid; place-items:center; flex:none;
  background: rgba(255,255,255,0.06);
  outline:1px solid rgba(255,255,255,0.07);
 }
 .step-icon svg{ width:14px; height:14px; }
 .step-label{
  font-size:10px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase; color:var(--ink-40);
  line-height:1;
 }
 .step-title{
  font-size:13px; font-weight:700; letter-spacing:-0.01em; line-height:1; margin-top:2px; color:var(--ink-80);
 }
 .step-dots{ display:flex; gap:5px; align-items:center; flex:none; opacity:0.9; }
 .dot-step{
  appearance:none; -webkit-appearance:none;
  border:none;
  width:6px; height:6px; border-radius:999px;
  background: rgba(255,255,255,0.14);
  outline:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
  padding:0;
  transition: all var(--dur-base) var(--ease-prism);
 }
 .dot-step.active{
  width:16px; background: var(--accent); outline-color: transparent;
  box-shadow: 0 0 8px rgba(86,184,255,0.38);
 }
 .dot-step.done{
  background: rgba(86,184,255,0.7);
 }
 .dot-step:focus-visible{ outline:2px solid var(--stroke-focus); outline-offset:2px; }
 .dot-step.gaze-focus{ transform:scale(1.15); }

 .instruction{
  text-align:center;
  display:grid; gap:2px; justify-items:center;
  padding:0 8px;
  opacity:0.94;
 }
 .instruction p{
  font-size:12px; font-weight:500; color:var(--ink-60); line-height:1.35; max-width:340px;
 }
 .instruction strong{ color:var(--ink-80); font-weight:700; }

 .illus{
  height:52px;
  display:grid; place-items:center;
  position:relative;
  opacity:0.78;
 }
 .illus-card{
  width:100%;
  height:52px;
  border-radius:14px;
  background: rgba(255,255,255,0.04);
  outline:1px solid rgba(255,255,255,0.06);
  display:grid; place-items:center;
  position:relative; overflow:hidden;
  box-shadow:none;
 }
 .illus-card::after{
  content:""; position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 60%);
  pointer-events:none;
 }
 .illus-card svg{ max-width:92%; max-height:42px; width:auto; height:auto; display:block; }

 .practice{
  flex:1;
  min-height:188px;
  background: var(--mat-raised);
  backdrop-filter: var(--blur-glass); -webkit-backdrop-filter: var(--blur-glass);
  outline:1.5px solid rgba(86,184,255,0.18);
  border-radius: var(--r-lg);
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  position:relative;
  overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,0.32), 0 0 0 1px rgba(255,255,255,0.04) inset;
  transition: transform var(--dur-base) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
 }
 .practice.is-success{
  outline-color: rgba(76,212,124,0.5);
  box-shadow: 0 0 0 2px rgba(76,212,124,0.14), 0 16px 36px rgba(0,0,0,0.32), 0 0 22px rgba(76,212,124,0.18);
  animation: successPulse 520ms var(--ease-prism);
 }
 @keyframes successPulse{
  0%{ transform:scale(1); }
  35%{ transform:scale(1.02); }
  100%{ transform:scale(1); }
 }
 .practice-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
 }
 .practice-label{
  font-size:10px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase; color:var(--ink-40);
 }
 .practice-status{
  display:inline-flex; align-items:center; gap:6px;
  height:22px; padding:0 8px;
  border-radius:999px;
  background: rgba(255,255,255,0.07);
  outline:1px solid rgba(255,255,255,0.07);
  font-size:11px; font-weight:700; color:var(--ink-80);
 }
 .practice-status .dot.ok{ width:6px; height:6px; }
 .practice-status.done{ background: rgba(76,212,124,0.14); color:#bff1cf; outline-color:rgba(76,212,124,0.28); }

 /* step views */
 .step-view{ display:none; flex-direction:column; gap:10px; flex:1; min-height:0; }
 .step-view.active{ display:flex; animation: rise-in var(--dur-base) var(--ease-prism) both; }

 /* step1 targets — reduced to 56px single-focus */
 .targets{
  flex:1;
  display:flex; align-items:center; justify-content:center; gap:14px;
  padding:6px 0 18px 0;
 }
 .target{
  appearance:none; -webkit-appearance:none;
  border:none;
  width:56px; height:56px; border-radius:50%;
  background: rgba(255,255,255,0.06);
  outline:1px solid rgba(255,255,255,0.10);
  display:grid; place-items:center;
  cursor:pointer;
  position:relative;
  transition: transform var(--dur-base) var(--ease-prism), background var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism);
  flex:none;
 }
 .target::before{
  content:""; position:absolute; inset:7px; border-radius:50%;
  border:1.3px solid rgba(255,255,255,0.16);
 }
 .target::after{
  content:""; position:absolute; inset:17px; border-radius:50%;
  background: rgba(255,255,255,0.92);
  box-shadow: 0 2px 8px rgba(0,0,0,0.20);
 }
 .target.done{
  background: rgba(86,184,255,0.14);
  outline-color: rgba(86,184,255,0.45);
  box-shadow: 0 0 0 2px rgba(86,184,255,0.12), 0 0 18px rgba(86,184,255,0.22);
 }
 .target.done::after{ background: var(--accent); box-shadow:0 0 12px rgba(86,184,255,0.6); }
 .target.gaze-focus{
  transform: scale(1.08);
  outline-color: var(--stroke-focus);
  box-shadow: 0 0 0 2px rgba(86,184,255,0.16), 0 0 18px rgba(86,184,255,0.28);
 }
 .target:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }
 .target .check{
  position:absolute; z-index:2; width:18px; height:18px; border-radius:50%;
  background:#fff; display:grid; place-items:center; opacity:0; transform:scale(0.6);
  transition: all var(--dur-base) var(--ease-prism);
 }
 .target.done .check{ opacity:1; transform:scale(1); }
 .dwell-hint{
  position:absolute; bottom:-22px; left:50%; transform:translateX(-50%);
  font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-40);
  white-space:nowrap; opacity:0; transition: opacity var(--dur-fast) var(--ease-prism);
  pointer-events:none;
 }
 .target.gaze-focus .dwell-hint{ opacity:1; }

 /* step2 tap */
 .tap-zone{
  flex:1;
  display:grid; place-items:center;
  padding:10px 0;
  position:relative;
 }
 .tap-btn{
  appearance:none; -webkit-appearance:none;
  border:none;
  height:52px; padding:0 22px;
  border-radius:999px;
  background: linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#051423;
  font-size:15px; font-weight:800; letter-spacing:-0.01em;
  display:inline-flex; align-items:center; gap:10px;
  cursor:pointer;
  box-shadow: 0 10px 24px rgba(16,92,180,0.34), 0 0 0 1px rgba(255,255,255,0.16) inset;
  transition: transform var(--dur-base) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism), filter var(--dur-fast) var(--ease-prism);
  position:relative;
 }
 .tap-btn::after{
  content:""; position:absolute; inset:-8px; border-radius:999px;
  background: radial-gradient(circle, rgba(86,184,255,0.24) 0%, transparent 70%);
  opacity:0; transition: opacity var(--dur-base) var(--ease-prism); pointer-events:none;
 }
 .tap-btn.gaze-focus{ transform:scale(1.06); box-shadow:0 14px 32px rgba(16,92,180,0.44), 0 0 0 2.5px var(--stroke-focus), 0 0 22px rgba(86,184,255,0.36); }
 .tap-btn.gaze-focus::after{ opacity:1; }
 .tap-btn:active{ transform:scale(0.96); }
 .tap-btn.done{ background: linear-gradient(180deg, #4cd47c, #2faa5a); color:#05210f; box-shadow:0 10px 24px rgba(47,170,90,0.34); }
 .tap-btn:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }

 /* step3 swipe list — fix fracture: no mask, proper width, no overlap */
 .scroll-track{
  flex:1;
  display:flex; gap:12px;
  overflow-x:auto; overscroll-behavior-x:contain;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  padding:6px 2px 10px 2px;
  width:100%; min-width:0; box-sizing:border-box;
  -webkit-overflow-scrolling:touch;
 }
 .scroll-track::-webkit-scrollbar{ display:none; }
 .swipe-card{
  flex:0 0 138px; min-width:138px; height:92px;
  border-radius:16px;
  background: var(--mat-glass);
  outline:1px solid var(--stroke-glass);
  padding:12px;
  display:grid; gap:8px; align-content:start;
  scroll-snap-align:start;
  scroll-snap-stop:normal;
  position:relative; overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.22);
  box-sizing:border-box;
 }
 .swipe-card::after{
  content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,0.06), transparent 46%); pointer-events:none;
 }
 .swipe-card .swatch{
  height:36px; border-radius:10px;
  outline:1px solid rgba(255,255,255,0.08);
 }
 .swipe-indicator{
  height:4px; border-radius:999px;
  background: rgba(255,255,255,0.10);
  overflow:hidden; position:relative;
 }
 .swipe-indicator > span{
  position:absolute; left:0; top:0; bottom:0; width:36%;
  border-radius:999px; background: var(--accent);
  transition: transform var(--dur-base) var(--ease-prism);
 }
 .swipe-hint{
  display:flex; align-items:center; justify-content:space-between;
  font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-40);
 }

 /* step4 capture */
 .capture-zone{
  flex:1;
  display:grid; place-items:center; gap:12px;
  padding:6px 0;
 }
 .shutter-btn{
  appearance:none; -webkit-appearance:none;
  border:none;
  width:84px; height:84px; border-radius:50%;
  background: #fff;
  outline:2px solid rgba(255,255,255,0.9);
  box-shadow: 0 0 0 6px rgba(255,255,255,0.12), 0 12px 28px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.9);
  display:grid; place-items:center;
  cursor:pointer;
  position:relative;
  transition: transform var(--dur-base) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism);
 }
 .shutter-btn::before{
  content:""; position:absolute; inset:6px; border-radius:50%;
  border:1.5px solid rgba(0,0,0,0.08);
 }
 .shutter-btn.gaze-focus{
  transform:scale(1.06);
  box-shadow: 0 0 0 6px rgba(86,184,255,0.22), 0 0 0 2.5px var(--stroke-focus), 0 16px 36px rgba(0,0,0,0.36), 0 0 22px rgba(86,184,255,0.22);
 }
 .shutter-btn:active{ transform:scale(0.96); }
 .shutter-btn:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:3px; }
 .shutter-btn.captured{
  animation: shutterPress 420ms var(--ease-prism);
 }
 @keyframes shutterPress{
  0%{ transform:scale(1); }
  22%{ transform:scale(0.92); }
  55%{ transform:scale(1.06); }
  100%{ transform:scale(1); }
 }
 .flash{
  position:absolute; inset:0; border-radius: var(--r-lg);
  background: rgba(255,255,255,0.92);
  opacity:0; pointer-events:none;
  transition: opacity 120ms ease;
 }
 .flash.on{ opacity:1; }
 .capture-meta{
  display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap;
 }
 .capture-count{
  font-size:11px; font-weight:700; letter-spacing:0.04em; color:var(--ink-80);
  background: rgba(255,255,255,0.07); outline:1px solid rgba(255,255,255,0.07); padding:6px 10px; border-radius:999px;
 }

 /* step5 voice */
 .voice-zone{
  flex:1;
  display:grid; place-items:center; gap:14px;
  padding:8px 0;
 }
 .orb{
  appearance:none; -webkit-appearance:none;
  border:none;
  width:72px; height:72px; border-radius:50%;
  background:
   radial-gradient(38% 38% at 32% 28%, #ffffff 0%, #dff0ff 14%, #86c8ff 30%, #2f9dff 52%, #0b5ed7 78%);
  box-shadow:
   0 12px 32px rgba(16,92,180,0.42),
   0 0 0 1px rgba(255,255,255,0.22) inset,
   0 0 22px rgba(86,184,255,0.38);
  display:grid; place-items:center;
  cursor:pointer; position:relative;
  transition: transform var(--dur-base) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism);
 }
 .orb::before{
  content:""; position:absolute; inset:-10px; border-radius:50%;
  background: radial-gradient(circle, rgba(86,184,255,0.22) 0%, transparent 68%);
  opacity:0; transition: opacity var(--dur-base) var(--ease-prism); pointer-events:none;
 }
 .orb.gaze-focus{ transform:scale(1.08); box-shadow:0 16px 40px rgba(16,92,180,0.52), 0 0 0 2.5px var(--stroke-focus), 0 0 28px rgba(86,184,255,0.45); }
 .orb.gaze-focus::before{ opacity:1; }
 .orb:active{ transform:scale(0.96); }
 .orb:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:3px; }
 .orb.listening{
  animation: orbListen 1.0s var(--ease-prism) infinite alternate;
  box-shadow:0 14px 36px rgba(16,92,180,0.52), 0 0 0 2px rgba(86,184,255,0.9), 0 0 34px rgba(86,184,255,0.45);
 }
 @keyframes orbListen{
  from{ transform:scale(1); }
  to{ transform:scale(1.06); }
 }
 .orb-waves{
  position:absolute; inset:-14px; border-radius:50%; pointer-events:none; opacity:0;
 }
 .orb.listening .orb-waves{
  opacity:1;
  background: radial-gradient(circle, transparent 56%, rgba(86,184,255,0.28) 58%, transparent 60%);
  animation: waves 1.2s ease-out infinite;
 }
 @keyframes waves{
  0%{ transform:scale(0.86); opacity:0.7; }
  100%{ transform:scale(1.22); opacity:0; }
 }
 .voice-card{
  width:100%;
  background: rgba(255,255,255,0.06);
  outline:1px solid rgba(255,255,255,0.07);
  border-radius:14px;
  padding:10px 12px;
  display:flex; align-items:center; gap:10px;
 }

 /* nav — secondary, practice is primary */
 .nav-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 2px 0 2px;
  gap:10px;
 }
 .nav-btn{
  appearance:none; -webkit-appearance:none;
  border:none;
  min-height:34px; padding:0 14px;
  border-radius:999px;
  font-size:13px; font-weight:700; letter-spacing:0.01em;
  cursor:pointer;
  display:inline-flex; align-items:center; gap:8px;
  transition: transform var(--dur-base) var(--ease-prism), opacity var(--dur-fast) var(--ease-prism), background var(--dur-fast) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism);
 }
 .nav-btn.primary{
  background: linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#04121f; box-shadow:0 10px 22px rgba(16,92,180,0.32);
 }
 .nav-btn.ghost{
  background: rgba(255,255,255,0.06);
  outline:1px solid rgba(255,255,255,0.07);
  color:var(--ink-60);
 }
 .nav-btn:disabled{ opacity:0.32; pointer-events:none; }
 .nav-btn.gaze-focus{ transform:scale(1.04); }
 .nav-btn:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }
 .nav-center{ display:flex; align-items:center; gap:8px; opacity:0.62; }
 .key-hint{
  font-size:10px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-40);
  display:flex; align-items:center; gap:5px;
 }
 .key{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:16px; height:16px; padding:0 3px;
  border-radius:4px;
  background: rgba(255,255,255,0.06);
  outline:1px solid rgba(255,255,255,0.08);
  font-size:10px; font-weight:700; letter-spacing:0.02em; color:var(--ink-40);
  line-height:1;
 }
 .gaze-readout{
  position:absolute; bottom:8px; right:10px;
  font-size:10px; font-weight:600; letter-spacing:0.04em; color:var(--ink-40);
    font-variant-numeric: tabular-nums;
  background: rgba(0,0,0,0.22); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  outline:1px solid rgba(255,255,255,0.05);
  padding:3px 6px; border-radius:999px;
  pointer-events:none;
  opacity:0.72;
 }

 /* state layer (edge states) */
 .state-layer{
  position:absolute;
  inset:44px 0 0 0;
  z-index:520;
  display:none;
  padding: 56px 16px 16px 16px;
  overflow-y:auto; scrollbar-width:none;
 }
 .state-layer::-webkit-scrollbar{ display:none; }
 .state-layer.on{ display:grid; place-items:start center; }
 .state-card{
  width:100%; max-width:420px;
  background: var(--mat-raised);
  backdrop-filter: var(--blur-heavy); -webkit-backdrop-filter: var(--blur-heavy);
  outline:1px solid var(--stroke-glass);
  border-radius: var(--r-lg);
  padding:24px 20px 18px 20px;
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px;
  box-shadow:0 18px 44px rgba(0,0,0,0.36);
  animation: rise-in var(--dur-base) var(--ease-prism) both;
 }
 .state-illus{
  width:64px; height:64px; border-radius:18px;
  display:grid; place-items:center;
  background: rgba(255,255,255,0.06);
  outline:1px solid rgba(255,255,255,0.08);
 }
 .progress-mini{
  height:4px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden; width:100%;
 }
 .progress-mini > span{
  display:block; height:100%; width:42%; background: var(--accent); border-radius:999px;
  animation: shimmerMove 1.6s ease-in-out infinite;
 }
 @keyframes shimmerMove{
  0%{ transform:translateX(-60%); }
  100%{ transform:translateX(240%); }
 }

 /* focus */
 button:focus-visible, [data-focusable]:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }

 @media (prefers-reduced-motion: reduce){
  .dot-step, .practice, .target, .tap-btn, .shutter-btn, .orb, .nav-btn{ transition:none !important; }
  .practice.is-success{ animation:none !important; }
  .orb.listening{ animation:none !important; }
 }
</style>
</head>
<body>
<div class="device">
 <div class="stage-shell">
  <div class="stage" data-stage></div>
 </div>
</div>
<script type="module">
import { createOS } from '/os/shared/core.js';
import { hardenGaze } from '/os/shared/lab.js';
const device = document.querySelector('.device');
const stage = document.querySelector('[data-stage]');
const os = createOS(stage, { dwell: true, dwellMs: 350 });
stage.appendChild(os.statusbar('<span style="color:var(--ink-60);font-size:11px;letter-spacing:0.04em">Gestures · Trainer</span>'));

/* helpers */
const h = (tag, attrs={}, ...children)=>{
 const el=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs)){
  if(k==='class') el.className=v;
  else if(k==='html') el.innerHTML=v;
  else if(v!==null && v!==undefined) el.setAttribute(k,v);
 }
 for(const c of children){
  if(c==null) continue;
  if(typeof c==='string') el.appendChild(document.createTextNode(c));
  else el.appendChild(c);
 }
 return el;
};

 {id:'error', label:'Error'},
 {id:'offline', label:'Offline'},
 {id:'permission', label:'No access'},
];
edgeStates.forEach(s=>{
 const b=h('button', {class:'chip', 'data-focusable':'', tabindex:'0', 'aria-label':`Show ${s.label} state`, 'data-state':s.id}, s.label);
 if(s.id==='normal') b.classList.add('active');
 b.addEventListener('click', ()=> setEdge(s.id));
 ctrlRow.appendChild(b);
});

function isStepDone(i){
 if(i===0) return targetsDone.size===3;
 if(i===1) return tapDone;
 if(i===2) return swipeLeftDone && swipeRightDone;
 if(i===3) return captureCount>0;
 if(i===4) return voiceDone;
 return false;
}
function syncPracticeStatus(){
 // step0
 const s0 = document.getElementById('status0');
 const s0t = document.getElementById('status0text');
 if(s0 && s0t){
  const n=targetsDone.size;
  s0t.textContent = n===3 ? 'complete · dwell mastered' : `${n} / 3 · hold to select`;
  s0.classList.toggle('done', n===3);
  s0.querySelector('.dot')?.style.setProperty('background', n===3? 'var(--ok)':'var(--accent)');
  const card=document.getElementById('practice0');
  if(card){
   if(n===3 && !card.classList.contains('is-success')){
    card.classList.add('is-success');
    // haptic-like pulse via dwell ring already, but add success banner once
    setTimeout(()=> os.banner('<strong>Gaze mastered</strong><span class="caption">dwell 350ms · halo + ring</span>',{timeout:2200}), 120);
   }
   if(n<3) card.classList.remove('is-success');
  }
 }
 // step1
 const s1=document.getElementById('status1');
 const s1t=document.getElementById('status1text');
 if(s1 && s1t){
  s1t.textContent = tapDone? 'selected · great tap' : 'tap the chip';
  s1.classList.toggle('done', tapDone);
  const dot=s1.querySelector('.dot');
  if(dot) dot.style.background = tapDone? 'var(--ok)':'var(--ink-20)';
  const btn=document.getElementById('tapBtn');
  if(btn){
   btn.classList.toggle('done', tapDone);
   if(tapDone) btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.4l3.8 3.8L18 8.4" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Selected`;
   else btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="white"/><path d="M12 7V5M12 19v-2M7 12H5M19 12h-2" stroke="white" stroke-opacity="0.9" stroke-width="1.6" stroke-linecap="round"/></svg> Select`;
  }
  const card=document.getElementById('practice1');
  if(card) card.classList.toggle('is-success', tapDone);
 }
 // step2
 const s2=document.getElementById('status2');
 const s2t=document.getElementById('status2text');
 if(s2 && s2t){
  const c=(swipeLeftDone?1:0)+(swipeRightDone?1:0);
  s2t.textContent = c===2? 'complete · swipe mastered' : `${c} / 2 swipes`;
  s2.classList.toggle('done', c===2);
  const dot=s2.querySelector('.dot');
  if(dot) dot.style.background = c===2? 'var(--ok)':'var(--ink-20)';
  const card=document.getElementById('practice2');
  if(card) card.classList.toggle('is-success', c===2);
 }
 // step3
 const s3=document.getElementById('status3');
 const s3t=document.getElementById('status3text');
 if(s3 && s3t){
  s3t.textContent = captureCount? `captured · ${captureCount}` : 'press Space or tap';
  s3.classList.toggle('done', captureCount>0);
  s3.querySelector('.dot')?.style.setProperty('background', captureCount? 'var(--ok)':'var(--ink-20)');
  document.getElementById('captureCount').textContent = `${captureCount} ${captureCount===1?'capture':'captures'}`;
  const card=document.getElementById('practice3');
  if(card) card.classList.toggle('is-success', captureCount>0);
 }
 // step4
 const s4=document.getElementById('status4');
 const s4t=document.getElementById('status4text');
 if(s4 && s4t){
  s4t.textContent = voiceDone? 'listening · orb active' : 'say Hey Prism';
  s4.classList.toggle('done', voiceDone);
  const dot=s4.querySelector('.dot');
  if(dot) dot.style.background = voiceDone? 'var(--ok)':'var(--ink-20)';
  const card=document.getElementById('practice4');
  if(card) card.classList.toggle('is-success', voiceDone);
  const orb=document.getElementById('orbBtn');
  if(orb) orb.classList.toggle('listening', voiceDone);
 }
}

function updateSwipeProg(){
 if(!scrollTrack || !swipeProg) return;

 swipeProg.style.transform = `translateX(${p*range}%)`;
}

    <p class="caption" style="margin-top:2px;color:var(--ink-40)">Settings → Privacy → Prism · Microphone</p>
    <div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:10px 12px;width:100%;margin-top:4px">
     <span class="dot warn"></span><span style="font-size:12px;font-weight:600;color:var(--ink-80)">Mic denied · voice off</span>
     <button class="chip" data-focusable aria-label="Open Settings for microphone" style="margin-left:auto;height:28px">Open Settings</button>
    </div>
   </div>
  `;
  stateLayer.querySelector('#allowMic')?.addEventListener('click', (e)=>{
   const b=e.currentTarget;
   b.textContent='Allowing…';
   setTimeout(()=>{ setEdge('normal'); voiceDone=true; syncPracticeStatus(); os.banner('<strong>Mic allowed</strong><span class="caption">Hey Prism ready · on-device</span>',{timeout:2000}); goTo(4); }, 800);
  });
  stateLayer.querySelectorAll('button').forEach(b=>{
   if(b.textContent.trim()==='Not now') b.addEventListener('click', ()=>{ setEdge('normal'); os.banner('<strong>Continuing without mic</strong><span class="caption">tap orb still works</span>',{timeout:2000}); });
   if(b.textContent.trim()==='Open Settings') b.addEventListener('click', ()=>{
    os.wm.open('settings-mic', (layer)=>{
     layer.style.cssText += ';background:rgba(6,10,16,0.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:24px;';
     layer.innerHTML=`<div class="card raised sheet-in" style="width:100%;max-width:420px;padding:22px;display:grid;gap:14px"><div style="font-weight:700;font-size:16px">Settings · Microphone</div><p class="caption">Allow Prism to listen for “Hey Prism” — on-device, no audio leaves the glasses.</p><div style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:12px 14px"><span style="font-weight:600;font-size:13px;color:var(--ink-80)">Microphone</span><div class="toggle" role="switch" aria-checked="false" aria-label="Microphone toggle" data-focusable tabindex="0"></div></div><button class="btn primary" data-focusable aria-label="Close settings">Done</button></div>`;
     layer.querySelector('button').addEventListener('click', ()=> os.wm.close('settings-mic'));
     layer.addEventListener('click', (e)=>{ if(e.target===layer) os.wm.close('settings-mic'); });
     const t=layer.querySelector('.toggle');
     t.addEventListener('click', ()=>{
      const on=t.getAttribute('aria-checked')==='true';
      t.setAttribute('aria-checked', String(!on));
      if(!on){ setTimeout(()=>{ os.wm.close('settings-mic'); setEdge('normal'); voiceDone=true; syncPracticeStatus(); os.banner('<strong>Mic allowed</strong><span class="caption">voice wake enabled</span>',{timeout:2000}); goTo(4); }, 500); }
     });
    });
   });
  });
 }
}
window.__setGestureState = setEdge;

/* init */
updateStepper();
syncPracticeStatus();
hardenGaze();

console.log('Prism Gestures ready — 600x600');

</script>
</body>
</html>
