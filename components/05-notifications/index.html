<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Notifications</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
 /* stage glass world */
 .stage{
  background:
   radial-gradient(120% 90% at 50% 16%, rgba(42,53,80,0.54) 0%, rgba(20,26,40,0.72) 36%, rgba(10,14,23,0.88) 68%),
   radial-gradient(68% 46% at 78% 88%, rgba(86,184,255,0.08), transparent 55%),
   rgba(6,10,16,0.74);
 }
 .stage-shell{
  position:relative;
  width:600px; height:600px;
  display:grid; place-items:center;
  flex:none;
 }
 /* dev chrome — fixed OUTSIDE .stage, not inside stage screenshot */
 .dev-controls{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex; gap:6px;
  z-index:1000;
  justify-content:center;
  flex-wrap:wrap;
  pointer-events:none;
  padding:8px 12px;
  border-radius:999px;
  background: rgba(10,15,23,0.74);
  outline:1px solid var(--stroke-glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 24px rgba(0,0,0,0.32);
  max-width:92vw;
 }
 .stage .dev-controls{ display:none !important; }
 .dev-controls .chip{
  pointer-events:auto;
  height:26px; padding:0 10px;
  font-size:11px; font-weight:700; letter-spacing:0.02em;
  border:none; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition: background var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
 }
 .dev-controls .chip.active{
  background: linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#051423; outline-color:transparent;
 }
 .dev-controls .chip:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }
 .dev-controls .chip.gaze-focus{ transform:scale(1.04); }

 /* viewport — scrollable notif stack */
 .notif-viewport{
  position:absolute;
  inset:44px 0 0 0;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:none;
  padding:10px 14px 74px 14px;
  display:flex;
  flex-direction:column;
  gap:12px;
 }
 .notif-viewport::-webkit-scrollbar{ display:none; }

 /* header */
 .notif-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
  padding:4px 2px 2px 2px;
  animation: rise-in var(--dur-base) var(--ease-prism) both;
 }
 .notif-header-left{ display:flex; flex-direction:column; gap:4px; min-width:0; }
 .notif-title{
  font-size:22px;
  font-weight:800;
  letter-spacing:-0.03em;
  line-height:1;
  color:var(--ink-100);
  display:flex; align-items:baseline; gap:8px;
 }
 .notif-title-count{
  font-size:11px;
  font-weight:700;
  letter-spacing:0.06em;
  color:var(--ink-80);
  background: rgba(255,255,255,0.07);
  outline:1px solid rgba(255,255,255,0.07);
  padding:4px 8px;
  border-radius:999px;
    font-variant-numeric:tabular-nums;
  line-height:1;
 }
 .notif-subtitle{
  font-size:11px;
  font-weight:600;
  letter-spacing:0.04em;
  color:var(--ink-60);
  line-height:1;
  display:flex; align-items:center; gap:6px;
 }
 .notif-subtitle .dot{ width:6px; height:6px; }
 .notif-header-actions{ display:flex; gap:6px; align-items:center; flex:none; }
 .header-chip{
  appearance:none; -webkit-appearance:none;
  border:none;
  height:28px; padding:0 12px;
  border-radius:999px;
  font-size:11px; font-weight:700; letter-spacing:0.02em;
  display:inline-flex; align-items:center; gap:6px;
  cursor:pointer;
  background: rgba(255,255,255,0.08);
  outline:1px solid rgba(255,255,255,0.07);
  color:var(--ink-80);
  transition: transform var(--dur-base) var(--ease-prism), background var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), opacity var(--dur-fast) var(--ease-prism);
 }
 .header-chip.primary{ background: linear-gradient(180deg, var(--accent), var(--accent-strong)); color:#051423; outline-color:transparent; box-shadow:0 8px 18px rgba(16,92,180,0.28); }
 .header-chip:disabled{ opacity:0.38; pointer-events:none; }
 .header-chip.gaze-focus{ transform:scale(1.04); outline-color:var(--stroke-focus); }
 .header-chip:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }

 /* offline queued banner */
 .offline-banner{
  display:flex; align-items:center; gap:8px;
  padding:8px 12px;
  border-radius:12px;
  background: rgba(255,194,71,0.12);
  outline:1px solid rgba(255,194,71,0.18);
  font-size:11px; font-weight:700; color:#ffe0a6;
  letter-spacing:0.01em;
  animation: banner-in var(--dur-base) var(--ease-prism);
 }
 .offline-banner .warn-dot{
  width:7px; height:7px; border-radius:50%; background:var(--warn); box-shadow:0 0 8px rgba(255,194,71,0.6); flex:none;
 }
 .offline-banner .caption{ color:rgba(255,255,255,0.66); font-weight:600; }

 /* groups */
 .notif-group{
  display:grid; gap:8px;
  animation: rise-in var(--dur-base) var(--ease-prism) both;
 }
 .notif-group:nth-of-type(1){ animation-delay: 40ms; }
 .notif-group:nth-of-type(2){ animation-delay: 90ms; }
 .group-head{
  display:flex; align-items:center; gap:8px;
  padding:0 2px;
 }
 .group-label{
  font-size:11px; font-weight:700;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--ink-60);
 }
 .group-count{
  font-size:11px; font-weight:600;
  color:var(--ink-40);
    font-variant-numeric:tabular-nums;
  letter-spacing:0.02em;
 }
 .group-line{ flex:1; height:1px; background: rgba(255,255,255,0.06); }
 .group-list{ display:flex; flex-direction:column; gap:8px; }

 /* notification card — banner pattern persistent */
 .notif-card{
  position:relative;
  background: var(--mat-raised);
  backdrop-filter: var(--blur-glass);
  -webkit-backdrop-filter: var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  border-radius:18px;
  padding:12px 12px 12px 12px;
  display:flex;
  gap:10px;
  cursor:pointer;
  box-shadow:0 12px 28px rgba(0,0,0,0.26);
  transition: transform var(--dur-base) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism), background var(--dur-fast) var(--ease-prism), opacity var(--dur-fast) var(--ease-prism);
  animation: banner-in var(--dur-slow) var(--ease-prism) both;
  will-change: transform;
  overflow:hidden;
 }
 .notif-card::after{
  content:""; position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 44%);
  pointer-events:none; border-radius:inherit;
 }
  .notif-card:hover{ transform: translateY(-1px); }
  .notif-card.is-top:hover{ transform: scale(1.01) translateY(-1px) !important; }
  /* primary focal at rest — single focal discipline (visionOS: one banner raised, others recessive) */
  .notif-card.is-top{
   transform: scale(1.01) !important;
   box-shadow:0 16px 36px rgba(0,0,0,0.34), 0 0 0 1px rgba(255,255,255,0.04) inset !important;
   opacity:1 !important;
  }
  .notif-card:not(.is-top){
   opacity:0.92 !important;
  }
  /* parallax dim: when any card has gaze-focus, dim non-focused to 0.65 */
  .notif-viewport:has(.notif-card.gaze-focus) .notif-card:not(.gaze-focus){
   opacity:0.65 !important;
  }
  .group-list:has(.notif-card.gaze-focus) .notif-card:not(.gaze-focus){
   opacity:0.65 !important;
  }
  .notif-viewport:has(.notif-card.gaze-focus) .notif-card.is-top:not(.gaze-focus){
   opacity:0.65 !important;
   transform: scale(1) !important;
  }
  .notif-card.gaze-focus{
   transform: scale(1.04) translateY(-1px) !important;
   outline:2.5px solid var(--stroke-focus);
   outline-color: var(--stroke-focus);
   box-shadow: 0 0 0 2.5px rgba(86,184,255,0.18), 0 18px 40px rgba(0,0,0,0.38), 0 0 28px rgba(86,184,255,0.30) !important;
   opacity:1 !important;
  }
  .notif-card:active{ transform: scale(0.985); }
  .notif-card.is-expanded{
   padding-bottom:12px;
  }
 .notif-card.is-dismissing{ pointer-events:none; }
 .notif-card.is-popping{
  animation: popSettle 360ms var(--ease-prism);
 }
 @keyframes popSettle{
  0%{ transform:scale(0.96); }
  50%{ transform:scale(1.02); }
  100%{ transform:scale(1); }
 }

 .notif-icon{
  width:36px; height:36px;
  border-radius:11px;
  display:grid; place-items:center;
  flex:none;
  box-shadow:0 4px 14px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.10);
  outline:1px solid rgba(255,255,255,0.08);
  position:relative; z-index:1;
 }
 .notif-icon svg{ width:18px; height:18px; display:block; }
 .notif-icon.msg{ background: linear-gradient(180deg, #2f9dff 0%, #0b5ed7 100%); color:#fff; }
 .notif-icon.capture{ background: linear-gradient(180deg, #2a3346 0%, #1a2230 100%); color:#fff; }
 .notif-icon.system{ background: linear-gradient(180deg, #a58bff 0%, #6a4bff 100%); color:#fff; }
 .notif-icon.warn{ background: linear-gradient(180deg, #ffc247 0%, #ff7a1a 100%); color:#1a0f00; }
 .notif-icon.team{ background: linear-gradient(180deg, #7ee0a6 0%, #1e6b4a 100%); color:#fff; }

 .notif-main{
  flex:1; min-width:0;
  display:flex; flex-direction:column; gap:3px;
  position:relative; z-index:1;
  padding-right:28px;
 }
 .notif-title-row{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
 }
 .notif-name{
  font-size:14px;
  font-weight:700;
  color:var(--ink-100);
  letter-spacing:-0.01em;
  line-height:1.15;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  flex:1;
 }
 .notif-time{
  font-size:11px;
  font-weight:600;
  color:var(--ink-60);
  letter-spacing:0.02em;
    font-variant-numeric:tabular-nums;
  flex:none;
  white-space:nowrap;
 }
 .notif-body{
  font-size:13px;
  font-weight:500;
  color:var(--ink-80);
  line-height:1.38;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  overflow-wrap:break-word;
 }
 .is-expanded .notif-body{
  -webkit-line-clamp:unset;
 }
 .notif-chiprow{
  display:flex; gap:6px; flex-wrap:wrap;
  margin-top:7px;
 }
 .notif-chip{
  appearance:none; -webkit-appearance:none;
  border:none;
  display:inline-flex; align-items:center; gap:6px;
  height:28px; padding:0 12px;
  border-radius:999px;
  background: rgba(255,255,255,0.08);
  outline:1px solid rgba(255,255,255,0.07);
  font-size:11px; font-weight:700; letter-spacing:0.01em;
  color:var(--ink-80);
  cursor:pointer;
  transition: background var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism);
  position:relative; z-index:2;
 }
 .notif-chip.primary{ background: linear-gradient(180deg, var(--accent), var(--accent-strong)); color:#051423; outline-color:transparent; box-shadow:0 8px 18px rgba(16,92,180,0.26); }
 .notif-chip.ghost{ background: transparent; color:var(--ink-60); }
 .notif-chip.gaze-focus{ transform:scale(1.04); outline-color:var(--stroke-focus); box-shadow:0 0 0 2px rgba(86,184,255,0.14), 0 0 14px rgba(86,184,255,0.22); }
 .notif-chip:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }
 .notif-chip:active{ transform:scale(0.96); }

 .notif-dismiss{
  position:absolute; top:10px; right:10px; z-index:2;
  width:26px; height:26px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.06);
  color:var(--ink-60);
  display:grid; place-items:center;
  font-size:14px; font-weight:700; line-height:1;
  cursor:pointer;
  transition: background var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism), border-color var(--dur-fast) var(--ease-prism);
 }
 .notif-dismiss:hover{ background: rgba(255,255,255,0.10); color:var(--ink-80); border-color:rgba(255,255,255,0.12); }
 .notif-dismiss.gaze-focus{ transform:scale(1.06); outline-color:var(--stroke-focus); color:var(--ink-100); background: rgba(255,255,255,0.12); }
 .notif-dismiss:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }
 .notif-dismiss:active{ transform:scale(0.92); }

 /* expanded detail */
 .notif-expanded{
  display:none;
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid rgba(255,255,255,0.06);
  gap:8px;
 }
 .is-expanded .notif-expanded{ display:grid; }
 .notif-preview{
  display:flex; gap:10px; align-items:center;
  background: rgba(255,255,255,0.05);
  outline:1px solid rgba(255,255,255,0.06);
  border-radius:12px;
  padding:8px 10px;
 }
 .notif-thumb{
  width:44px; height:44px;
  border-radius:10px;
  flex:none;
  overflow:hidden;
  outline:1px solid rgba(255,255,255,0.08);
  display:grid; place-items:center;
  background: linear-gradient(135deg,#ff8a6b 0%, #d4232a 100%);
  box-shadow:0 6px 14px rgba(0,0,0,0.18);
 }
 .notif-preview-text{ flex:1; min-width:0; }
 .notif-preview-title{ font-size:12px; font-weight:700; color:var(--ink-100); line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
 .notif-preview-sub{ font-size:11px; font-weight:500; color:var(--ink-60); letter-spacing:0.01em; margin-top:2px; }

 /* swipe bg hint */
 .notif-swipe-bg{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 18px;
  background: linear-gradient(90deg, rgba(255,93,93,0.18) 0%, transparent 46%), linear-gradient(270deg, rgba(255,93,93,0.18) 0%, transparent 46%);
  opacity:0; pointer-events:none;
 }
 .notif-swipe-bg span{ font-size:10px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:rgba(255,255,255,0.42); }

 /* undo bar — dependability */
 .undo-bar{
  position:absolute;
  left:12px; right:12px; bottom:12px;
  z-index:560;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 12px 10px 14px;
  border-radius:18px;
  background: var(--mat-raised);
  backdrop-filter: var(--blur-glass);
  -webkit-backdrop-filter: var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  box-shadow:0 16px 40px rgba(0,0,0,0.42), 0 1px 0 rgba(255,255,255,0.06) inset;
  animation: rise-in var(--dur-base) var(--ease-prism);
 }
 .undo-bar.pulse{ animation: undoPulse 520ms var(--ease-prism); }
 @keyframes undoPulse{
  0%{ transform:scale(1); }
  38%{ transform:scale(1.02); }
  100%{ transform:scale(1); }
 }
 .undo-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
 .undo-title{ font-size:13px; font-weight:700; color:var(--ink-100); letter-spacing:-0.01em; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
 .undo-sub{ font-size:11px; font-weight:600; color:var(--ink-60); letter-spacing:0.01em; line-height:1; }
 .undo-chip{
  appearance:none; -webkit-appearance:none;
  border:none;
  height:32px; padding:0 14px;
  border-radius:999px;
  background: linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#051423;
  font-size:13px; font-weight:800; letter-spacing:-0.01em;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(16,92,180,0.32);
  transition: transform var(--dur-fast) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism);
  flex:none;
 }
 .undo-chip.gaze-focus{ transform:scale(1.04); box-shadow:0 10px 22px rgba(16,92,180,0.42), 0 0 0 2px rgba(86,184,255,0.18); }
 .undo-chip:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }
 .undo-chip:active{ transform:scale(0.96); }

 /* hint bar */
 .hintbar{
  position:absolute;
  left:12px; right:12px; bottom:12px;
  z-index:540;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:8px 10px;
  border-radius:12px;
  background: rgba(0,0,0,0.34);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  outline:1px solid rgba(255,255,255,0.06);
  font-size:10px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--ink-60);
  line-height:1;
 }
 .hintbar strong{ color:var(--ink-80); font-weight:700; letter-spacing:0.02em; text-transform:none; font-size:11px; }
 .hintbar .mono-dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px rgba(86,184,255,0.6); flex:none; display:inline-block; }

 /* state layer — edge states outside scroll */
 .state-layer{
  position:absolute;
  inset:44px 0 0 0;
  z-index:520;
  display:none;
  overflow-y:auto;
  scrollbar-width:none;
  padding:12px 14px 74px 14px;
 }
 .state-layer::-webkit-scrollbar{ display:none; }
 .state-layer.on{ display:block; animation: rise-in var(--dur-base) var(--ease-prism); }
 .state-layer.dim-on{
  display:grid;
  place-items:center;
  padding:12px 14px 74px 14px;
  background: transparent;
  pointer-events:none;
 }
 .state-layer.dim-on .state-card{ pointer-events:auto; }
 .state-card{
  background: var(--mat-raised);
  backdrop-filter: var(--blur-heavy);
  -webkit-backdrop-filter: var(--blur-heavy);
  outline:1px solid var(--stroke-glass);
  border-radius: var(--r-lg);
  padding:26px 20px 20px 20px;
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px;
  box-shadow:0 18px 44px rgba(0,0,0,0.36);
  width:100%; max-width:420px;
  margin:0 auto;
  animation: rise-in var(--dur-base) var(--ease-prism) both;
 }
 .state-illus{
  width:64px; height:64px;
  border-radius:18px;
  display:grid; place-items:center;
  background: rgba(255,255,255,0.06);
  outline:1px solid rgba(255,255,255,0.08);
  margin-bottom:2px;
 }
 .state-title{ font-size:18px; font-weight:800; letter-spacing:-0.02em; color:var(--ink-100); line-height:1.1; }
 .state-body{ font-size:13px; font-weight:500; color:var(--ink-60); line-height:1.45; max-width:300px; }
 .state-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
 .state-actions .btn{ min-height:36px; }
 .state-skel-list{ display:grid; gap:8px; width:100%; max-width:520px; margin:18px auto 0 auto; }
 .sk-notif{
  background: var(--mat-glass);
  backdrop-filter: var(--blur-glass);
  -webkit-backdrop-filter: var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  border-radius:18px;
  padding:12px;
  display:flex; gap:10px; align-items:flex-start;
 }

 /* focus ring */
 button:focus-visible, [data-focusable]:focus-visible{ outline:2.5px solid var(--stroke-focus); outline-offset:2px; }

 @media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
   animation-duration:0.01ms !important;
   animation-iteration-count:1 !important;
   transition-duration:0.01ms !important;
  }
 }
</style>
</head>
<body>
<div class="device">
 <div class="stage-shell">
  <div class="stage" data-stage></div>
 </div>
</div>
<script type="module">
import { createOS } from '/os/shared/core.js';
const stage = document.querySelector('[data-stage]');
const device = document.querySelector('.device');
const os = createOS(stage, { dwell: true, dwellMs: 350 });

// statusbar
stage.appendChild(os.statusbar('<span style="color:var(--ink-60);font-size:11px;letter-spacing:0.04em">Notifications · Center</span>'));

// helpers
const h = (tag, attrs={}, ...children)=>{
 const el=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs)){
  if(k==='class') el.className=v;
  else if(k==='html') el.innerHTML=v;
  else if(v!==null && v!==undefined) el.setAttribute(k,v);
 }
 for(const c of children){
  if(c==null) continue;
  if(typeof c==='string') el.appendChild(document.createTextNode(c));
  else el.appendChild(c);
 }
 return el;
};

// dev controls — outside stage bounds fixed bottom, verified outside .stage
const edgeRow = h('div', {class:'dev-controls', role:'toolbar', 'aria-label':'Edge state controls'});
const edgeStates = [

function render(){

 dndBtn.addEventListener('click', ()=>{

 });
 actions.append(clearBtn, dndBtn);
 header.append(left, actions);
 viewport.appendChild(header);

 // offline banner when edgeState offline (also show when not normal but we handle via stateLayer dim. For normal offline we still show banner inside viewport if edgeState offline)

function buildCard(n, isTop){

 card.appendChild(swipeBg);

 const icon = h('div', {class:`notif-icon ${n.icon}`, 'aria-hidden':'true', html: iconSVG(n.type==='warn'?'warn': n.type==='capture'?'capture': n.type==='system'?'system': n.type==='team'?'team':'msg')});
 // For capture/system we have specific icon class but keep mapping
 if(n.icon==='warn') icon.className='notif-icon warn';
 else if(n.icon==='capture') icon.className='notif-icon capture';
 else if(n.icon==='system') icon.className='notif-icon system';
 else if(n.icon==='team') icon.className='notif-icon team';
 else icon.className='notif-icon msg';

 const main = h('div', {class:'notif-main'});
 const titleRow = h('div', {class:'notif-title-row'});
 const name = h('div', {class:'notif-name'}, n.title);

 titleRow.append(name, time);
 const body = h('div', {class:'notif-body'}, n.body);
 const chipRow = h('div', {class:'notif-chiprow'});
 n.chips.forEach(c=>{
  const chip = h('button', {class:'notif-chip' + (c.primary?' primary':''), 'data-focusable':'', tabindex:'0', 'aria-label':`${c.label} ${n.title}`}, c.label);
  chip.addEventListener('click', (e)=>{
   e.stopPropagation();
   handleChip(n.id, c.action);
  });
  chipRow.appendChild(chip);
 });
 main.append(titleRow, body, chipRow);

 // expanded detail if needed
 const expanded = h('div', {class:'notif-expanded'});
 if(n.preview){
  const preview = h('div', {class:'notif-preview'});

  ptext.innerHTML = `<div class="notif-preview-title">${n.preview.title}</div><div class="notif-preview-sub">${n.preview.sub}</div>`;

  expanded.appendChild(preview);
  const detail = h('div', {class:'caption', style:'font-size:11px;color:var(--ink-60)'}, 'Tap View to open Gallery · space = capture · expanded with 12 MP');

 } else if(n.type==='warn'){
  expanded.innerHTML = `<div style="background:rgba(255,194,71,0.10);outline:1px solid rgba(255,194,71,0.14);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start"><span style="width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px rgba(255,194,71,0.6);margin-top:5px;flex:none"></span><div style="flex:1"><div style="font-size:12px;font-weight:700;color:var(--ink-100)">Thermal nominal · 34°C</div><div style="font-size:11px;font-weight:500;color:var(--ink-60);margin-top:2px;line-height:1.35">Auto-dimmed to 82% brightness. Will restore when cool. No action needed.</div></div></div>`;

 }

 const dismissBtn = h('button', {class:'notif-dismiss', 'data-focusable':'', tabindex:'0', 'aria-label':`Dismiss ${n.title} notification`}, '×');

 card.append(icon, main, dismissBtn);

 // tap to expand (card click)
 card.addEventListener('click', (e)=>{

  n.expanded = !n.expanded;

  if(!os.state.reducedMotion){
   card.animate([

    { transform: 'scale(1)' }
   ], {duration:220, easing:'cubic-bezier(0.32,0.72,0,1)'});

 });
 card.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' || e.key===' '){ e.preventDefault(); card.click(); }
  if(e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); dismiss(n.id, 'left'); }
 });

 // stagger animation delay based on index? Already group handles but we add per card
 if(!os.state.reducedMotion){
  card.style.animationDelay = `${Math.min(220, (isTop?0: 60))}ms`;
 }

 return card;
}

function handleChip(id, action){
 const n = notifications.find(x=>x.id===id);
 if(!n) return;
 if(action==='dismiss'){
  dismiss(id, 'left');
 } else if(action==='reply'){
  n.expanded = true;
  render();
  // focus expanded area? simulate reply input
  os.banner('<strong>Reply — Mara</strong><span class="caption">inline reply · demo — no send</span>',{timeout:2000});
  // highlight chip
  setTimeout(()=>{
   const card = viewport.querySelector(`[data-id="${id}"]`);
   card?.classList.add('is-popping');
   setTimeout(()=> card?.classList.remove('is-popping'), 360);
  }, 30);
 } else if(action==='view'){
  os.banner('<strong>Gallery — Golden Gate</strong><span class="caption">12 MP · opened from notification</span>',{timeout:2000});
  // optionally expand
  n.expanded=true; render();
 } else if(action==='update'){
  os.banner('<strong>Restarting…</strong><span class="caption">Prism OS 26A · 12s remaining</span>',{timeout:2400});
  dismiss(id,'left');
 } else if(action==='details'){
  n.expanded = !n.expanded; render();
 } else if(action==='open'){
  os.banner('<strong>Prism Team — opened</strong><span class="caption">demo surface</span>',{timeout:1800});
 }
}

function dismiss(id, dir='left', silent=false){
 const idx = notifications.findIndex(n=>n.id===id);
 if(idx<0) return;
 const data = notifications[idx];
 const el = viewport.querySelector(`[data-id="${id}"]`);
 if(!el){
  // fallback sync
  dismissedStack.push({data, index: idx});
  notifications.splice(idx,1);
  render();
  if(!silent) showUndo(data);
  updateHeaderAfter();
  return;
 }
 el.classList.add('is-dismissing');
 // store for undo
 dismissedStack.push({data, index: idx});
 if(dismissedStack.length>6) dismissedStack.shift();

 const reduced = os.state.reducedMotion;
 const delta = dir==='left' ? -1 : 1;
 // rubber-band settle: slight overshoot opposite before exit
 const anim = el.animate([
  { transform: `translateX(0) scale(1)`, opacity:1, offset:0 },
  { transform: `translateX(${delta*-8}px) scale(0.99)`, opacity:1, offset:0.18 },
  { transform: `translateX(${delta*110}%) scale(0.96)`, opacity:0, offset:1 }
 ], { duration: reduced?1: 280, easing: 'cubic-bezier(0.32,0.72,0,1)' });
 anim.finished.then(()=>{
  // remove from model
  const i = notifications.findIndex(n=>n.id===id);
  if(i>=0) notifications.splice(i,1);
  render();
  if(!silent) showUndo(data);
  updateHeaderAfter();
  // monoaudio cue placeholder (silent)
  cue('dismiss');
 }).catch(()=>{});
 // hide undo if new dismiss cancels previous timer? Keep stack but show latest
}

function showUndo(data){
 // clear previous
 if(undoBarEl) undoBarEl.remove();
 if(undoTimer) clearTimeout(undoTimer);
 const bar = h('div', {class:'undo-bar pulse'});
 bar.innerHTML = `
  <div class="undo-text">
   <div class="undo-title">${escapeHtml(data.title)} dismissed</div>
   <div class="undo-sub">Swipe dismissed · undo restores</div>
  </div>
  <button class="undo-chip" data-focusable tabindex="0" aria-label="Undo dismiss ${escapeHtml(data.title)}">Undo</button>
 `;
 const undoBtn = bar.querySelector('button');
 undoBtn.addEventListener('click', ()=>{
  undoDismiss();
 });
 // allow gaze focus styling via core? Need to ensure data-focusable handled? Use class manually but core tracks via pointer. Add hover.
 undoBtn.addEventListener('pointerenter', ()=> undoBtn.classList.add('gaze-focus'));
 undoBtn.addEventListener('pointerleave', ()=> undoBtn.classList.remove('gaze-focus'));
 stage.appendChild(bar);
 undoBarEl = bar;
 // hide hintbar while undo visible (undo replaces hint)
 hintbar.style.opacity='0';
 hintbar.style.pointerEvents='none';
 // auto hide 4.2s
 undoTimer = setTimeout(()=> hideUndo(), 4200);
 // ensure cursor above
 stage.appendChild(os.cursor);
}

function hideUndo(){
 if(!undoBarEl) return;
 const bar = undoBarEl;
 const anim = bar.animate([
  { transform:'translateY(0) scale(1)', opacity:1 },
  { transform:'translateY(8px) scale(0.98)', opacity:0 }
 ], {duration: os.state.reducedMotion?1:220, easing:'ease-in'});
 anim.finished.then(()=>{
  bar.remove();
  if(undoBarEl===bar) undoBarEl=null;
  hintbar.style.opacity='';
  hintbar.style.pointerEvents='';
 });
}

function undoDismiss(){
 if(dismissedStack.length===0) return;
 const {data, index} = dismissedStack.pop();
 // restore at original index (clamp)
 const at = Math.min(index, notifications.length);
 notifications.splice(at, 0, {...data, expanded:false});
 if(undoBarEl){
  // animate undoBar out quickly
  const bar=undoBarEl;
  bar.style.pointerEvents='none';
  bar.animate([{opacity:1},{opacity:0}],{duration:140}).finished.then(()=> bar.remove());
  undoBarEl=null;
 }
 if(undoTimer){ clearTimeout(undoTimer); undoTimer=null; }
 hintbar.style.opacity='';
 hintbar.style.pointerEvents='';
 render();
 // delight pulse on restored card
 requestAnimationFrame(()=>{
  const el = viewport.querySelector(`[data-id="${data.id}"]`);
  if(el && !os.state.reducedMotion){
   el.classList.add('is-popping');
   el.animate([
    { transform:'scale(0.96)', boxShadow:'0 0 0 0 rgba(86,184,255,0)' },
    { transform:'scale(1.025)', boxShadow:'0 0 0 2.5px rgba(86,184,255,0.22)' },
    { transform:'scale(1)', boxShadow:'0 0 0 0 rgba(86,184,255,0)' }
   ], {duration:520, easing:'cubic-bezier(0.32,0.72,0,1)'});
   setTimeout(()=> el.classList.remove('is-popping'), 560);
  }
 });
 os.banner('<strong>Restored</strong><span class="caption">notification back in list</span>',{timeout:1800});
 cue('undo');
 updateHeaderAfter();
}

function escapeHtml(s){
 return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateHeaderAfter(){
 // no-op, render already did header, but ensure clear button disabled state refreshed on next render? Already
}

function updateHintBar(){
 // keep hintbar visible unless undo
 if(undoBarEl) return;
 // already in DOM
}

function cue(type){
 // mono audio cues placeholder — silent for probe, but announce via aria-live region if needed
}

// edge states
function setEdge(id){
 edgeState = id;
 edgeRow.querySelectorAll('.chip').forEach(c=> c.classList.toggle('active', c.dataset.state===id));
 // reset undo
 if(undoBarEl){ undoBarEl.remove(); undoBarEl=null; }
 if(undoTimer){ clearTimeout(undoTimer); undoTimer=null; }
 hintbar.style.opacity=''; hintbar.style.pointerEvents='';
 stateLayer.className='state-layer';
 stateLayer.style.display='';
 stateLayer.style.background='';
 stateLayer.style.pointerEvents='';
 viewport.style.display='';
 viewport.style.opacity='';
 viewport.style.filter='';
 viewport.style.pointerEvents='';

 if(id==='normal'){
  stateLayer.classList.remove('on','dim-on');
  stateLayer.style.display='none';
  viewport.style.display='flex';
  render();
  return;
 }
 if(id==='empty'){
  viewport.style.display='none';
  stateLayer.classList.add('on');
  stateLayer.style.display='block';
  stateLayer.innerHTML = `
   <div style="display:grid;gap:12px;justify-items:center;padding:28px 0 0 0">
    <div class="state-card">
     <div class="state-illus" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M6 8a6 6 0 0112 0c0 6-4 8-6 10-2-2-6-4-6-10z" stroke="white" stroke-opacity="0.92" stroke-width="1.6"/><path d="M9 19a3 3 0 006 0" stroke="white" stroke-opacity="0.78" stroke-width="1.5" stroke-linecap="round"/><path d="M8 9.5l2 2 2-1.6 2 1.6 2-2" stroke="white" stroke-opacity="0.42" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
     </div>
     <div class="state-title">All caught up</div>
     <div class="state-body">No new notifications. We’ll surface what needs your focus here — messages, captures, and system alerts live in one calm stack.</div>
     <div class="state-actions">
      <button class="btn primary" data-focusable tabindex="0" aria-label="Enable notifications">Enable notifications</button>
      <button class="btn ghost" data-focusable tabindex="0" aria-label="Dismiss empty state">Dismiss</button>
     </div>
     <p class="caption" style="color:var(--ink-40);font-size:11px">Humane empty · nothing missed</p>
    </div>
   </div>
  `;
  stateLayer.querySelectorAll('button').forEach(b=>{
   b.addEventListener('click', ()=>{
    if(b.textContent.includes('Enable')){
     b.textContent='Enabling…';
     setTimeout(()=>{ setEdge('normal'); os.banner('<strong>Notifications enabled</strong><span class="caption">we’ll banner important items</span>',{timeout:1800}); }, 700);
    } else {
     setEdge('normal');
    }
   });
  });
  return;
 }
 if(id==='loading'){
  viewport.style.display='none';
  stateLayer.classList.add('on');
  stateLayer.style.display='block';
  stateLayer.innerHTML = `
   <div style="padding:4px 0 0 0;display:grid;gap:12px">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;padding:0 2px;opacity:0.88">
     <div style="display:grid;gap:6px"><div class="skeleton" style="width:142px;height:20px;border-radius:8px"></div><div class="skeleton" style="width:160px;height:10px;border-radius:6px"></div></div>
     <div class="skeleton" style="width:78px;height:28px;border-radius:999px"></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:0 2px"><div class="skeleton" style="width:36px;height:10px;border-radius:999px"></div><div class="skeleton" style="width:52px;height:10px;border-radius:999px"></div><div style="flex:1;height:1px;background:rgba(255,255,255,0.06)"></div></div>
    <div class="state-skel-list">
     ${Array(4).fill(0).map((_,i)=>`
      <div class="sk-notif" style="opacity:${1 - i*0.12}">
       <div class="skeleton" style="width:36px;height:36px;border-radius:11px;flex:none"></div>
       <div style="flex:1;display:grid;gap:8px">
        <div style="display:flex;gap:8px;align-items:center"><div class="skeleton" style="flex:1;height:12px;border-radius:6px"></div><div class="skeleton" style="width:28px;height:10px;border-radius:6px"></div></div>
        <div class="skeleton" style="width:92%;height:10px;border-radius:6px"></div>
        <div class="skeleton" style="width:74%;height:10px;border-radius:6px"></div>
        <div style="display:flex;gap:6px;margin-top:2px"><div class="skeleton" style="width:56px;height:26px;border-radius:999px"></div><div class="skeleton" style="width:68px;height:26px;border-radius:999px"></div></div>
       </div>
      </div>
     `).join('')}
    </div>
    <div class="caption" style="text-align:center;color:var(--ink-40);display:flex;align-items:center;justify-content:center;gap:6px"><span class="dot ok" style="width:6px;height:6px;background:var(--accent);box-shadow:0 0 8px rgba(86,184,255,0.5)"></span>Loading · shimmer 1.2s times</div>
   </div>
  `;
  return;
 }
 if(id==='error'){
  viewport.style.display='none';
  stateLayer.classList.add('on');
  stateLayer.style.display='block';
  stateLayer.innerHTML = `
   <div style="display:grid;gap:10px;justify-items:center;padding:18px 0 0 0">
    <div class="state-card" style="animation: sheet-in var(--dur-slow) var(--ease-prism)">
     <div class="state-illus" style="background:rgba(255,93,93,0.10);outline-color:rgba(255,93,93,0.18)" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 3.5L21.5 19H2.5L12 3.5z" stroke="#ff8a8a" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 9.5v4.2" stroke="#ffb3b3" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.25" fill="#ffb3b3"/></svg>
     </div>
     <div class="state-title">Can’t load notifications</div>
     <div class="state-body">Prism couldn’t reach the notification service. Your captures are safe — try again. No dead ends.</div>
     <div class="state-actions">
      <button class="btn primary" data-focusable tabindex="0" aria-label="Retry loading notifications" id="retryBtn">Retry</button>
      <button class="btn ghost" data-focusable tabindex="0" aria-label="Dismiss error">Dismiss</button>
     </div>
     <div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:8px 12px;width:100%;justify-content:center">
      <span class="dot bad" aria-hidden="true"></span><span class="caption " style="color:var(--ink-60)">Error PR-NOTIF-503 · 9:41</span><span class="caption" style="margin-left:auto;color:var(--ink-40)">tap retry</span>
     </div>
    </div>
   </div>
  `;
  stateLayer.querySelector('#retryBtn').addEventListener('click', (e)=>{
   const btn=e.currentTarget; btn.textContent='Retrying…'; btn.setAttribute('disabled','true');
   // show skeleton inside card briefly
   const cardBody=stateLayer.querySelector('.state-card');
   const prev=cardBody.innerHTML;
   cardBody.innerHTML = `<div style="display:grid;gap:10px;width:100%;justify-items:center;padding:8px 0"><div class="skeleton" style="width:64px;height:64px;border-radius:18px"></div><div class="skeleton" style="width:62%;height:16px;border-radius:8px"></div><div class="skeleton" style="width:78%;height:12px;border-radius:6px"></div><div class="skeleton" style="width:100%;height:56px;border-radius:12px;margin-top:6px"></div></div>`;
   setTimeout(()=>{ setEdge('normal'); os.banner('<strong>Notifications restored</strong><span class="caption">service back · 5 items</span>',{timeout:1800}); }, 1200);
  });
  stateLayer.querySelectorAll('button')[1].addEventListener('click', ()=> setEdge('normal'));
  return;
 }
 if(id==='offline'){
  // dim viewport but keep visible + overlay card
  viewport.style.display='flex';
  viewport.style.opacity='0.52';
  viewport.style.filter='blur(1px)';
  stateLayer.classList.add('dim-on');
  stateLayer.style.display='grid';
  stateLayer.innerHTML = `
   <div class="state-card" style="animation: rise-in var(--dur-base) var(--ease-prism)">
    <div class="state-illus" style="background:rgba(255,194,71,0.12);outline-color:rgba(255,194,71,0.18)" aria-hidden="true">
     <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M3.5 9.5a9 9 0 0117 0" stroke="white" stroke-opacity="0.92" stroke-width="1.6" stroke-linecap="round"/><path d="M6 12.5a6 6 0 0112 0" stroke="white" stroke-opacity="0.78" stroke-width="1.6" stroke-linecap="round"/><path d="M8.8 15.5a2.8 2.8 0 016.4 0" stroke="white" stroke-opacity="0.76" stroke-width="1.6" stroke-linecap="round"/><path d="M2 2l20 20" stroke="#ffc247" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="17.8" r="1.25" fill="white"/></svg>
    </div>
    <div class="state-title">You’re offline</div>
    <div class="state-body">Notifications keep their last state. 2 queued on device — they’ll sync when you’re back on the world layer.</div>
    <div style="display:flex;gap:8px;width:100%;margin-top:2px">
     <button class="btn primary" data-focusable tabindex="0" aria-label="Retry connection" style="flex:1">Retry</button>
     <button class="btn" data-focusable tabindex="0" aria-label="Continue offline, keep cached notifications" style="flex:1">Use cached</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:8px 12px;width:100%;justify-content:center">
     <span class="dot bad" aria-hidden="true"></span><span class="caption" style="color:var(--ink-60);font-size:12px;font-weight:700">No network · queued 2</span><span class="caption" style="margin-left:auto">offline</span>
    </div>
   </div>
  `;
  stateLayer.querySelectorAll('button').forEach(b=>{
   b.addEventListener('click', ()=>{
    if(b.textContent.includes('Retry')){
     b.textContent='Retrying…';
     setTimeout(()=>{ os.banner('<strong>Still offline</strong><span class="caption">check Wi-Fi · queued will sync</span>',{timeout:2200}); b.textContent='Retry'; }, 900);
    } else {
     setEdge('normal');
     os.banner('<strong>Offline mode</strong><span class="caption">cached notifications · 5 items</span>',{timeout:2000});
    }
   });
  });
  return;
 }
 if(id==='permission'){
  viewport.style.display='flex';
  viewport.style.opacity='0.46';
  viewport.style.filter='blur(1.2px)';
  stateLayer.classList.add('dim-on');
  stateLayer.style.display='grid';
  stateLayer.innerHTML = `
   <div class="state-card">
    <div class="state-illus" aria-hidden="true">
     <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="5" y="9.5" width="14" height="10" rx="2.4" stroke="white" stroke-opacity="0.92" stroke-width="1.6"/><path d="M8.5 9.5V7.8a3.5 3.5 0 017 0v1.7" stroke="white" stroke-width="1.5"/><circle cx="12" cy="14.5" r="1.35" fill="white"/><path d="M12 15.85v1.6" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
    <div class="state-title">Permission needed</div>
    <div class="state-body">Prism needs notification access to show banners over the world. Launcher stays usable without it — enable to see the stack.</div>
    <div class="state-actions" style="width:100%">
     <button class="btn primary" data-focusable tabindex="0" aria-label="Allow notifications" style="flex:1">Allow</button>
     <button class="btn ghost" data-focusable tabindex="0" aria-label="Not now, dismiss permission prompt" style="flex:1">Not now</button>
    </div>
    <p class="caption" style="color:var(--ink-40)">Settings → Privacy → Prism · Notifications</p>
    <div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:8px 12px;width:100%;justify-content:center">
     <span class="dot warn" aria-hidden="true"></span><span class="caption" style="color:var(--ink-80);font-size:12px;font-weight:700">Notifications blocked</span>
    </div>
   </div>
  `;
  stateLayer.querySelectorAll('button').forEach(b=>{
   b.addEventListener('click', ()=>{
    if(b.textContent.trim()==='Allow'){
     b.textContent='Allowing…';
     setTimeout(()=>{ setEdge('normal'); os.banner('<strong>Notifications allowed</strong><span class="caption">banners will appear over world</span>',{timeout:1800}); }, 700);
    } else {
     setEdge('normal');
     os.banner('<strong>Without notifications</strong><span class="caption">allow later in Settings</span>',{timeout:2000});
    }
   });
  });
  return;
 }
}

// gestures + keys — use os bus (temple swipe, Esc, capture)
os.on('swipeleft', ()=>{
 if(edgeState!=='normal') return;
 if(undoBarEl) { hideUndo(); return; }
 const top = notifications[0];
 if(top) dismiss(top.id, 'left');
 else os.banner('<strong>No notification to dismiss</strong><span class="caption">stack empty</span>',{timeout:1500});
});
os.on('swiperight', ()=>{
 if(edgeState!=='normal') return;
 if(undoBarEl) { hideUndo(); return; }
 const top = notifications[0];
 if(top) dismiss(top.id, 'right');
 else os.banner('<strong>Nothing to dismiss</strong><span class="caption">all caught up</span>',{timeout:1500});
});
os.on('back', ()=>{
 if(undoBarEl){ hideUndo(); return; }
 if(edgeState!=='normal'){ setEdge('normal'); return; }
 const top = notifications[0];
 if(top) dismiss(top.id, 'left');
});
os.on('capture', ()=>{
 os.banner('<strong>Capture · notification snapshot</strong><span class="caption">600×600 · saved</span>',{timeout:1800});
});

// expose for probe
window.__notif = { setEdge, dismiss: (id)=> dismiss(id,'left'), getState: ()=>({edgeState, count:notifications.length}) };

// initial render
render();
console.log('Prism Notifications ready — 600x600');
</script>
</body>
</html>
