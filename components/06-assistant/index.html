<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Assistant</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
 /* stage tint — the world layer (mounted by the lab) shows the street through */
 .stage{ background: rgba(8,12,20,0.30); }

 .stage-shell{ position:relative; width:600px; height:600px; display:grid; place-items:center; flex:none; }

 /* Two-zone rhythm, identical in every state:
    primary card  y  58–270
    gaze rest band y 270–330  (kept clear of glyphs — the reticle parks here)
    dock          y 330+                                     */
 .assistant-viewport{
  position:absolute; inset:44px 0 0 0;
  padding:14px 16px 88px 16px;
  overflow:hidden;
 }
 .view{ display:none; }
 .view.active{ display:block; animation:rise-in 260ms var(--ease-prism) both; }
 .view-primary{ height:212px; position:relative; }
 .view-dock{ margin-top:60px; display:flex; flex-direction:column; gap:12px; }

 /* sheet */
 .sheet{
  background:var(--mat-glass);
  backdrop-filter:var(--blur-glass);
  -webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  border-radius:var(--r-lg);
  box-shadow:0 18px 44px rgba(0,0,0,0.34);
  overflow:hidden;
  position:relative;
 }
 .sheet.raised{ background:var(--mat-raised); }
 .sheet::before{
  content:""; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
  pointer-events:none;
 }
 #conversation{ height:212px; display:flex; flex-direction:column; }
 .sheet-header{
  flex:none;
  display:flex; align-items:center; gap:12px;
  padding:13px 16px 10px 16px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  position:relative;
 }
 .sheet-header::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(120deg, rgba(255,255,255,0.06) 0%, transparent 44%);
  pointer-events:none;
 }
 .mini-orb{
  width:32px;height:32px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  background:radial-gradient(38% 38% at 32% 28%, #ffffff 0%, #dff0ff 14%, #86c8ff 30%, #2f9dff 52%, #0b5ed7 78%);
  box-shadow:0 4px 14px rgba(16,92,180,0.32), 0 0 0 1px rgba(255,255,255,0.14) inset;
  position:relative;
 }
 .mini-orb.listening{ animation:orbBreathe 320ms var(--ease-prism) infinite alternate; }
 @keyframes orbBreathe{from{transform:scale(1);filter:brightness(1)}to{transform:scale(1.06);filter:brightness(1.08)}}
 .sheet-title{font-size:14px;font-weight:700;letter-spacing:-0.01em;line-height:1;color:var(--ink-100)}
 .sheet-sub{font-size:11px;font-weight:600;color:var(--ink-60);letter-spacing:0.02em;margin-top:3px;display:flex;align-items:center;gap:6px}
 .live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px rgba(76,212,124,0.7);display:inline-block}
 .live-dot.pulse{animation:livePulse 1.2s ease-in-out infinite}
 @keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.45;transform:scale(0.85)}}
 .live-dot.warn{background:var(--warn);box-shadow:0 0 10px rgba(255,194,71,0.6)}
 .live-dot.bad{background:var(--danger);box-shadow:0 0 10px rgba(255,93,93,0.6)}
 .live-dot.idle{background:var(--ink-20);box-shadow:none}

 /* transcript — bottom-anchored, newest reply always in view */
 .transcript{
  flex:1; min-height:0;
  overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none;
  display:flex; flex-direction:column; gap:10px;
  padding:12px 16px;
 }
 .transcript::-webkit-scrollbar{display:none}
 .msg{
  max-width:84%;
  padding:10px 13px;
  border-radius:18px;
  font-size:13px;
  font-weight:500;
  line-height:1.45;
  letter-spacing:0.01em;
  position:relative;
  word-break:break-word;
  animation:rise-in 220ms var(--ease-prism) both;
  flex:none;
 }
 .msg.user{
  align-self:flex-end;
  background:linear-gradient(180deg, var(--accent) 0%, var(--accent-strong) 100%);
  color:#04121f;
  border-radius:18px 18px 4px 18px;
  font-weight:600;
  box-shadow:0 6px 18px rgba(16,92,180,0.24);
 }
 .msg.assistant{
  align-self:flex-start;
  background:rgba(255,255,255,0.08);
  outline:1px solid rgba(255,255,255,0.08);
  color:var(--ink-80);
  border-radius:18px 18px 18px 4px;
 }
 .msg-meta{
  font-size:11px;font-weight:600;color:var(--ink-40);letter-spacing:0.02em;margin-top:6px;display:flex;gap:6px;align-items:center;
  font-variant-numeric:tabular-nums;
 }
 .msg.user .msg-meta{color:rgba(4,18,31,0.62);justify-content:flex-end}
 .word-reveal{ display:inline-block; animation:blurWipe 320ms var(--ease-prism) both; }
 @keyframes blurWipe{
  from{filter:blur(8px);opacity:0;transform:translateY(4px)}
  to{filter:blur(0);opacity:1;transform:translateY(0)}
 }
 .cursor{
  display:inline-block;width:2px;height:13px;
  background:var(--accent-strong);
  margin-left:2px;vertical-align:-2px;
  border-radius:1px;
  animation:cursorBlink 900ms steps(1) infinite;
 }
 @keyframes cursorBlink{0%,50%{opacity:1}51%,100%{opacity:0}}

 /* thinking bubble */
 .thinking-inline{
  align-self:flex-start; flex:none;
  display:inline-flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.07);
  outline:1px solid rgba(255,255,255,0.07);
  border-radius:18px 18px 18px 4px;
  padding:10px 14px;
 }
 .thinking-dots{display:flex;gap:4px;align-items:center}
 .thinking-dots i{
  width:6px;height:6px;border-radius:50%;background:var(--ink-60);
  animation:dotBounce 320ms var(--ease-prism) infinite alternate;
 }
 .thinking-dots i:nth-child(2){animation-delay:80ms}
 .thinking-dots i:nth-child(3){animation-delay:160ms}
 @keyframes dotBounce{
  from{transform:translateY(0) scale(1);opacity:0.7}
  to{transform:translateY(-3px) scale(1.08);opacity:1}
 }
 .thinking-label{font-size:11px;font-weight:600;color:var(--ink-60);letter-spacing:0.02em}

 /* waveform */
 .waveform{
  display:flex;align-items:center;gap:3px;
  height:28px; padding:0 2px;
  opacity:0.5;
  transition:opacity var(--dur-fast) var(--ease-prism);
 }
 .waveform.listening,.waveform.streaming{opacity:1}
 .waveform i{
  width:3px;border-radius:999px;
  background:linear-gradient(180deg, #dff0ff 0%, var(--accent) 48%, var(--accent-strong) 100%);
  height:var(--h,10px);
  transform-origin:center;
  animation:wavePulse 280ms var(--ease-prism) infinite alternate;
 }
 @keyframes wavePulse{
  from{transform:scaleY(0.45);opacity:0.75}
  to{transform:scaleY(1);opacity:1}
 }
 .waveform.idle i{animation-play-state:paused;opacity:0.45;transform:scaleY(0.5)}
 .waveform.listening i{animation-duration:220ms}
 .waveform.streaming i{animation-duration:260ms}

 /* status strip in the dock */
 .status-strip{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;
  background:rgba(255,255,255,0.06);
  outline:1px solid rgba(255,255,255,0.07);
  border-radius:14px;
  min-height:46px;
 }
 .status-strip strong{font-size:13px;font-weight:700;color:var(--ink-80)}

 /* suggestions — demoted at rest; the orb is the one focal element */
 .suggestions{ display:flex;gap:8px;flex-wrap:wrap; }
 .suggestions .chip{
  height:30px;padding:0 12px;
  font-size:11px;font-weight:600;letter-spacing:0.01em;
  opacity:0.68;
  transition:transform var(--dur-base) var(--ease-prism), background var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism), opacity var(--dur-fast) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism);
  cursor:pointer;
 }
 .suggestions .chip:hover{transform:translateY(-1px);opacity:1}
 .suggestions .chip.gaze-focus{transform:scale(1.06);opacity:1;box-shadow:0 0 0 2.5px var(--stroke-focus), 0 0 22px rgba(86,184,255,0.35)}
 .suggestions .chip:focus-visible{opacity:1}
 .composer-hint{ display:flex;align-items:center;justify-content:center;gap:6px; padding:0 4px; }
 .composer-hint .caption{color:var(--ink-40)}

 /* header Clear — demoted at rest */
 .sheet-header .btn{
  opacity:0.68; position:relative;
  min-height:32px;padding:0 12px;font-size:13px;
  transition:opacity var(--dur-fast) var(--ease-prism), transform var(--dur-base) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism);
 }
 .sheet-header .btn:hover,
 .sheet-header .btn:focus-visible{opacity:1}
 .sheet-header .btn.gaze-focus{opacity:1;transform:scale(1.06);box-shadow:0 0 0 2.5px var(--stroke-focus), 0 0 22px rgba(86,184,255,0.35)}

 /* orb — the one focal element at rest */
 .orb-wrap{
  position:absolute;
  bottom:14px; left:50%; transform:translateX(-50%);
  z-index:420;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  animation:rise-in 380ms var(--ease-prism) both;
  animation-delay:320ms;
 }
 .orb{
  appearance:none;-webkit-appearance:none;
  border:none;
  width:56px;height:56px;
  border-radius:50%;
  background:radial-gradient(38% 38% at 32% 28%, #ffffff 0%, #dff0ff 14%, #86c8ff 30%, #2f9dff 52%, #0b5ed7 78%);
  box-shadow:0 16px 40px rgba(16,92,180,0.52), 0 0 0 1px rgba(255,255,255,0.22) inset, 0 0 32px rgba(86,184,255,0.42), 0 8px 22px rgba(0,0,0,0.32);
  display:grid;place-items:center;
  cursor:pointer;
  position:relative;
  transition:transform 260ms var(--ease-prism), box-shadow 160ms var(--ease-prism);
 }
 .orb::before{
  content:"";position:absolute;inset:-10px;border-radius:50%;
  background:radial-gradient(circle, rgba(86,184,255,0.22) 0%, transparent 70%);
  opacity:0;transition:opacity 260ms var(--ease-prism);pointer-events:none;
 }
 .orb.gaze-focus{transform:scale(1.06);box-shadow:0 14px 32px rgba(16,92,180,0.46), 0 0 0 2.5px var(--stroke-focus), 0 0 22px rgba(86,184,255,0.38)}
 .orb.gaze-focus::before{opacity:1}
 .orb:active{transform:scale(0.96)}
 .orb.listening{
  animation:orbListenPulse 320ms var(--ease-prism) infinite alternate;
  box-shadow:0 14px 32px rgba(16,92,180,0.5), 0 0 0 2px rgba(86,184,255,0.9), 0 0 28px rgba(86,184,255,0.5);
 }
 @keyframes orbListenPulse{from{transform:scale(1)}to{transform:scale(1.07)}}
 .orb svg{filter:drop-shadow(0 1px 6px rgba(0,0,0,0.22))}
 .orb-label{
  font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-40);white-space:nowrap;
 }
 .orb-hint{
  position:absolute;bottom:72px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.44);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  outline:1px solid rgba(255,255,255,0.08);
  color:var(--ink-60);font-size:10px;font-weight:600;letter-spacing:0.02em;
  padding:5px 9px;border-radius:999px;white-space:nowrap;
  opacity:0;translate:0 6px;
  transition:opacity 260ms var(--ease-prism), translate 260ms var(--ease-prism);
  pointer-events:none;
 }
 .orb-wrap:hover .orb-hint,
 .orb.gaze-focus ~ .orb-hint{opacity:1;translate:0 0}
 .orb-wrap:focus-within .orb-hint{opacity:1;translate:0 0}

 /* edge state cards — primary zone, one focal card per state */
 .state-card{
  height:100%;
  background:var(--mat-raised);
  backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  outline:1px solid var(--stroke-glass);
  border-radius:var(--r-lg);
  padding:16px 20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;
  box-shadow:0 18px 44px rgba(0,0,0,0.36);
  position:relative;overflow:hidden;
 }
 .state-card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(90% 60% at 50% 10%, rgba(86,184,255,0.08), transparent 62%);
  pointer-events:none;
 }
 .state-card > *{position:relative}
 .state-illus{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.08);
  flex:none;
 }
 .state-illus.danger{background:rgba(255,93,93,0.10);outline-color:rgba(255,93,93,0.18)}
 .state-title{font-size:18px;font-weight:700;letter-spacing:-0.01em;color:var(--ink-100)}
 .state-body{font-size:13px;font-weight:500;color:var(--ink-60);line-height:1.45;max-width:330px}
 .dock-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
 .dock-caption{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}

 /* queued prompt row (offline) */
 .queue-row{
  width:100%;max-width:360px;
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);
  border-radius:12px;padding:9px 12px;text-align:left;
  font-variant-numeric:tabular-nums;
 }
 .queue-row strong{font-size:13px;color:var(--ink-80);font-weight:600}
 .queue-row .caption{color:var(--ink-40)}

 .sk-line{height:10px;border-radius:8px}
 .sk-bubble{height:42px;border-radius:18px}

 button:focus-visible, [data-focusable]:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}

 @media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}
  .waveform i{animation:none}
  .cursor{animation:none;opacity:1}
 }
 :root[data-reduced-motion] *,
 :root[data-reduced-motion] *::before,
 :root[data-reduced-motion] *::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}
 :root[data-reduced-motion] .waveform i{animation:none}
 :root[data-reduced-motion] .cursor{animation:none;opacity:1}
</style>
</head>
<body>
<div class="device">
 <div class="stage-shell">
  <div class="stage" data-stage></div>
 </div>
</div>
<script type="module">
import { createOS } from '/os/shared/core.js';
import { mountLab } from '/os/shared/lab.js';

const stage = document.querySelector('[data-stage]');
const os = createOS(stage, { dwell: true, dwellMs: 350 });
stage.appendChild(os.statusbar('<span class="caption" style="color:var(--ink-60);letter-spacing:0.04em">Assistant</span>'));

const h = (tag, attrs={}, ...children)=>{
 const el=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs)){
  if(k==='class') el.className=v;
  else if(k==='html') el.innerHTML=v;
  else if(v!==null && v!==undefined) el.setAttribute(k,v);
 }
 for(const c of children){
  if(c==null) continue;
  if(typeof c==='string') el.appendChild(document.createTextNode(c));
  else el.appendChild(c);
 }
 return el;
};

/* ---- views: every state shares the primary / clear-band / dock rhythm ---- */
const viewport = h('div', {class:'assistant-viewport'});
stage.appendChild(viewport);
const views = {};
for (const id of ['normal','loading','empty','error','offline','permission']){
 const v = h('div', {class:'view', id:`view-${id}`, 'aria-label':`${id} state`});
 const primary = h('div', {class:'view-primary'});
 const dock = h('div', {class:'view-dock'});
 v.append(primary, dock);
 viewport.appendChild(v);
 views[id] = { v, primary, dock };
}

/* ================= NORMAL — conversation sheet ================= */
const sheet = h('div', {class:'sheet raised', id:'conversation'});
const sheetHeader = h('div', {class:'sheet-header'});
const miniOrb = h('div', {class:'mini-orb', 'aria-hidden':'true', html:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="1.3" fill="white"/><path d="M12 5.2l1 2.6 2.6.35-2.6.38-1 2.6-1-2.6-2.6-.38 2.6-.35 1-2.6z" fill="white"/></svg>`});
const headerText = h('div', {style:'flex:1;position:relative;min-width:0'});
headerText.innerHTML = `<div class="sheet-title">Prism</div><div class="sheet-sub"><span class="live-dot idle" id="headerDot" aria-hidden="true"></span><span id="headerStatus">Ready — tap the orb or say “Hey Prism”</span></div>`;
const headerAction = h('button', {class:'btn ghost', 'data-focusable':'', tabindex:'0', 'aria-label':'Clear conversation'}, 'Clear');
sheetHeader.append(miniOrb, headerText, headerAction);

const transcript = h('div', {class:'transcript', id:'transcript', role:'log', 'aria-live':'polite', 'aria-label':'Conversation transcript'});
const pin = ()=>{ transcript.scrollTop = transcript.scrollHeight; };

sheet.append(sheetHeader, transcript);
views.normal.primary.appendChild(sheet);

/* dock: status strip + suggestions + hint */
const statusStrip = h('div', {class:'status-strip', id:'statusStrip', 'aria-live':'polite'});
function buildWaveform(cls='idle'){
 const w = h('div', {class:`waveform ${cls}`, 'aria-hidden':'true'});
 const heights = [10,16,8,18,12,22,14,18,9,14,11,17];
 heights.forEach((hh,i)=>{
  const bar = h('i', {style:`--h:${hh}px;--i:${i}`});
  bar.style.animationDelay = `${i*52}ms`;
  w.appendChild(bar);
 });
 return w;
}
let waveform = buildWaveform('idle');
let statusText = h('div', {style:'flex:1;display:flex;flex-direction:column;gap:2px'});
statusText.innerHTML = `<strong>Prism is idle</strong><span class="caption">Ask anything — voice or tap</span>`;
statusStrip.append(waveform, statusText);

const suggestions = h('div', {class:'suggestions', role:'group', 'aria-label':'Suggestion chips'});
const chipData = [
 {label:'Summarize my day', prompt:'Summarize my day'},
 {label:'Open my commute', prompt:'What’s my commute?'},
 {label:'Take a photo', prompt:'Take a photo'},
 {label:'What’s on screen?', prompt:'What’s on screen?'},
];
chipData.forEach(c=>{
 const chip = h('button', {class:'chip', 'data-focusable':'', tabindex:'0', 'aria-label':`Ask: ${c.label}`}, c.label);
 chip.addEventListener('click', ()=> handleQuickPrompt(c.prompt));
 suggestions.appendChild(chip);
});

const composerHint = h('div', {class:'composer-hint'});
composerHint.innerHTML = `<span class="caption">“Hey Prism” wakes anywhere</span><span style="width:3px;height:3px;border-radius:50%;background:var(--ink-20);display:inline-block"></span><span class="caption">Enter while the orb is focused</span>`;

views.normal.dock.append(statusStrip, suggestions, composerHint);

/* ---- transcript helpers ---- */
function addMessage(role, text, opts={}){
 const el = h('div', {class:`msg ${role}`});
 if(role==='assistant' && opts.streaming) el.classList.add('streaming');
 const time = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
 if(role==='user'){
  el.textContent = text;
  el.appendChild(h('div', {class:'msg-meta'}, `${time} · you`));
 } else {
  if(opts.html){ el.innerHTML = opts.html; } else { el.textContent = text; }
  el.appendChild(h('div', {class:'msg-meta'}, `Prism · ${time}`));
 }
 transcript.appendChild(el);
 pin();
 return el;
}

function seedTranscript(){
 transcript.innerHTML = '';
 addMessage('user','Hey Prism, what’s my morning look like?');
 addMessage('assistant','Good morning. 3 highlights — Standup at 9:30 in Prism Room, Deep Work 10–12, and your 7:31 walk is ready in Gallery.');
 addMessage('user','And my commute?');
 addMessage('assistant','Light traffic — 18 min via 101. Weather 72° and bright. Want me to open Maps?');
 pin();
}
seedTranscript();

headerAction.addEventListener('click', ()=>{
 transcript.innerHTML='';
 transcript.appendChild(h('div', {class:'msg assistant', style:'max-width:100%;text-align:center;align-self:center;background:rgba(255,255,255,0.06)'}, 'Cleared — say “Hey Prism” to start a new thread.'));
 pin();
 setAssistantState('idle');
 os.banner('<strong>History cleared</strong><span class="caption">new thread ready</span>',{timeout:1800});
});

/* ---- assistant phase machine ---- */
let assistantPhase = 'idle';
let streamTimer = null;
let listenTimer = null;
let thinkTimer = null;

function setAssistantState(phase){
 assistantPhase = phase;
 const dot = document.getElementById('headerDot');
 const statusLabel = document.getElementById('headerStatus');
 miniOrb.classList.toggle('listening', phase==='listening');
 if(dot){
  dot.className = 'live-dot ' + (phase==='listening' ? 'pulse' : phase==='thinking' ? 'warn' : 'idle');
 }
 waveform.className = `waveform ${phase==='idle' ? 'idle' : phase==='listening' ? 'listening' : 'streaming'}`;
 if(phase==='listening'){
  statusText.innerHTML = `<strong style="color:var(--ink-100)">Listening…</strong><span class="caption">“${pendingPrompt || 'Hey Prism'}” — I’m all ears</span>`;
  statusLabel.textContent = 'Listening — speak now';
  animateWaveformVoice();
 } else if(phase==='thinking'){
  statusText.innerHTML = `<strong style="color:var(--ink-100)">Prism is thinking…</strong><span class="caption">Finding context on device</span>`;
  statusLabel.textContent = 'Thinking…';
  stopWaveformVoice();
 } else if(phase==='streaming'){
  statusText.innerHTML = `<strong style="color:var(--ink-100)">Replying…</strong><span class="caption">Streaming the answer</span>`;
  statusLabel.textContent = 'Replying…';
 } else {
  statusText.innerHTML = `<strong>Prism is idle</strong><span class="caption">Ask anything — voice or tap</span>`;
  statusLabel.textContent = 'Ready — tap the orb or say “Hey Prism”';
  stopWaveformVoice();
 }
 orb.classList.toggle('listening', phase==='listening');
 orb.setAttribute('aria-label', phase==='listening' ? 'Listening — speak now' : phase==='thinking' ? 'Prism is thinking' : 'Assistant, say Hey Prism or tap to speak');
}

let voiceInterval = null;
function animateWaveformVoice(){
 stopWaveformVoice();
 voiceInterval = setInterval(()=>{
  [...waveform.children].forEach(bar=>{
   const bh = 6 + Math.random()*16;
   bar.style.setProperty('--h', `${bh}px`);
   bar.style.height = `${bh}px`;
  });
 }, 110);
}
function stopWaveformVoice(){
 if(voiceInterval){ clearInterval(voiceInterval); voiceInterval=null; }
}
function animateWaveformStreamingTick(progress){
 [...waveform.children].forEach((bar,i)=>{
  const base = 8 + (i%3)*4;
  const lift = Math.sin((progress*0.4 + i)*1.2)*6;
  const bh = Math.max(6, base + lift + (Math.random()*4));
  bar.style.height = `${bh}px`;
 });
}

let pendingPrompt = '';

function handleQuickPrompt(prompt){ triggerAssistant(prompt); }

function triggerAssistant(promptOverride){
 if(currentState==='permission'){
  os.banner('<strong>Microphone blocked</strong><span class="caption">Allow access to speak</span>',{timeout:2200});
  setState('permission');
  return;
 }
 if(currentState==='offline'){
  queuePrompt(promptOverride || 'Voice prompt');
  return;
 }
 if(currentState!=='normal'){
  setState('normal');
  setTimeout(()=> triggerAssistant(promptOverride), 220);
  return;
 }
 if(assistantPhase==='listening' || assistantPhase==='thinking' || assistantPhase==='streaming'){
  os.banner('<strong>One moment</strong><span class="caption">Prism is busy — hang tight</span>',{timeout:1400});
  return;
 }
 pendingPrompt = promptOverride || samplePrompt();
 setAssistantState('listening');
 clearTimeout(listenTimer); clearTimeout(thinkTimer); clearTimeout(streamTimer);
 listenTimer = setTimeout(()=>{
  addMessage('user', pendingPrompt);
  setAssistantState('thinking');
  const thinkingEl = h('div', {class:'thinking-inline', id:'thinkingBubble', 'aria-label':'Prism is thinking'});
  thinkingEl.innerHTML = `<span class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="thinking-label">Prism is thinking…</span>`;
  transcript.appendChild(thinkingEl);
  pin();
  thinkTimer = setTimeout(()=>{
   thinkingEl.remove();
   const response = responseFor(pendingPrompt);
   const streamEl = h('div', {class:'msg assistant streaming'});
   const content = h('span', {class:'assistant-content'});
   const time = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
   streamEl.append(content, h('div', {class:'msg-meta'}, `Prism · ${time}`));
   transcript.appendChild(streamEl);
   pin();
   setAssistantState('streaming');
   streamWords(content, response, ()=>{
    setAssistantState('idle');
    pendingPrompt='';
   });
  }, 900);
 }, 850);
}

function samplePrompt(){
 const samples = ['Summarize my day','What’s my commute?','Take a photo','What’s on screen?'];
 return samples[Math.floor(Math.random()*samples.length)];
}
function responseFor(prompt){
 const p = prompt.toLowerCase();
 if(p.includes('summarize') || p.includes('morning') || p.includes('my day')){
  return 'You have Standup at 9:30 in Prism Room, Deep Work 10–12, then Gallery exports at 14:00. Weather is 72° — bright and clear. Want me to open Maps for your 18-min commute?';
 }
 if(p.includes('commute') || p.includes('maps') || p.includes('retry')){
  return 'Light traffic via 101 — 18 min to downtown. Your lens is at 82% and AQI is 32. I can queue directions for offline if you want.';
 }
 if(p.includes('photo') || p.includes('capture')){
  return 'Lens ready — say “capture” or tap the shutter. Your last photo at 8:14 is in Recents. Want me to open Camera now?';
 }
 if(p.includes('screen')){
  return 'You’re looking at Prism — time, weather, launcher and the assistant orb. Gaze focuses cards, dwell to open. Say “Hey Prism” anywhere to wake me.';
 }
 return 'Got it — I’m on it. I can summarize, navigate, or capture. Try “Hey Prism, open Maps” or pick a chip below.';
}

function streamWords(container, text, done){
 const words = text.split(' ');
 let idx = 0;
 let waveTick = setInterval(()=> animateWaveformStreamingTick(idx), 90);
 function tick(){
  if(idx <= words.length){
   container.innerHTML = words.slice(0, idx).map((w,i)=>{
    const delay = (i*28) + 'ms';
    return `<span class="word-reveal" style="animation-delay:${delay}">${w}</span>`;
   }).join(' ') + (idx < words.length ? `<span class="cursor" aria-hidden="true"></span>` : '');
   idx++;
   pin();
   streamTimer = setTimeout(tick, idx===1 ? 180 : 72);
  } else {
   clearInterval(waveTick);
   [...waveform.children].forEach((bar,i)=>{ bar.style.height = `${10 + (i%4)*3}px`; });
   done && done();
  }
 }
 tick();
}

/* ---- state switching ---- */
let currentState='normal';
function setState(id){
 currentState=id;
 views[id].v.classList.add('active');
 for(const [key,val] of Object.entries(views)){
  if(key!==id) val.v.classList.remove('active');
 }
 if(id!=='normal'){
  clearTimeout(listenTimer);clearTimeout(thinkTimer);clearTimeout(streamTimer);stopWaveformVoice();
  assistantPhase='idle';
 } else {
  setAssistantState('idle');
  pin();
 }
 os.emit('statechange',{id});
}
