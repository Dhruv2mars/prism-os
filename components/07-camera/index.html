<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Camera</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
 /* stage world — translucent scrim, consistent with design system */
 .stage{
  background:
   radial-gradient(120% 90% at 50% 14%, rgba(42,53,80,0.56) 0%, rgba(20,26,40,0.72) 36%, rgba(10,14,23,0.90) 68%),
   radial-gradient(68% 46% at 78% 86%, rgba(86,184,255,0.09), transparent 56%),
   rgba(6,10,16,0.76);
 }
 .stage-shell{
  position:relative;
  width:600px;height:600px;
  display:grid;place-items:center;
  flex:none;
 }
 /* DEV CHROME — MUST be fixed OUTSIDE .stage (not inside stage screenshot) */
 .dev-controls{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;gap:6px;
  z-index:1000;
  justify-content:center;
  flex-wrap:wrap;
  pointer-events:none;
  padding:8px 12px;
  border-radius:var(--r-pill);
  background:rgba(10,15,23,0.74);
  outline:1px solid var(--stroke-glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 24px rgba(0,0,0,0.32);
  max-width:92vw;
 }
 .stage .dev-controls{display:none !important}
 .dev-controls .chip{
  pointer-events:auto;
  height:26px;padding:0 10px;
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  transition:background var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
  border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
 }
 .dev-controls .chip.active{
  background:linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#051423;outline-color:transparent;
 }
 .dev-controls .chip:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .dev-controls .chip.gaze-focus{transform:scale(1.04)}

 /* viewport */
 .cam-viewport{
  position:absolute;
  inset:44px 0 0 0;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px 14px 14px 14px;
  overflow:hidden;
 }

 /* viewfinder card — simulated world */
 .vf-card{
  position:relative;
  flex:0 0 338px;
  height:338px;
  border-radius:22px;
  overflow:hidden;
  background: var(--mat-glass);
  backdrop-filter:var(--blur-glass);
  -webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  box-shadow:0 18px 44px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.06);
  display:flex;
  flex-direction:column;
  animation: rise-in 260ms var(--ease-prism) both;
 }
 .vf-world{
  position:absolute;inset:0;
  background:
   radial-gradient(120% 70% at 30% 18%, #6a8cc2 0%, #3d5a8a 18%, #2a3a5a 34%, #1c2538 56%, #0f141e 78%),
   linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 42%),
   #0a1020;
  overflow:hidden;
 }
 .vf-world::before{
  content:"";
  position:absolute;inset:0;
  background:
   radial-gradient(80% 50% at 50% 100%, rgba(255,200,140,0.14), transparent 62%),
   radial-gradient(60% 30% at 70% 20%, rgba(86,184,255,0.10), transparent 60%);
  pointer-events:none;
 }
 /* horizon/mountain silhouette — subtle, not photo */
 .vf-world::after{
  content:"";
  position:absolute;left:0;right:0;bottom:0;height:44%;
  background:
   linear-gradient(180deg, transparent 0%, rgba(10,14,23,0.38) 100%),
   url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" preserveAspectRatio="none"><path d="M0 78 L90 42 L172 68 L248 28 L342 62 L418 36 L498 72 L600 44 L600 120 L0 120 Z" fill="rgba(20,30,48,0.42)"/><path d="M0 94 L68 78 L138 92 L210 70 L292 88 L368 66 L448 84 L528 72 L600 90 L600 120 L0 120 Z" fill="rgba(12,18,30,0.58)"/></svg>') 0 100% / 100% 100% no-repeat;
  opacity:0.96;
  pointer-events:none;
 }
 /* grid 3x3 */
 .vf-grid{
  position:absolute;inset:0;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:1fr 1fr 1fr;
  opacity:0;
  transition: opacity 260ms var(--ease-prism);
  pointer-events:none;
  z-index:4;
 }
 .vf-grid.on{opacity:1}
 .vf-grid span{
  outline:1px solid rgba(255,255,255,0.14);
  outline-offset:-0.5px;
 }
 .vf-grid span:nth-child(1), .vf-grid span:nth-child(3), .vf-grid span:nth-child(7), .vf-grid span:nth-child(9){outline-color:rgba(255,255,255,0.10)}
 /* center reticle */
 .vf-reticle{
  position:absolute;
  left:50%;top:50%;
  width:64px;height:64px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,0.22);
  border-radius:12px;
  z-index:5;
  pointer-events:none;
  transition: border-color 260ms var(--ease-prism), transform 260ms var(--ease-prism), opacity 220ms var(--ease-prism);
  box-shadow:0 0 0 1px rgba(0,0,0,0.18), 0 2px 12px rgba(0,0,0,0.18);
 }
 .vf-reticle::before, .vf-reticle::after{
  content:"";position:absolute;background:rgba(255,255,255,0.9);
 }
 .vf-reticle::before{left:50%;top:-6px;width:1px;height:6px;transform:translateX(-50%)}
 .vf-reticle::after{left:-6px;top:50%;width:6px;height:1px;transform:translateY(-50%)}
 .vf-reticle.focus{
  border-color: var(--accent);
  box-shadow:0 0 0 1px rgba(86,184,255,0.28), 0 0 18px rgba(86,184,255,0.22);
  transform:translate(-50%,-50%) scale(1.04);
 }
 /* top bar inside viewfinder */
 .vf-topbar{
  position:absolute;
  top:10px;left:10px;right:10px;
  z-index:8;
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;
  pointer-events:none;
 }
 .vf-topbar > *{pointer-events:auto}
 .vf-cluster{display:flex;align-items:center;gap:6px}
 .vf-chip{
  appearance:none;-webkit-appearance:none;
  border:none;
  display:inline-flex;align-items:center;gap:5px;
  height:28px;padding:0 10px;
  border-radius:999px;
  background:rgba(0,0,0,0.42);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  outline:1px solid rgba(255,255,255,0.10);
  color:var(--ink-80);
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  cursor:pointer;
  transition: transform var(--dur-base) var(--ease-prism), background var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
 }
 .vf-chip.active{background:rgba(86,184,255,0.18);outline-color:rgba(86,184,255,0.28);color:var(--ink-100)}
 .vf-chip.gaze-focus{transform:scale(1.04);outline-color:var(--stroke-focus)}
 .vf-chip:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .vf-chip .dot{width:6px;height:6px;border-radius:50%;flex:none}
 .vf-chip .dot.rec{background:var(--danger);box-shadow:0 0 8px rgba(255,93,93,0.6);animation:recPulse 1s ease-in-out infinite}
 @keyframes recPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.52;transform:scale(0.84)}}
 .vf-timer{
  position:absolute;
  left:50%;top:10px;transform:translateX(-50%);
  z-index:8;
  display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,0.44);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  outline:1px solid rgba(255,255,255,0.08);
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;font-weight:700;
  color:var(--ink-100);
  letter-spacing:0.02em;
    font-variant-numeric:tabular-nums;
  opacity:0;translate:0 -6px;
  transition: opacity 220ms var(--ease-prism), translate 260ms var(--ease-prism);
  pointer-events:none;
 }
 .vf-timer.on{opacity:1;translate:0 0}
 /* countdown big */
 .vf-countdown{
  position:absolute;inset:0;
  z-index:9;
  display:grid;place-items:center;
  background:rgba(6,10,16,0.18);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;
  transition: opacity 220ms var(--ease-prism);
 }
 .vf-countdown.on{opacity:1;pointer-events:auto}
 .count-num{
  font-size:72px;font-weight:800;letter-spacing:-0.04em;
  color:var(--ink-100);
    font-variant-numeric:tabular-nums;
  text-shadow:0 4px 18px rgba(0,0,0,0.38), 0 0 22px rgba(86,184,255,0.18);
  transform:scale(0.92);
  animation: countPop 320ms var(--ease-prism) both;
 }
 @keyframes countPop{
  0%{transform:scale(0.84);opacity:0;filter:blur(8px)}
  55%{transform:scale(1.06);opacity:1;filter:blur(0)}
  100%{transform:scale(1);opacity:1}
 }
 /* flash — 220ms prism-ease */
 .vf-flash{
  position:absolute;inset:0;
  background:rgba(255,255,255,0.94);
  opacity:0;pointer-events:none;
  z-index:10;
  transition: opacity 220ms var(--ease-prism);
 }
 .vf-flash.on{opacity:1}

 /* bottom meta inside vf — mode hint + focal distance */
 .vf-bottom{
  position:absolute;
  left:10px;right:10px;bottom:10px;
  z-index:8;
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;
  pointer-events:none;
 }
 .vf-bottom > *{pointer-events:auto}
 .vf-meta-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,0,0,0.42);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  outline:1px solid rgba(255,255,255,0.08);
  padding:5px 9px;
  border-radius:999px;
  font-size:10px;font-weight:600;letter-spacing:0.04em;
  text-transform:uppercase;color:var(--ink-60);
 }
 .vf-meta-pill strong{color:var(--ink-80);font-size:11px;letter-spacing:0.01em;text-transform:none;font-weight:700}
 .vf-meta-pill .sep{width:1px;height:10px;background:rgba(255,255,255,0.08)}

 /* controls stack below viewfinder */
 .controls-stack{
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:center;
  animation: rise-in 260ms var(--ease-prism) both;
  animation-delay:80ms;
 }
 .mode-switch{
  display:inline-flex;
  gap:2px;
  padding:3px;
  border-radius:999px;
  background:rgba(255,255,255,0.07);
  outline:1px solid rgba(255,255,255,0.07);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
 }
 .mode-btn{
  appearance:none;-webkit-appearance:none;
  border:none;
  height:28px;padding:0 16px;
  border-radius:999px;
  background:transparent;
  color:var(--ink-60);
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition: background var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism);
  position:relative;
 }
 .mode-btn[aria-selected="true"]{
  background:linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#051423;
  box-shadow:0 6px 14px rgba(16,92,180,0.28);
 }
 .mode-btn.gaze-focus{transform:scale(1.04)}
 .mode-btn:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .mode-hint{
  font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-40);margin-top:-2px;
 }

 .shutter-row{
  width:100%;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
  padding:2px 6px 0 6px;
 }
 .shutter-side{
  display:flex;align-items:center;gap:8px;
 }
 .shutter-side.left{justify-content:flex-start}
 .shutter-side.right{justify-content:flex-end}
 .thumb-preview{
  appearance:none;-webkit-appearance:none;
  border:none;
  width:44px;height:44px;
  border-radius:10px;
  overflow:hidden;
  outline:1px solid rgba(255,255,255,0.12);
  background: linear-gradient(135deg, #2a3a5a 0%, #0f141e 100%);
  display:grid;place-items:center;
  cursor:pointer;
  position:relative;
  box-shadow:0 6px 14px rgba(0,0,0,0.22);
  transition: transform var(--dur-base) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
 }
 .thumb-preview.gaze-focus{transform:scale(1.06);outline-color:var(--stroke-focus)}
 .thumb-preview:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .thumb-preview img, .thumb-preview .thumb-fallback{width:100%;height:100%;object-fit:cover;display:block}
 .thumb-fallback{
  background: linear-gradient(135deg, #ff8a6b 0%, #d4232a 55%, #1a2a44 100%);
  display:grid;place-items:center;color:white;
 }
 .side-label{
  font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-40);line-height:1;
 }
 .side-stack{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
 .side-stack.right{ align-items:flex-end}
 /* shutter halo + button - 72px spec */
 .shutter-wrap{
  position:relative;
  width:78px;height:78px;
  display:grid;place-items:center;
  flex:none;
 }
 .shutter-halo{
  position:absolute;inset:-6px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(86,184,255,0.22) 0%, transparent 72%);
  opacity:0;
  transition: opacity 260ms var(--ease-prism), transform 260ms var(--ease-prism);
  pointer-events:none;
 }
 .shutter-wrap.gaze-focus .shutter-halo{opacity:1;transform:scale(1.04)}
 .shutter-wrap.recording .shutter-halo{opacity:1;background:radial-gradient(circle, rgba(255,93,93,0.18) 0%, transparent 72%)}
 .shutter-btn{
  appearance:none;-webkit-appearance:none;
  border:none;
  width:72px;height:72px;
  border-radius:50%;
  background:#fff;
  outline:1.5px solid rgba(255,255,255,0.96);
  box-shadow:0 0 0 4px rgba(255,255,255,0.14), 0 12px 28px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.9);
  display:grid;place-items:center;
  cursor:pointer;
  position:relative;
  transition: transform var(--dur-base) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism), background var(--dur-fast) var(--ease-prism);
 }
 .shutter-btn::before{
  content:"";position:absolute;inset:4px;
  border-radius:50%;
  border:1.5px solid rgba(0,0,0,0.10);
  pointer-events:none;
 }
 .shutter-btn.gaze-focus{transform:scale(1.05);box-shadow:0 0 0 4px rgba(86,184,255,0.18), 0 0 0 2.5px var(--stroke-focus), 0 16px 32px rgba(0,0,0,0.36), 0 0 18px rgba(86,184,255,0.18)}
 .shutter-btn:active{transform:scale(0.96)}
 .shutter-btn:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:3px}
 .shutter-btn.recording{
  background:#ff2d2d;
  outline-color:rgba(255,255,255,0.92);
  box-shadow:0 0 0 4px rgba(255,93,93,0.18), 0 12px 28px rgba(0,0,0,0.32);
 }
 .shutter-icon{
  width:28px;height:28px;
  border-radius:50%;
  background:transparent;
  border:2px solid #0a1626;
  transition: all 260ms var(--ease-prism);
 }
 .shutter-btn.recording .shutter-icon{
  width:22px;height:22px;
  border-radius:5px;
  background:#fff;
  border-color:#fff;
 }
 .shutter-btn.photo-halo-pulse{
  animation: haloPulse 420ms var(--ease-prism);
 }
 @keyframes haloPulse{
  0%{transform:scale(1)}
  30%{transform:scale(0.92)}
  60%{transform:scale(1.04)}
  100%{transform:scale(1)}
 }
 .shutter-ring{
  position:absolute;inset:-4px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.92);
  opacity:0;pointer-events:none;
 }
 .shutter-ring.pulse{
  animation: ringOut 520ms var(--ease-prism) both;
 }
 @keyframes ringOut{
  0%{transform:scale(0.86);opacity:0.9}
  100%{transform:scale(1.18);opacity:0}
 }
 .shutter-label{
  position:absolute;
  bottom:-16px;left:50%;transform:translateX(-50%);
  font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-40);white-space:nowrap;pointer-events:none;
 }
 /* thumbnail strip */
 .strip-wrap{
  width:100%;
  background:rgba(255,255,255,0.04);
  outline:1px solid rgba(255,255,255,0.06);
  border-radius:14px;
  padding:8px 8px 8px 8px;
  display:flex;flex-direction:column;gap:6px;
  animation: rise-in 260ms var(--ease-prism) both;
  animation-delay:140ms;
 }
 .strip-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2px;
 }
 .strip-title{font-size:10px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--ink-40)}
  .strip-count{font-size:10px;font-weight:600;color:var(--ink-40);font-variant-numeric:tabular-nums}
 .recent-strip{
  display:flex;gap:8px;
  overflow-x:auto;overscroll-behavior-x:contain;
  scrollbar-width:none;
  padding:2px 1px 2px 1px;
  scroll-snap-type:x proximity;
 }
 .recent-strip::-webkit-scrollbar{display:none}
 .recent-thumb{
  appearance:none;-webkit-appearance:none;
  border:none;
  flex:0 0 76px;
  height:56px;
  border-radius:10px;
  overflow:hidden;
  outline:1px solid rgba(255,255,255,0.10);
  background:var(--mat-glass);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  position:relative;
  cursor:pointer;
  display:flex;flex-direction:column;
  box-shadow:0 6px 14px rgba(0,0,0,0.18);
  transition: transform var(--dur-base) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism);
  scroll-snap-align:start;
  padding:0;
  text-align:left;
 }
 .recent-thumb.gaze-focus{transform:scale(1.04) translateY(-1px);outline-color:var(--stroke-focus);box-shadow:0 10px 22px rgba(0,0,0,0.28), 0 0 0 2px rgba(86,184,255,0.14)}
 .recent-thumb:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .recent-thumb:active{transform:scale(0.98)}
 .recent-thumb .thumb-img{
  height:36px;position:relative;overflow:hidden;
  background: linear-gradient(135deg, #2a3a5a 0%, #0f141e 100%);
  display:grid;place-items:center;
 }
 .recent-thumb .thumb-meta{
  flex:1;display:flex;align-items:center;justify-content:space-between;
  padding:4px 6px;
  background:rgba(255,255,255,0.04);
 }
  .thumb-time{font-size:10px;font-weight:700;color:var(--ink-80);font-variant-numeric:tabular-nums;letter-spacing:0.01em}
 .thumb-badge{font-size:10px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-60);background:rgba(255,255,255,0.08);padding:2px 5px;border-radius:999px}
 .recent-thumb.is-new{animation: thumbPop 420ms var(--ease-prism) both}
 @keyframes thumbPop{
  0%{transform:scale(0.88);opacity:0;filter:blur(6px)}
  50%{transform:scale(1.06)}
  100%{transform:scale(1);opacity:1;filter:blur(0)}
 }

 /* context sheet — long-press stub */
 .dim{
  position:absolute;inset:0;
  background:rgba(4,7,11,0.45);
  z-index:540;
  display:none;
  opacity:0;
  transition: opacity 260ms var(--ease-prism);
 }
 .dim.on{display:block;opacity:1}
 .ctx-sheet{
  position:absolute;
  left:12px;right:12px;bottom:12px;
  z-index:560;
  background:var(--mat-sheet);
  backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  outline:1px solid var(--stroke-glass);
  border-radius:20px;
  padding:16px 14px 14px 14px;
  display:flex;flex-direction:column;gap:12px;
  box-shadow:0 18px 44px rgba(0,0,0,0.42);
  transform:translateY(8px) scale(0.98);
  opacity:0;
  transition: transform 280ms var(--ease-prism), opacity 260ms var(--ease-prism);
  pointer-events:none;
 }
 .ctx-sheet.on{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
 .sheet-drag{width:32px;height:3px;border-radius:999px;background:rgba(255,255,255,0.14);align-self:center}
 .sheet-title{font-size:14px;font-weight:700;letter-spacing:-0.01em;color:var(--ink-100);line-height:1}
 .sheet-row{display:flex;gap:8px;flex-wrap:wrap}
 .sheet-row .btn{min-height:36px;font-size:13px}
 .sheet-row .chip{height:28px}

 /* state layer — edge states */
 .state-layer{
  position:absolute;
  inset:44px 0 0 0;
  z-index:520;
  display:none;
  overflow-y:auto;scrollbar-width:none;
  padding:12px 14px 14px 14px;
 }
 .state-layer::-webkit-scrollbar{display:none}
 .state-layer.on{display:block;animation: rise-in 260ms var(--ease-prism) both}
 .state-layer.dim-on{
  display:grid;place-items:center;
  padding:12px 14px 14px 14px;
  background:transparent;
  pointer-events:none;
 }
 .state-layer.dim-on .state-card{pointer-events:auto}
 .state-card{
  width:100%;max-width:420px;
  background:var(--mat-raised);
  backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  outline:1px solid var(--stroke-glass);
  border-radius:var(--r-lg);
  padding:24px 20px 18px 20px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
  box-shadow:0 18px 44px rgba(0,0,0,0.36);
  animation: rise-in 260ms var(--ease-prism) both;
 }
 .state-card.sheet-in-anim{animation: sheet-in 320ms var(--ease-prism) both}
 .state-illus{
  width:64px;height:64px;border-radius:18px;
  display:grid;place-items:center;
  background:rgba(255,255,255,0.06);
  outline:1px solid rgba(255,255,255,0.08);
  margin-bottom:2px;
 }
 .state-title{font-size:18px;font-weight:800;letter-spacing:-0.02em;color:var(--ink-100);line-height:1.1}
 .state-body{font-size:13px;font-weight:500;color:var(--ink-60);line-height:1.45;max-width:300px}
 .state-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:2px}
 .state-actions .btn{min-height:36px}
 .queued-pill{
  display:flex;align-items:center;gap:8px;
  width:100%;max-width:360px;
  background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);
  border-radius:12px;padding:10px 12px;
  text-align:left;
 }
 .skel-grid{ display:grid; gap:8px; width:100%; max-width:520px; margin:0 auto}
 /* reduced motion — probe requires this */
 @media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
   animation-duration:0.01ms !important;
   animation-iteration-count:1 !important;
   transition-duration:0.01ms !important;
  }
 }
</style>
</head>
<body>
<div class="device">
 <div class="stage-shell">
  <div class="stage" data-stage></div>
 </div>
</div>
<script type="module">
import { createOS } from '/os/shared/core.js';
import { hardenGaze } from '/os/shared/lab.js';
const stage = document.querySelector('[data-stage]');
const device = document.querySelector('.device');
const os = createOS(stage, { dwell:true, dwellMs:350 });
stage.appendChild(os.statusbar('<span style="color:var(--ink-60);font-size:11px;letter-spacing:0.04em;font-weight:700">Camera · 12 MP</span>'));

const h = (tag, attrs={}, ...children)=>{
 const el=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs)){
  if(k==='class') el.className=v;
  else if(k==='html') el.innerHTML=v;
  else if(v!==null && v!==undefined) el.setAttribute(k,v);
 }
 for(const c of children){
  if(c==null) continue;
  if(typeof c==='string') el.appendChild(document.createTextNode(c));
  else el.appendChild(c);
 }
 return el;
};

// dev controls outside stage
const edgeRow = h('div', {class:'dev-controls', role:'toolbar', 'aria-label':'Camera edge state controls'});
const edgeStates = [
 {id:'normal', label:'Normal'},
 {id:'empty', label:'Empty'},
 {id:'loading', label:'Loading'},
 {id:'error', label:'Error'},
 {id:'offline', label:'Offline'},
 {id:'permission', label:'No access'},
];
edgeStates.forEach(s=>{
 const b=h('button', {class:'chip', 'data-focusable':'', tabindex:'0', 'aria-label':`Show ${s.label} state`, 'data-state':s.id}, s.label);
 if(s.id==='normal') b.classList.add('active');
 b.addEventListener('click', ()=> setEdge(s.id));
 edgeRow.appendChild(b);
});
device.appendChild(edgeRow);

// viewport
const viewport = h('div', {class:'cam-viewport', id:'viewport'});
const stateLayer = h('div', {class:'state-layer', id:'stateLayer', 'aria-live':'polite'});
const dim = h('div', {class:'dim', id:'dim'});
const ctxSheet = h('div', {class:'ctx-sheet', id:'ctxSheet', role:'dialog', 'aria-label':'Capture options'});
ctxSheet.innerHTML = `
 <div class="sheet-drag" aria-hidden="true"></div>
 <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
  <div class="sheet-title">Quick actions</div>
  <span class="caption " style="color:var(--ink-40);font-size:10px;letter-spacing:0.04em">Long-press for options</span>
 </div>
 <div style="background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px">
  <div style="width:36px;height:36px;border-radius:8px;flex:none;background:linear-gradient(135deg,#ff8a6b 0%, #d4232a 100%);display:grid;place-items:center;color:white">
   <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="2.2" stroke="white" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="white" stroke-width="1.6"/><circle cx="12" cy="12" r="1.2" fill="white"/></svg>
  </div>
  <div style="flex:1;min-width:0">
   <div style="font-size:12px;font-weight:700;color:var(--ink-100)">Last capture · Golden Gate</div>
   <div style="font-size:11px;font-weight:500;color:var(--ink-60)">12 MP · Today 8:14 · Gallery</div>
  </div>
  <span class="caption" style="background:rgba(255,255,255,0.08);padding:4px 8px;border-radius:999px">stub</span>
 </div>
 <div class="sheet-row">
  <button class="btn primary" data-focusable tabindex="0" aria-label="Copy last photo (stub)">Copy last photo</button>
  <button class="btn" data-focusable tabindex="0" aria-label="Open Gallery (stub)">Open Gallery</button>
  <button class="btn ghost" data-focusable tabindex="0" aria-label="Close quick actions">Close</button>
 </div>
 <p class="caption" style="color:var(--ink-40);font-size:10px;text-align:center">Long-press context · swipe to switch Photo/Video · Space = shutter</p>
`;
stage.append(viewport, dim, ctxSheet, stateLayer);

// state
let mode = 'photo'; // photo | video
let gridOn = false;
let countdown = 'off'; // off | 3s | 5s
let recording = false;
let recStart = 0;
let recTimerId = null;
let captureCount = 0;
let edgeState = 'normal';
let isCounting = false;

// recent captures model
let recents = [
 { id:'r1', label:'Golden Gate', time:'8:14 AM', badge:'12 MP', tint:'#ff8a6b' },
 { id:'r2', label:'Lab notes', time:'9:02 AM', badge:'CAPTURE', tint:'#7ee0a6' },
 { id:'r3', label:'Walk · 12s', time:'7:31 AM', badge:'VIDEO', tint:'#a58bff' },
 { id:'r4', label:'Prism OS', time:'Yesterday', badge:'PNG', tint:'#56b8ff' },
];

// build viewfinder
const vfCard = h('div', {class:'vf-card', id:'vfCard', 'data-focusable':'', tabindex:'0', 'aria-label':'Viewfinder, long-press for options, swipe to switch Photo Video'});
const vfWorld = h('div', {class:'vf-world', 'aria-hidden':'true'});
const vfGrid = h('div', {class:'vf-grid', id:'vfGrid', 'aria-hidden':'true'});
for(let i=0;i<9;i++) vfGrid.appendChild(h('span', {'aria-hidden':'true'}));
const vfReticle = h('div', {class:'vf-reticle', id:'vfReticle', 'aria-hidden':'true'});
const vfFlash = h('div', {class:'vf-flash', id:'vfFlash', 'aria-hidden':'true'});
const vfCountdown = h('div', {class:'vf-countdown', id:'vfCountdown', 'aria-live':'polite'});
const vfTopbar = h('div', {class:'vf-topbar'});
const vfTimer = h('div', {class:'vf-timer ', id:'vfTimer', 'aria-live':'polite'});

// topbar left cluster: countdown + aspect
const leftCluster = h('div', {class:'vf-cluster'});
const countdownBtn = h('button', {class:'vf-chip', 'data-focusable':'', tabindex:'0', 'aria-label':'Countdown off, tap to cycle 3s 5s', id:'countdownBtn'});
const updateCountdownBtn = ()=>{
 const labels = {off:'Off', '3s':'3s', '5s':'5s'};
 countdownBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7.5" stroke="white" stroke-opacity="0.9" stroke-width="1.5"/><path d="M12 7v5l3 1.6" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> ${labels[countdown]}`;
 countdownBtn.classList.toggle('active', countdown!=='off');
 countdownBtn.setAttribute('aria-label', `Countdown ${labels[countdown]}, tap to change`);
};
updateCountdownBtn();
countdownBtn.addEventListener('click', (e)=>{
 e.stopPropagation();
 const order=['off','3s','5s'];
 const idx=order.indexOf(countdown);
 countdown=order[(idx+1)%order.length];
 updateCountdownBtn();
 os.banner(countdown==='off' ? '<strong>Countdown off</strong><span class="caption">tap shutter to capture instantly</span>' : `<strong>Countdown ${countdown}</strong><span class="caption">shutter will wait ${countdown}</span>`, {timeout:1800});
});

const aspectBtn = h('button', {class:'vf-chip', 'data-focusable':'', tabindex:'0', 'aria-label':'Aspect 4:3'}, '4:3');
aspectBtn.addEventListener('click', (e)=>{ e.stopPropagation(); os.banner('<strong>4:3 · 12 MP</strong><span class="caption">aspect locked · stub</span>',{timeout:1600}); });

leftCluster.append(countdownBtn, aspectBtn);

// right cluster: grid + flash
const rightCluster = h('div', {class:'vf-cluster'});
const gridBtn = h('button', {class:'vf-chip', 'data-focusable':'', tabindex:'0', 'aria-label':'Grid off, tap to show 3 by 3', id:'gridBtn'});
gridBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="1.6" stroke="white" stroke-width="1.4"/><path d="M9.5 3.5v17M14.5 3.5v17M3.5 9.5h17M3.5 14.5h17" stroke="white" stroke-opacity="0.9" stroke-width="1.2"/></svg> Grid`;
gridBtn.addEventListener('click', (e)=>{
 e.stopPropagation();
 gridOn=!gridOn;
 vfGrid.classList.toggle('on', gridOn);
 gridBtn.classList.toggle('active', gridOn);
 gridBtn.setAttribute('aria-label', gridOn ? 'Grid on, tap to hide' : 'Grid off, tap to show 3 by 3');
 if(gridOn) os.banner('<strong>Grid on</strong><span class="caption">3×3 composition guide</span>',{timeout:1400});
});
const flashBtn = h('button', {class:'vf-chip', 'data-focusable':'', tabindex:'0', 'aria-label':'Flash auto'}, 'Auto');
flashBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/></svg> Auto`;
flashBtn.addEventListener('click', (e)=>{ e.stopPropagation(); os.banner('<strong>Flash auto</strong><span class="caption">world scrim adapts · stub</span>',{timeout:1500}); });
rightCluster.append(gridBtn, flashBtn);

vfTopbar.append(leftCluster, rightCluster);

// timer center for video/recording
vfTimer.innerHTML = `<span class="dot rec" aria-hidden="true"></span><span id="timerText" class="tabular">00:00</span><span class="caption" style="color:var(--ink-60)">REC · 12 MP</span>`;
vfCard.append(vfWorld, vfGrid, vfReticle, vfFlash, vfCountdown, vfTopbar, vfTimer);

// bottom meta inside vf
const vfBottom = h('div', {class:'vf-bottom'});
const bottomLeft = h('div', {class:'vf-meta-pill'});
bottomLeft.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="white" stroke-opacity="0.9" stroke-width="1.5"/><circle cx="12" cy="12" r="7.5" stroke="white" stroke-opacity="0.55" stroke-width="1.2"/><circle cx="12" cy="12" r="1.2" fill="white"/></svg> <strong>AF</strong> <span class="sep" aria-hidden="true"></span> <span class="tabular">12 MP</span>`;
const bottomRight = h('div', {class:'vf-meta-pill'});
bottomRight.innerHTML = `<span class="tabular">f/1.8</span> <span class="sep"></span> <span class="tabular">1/120</span> <span class="dot ok" style="width:6px;height:6px;background:var(--ok);box-shadow:0 0 6px rgba(76,212,124,0.5)"></span>`;
vfBottom.append(bottomLeft, bottomRight);
vfCard.appendChild(vfBottom);

viewport.appendChild(vfCard);

// controls stack below viewfinder
const controlsStack = h('div', {class:'controls-stack'});

const modeSwitch = h('div', {class:'mode-switch', role:'tablist', 'aria-label':'Camera mode'});
const photoBtn = h('button', {class:'mode-btn', role:'tab', 'data-focusable':'', tabindex:'0', 'aria-selected':'true', 'aria-label':'Photo mode', 'data-mode':'photo'}, 'Photo');
const videoBtn = h('button', {class:'mode-btn', role:'tab', 'data-focusable':'', tabindex:'0', 'aria-selected':'false', 'aria-label':'Video mode', 'data-mode':'video'}, 'Video');
modeSwitch.append(photoBtn, videoBtn);
const modeHint = h('div', {class:'mode-hint'}, 'Swipe ←→ to switch · Space = shutter');

function setMode(newMode){
 if(newMode===mode) return;
 mode=newMode;
 const isVideo = mode==='video';
 photoBtn.setAttribute('aria-selected', String(!isVideo));
 videoBtn.setAttribute('aria-selected', String(isVideo));
 // update shutter appearance? Keep same halo but label
 shutterBtn.classList.toggle('recording', isVideo && recording);
 shutterIconWrap(); // update
 // show/hide video timer
 vfTimer.classList.toggle('on', isVideo && recording);
 // update meta pill text? keep
 // reticle subtle change
 vfReticle.classList.toggle('focus', isVideo);
 // banner
 os.banner(isVideo ? '<strong>Video</strong><span class="caption">12 MP · swipe or tap Photo to switch</span>' : '<strong>Photo</strong><span class="caption">12 MP · 4:3 · Space to capture</span>',{timeout:1600});
 // animate mode switch with prism-ease
 if(!os.state.reducedMotion){
  modeSwitch.animate([{transform:'scale(0.98)'},{transform:'scale(1)'}],{duration:220,easing:'cubic-bezier(0.32,0.72,0,1)'});
 }
 // update shutter label
 shutterLabel.textContent = isVideo ? (recording ? 'Stop' : 'Record') : 'Shutter';
 // reset recording if switching from video to photo while recording? stop
 if(!isVideo && recording){
  stopRecording();
 }
}
photoBtn.addEventListener('click', ()=> setMode('photo'));
videoBtn.addEventListener('click', ()=> setMode('video'));

// shutter row
const shutterRow = h('div', {class:'shutter-row'});
const leftSide = h('div', {class:'shutter-side left'});
const thumbPreviewBtn = h('button', {class:'thumb-preview', 'data-focusable':'', tabindex:'0', 'aria-label':'Open last capture Golden Gate 8:14', id:'thumbPreview'});
thumbPreviewBtn.innerHTML = `<div class="thumb-fallback" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="13" rx="2.4" stroke="white" stroke-width="1.4"/><circle cx="9" cy="10" r="1.4" fill="white"/><path d="M3.8 15.4l5-4.2 3.4 2.8 3.2-2.2 4.1 3.4" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
leftSide.appendChild(thumbPreviewBtn);
const leftStack = h('div', {class:'side-stack'});
leftStack.innerHTML = `<span class="side-label">Last</span><span style="font-size:11px;font-weight:700;color:var(--ink-80);line-height:1">8:14 AM</span>`;
leftSide.appendChild(leftStack);

const shutterWrap = h('div', {class:'shutter-wrap', id:'shutterWrap'});
const shutterHalo = h('div', {class:'shutter-halo', 'aria-hidden':'true'});
const shutterBtn = h('button', {class:'shutter-btn', 'data-focusable':'', tabindex:'0', 'aria-label':'Capture photo, press Space or tap', id:'shutterBtn'});
const shutterIcon = h('span', {class:'shutter-icon', 'aria-hidden':'true'});
const shutterRing = h('span', {class:'shutter-ring', 'aria-hidden':'true'});
const shutterLabelEl = h('span', {class:'shutter-label ', id:'shutterLabel'}, 'Shutter');
shutterBtn.append(shutterIcon, shutterRing);
shutterWrap.append(shutterHalo, shutterBtn, shutterLabelEl);
const shutterLabel = shutterLabelEl;

function shutterIconWrap(){
 // update aria-label based on mode
 if(mode==='video'){
  shutterBtn.setAttribute('aria-label', recording ? 'Stop recording, press Space or tap' : 'Start recording video, press Space or tap');
 } else {
  shutterBtn.setAttribute('aria-label', 'Capture photo, press Space or tap');
 }
}
shutterIconWrap();

const rightSide = h('div', {class:'shutter-side right'});
const rightStack = h('div', {class:'side-stack right'});
rightStack.innerHTML = `<span class="side-label">12 MP</span><span style="font-size:11px;font-weight:700;color:var(--ink-80);line-height:1">4:3 · HDR</span>`;
const flipBtn = h('button', {class:'thumb-preview', 'data-focusable':'', tabindex:'0', 'aria-label':'Flip camera front back', style:'width:38px;height:38px;border-radius:999px;background:rgba(255,255,255,0.07);backdrop-filter:blur(8px)'});
flipBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 8l4 4-4 4" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12H8" stroke="white" stroke-width="1.6" stroke-linecap="round"/><path d="M8 16L4 12l4-4" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12h6" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>`;
rightSide.append(rightStack, flipBtn);

shutterRow.append(leftSide, shutterWrap, rightSide);

controlsStack.append(modeSwitch, modeHint, shutterRow);
viewport.appendChild(controlsStack);

// strip
const stripWrap = h('div', {class:'strip-wrap'});
const stripHead = h('div', {class:'strip-head'});
stripHead.innerHTML = `<span class="strip-title">Recents</span><span class="strip-count " id="stripCount">4 captures</span>`;
const recentStrip = h('div', {class:'recent-strip', id:'recentStrip', role:'list', 'aria-label':'Recent captures'});
stripWrap.append(stripHead, recentStrip);
viewport.appendChild(stripWrap);

function renderRecents(){
 recentStrip.innerHTML='';
 recents.forEach((r)=>{
  const btn=h('button', {class:'recent-thumb', 'data-focusable':'', tabindex:'0', role:'listitem', 'aria-label':`${r.label}, ${r.time}, ${r.badge}`});
  const tints = {
   '#ff8a6b':'linear-gradient(135deg,#ff8a6b 0%, #d4232a 55%, #1a2a44 100%)',
   '#7ee0a6':'linear-gradient(135deg,#7ee0a6 0%, #1e6b4a 100%)',
   '#a58bff':'linear-gradient(135deg,#a58bff 0%, #6a4bff 100%)',
   '#56b8ff':'linear-gradient(135deg,#56b8ff 0%, #0b5ed7 100%)'
  };
  const bg = tints[r.tint] || tints['#56b8ff'];
  btn.innerHTML = `
   <div class="thumb-img" style="background:${bg}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.4" stroke="white" stroke-opacity="0.9" stroke-width="1.4"/><circle cx="9" cy="10" r="1.35" fill="white"/><path d="M3.8 15.4l5-4.2 3.4 2.8 3.2-2.2 4.1 3.4" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
   </div>
   <div class="thumb-meta">
    <span class="thumb-time ">${r.time.split(' ')[0]}</span>
    <span class="thumb-badge">${r.badge}</span>
   </div>
  `;
  btn.addEventListener('click', ()=>{
   os.banner(`<strong>${r.label}</strong><span class="caption">${r.time} · ${r.badge} · opened</span>`,{timeout:1800});
   // subtle pop
   btn.animate([{transform:'scale(0.96)'},{transform:'scale(1)'}],{duration:200,easing:'cubic-bezier(0.32,0.72,0,1)'});
  });
  recentStrip.appendChild(btn);
 });
 const cnt=document.getElementById('stripCount');
 if(cnt) cnt.textContent = `${recents.length} captures`;
 thumbPreviewBtn.setAttribute('aria-label', `Open last capture ${recents[0]?.label || ''} ${recents[0]?.time || ''}`);
}
renderRecents();

flipBtn.addEventListener('click', ()=>{
 os.banner('<strong>Front camera</strong><span class="caption">flipped · world scrim stays</span>',{timeout:1600});
 // subtle world shift
 vfWorld.animate([{filter:'brightness(1)'},{filter:'brightness(1.08)'},{filter:'brightness(1)'}],{duration:320,easing:'cubic-bezier(0.32,0.72,0,1)'});
});
thumbPreviewBtn.addEventListener('click', ()=>{
 const r=recents[0];
 if(r) os.banner(`<strong>${r.label}</strong><span class="caption">${r.time} · preview</span>`,{timeout:1800});
});

// capture logic
function formatTime(d){
 return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
function doCapture(){
 if(edgeState!=='normal'){
  if(edgeState==='permission'){
   os.banner('<strong>Camera blocked</strong><span class="caption">allow access to capture</span>',{timeout:2000});
  } else if(edgeState==='offline'){
   // queue
   const at=formatTime(new Date());
   recents.unshift({id:'q'+Date.now(), label:'Queued', time:at, badge:'QUEUED', tint:'#56b8ff'});
   renderRecents();
   const thumb=recentStrip.firstElementChild;
   if(thumb){ thumb.classList.add('is-new'); setTimeout(()=> thumb.classList.remove('is-new'), 600); }
   os.banner('<strong>Queued offline</strong><span class="caption">will save when back online · queued</span>',{timeout:2200});
   return;
  } else if(edgeState==='error'){
   os.banner('<strong>Camera error</strong><span class="caption">PR-CAM-503 · tap Retry</span>',{timeout:2000});
   return;
  } else if(edgeState==='empty'){
   // after empty, take first photo
  }
  // for error/permission/loading etc, don't do flash
  if(edgeState==='loading') return;
 }
 if(mode==='video'){
  if(recording) stopRecording();
  else startRecording();
  return;
 }
 // photo mode with optional countdown
 if(countdown!=='off' && !isCounting){
  startCountdownThenCapture();
 } else {
  flashAndSave();
 }
}
function startCountdownThenCapture(){
 isCounting=true;
 shutterBtn.setAttribute('disabled','true');
 const secs = countdown==='3s' ? 3 : 5;
 let n=secs;
 vfCountdown.classList.add('on');
 vfCountdown.innerHTML=`<span class="count-num " id="countNum">${n}</span>`;
 vfReticle.classList.add('focus');
 const tick=()=>{
  if(n<=0){
   vfCountdown.classList.remove('on');
   vfReticle.classList.remove('focus');
   isCounting=false;
   shutterBtn.removeAttribute('disabled');
   flashAndSave();
   return;
  }
  const el=document.getElementById('countNum');
  if(el){
   el.textContent=n;
   el.style.animation='none';
   // force reflow
   void el.offsetWidth;
   el.style.animation='countPop 320ms var(--ease-prism) both';
  }
  // announce
  vfTimer.classList.add('on');
  vfTimer.querySelector('#timerText').textContent = `00:0${n}`;
  n--;
  setTimeout(tick, 720);
 };
 tick();
}
function flashAndSave(){
 // flash 220ms
 vfFlash.classList.add('on');
 shutterBtn.classList.add('photo-halo-pulse');
 shutterRing.classList.add('pulse');
 // haptic halo
 shutterWrap.classList.add('gaze-focus');
 // banner after tiny delay for realism
 setTimeout(()=>{
  vfFlash.classList.remove('on');
  shutterBtn.classList.remove('photo-halo-pulse');
  shutterRing.classList.remove('pulse');
  setTimeout(()=> shutterWrap.classList.remove('gaze-focus'), 220);
 }, 220);
 // save to recents
 captureCount++;
 const now=new Date();
 const at=formatTime(now);
 const newItem={id:'c'+Date.now(), label:`Capture ${captureCount}`, time:at, badge:'12 MP', tint:['#ff8a6b','#7ee0a6','#a58bff','#56b8ff'][captureCount%4]};
 recents.unshift(newItem);
 if(recents.length>6) recents.pop();
 renderRecents();
 const newest=recentStrip.firstElementChild;
 if(newest){
  newest.classList.add('is-new');
  setTimeout(()=> newest.classList.remove('is-new'), 620);
  if(!os.state.reducedMotion){
   newest.animate([{transform:'scale(0.92)', filter:'blur(6px)', opacity:'0'},{transform:'scale(1)', filter:'blur(0)', opacity:'1'}],{duration:320,easing:'cubic-bezier(0.32,0.72,0,1)'});
  }
 }
 // thumb preview update
 thumbPreviewBtn.animate([{transform:'scale(0.96)'},{transform:'scale(1)'}],{duration:260,easing:'cubic-bezier(0.32,0.72,0,1)'});
 // banner
 os.banner(`<strong>Captured · ${at}</strong><span class="caption">12 MP · saved to Gallery · ${captureCount} today</span>`,{timeout:2200});
 // reticle flash
 vfReticle.classList.add('focus');
 setTimeout(()=> vfReticle.classList.remove('focus'), 420);
}

function startRecording(){
 recording=true;
 recStart=Date.now();
 shutterBtn.classList.add('recording');
 shutterWrap.classList.add('recording');
 shutterLabel.textContent='Stop';
 vfTimer.classList.add('on');
 // subtle red scrim
 vfCard.style.outlineColor='rgba(255,93,93,0.28)';
 os.banner('<strong>Recording · 12 MP</strong><span class="caption">tap Stop or press Space 00:00</span>',{timeout:1800});
 recTimerId=setInterval(()=>{
  const elapsed=Math.floor((Date.now()-recStart)/1000);
  const mm=String(Math.floor(elapsed/60)).padStart(2,'0');
  const ss=String(elapsed%60).padStart(2,'0');
  const t=document.getElementById('timerText');
  if(t) t.textContent=`${mm}:${ss}`;
 }, 500);
}
function stopRecording(){
 recording=false;
 shutterBtn.classList.remove('recording');
 shutterWrap.classList.remove('recording');
 shutterLabel.textContent='Record';
 vfCard.style.outlineColor='';
 if(recTimerId){ clearInterval(recTimerId); recTimerId=null; }
 const elapsed=Math.floor((Date.now()-recStart)/1000);
 const mm=String(Math.floor(elapsed/60)).padStart(2,'0');
 const ss=String(elapsed%60).padStart(2,'0');
 // save video thumbnail
 captureCount++;
 const now=new Date();
 const at=formatTime(now);
 recents.unshift({id:'v'+Date.now(), label:`Video ${captureCount}`, time:at, badge:`${mm}:${ss}`, tint:'#a58bff'});
 if(recents.length>6) recents.pop();
 renderRecents();
 const newest=recentStrip.firstElementChild;
 if(newest) newest.classList.add('is-new');
 os.banner(`<strong>Video saved · ${mm}:${ss}</strong><span class="caption">12 MP · Gallery · queued if offline</span>`,{timeout:2200});
 vfTimer.classList.remove('on');
 // halo pulse
 shutterWrap.animate([{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:320,easing:'cubic-bezier(0.32,0.72,0,1)'});
}

// shutter interactions
shutterBtn.addEventListener('click', (e)=>{
 e.stopPropagation();
 doCapture();
});
shutterBtn.addEventListener('keydown', (e)=>{
 if(e.key==='Enter' || e.key===' '){ e.preventDefault(); doCapture(); }
});
thumbPreviewBtn.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); thumbPreviewBtn.click(); }});

// Space capture via core bus
os.on('capture', ()=> doCapture());
os.on('shutter', ()=> { /* duplicate guard - core emits both, but doCapture already via capture */ });

// swipe to switch mode
os.on('swipeleft', ()=>{
 if(edgeState!=='normal') return;
 // swipeleft => next mode (Video if currently Photo)
 if(mode==='photo') setMode('video');
 else setMode('photo');
});
os.on('swiperight', ()=>{
 if(edgeState!=='normal') return;
 if(mode==='video') setMode('photo');
 else setMode('video');
});

// long-press context stub (500ms)
let pressTimer=null;
let longPressed=false;
vfCard.addEventListener('pointerdown', (e)=>{
 longPressed=false;
 pressTimer=setTimeout(()=>{
  longPressed=true;
  openCtx();
  // haptics
  vfCard.animate([{transform:'scale(0.985)'},{transform:'scale(1)'}],{duration:220,easing:'cubic-bezier(0.32,0.72,0,1)'});
 }, 520);
});
vfCard.addEventListener('pointerup', ()=>{
 clearTimeout(pressTimer);
 if(longPressed) { /* consumed */ }
});
vfCard.addEventListener('pointerleave', ()=> clearTimeout(pressTimer));
vfCard.addEventListener('pointercancel', ()=> clearTimeout(pressTimer));
vfCard.addEventListener('click', (e)=>{
 // if not long press, treat as tap to focus reticle
 if(longPressed){ longPressed=false; return; }
 if(e.target.closest('button')) return;
 // tap viewfinder -> focus pulse
 vfReticle.classList.add('focus');
 setTimeout(()=> vfReticle.classList.remove('focus'), 520);
 vfCard.animate([{transform:'scale(0.995)'},{transform:'scale(1)'}],{duration:220,easing:'cubic-bezier(0.32,0.72,0,1)'});
});
function openCtx(){
 dim.classList.add('on');
 ctxSheet.classList.add('on');
 ctxSheet.querySelectorAll('[data-focusable],button').forEach(b=> b.setAttribute('tabindex','0'));
}
function closeCtx(){
 dim.classList.remove('on');
 ctxSheet.classList.remove('on');
}
dim.addEventListener('click', closeCtx);
ctxSheet.querySelectorAll('button').forEach(b=>{
 b.addEventListener('click', ()=>{
  const t=b.textContent.trim();
  if(t.includes('Close')){
   closeCtx();
  } else if(t.includes('Copy')){
   closeCtx();
   os.banner('<strong>Copied</strong><span class="caption">last photo · clipboard stub</span>',{timeout:1600});
  } else if(t.includes('Gallery')){
   closeCtx();
   os.banner('<strong>Gallery opened</strong><span class="caption">demo · stub</span>',{timeout:1600});
  }
 });
});
stage.addEventListener('keydown', (e)=>{
 if(e.key==='Escape' && ctxSheet.classList.contains('on')){
  e.preventDefault();
  closeCtx();
 }
});

 if(id==='error'){

  stateLayer.classList.add('on');
  stateLayer.style.display='block';
  stateLayer.innerHTML = `

      <span class="dot bad" aria-hidden="true"></span><span class="caption " style="color:var(--ink-60)">PR-CAM-503 · 9:41 AM</span><span class="caption" style="margin-left:auto;color:var(--ink-40)">retry · 12s</span>
     </div>

  `;

   card.innerHTML = `<div style="display:grid;gap:10px;width:100%;justify-items:center;padding:8px 0"><div class="skeleton" style="width:64px;height:64px;border-radius:18px"></div><div class="skeleton" style="width:62%;height:16px;border-radius:8px"></div><div class="skeleton" style="width:78%;height:12px;border-radius:6px"></div><div class="skeleton" style="width:100%;height:56px;border-radius:12px;margin-top:6px"></div></div>`;

 if(id==='offline'){

     // keep offline flag? We'll stay in normal but next capture will queue if we set edge back to offline manually. Instead stay dim? For usability, close overlay but indicate offline by banner.

   });

  return;
 }
 if(id==='permission'){

  stateLayer.querySelectorAll('button').forEach(b=>{

    if(label==='Allow camera'){
     b.textContent='Allowing…';
     setTimeout(()=>{ setEdge('normal'); os.banner('<strong>Camera allowed</strong><span class="caption">world scrim ready · 12 MP</span>',{timeout:2000}); b.textContent='Allow camera'; }, 700);

     setEdge('normal');
     os.banner('<strong>Camera still blocked</strong><span class="caption">recents only</span>',{timeout:1800});

 }
}
window.__setCameraEdge = setEdge;
window.__doCapture = doCapture;
window.__setCameraMode = setMode;

// keyboard: arrows also switch mode for accessibility (already core maps arrows to swipe)

stage.appendChild(os.cursor);

hardenGaze();
