<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Settings</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
 .stage{
  background:
   radial-gradient(120% 90% at 50% 14%, rgba(42,53,80,0.56) 0%, rgba(20,26,40,0.72) 36%, rgba(10,14,23,0.90) 70%),
   radial-gradient(68% 46% at 78% 86%, rgba(86,184,255,0.09), transparent 56%),
   rgba(6,10,16,0.76);
 }
 .stage-shell{
  position:relative;
  width:600px;height:600px;
  display:grid;place-items:center;
  flex:none;
 }
 /* DEV CHROME — fixed OUTSIDE .stage */
 .dev-controls{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;gap:6px;
  z-index:1000;
  justify-content:center;
  flex-wrap:wrap;
  pointer-events:none;
  padding:8px 12px;
  border-radius:var(--r-pill);
  background:rgba(10,15,23,0.74);
  outline:1px solid var(--stroke-glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 24px rgba(0,0,0,0.32);
  max-width:92vw;
 }
 .stage .dev-controls{display:none !important}
 .dev-controls .chip{
  pointer-events:auto;
  height:26px;padding:0 10px;
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  transition:background var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
  border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
 }
 .dev-controls .chip.active{
  background:linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#051423;outline-color:transparent;
 }
 .dev-controls .chip:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .dev-controls .chip.gaze-focus{transform:scale(1.04)}

 /* layout */
 .set-viewport{
  position:absolute;
  inset:44px 0 0 0;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px 12px 14px 12px;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:none;
 }
 .set-viewport::-webkit-scrollbar{display:none}

 .set-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  animation: rise-in 260ms var(--ease-prism) both;
  padding:2px 2px 0 2px;
 }
 .set-title{
  font-size:22px;font-weight:800;letter-spacing:-0.03em;line-height:1;color:var(--ink-100);
 }
 .set-subtitle{
  font-size:11px;font-weight:600;letter-spacing:0.04em;color:var(--ink-60);line-height:1;margin-top:4px;display:flex;align-items:center;gap:6px;
 }
 .set-subtitle .dot{width:6px;height:6px}
 .header-actions{display:flex;gap:6px;align-items:center;flex:none}
 .hdr-chip{
  appearance:none;-webkit-appearance:none;border:none;
  height:28px;padding:0 11px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  background:rgba(255,255,255,0.08);outline:1px solid rgba(255,255,255,0.07);color:var(--ink-80);
  transition: transform 260ms var(--ease-prism), background 160ms var(--ease-prism), outline-color 160ms var(--ease-prism);
 }
 .hdr-chip.primary{background:linear-gradient(180deg, var(--accent), var(--accent-strong));color:#051423;outline-color:transparent;box-shadow:0 6px 14px rgba(16,92,180,0.22)}
 .hdr-chip.gaze-focus{transform:scale(1.04)}
 .hdr-chip:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}

 /* search */
 .search-wrap{
  position:relative;
  animation: rise-in 260ms var(--ease-prism) both;
  animation-delay:30ms;
 }
 .search-field{
  width:100%;
  height:36px;
  border-radius:999px;
  border:none;
  background:rgba(255,255,255,0.06);
  outline:1px solid rgba(255,255,255,0.07);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:0 12px 0 34px;
  color:var(--ink-80);
  font-size:13px;font-weight:500;letter-spacing:0.01em;
  font-family:var(--font);
 }
 .search-field::placeholder{color:var(--ink-40)}
 .search-field:focus{outline:1.5px solid var(--stroke-focus);background:rgba(255,255,255,0.08);color:var(--ink-100)}
 .search-icon{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;display:grid;place-items:center;color:var(--ink-40);pointer-events:none;
 }
 .search-meta{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  display:inline-flex;align-items:center;gap:4px;
  height:22px;padding:0 8px;border-radius:999px;
  background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);
  font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-60);
 }

 /* groups */
 .group{
  display:flex;flex-direction:column;gap:6px;
  animation: rise-in 260ms var(--ease-prism) both;
 }
 .group:nth-of-type(1){animation-delay:50ms}
 .group:nth-of-type(2){animation-delay:80ms}
 .group:nth-of-type(3){animation-delay:110ms}
 .group:nth-of-type(4){animation-delay:140ms}
 .group:nth-of-type(5){animation-delay:170ms}
 .group-head{
  display:flex;align-items:center;gap:8px;
  padding:4px 4px 0 4px;
 }
 .group-label{
  font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-60);
 }
 .group-count{
  font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-40);
  background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);padding:3px 6px;border-radius:999px;
 }
 .group-line{flex:1;height:1px;background:rgba(255,255,255,0.06)}
 .group-card{
  background:var(--mat-glass);
  backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 12px 28px rgba(0,0,0,0.22);
  display:flex;flex-direction:column;
 }

 /* rows */
 .set-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 12px;
  cursor:pointer;
  position:relative;
  transition: background 160ms var(--ease-prism), transform 260ms var(--ease-prism);
  min-height:56px;
 }
 .set-row + .set-row{border-top:1px solid rgba(255,255,255,0.06)}
 .set-row:hover{background:rgba(255,255,255,0.04)}
 .set-row.gaze-focus{
  background:rgba(86,184,255,0.08);
  outline:2px solid var(--stroke-focus);
  outline-offset:-2px;
  z-index:1;
 }
 .set-row:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px;z-index:2}
 .set-row:active{transform:scale(0.99)}
 .row-icon{
  width:32px;height:32px;border-radius:10px;
  display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,0.07);outline:1px solid rgba(255,255,255,0.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
  color:var(--ink-80);
 }
 .row-icon.accent{background:linear-gradient(180deg, var(--accent), var(--accent-strong));color:#04121f;outline-color:transparent;box-shadow:0 4px 12px rgba(16,92,180,0.22)}
 .row-icon.warm{background:linear-gradient(180deg,#ffb347 0%, #ff7a1a 100%);color:#1a0f00}
 .row-icon.ok{background:linear-gradient(180deg,#4cd47c 0%, #1a8a4a 100%);color:#fff}
 .row-icon.purple{background:linear-gradient(180deg,#a58bff 0%, #6a4bff 100%);color:#fff}
 .row-icon.slate{background:linear-gradient(180deg,#2b3242 0%, #161c28 100%);color:#fff}
 .row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
 .row-title{font-size:14px;font-weight:700;color:var(--ink-100);letter-spacing:-0.01em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .row-sub{font-size:11px;font-weight:500;color:var(--ink-60);letter-spacing:0.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .row-ctrl{flex:none;display:flex;align-items:center;gap:8px}
  .row-value{font-size:11px;font-weight:700;letter-spacing:0.02em;color:var(--ink-60);font-variant-numeric:tabular-nums;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);padding:6px 8px;border-radius:999px;min-width:42px;text-align:center}
 .row-value.accent{color:var(--accent);background:rgba(86,184,255,0.12);outline-color:rgba(86,184,255,0.18)}
 .row-chevron{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink-40);background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06)}
 .set-row.gaze-focus .row-chevron{color:var(--ink-80);background:rgba(86,184,255,0.14);outline-color:rgba(86,184,255,0.18)}
 /* slider row variant */
 .slider-row{
  flex-direction:column;align-items:stretch;gap:10px;
  padding:12px 12px 14px 12px;
  cursor:default;
 }
 .slider-row:hover{background:transparent}
 .slider-row.gaze-focus{background:rgba(86,184,255,0.06)}
 .slider-head{display:flex;align-items:center;gap:12px;width:100%}
 .slider-head .row-main{flex:1}
 .slider-track-wrap{
  display:flex;align-items:center;gap:10px;width:100%;
 }
 .slider-track{
  flex:1;position:relative;height:28px;display:flex;align-items:center;
 }
 .range{
  -webkit-appearance:none;appearance:none;
  width:100%;height:28px;background:transparent;cursor:pointer;
 }
 .range::-webkit-slider-runnable-track{
  height:6px;border-radius:999px;
  background:rgba(255,255,255,0.10);
  outline:1px solid rgba(255,255,255,0.06);
 }
 .range::-moz-range-track{height:6px;border-radius:999px;background:rgba(255,255,255,0.10)}
 .range::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:22px;height:22px;border-radius:50%;
  background:#fff;
  border:2px solid rgba(255,255,255,0.9);
  box-shadow:0 2px 8px rgba(0,0,0,0.32), 0 0 0 4px rgba(86,184,255,0.12);
  margin-top:-8px;
  transition:transform 160ms var(--ease-prism), box-shadow 160ms var(--ease-prism);
 }
 .range:active::-webkit-slider-thumb{transform:scale(1.06);box-shadow:0 4px 14px rgba(0,0,0,0.36), 0 0 0 6px rgba(86,184,255,0.16)}
 .range::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.32);
 }
 .range:focus-visible{outline:none}
 .range:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2.5px var(--stroke-focus), 0 2px 8px rgba(0,0,0,0.32)}
 .slider-fill{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  height:6px;border-radius:999px;
  background:linear-gradient(90deg, var(--accent), var(--accent-strong));
  pointer-events:none;
  box-shadow:0 0 8px rgba(86,184,255,0.32);
 }
 .slider-minmax{
  display:flex;justify-content:space-between;
  font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-40);
  padding:0 1px;
 }

 /* hint bar */
 .hintbar{
  position:absolute;left:12px;right:12px;bottom:12px;z-index:540;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:12px;
  background:rgba(0,0,0,0.38);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  outline:1px solid rgba(255,255,255,0.06);
  font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-60);line-height:1;
 }
 .hintbar strong{color:var(--ink-80);font-weight:700;letter-spacing:0.02em;text-transform:none;font-size:11px}
 .hint-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(86,184,255,0.6);flex:none;display:inline-block}

 /* detail sheet */
 .detail-sheet{
  position:absolute;inset:44px 0 0 0;z-index:560;
  display:none;flex-direction:column;
  background:var(--mat-sheet);
  backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  overflow:hidden;
  box-shadow:0 -12px 40px rgba(0,0,0,0.32);
 }
 .detail-sheet.on{display:flex;animation: sheet-in 300ms var(--ease-prism) both}
 @keyframes sheet-in{from{transform:translateY(36px) scale(0.97);opacity:0;filter:blur(8px)}to{transform:translateY(0) scale(1);opacity:1;filter:blur(0)}}
 .sheet-header{
  height:52px;flex:none;
  display:flex;align-items:center;gap:10px;
  padding:0 10px;
  border-bottom:1px solid rgba(255,255,255,0.07);
  background:linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
 }
 .sheet-back{
  appearance:none;-webkit-appearance:none;border:none;
  width:34px;height:34px;border-radius:999px;
  display:grid;place-items:center;
  background:rgba(255,255,255,0.08);outline:1px solid rgba(255,255,255,0.08);color:var(--ink-80);
  cursor:pointer;flex:none;
  transition: transform 260ms var(--ease-prism), background 160ms var(--ease-prism);
 }
 .sheet-back.gaze-focus{transform:scale(1.06);outline-color:var(--stroke-focus);background:rgba(255,255,255,0.12);color:var(--ink-100)}
 .sheet-back:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .sheet-title{font-size:14px;font-weight:800;letter-spacing:-0.01em;color:var(--ink-100);line-height:1}
 .sheet-sub{font-size:11px;font-weight:600;color:var(--ink-60);letter-spacing:0.02em;line-height:1;margin-top:2px}
 .sheet-scroll{
  flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  padding:14px 14px 16px 14px;
  display:flex;flex-direction:column;gap:14px;
 }
 .sheet-scroll::-webkit-scrollbar{display:none}
 .preview-card{
  background:var(--mat-glass);
  backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  border-radius:18px;
  padding:14px;
  display:flex;flex-direction:column;gap:12px;
  box-shadow:0 12px 28px rgba(0,0,0,0.22);
  position:relative;overflow:hidden;
 }
 .preview-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,0.04), transparent 54%);pointer-events:none;border-radius:inherit}
 .preview-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
 .preview-label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-60)}
  .preview-val{font-size:22px;font-weight:800;letter-spacing:-0.03em;color:var(--ink-100);font-variant-numeric:tabular-nums;line-height:1}
 .preview-val small{font-size:11px;font-weight:700;color:var(--ink-60);letter-spacing:0.06em;margin-left:2px}
 .preview-stage{
  height:112px;border-radius:14px;overflow:hidden;position:relative;
  background:radial-gradient(120% 90% at 50% 20%, rgba(42,53,80,0.9) 0%, rgba(20,26,40,0.96) 50%, rgba(10,14,23,1) 78%);
  outline:1px solid rgba(255,255,255,0.08);
  display:grid;place-items:center;
  transition: filter 260ms var(--ease-prism), background 260ms var(--ease-prism);
 }
 .preview-stage::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(80% 60% at 50% 30%, rgba(86,184,255,0.18), transparent 62%), linear-gradient(180deg, rgba(255,255,255,0.06), transparent 44%);
  pointer-events:none;
 }
 .preview-glass{
  position:relative;z-index:1;
  width:78%;height:64px;border-radius:16px;
  background:var(--mat-glass);backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  box-shadow:0 10px 24px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 14px;
  transition: opacity 260ms var(--ease-prism), transform 260ms var(--ease-prism);
 }
 .preview-glass strong{font-size:14px;font-weight:800;letter-spacing:-0.01em;color:var(--ink-100)}
 .preview-glass span{font-size:11px;font-weight:600;color:var(--ink-60)}
 .sheet-section-label{font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--ink-40);padding:0 2px}
 .sheet-card{
  background:var(--mat-glass);backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);border-radius:18px;overflow:hidden;
  box-shadow:0 12px 28px rgba(0,0,0,0.18);
 }
 .sheet-row{
  display:flex;align-items:center;gap:12px;padding:12px 12px;min-height:52px;
  transition: background 160ms var(--ease-prism);
 }
 .sheet-row + .sheet-row{border-top:1px solid rgba(255,255,255,0.06)}
 .sheet-row.gaze-focus{background:rgba(86,184,255,0.08);outline:2px solid var(--stroke-focus);outline-offset:-2px;z-index:1}
 .sheet-row:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .sheet-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,0.07);outline:1px solid rgba(255,255,255,0.07);color:var(--ink-80)}
 .sheet-main{flex:1;min-width:0}
 .sheet-main .row-title{font-size:13px}
 .sheet-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:4px 0}
 .sheet-actions .btn{min-height:38px;font-size:13px}

 /* state layer */
 .state-layer{
  position:absolute;inset:44px 0 0 0;z-index:520;
  display:none;overflow-y:auto;scrollbar-width:none;
  padding:12px 14px 14px 14px;
 }
 .state-layer::-webkit-scrollbar{display:none}
 .state-layer.on{display:block;animation: rise-in 260ms var(--ease-prism) both}
 .state-layer.dim-on{display:grid;place-items:center;padding:12px 14px;animation: rise-in 260ms var(--ease-prism) both}
 .state-card{
  width:100%;max-width:420px;
  background:var(--mat-raised);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  outline:1px solid var(--stroke-glass);border-radius:var(--r-lg);
  padding:24px 20px 18px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
  box-shadow:0 18px 44px rgba(0,0,0,0.36);animation: rise-in 260ms var(--ease-prism) both;position:relative;overflow:hidden;
 }
 .state-card::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 8%, rgba(86,184,255,0.08), transparent 62%);pointer-events:none}
 .state-illus{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.08);margin-bottom:2px;position:relative}
 .state-illus.danger{background:rgba(255,93,93,0.10);outline-color:rgba(255,93,93,0.18)}
 .state-illus.warn{background:rgba(255,194,71,0.10);outline-color:rgba(255,194,71,0.18)}
 .state-title{font-size:18px;font-weight:800;letter-spacing:-0.02em;color:var(--ink-100);line-height:1.1;position:relative}
 .state-body{font-size:13px;font-weight:500;color:var(--ink-60);line-height:1.45;max-width:300px;position:relative}
 .state-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:2px;position:relative}
 .state-actions .btn{min-height:36px;font-size:13px}
 .skel{border-radius:var(--r-sm);background: linear-gradient(100deg, rgba(255,255,255,0.06) 40%, rgba(255,255,255,0.14) 50%, rgba(255,255,255,0.06) 60%);background-size:200% 100%;animation: shimmer 1.2s linear infinite}
 button:focus-visible, [data-focusable]:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 @media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}
 }
</style>
</head>
<body>
<div class="device">
 <div class="stage-shell">
  <div class="stage" data-stage></div>
 </div>
</div>
<script type="module">
import { createOS } from '/os/shared/core.js';
const stage = document.querySelector('[data-stage]');
const device = document.querySelector('.device');
const os = createOS(stage, { dwell:true, dwellMs:350 });
stage.appendChild(os.statusbar('<span style="color:var(--ink-60);font-size:11px;letter-spacing:0.04em;font-weight:700">Settings · Prism</span>'));

const h = (tag, attrs={}, ...children)=>{
 const el=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs)){
  if(k==='class') el.className=v;
  else if(k==='html') el.innerHTML=v;
  else if(v!==null && v!==undefined) el.setAttribute(k,v);
 }
 for(const c of children){
  if(c==null) continue;
  if(typeof c==='string') el.appendChild(document.createTextNode(c));
  else el.appendChild(c);
 }
 return el;
};

// dev controls OUTSIDE stage

function makeToggle(initial, label){
 const t=h('div', {class:'toggle', role:'switch', 'aria-checked':String(initial), 'aria-label':label, tabindex:'0', 'data-focusable':''});
 t.addEventListener('click', (e)=>{
  e.stopPropagation();
  const on=t.getAttribute('aria-checked')==='true';
  t.setAttribute('aria-checked', String(!on));
  // update state mapping by label
  t.dispatchEvent(new CustomEvent('togglechange', {detail:{on:!on}}));
  os.banner(`<strong>${label} ${!on?'on':'off'}</strong><span class="caption">saved · ${!on?'enabled':'disabled'}</span>`,{timeout:1600});
  if(!os.state.reducedMotion) t.animate([{transform:'scale(0.96)'},{transform:'scale(1)'}],{duration:160,easing:'cubic-bezier(0.32,0.72,0,1)'});
 });
 t.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); t.click(); }});
 return t;
}

 function buildGroup(label, countLabel, rows){
  const g=h('div', {class:'group', role:'group', 'aria-label':label});
  const head=h('div', {class:'group-head'});
  head.innerHTML=`<span class="group-label">${label}</span><span class="group-count ">${countLabel}</span><span class="group-line" aria-hidden="true"></span>`;
  const card=h('div', {class:'group-card'});
  rows.forEach(r=> card.appendChild(r));
  g.append(head, card);
  return g;
 }

 // filtered empty hint (inline) if search yields zero groups? We'll simulate by hiding groups if searchQuery matches none
 if(filterActive && searchQuery){
  const q=searchQuery;
  // naive: if query not in any title substring, show banner already; but also hide groups not matching
  // We'll simply check each group card rows for title includes
  const groups=viewport.querySelectorAll('.group');
  let visibleGroups=0;
  groups.forEach(g=>{
   const titles=[...g.querySelectorAll('.row-title')].map(el=> el.textContent.toLowerCase());
   const match=titles.some(t=> t.includes(q)) || g.querySelector('.group-label').textContent.toLowerCase().includes(q);
   if(!match){ g.style.display='none'; } else { g.style.display=''; visibleGroups++; }
  });
  if(visibleGroups===0){
   const emptyInline=h('div', {class:'card', style:'padding:18px;display:grid;gap:8px;justify-items:center;text-align:center;background:var(--mat-glass);backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);outline:1px solid var(--stroke-glass);border-radius:18px;margin-top:2px'});

   emptyInline.querySelector('button').addEventListener('click', ()=>{ search.value=''; searchQuery=''; filterActive=false; renderSettings(); document.getElementById('searchInput')?.focus(); });
   viewport.appendChild(emptyInline);

function setEdge(id){

 edgeRow.querySelectorAll('.chip').forEach(c=> c.classList.toggle('active', c.dataset.state===id));

    <div style="width:100%;max-width:340px;display:grid;gap:10px;margin-top:4px;position:relative">
     <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:12px 14px">
      <span class="dot bad" aria-hidden="true"></span>
      <span style="font-size:13px;font-weight:600;color:var(--ink-80)">No network · changes queued</span>
      <span class="caption" style="margin-left:auto">offline</span>
     </div>
     <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn primary" data-focusable tabindex="0" aria-label="Retry connection">Retry</button>
      <button class="btn" data-focusable tabindex="0" aria-label="Use offline settings">Use offline</button>
     </div>
    </div>
   </div>
  `;
  stateLayer.querySelectorAll('button').forEach(b=>{
   b.addEventListener('click', ()=>{
    if(b.textContent.includes('Retry')){
     b.textContent='Retrying…';
     setTimeout(()=>{ os.banner('<strong>Still offline</strong><span class="caption">changes stay queued</span>',{timeout:1800}); b.textContent='Retry'; }, 800);
    } else { setEdge('normal'); os.banner('<strong>Offline mode</strong><span class="caption">queued · will sync later</span>',{timeout:1600}); }
   });
  });
  return;
 }
 if(id==='permission'){
  viewport.style.display='none';
  stateLayer.classList.add('on');
  stateLayer.style.display='block';
  stateLayer.innerHTML=`
   <div class="state-card">
    <div class="state-illus" aria-hidden="true">
     <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="5" y="9.5" width="14" height="10" rx="2.4" stroke="white" stroke-opacity="0.9" stroke-width="1.6"/><path d="M8.5 9.5V7.8a3.5 3.5 0 017 0v1.7" stroke="white" stroke-width="1.5"/><circle cx="12" cy="14.5" r="1.35" fill="white"/><path d="M12 15.85v1.6" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
    <div class="state-title">Permission needed</div>
    <div class="state-body">Prism needs system access to show Optics and Privacy. You can keep using the launcher without it — no dead ends.</div>
    <div class="state-actions">
     <button class="btn primary" data-focusable tabindex="0" aria-label="Allow access to settings">Allow access</button>
     <button class="btn ghost" data-focusable tabindex="0" aria-label="Not now">Not now</button>
    </div>
    <p class="caption" style="margin-top:2px;color:var(--ink-40)">Settings → Privacy → Prism · System</p>
    <div style="width:100%;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-top:4px;position:relative;text-align:left">
     <span class="dot warn" aria-hidden="true"></span>
     <span style="font-size:12px;font-weight:600;color:var(--ink-80)">System settings blocked</span>
     <button class="chip" data-focusable tabindex="0" aria-label="Open system settings" style="margin-left:auto;height:28px">Open Settings</button>
    </div>
   </div>
  `;
  stateLayer.querySelectorAll('button').forEach(b=>{
   b.addEventListener('click', ()=>{
    const t=b.textContent.trim();
    if(t==='Allow access' || t==='Open Settings'){
     b.textContent='Allowing…';
     setTimeout(()=>{ setEdge('normal'); os.banner('<strong>Access granted</strong><span class="caption">Optics & Privacy restored</span>',{timeout:1800}); }, 700);
    } else if(t==='Not now'){
     setEdge('normal');
     os.banner('<strong>Continuing without access</strong><span class="caption">allow later in Privacy</span>',{timeout:1600});
    }
   });
  });
  return;
 }
}
window.__setSettingsState=setEdge;

// initial
renderSettings();

// swipe handling
os.on('swipeleft', ()=>{
 if(detailSheet.classList.contains('on')) return;
 if(edgeState!=='normal') return;
 // swipeleft advances? For settings, map to scroll
 viewport.scrollBy({top:140, behavior:'smooth'});
});
os.on('swiperight', ()=>{
 if(detailSheet.classList.contains('on')){ closeSheet(); return; }
 if(edgeState!=='normal') return;
 viewport.scrollBy({top:-140, behavior:'smooth'});
});

os.on('capture', ()=>{
 if(edgeState==='normal' && !detailSheet.classList.contains('on')){
  // capture quick feedback
  os.banner('<strong>Shutter</strong><span class="caption">settings snapshot</span>',{timeout:1400});
 }
});

console.log('Prism Settings ready — 600x600');
</script>
</body>
</html>
