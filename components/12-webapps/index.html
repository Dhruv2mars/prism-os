<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Web Apps</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
/* ---------------------------------------------------------------------------
   Web Apps. Every surface below is driven by the real runtime in
   /os/shared/app-runtime.js: the frames are sandboxed, the prompts are raised
   by actual capability calls from third-party code, and the buttons install,
   suspend and kill for real. Nothing here is a depiction.

   Material ladder, in one place so it can be checked at a glance. The rule is
   that a surface earns the right to occlude the world in proportion to how
   committed it is. Fill rises, blur rises, brightness falls, monotonically:

     app canvas   0.34 fill · blur 12 · brightness 0.90   transient, world-first
     app chrome   0.52 fill · blur 20 · brightness 0.76   persistent while open
     sheet        0.78 fill · blur 34 · brightness 0.54   a decision, demands you
--------------------------------------------------------------------------- */

:root {
  --s: var(--a11y-scale, 1);
  /* Type scales all the way; space and icons do not. At 310% a linearly scaled
     layout spends the whole lens on padding and there is nowhere left to read. */
  --sp: min(var(--s), 1.5);
  --glyph: calc(26px * var(--sp));
}

.stage { background: transparent; }

.surface {
  position: absolute; inset: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  padding: calc(14px * var(--sp)) calc(16px * var(--sp)) calc(12px * var(--sp));
  gap: calc(10px * var(--sp));
  box-sizing: border-box;
  min-height: 0;
}

/* ---------- header ---------- */
.head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: calc(10px * var(--sp));
  min-width: 0;
}
.head h1 {
  margin: 0;
  font-size: calc(var(--fs-callout) * var(--s));
  font-weight: 640;
  letter-spacing: -0.01em;
  color: var(--ink-100);
  white-space: nowrap;
}
.head .count {
  font-size: calc(var(--fs-caption) * var(--s));
  color: var(--ink-60);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ---------- scroll region ---------- */
.main { min-height: 0; overflow: auto; scrollbar-width: thin; align-content: start; }
.main::-webkit-scrollbar { width: 4px; }
.main::-webkit-scrollbar-thumb { background: var(--ink-20); border-radius: 999px; }

/* ---------- launcher ---------- */
.list { display: grid; gap: calc(8px * var(--s)); align-content: start; }

.app-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: calc(11px * var(--sp));
  padding: calc(10px * var(--sp)) calc(12px * var(--sp));
  border-radius: var(--r-md);
  background: rgba(10, 15, 23, 0.52);
  backdrop-filter: saturate(1.3) blur(20px) brightness(0.76);
  -webkit-backdrop-filter: saturate(1.3) blur(20px) brightness(0.76);
  outline: 1px solid var(--stroke-glass);
  text-align: left;
  border: 0;
  color: inherit;
  font: inherit;
  width: 100%;
  box-sizing: border-box;
  cursor: pointer;
}
.app-row:focus-visible { outline: 2.5px solid var(--stroke-focus); outline-offset: 2px; }

.glyph {
  width: var(--glyph); height: var(--glyph);
  min-width: var(--glyph);
  border-radius: calc(8px * var(--sp));
  display: grid; place-items: center;
  font-size: calc(13px * var(--s));
  font-weight: 680;
  color: #08101a;
  background: var(--app-accent, var(--accent));
}
.app-name {
  font-size: calc(var(--fs-body) * var(--s));
  font-weight: 600;
  color: var(--ink-100);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.app-badge {
  font-size: calc(var(--fs-caption) * var(--s));
  color: var(--ink-60);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.run-dot {
  width: calc(7px * var(--sp)); height: calc(7px * var(--s));
  min-width: calc(7px * var(--sp));
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 calc(3px * var(--s)) rgba(76, 212, 124, 0.16);
}
.run-dot[data-suspended] { background: var(--ink-40); box-shadow: none; }
.run-dot[data-hidden] { visibility: hidden; }

/* Exactly one row is loud. The lead is whatever the wearer would resume — a
   running app, otherwise the first one — and every other row is a quiet index
   entry until gaze lands on it. A list of equals has no focal element, and on a
   600px monocular display that reads as noise. */
.app-row[data-lead] { padding: calc(14px * var(--s)) calc(12px * var(--s)); }
.app-row[data-lead] .glyph { --glyph: calc(38px * var(--s)); font-size: calc(18px * var(--s)); }
.app-row[data-lead] .app-name { font-size: calc(var(--fs-callout) * var(--s)); font-weight: 660; }

.app-row:not([data-lead]) {
  background: rgba(10, 15, 23, 0.34);
  backdrop-filter: saturate(1.15) blur(12px) brightness(0.90);
  -webkit-backdrop-filter: saturate(1.15) blur(12px) brightness(0.90);
}
.app-row:not([data-lead]) .app-name { color: var(--ink-80); font-weight: 560; }
.app-row:not([data-lead]) .app-badge { color: var(--ink-40); }
.app-row:not([data-lead]) .glyph { opacity: 0.62; }
.app-row:not([data-lead]).gaze-focus .glyph,
.app-row:not([data-lead]):hover .glyph { opacity: 1; }

/* ---------- running app ---------- */
/* The window is a frame, not a slab: it carries no fill of its own so the bar
   and the canvas each composite once against the world. Nesting two
   backdrop-filters would multiply them and quietly break the ladder. */
.window {
  display: grid;
  grid-template-rows: auto auto;
  border-radius: var(--r-md);
  overflow: hidden;
  outline: 1px solid var(--stroke-glass);
}
.win-bar {
  display: flex; align-items: center; gap: calc(8px * var(--s));
  padding: calc(7px * var(--sp)) calc(10px * var(--sp));
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  min-width: 0;
  background: rgba(10, 15, 23, 0.52);
  backdrop-filter: saturate(1.3) blur(20px) brightness(0.76);
  -webkit-backdrop-filter: saturate(1.3) blur(20px) brightness(0.76);
}
.win-title {
  font-size: calc(var(--fs-caption) * var(--s));
  font-weight: 620;
  color: var(--ink-80);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.win-origin {
  font-size: calc(var(--fs-caption) * var(--s));
  color: var(--ink-40);
  margin-left: auto;
  white-space: nowrap;
}
.canvas {
  position: relative;
  height: var(--app-h, 200px);
  transition: height var(--dur-base) var(--ease-prism);
  background: rgba(10, 15, 23, 0.34);
  backdrop-filter: saturate(1.15) blur(12px) brightness(0.90);
  -webkit-backdrop-filter: saturate(1.15) blur(12px) brightness(0.90);
}
.canvas iframe.app-frame {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border: 0;
  display: block;
}
.canvas[data-suspended]::after {
  content: "Paused";
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: calc(var(--fs-caption) * var(--s));
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--ink-60);
  background: rgba(6, 10, 16, 0.62);
  backdrop-filter: blur(3px);
}

/* ---------- messages (empty / error / offline / denied) ---------- */
:root[data-reduced-motion] .canvas { transition: none; }

.msg {
  display: grid; gap: calc(7px * var(--s));
  align-content: center; justify-items: start;
  height: 100%;
  padding: calc(4px * var(--sp)) calc(2px * var(--sp));
  max-width: 40ch;
}
.msg-icon {
  width: calc(28px * var(--sp)); height: calc(28px * var(--s));
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--msg-wash, var(--ink-10));
  color: var(--msg-ink, var(--ink-80));
  font-size: calc(14px * var(--s));
  font-weight: 700;
}
.msg h2 {
  margin: 0;
  font-size: calc(var(--fs-body) * var(--s));
  font-weight: 620;
  color: var(--ink-100);
}
.msg p {
  margin: 0;
  font-size: calc(var(--fs-caption) * var(--s));
  line-height: 1.45;
  color: var(--ink-60);
}

/* ---------- footer actions ---------- */
.foot { display: flex; gap: calc(6px * var(--s)); flex-wrap: wrap; align-items: center; }
.act {
  font: inherit;
  font-size: calc(var(--fs-caption) * var(--s));
  font-weight: 580;
  color: var(--ink-80);
  background: rgba(255, 255, 255, 0.08);
  outline: 1px solid var(--stroke-glass);
  border: 0;
  border-radius: var(--r-pill);
  padding: calc(6px * var(--sp)) calc(12px * var(--sp));
  min-height: calc(26px * var(--sp));
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-prism);
}
.act:hover { background: rgba(255, 255, 255, 0.14); }
.act:focus-visible { outline: 2.5px solid var(--stroke-focus); outline-offset: 2px; }
.act[data-primary] {
  color: var(--ink-100);
  background: var(--accent-wash);
  outline-color: rgba(86, 184, 255, 0.42);
}
.act[data-danger] { color: #ffc9c9; background: rgba(255, 93, 93, 0.14); outline-color: rgba(255, 93, 93, 0.34); }

/* ---------- permission sheet ---------- */
.scrim {
  position: absolute; inset: 0;
  background: rgba(4, 7, 12, 0.42);
  backdrop-filter: blur(2px);
  z-index: 40;
}
.sheet {
  position: absolute;
  left: calc(14px * var(--sp)); right: calc(14px * var(--s));
  bottom: calc(14px * var(--sp));
  max-height: calc(100% - 28px * var(--s));
  overflow: auto;
  z-index: 41;
  box-sizing: border-box;
  padding: calc(14px * var(--sp));
  border-radius: var(--r-lg);
  background: rgba(8, 12, 19, 0.78);
  backdrop-filter: saturate(1.35) blur(34px) brightness(0.54);
  -webkit-backdrop-filter: saturate(1.35) blur(34px) brightness(0.54);
  outline: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: 0 -18px 48px rgba(0, 0, 0, 0.5);
  display: grid;
  gap: calc(9px * var(--sp));
}
.sheet .ask {
  margin: 0;
  font-size: calc(var(--fs-body) * var(--s));
  font-weight: 640;
  line-height: 1.3;
  color: var(--ink-100);
}
.sheet .reason {
  margin: 0;
  font-size: calc(var(--fs-caption) * var(--s));
  line-height: 1.45;
  color: var(--ink-80);
}
.sheet .why {
  margin: 0;
  font-size: calc(var(--fs-caption) * var(--s));
  line-height: 1.45;
  color: var(--ink-60);
  padding-left: calc(9px * var(--sp));
  border-left: 2px solid var(--risk-ink, var(--ink-20));
}
.sheet .buttons { display: flex; gap: calc(8px * var(--s)); flex-wrap: wrap; }
.sheet .buttons .act { flex: 1 1 auto; min-width: calc(96px * var(--s)); text-align: center; justify-content: center; }

/* ---------- permission manager ---------- */
.perm-app { display: grid; gap: calc(6px * var(--s)); margin-bottom: calc(10px * var(--s)); }
.perm-app > h3 {
  margin: 0;
  font-size: calc(var(--fs-caption) * var(--s));
  font-weight: 640;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.perm-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: calc(8px * var(--sp));
  padding: calc(8px * var(--sp)) calc(11px * var(--sp));
  border-radius: var(--r-sm);
  background: rgba(10, 15, 23, 0.52);
  backdrop-filter: saturate(1.3) blur(20px) brightness(0.76);
  -webkit-backdrop-filter: saturate(1.3) blur(20px) brightness(0.76);
  outline: 1px solid var(--stroke-glass);
}
.perm-name { font-size: calc(var(--fs-caption) * var(--s)); color: var(--ink-100); font-weight: 580; }
.perm-why { font-size: calc(var(--fs-caption) * var(--s)); color: var(--ink-40); line-height: 1.35; }
.perm-state {
  font-size: calc(var(--fs-caption) * var(--s));
  font-weight: 620;
  padding: calc(3px * var(--sp)) calc(9px * var(--sp));
  border-radius: var(--r-pill);
  white-space: nowrap;
  border: 0; font-family: inherit; cursor: pointer;
}
/* Colour is never the only carrier: each state also reads as a word. */
.perm-state[data-state="granted"] { color: #bff3d1; background: rgba(76, 212, 124, 0.18); outline: 1px solid rgba(76,212,124,0.34); }
.perm-state[data-state="denied"]  { color: #ffc9c9; background: rgba(255, 93, 93, 0.14); outline: 1px solid rgba(255,93,93,0.30); }
.perm-state[data-state="prompt"]  { color: var(--ink-60); background: rgba(255,255,255,0.07); outline: 1px solid var(--stroke-glass); }
.perm-state:focus-visible { outline: 2.5px solid var(--stroke-focus); outline-offset: 2px; }

:root[data-reduced-motion] * { animation-duration: 1ms !important; transition-duration: 1ms !important; }
[hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="device">
    <div class="stage-shell">
      <div class="stage" data-stage></div>
    </div>
  </div>

<script type="module">
import { createOS } from '/os/shared/core.js';
import { mountLab } from '/os/shared/lab.js';
import { AppRuntime } from '/os/shared/app-runtime.js';
import { PERMISSIONS } from '/os/shared/app-manifest.js';

const stage = document.querySelector('[data-stage]');
const os = createOS(stage, { scale: 1 });

/* The surface is built once and mutated; the runtime is the only source of
   truth about what is installed, running, granted or offline. */
const surface = document.createElement('div');
surface.className = 'surface';
surface.innerHTML = `
  <div class="head">
    <h1 data-title>Web Apps</h1>
    <span class="count" data-count></span>
  </div>
  <div class="main" data-main></div>
  <div class="foot" data-foot></div>
`;
stage.appendChild(surface);

const titleEl = surface.querySelector('[data-title]');
const countEl = surface.querySelector('[data-count]');
const mainEl = surface.querySelector('[data-main]');
const footEl = surface.querySelector('[data-foot]');

const rt = new AppRuntime({ container: null });

/* view: 'launcher' | 'app' | 'permissions' | one of the edge states */
let view = 'launcher';
let page = 0;
let openId = null;
let lastError = null;

/* ---------- small builders ---------- */

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function action(label, onClick, kind) {
  const b = el('button', 'act', label);
  b.type = 'button';
  if (kind) b.setAttribute(`data-${kind}`, '');
  b.addEventListener('click', onClick);
  return b;
}

function setFoot(buttons) {
  footEl.textContent = '';
  buttons.filter(Boolean).forEach((b) => footEl.appendChild(b));
}

function message(icon, title, body, tone) {
  const wrap = el('div', 'msg');
  const i = el('div', 'msg-icon', icon);
  if (tone === 'danger') { i.style.setProperty('--msg-wash', 'rgba(255,93,93,0.16)'); i.style.setProperty('--msg-ink', '#ffc9c9'); }
  if (tone === 'warn') { i.style.setProperty('--msg-wash', 'rgba(255,194,71,0.16)'); i.style.setProperty('--msg-ink', '#ffdf9e'); }
  wrap.appendChild(i);
  wrap.appendChild(el('h2', null, title));
  wrap.appendChild(el('p', null, body));
  return wrap;
}

/* ---------- views ---------- */

function renderLauncher() {
  titleEl.textContent = 'Web Apps';
  const installed = [...rt.installed.values()];

  if (!installed.length) {
    mainEl.textContent = '';
    mainEl.appendChild(message('+', 'No apps installed',
      'Apps you add appear here. Each one runs sealed off from the system and from every other app.'));
    setFoot([action('Add the sample apps', () => installSamples(), 'primary')]);
    countEl.textContent = '';
    return;
  }

  /* Whatever the wearer would resume comes first and is the only loud thing. */
  const leadId = [...rt.instances.keys()][0] || installed[0].manifest.id;
  const byLead = [...installed].sort((a, b) =>
    (a.manifest.id === leadId ? -1 : 0) - (b.manifest.id === leadId ? -1 : 0));
  const ordered = byLead.slice(page % byLead.length).concat(byLead.slice(0, page % byLead.length));

  const list = el('div', 'list');
  for (const { manifest } of ordered) {
    const inst = rt.instances.get(manifest.id);
    const row = el('button', 'app-row');
    if (manifest.id === leadId) row.setAttribute('data-lead', '');
    row.type = 'button';
    row.setAttribute('data-focusable', '');
    row.setAttribute('aria-label', `${manifest.name}. ${inst ? (inst.status === 'suspended' ? 'Paused' : 'Running') : 'Not running'}.`);

    const g = el('div', 'glyph', manifest.glyph);
    if (manifest.accent) g.style.setProperty('--app-accent', manifest.accent);

    const mid = el('div');
    mid.style.minWidth = '0';
    mid.appendChild(el('div', 'app-name', manifest.name));
    mid.appendChild(el('div', 'app-badge', inst?.badge || manifest.badge || manifest.developer));

    const dot = el('div', 'run-dot');
    if (!inst) dot.setAttribute('data-hidden', '');
    else if (inst.status === 'suspended') dot.setAttribute('data-suspended', '');

    row.append(g, mid, dot);
    row.addEventListener('click', () => open(manifest.id));
    list.appendChild(row);
  }
  mainEl.textContent = '';
  mainEl.appendChild(list);

  const hidden = fitAbove(list);
  const running = rt.instances.size;
  countEl.textContent = running ? `${running} running` : `${installed.length} installed`;
  setFoot([
    hidden ? action(`${hidden} more`, () => { page += ordered.length - hidden; render(); }) : null,
    action('Permissions', () => { view = 'permissions'; render(); }),
    rt.instances.size ? action('Close all', () => { [...rt.instances.keys()].forEach((id) => rt.kill(id)); }, 'danger') : null,
  ]);
}

function renderApp() {
  const inst = rt.instances.get(openId);
  const entry = rt.installed.get(openId);
  titleEl.textContent = entry?.manifest.name || 'App';

  if (!inst) { view = 'launcher'; renderLauncher(); return; }

  if (inst.status === 'unresponsive') {
    mainEl.textContent = '';
    mainEl.appendChild(message('!', `${inst.manifest.name} did not start`,
      'The app never reported that it was ready. Nothing it was doing has been saved. You can wait a little longer or close it.', 'warn'));
    setFoot([
      action('Close app', () => { rt.kill(openId); view = 'launcher'; render(); }, 'primary'),
      action('Wait longer', () => { rt.kill(openId); rt.launch(openId); }),
      action('Back', () => { view = 'launcher'; render(); }),
    ]);
    countEl.textContent = 'Not responding';
    return;
  }

  /* Reuse the existing window node when possible: rebuilding it would reload
     the iframe, which would throw away the app's state on every re-render. */
  let win = mainEl.querySelector('.window');
  if (!win || win.getAttribute('data-app') !== openId) {
    mainEl.textContent = '';
    win = el('div', 'window');
    win.setAttribute('data-app', openId);
    const bar = el('div', 'win-bar');
    /* The header already names the app. This line answers the question the
       header cannot: whose code is this, and is it contained. */
    bar.appendChild(el('span', 'win-title', inst.manifest.developer));
    bar.appendChild(el('span', 'win-origin', 'sandboxed'));
    const canvas = el('div', 'canvas');
    canvas.appendChild(inst.frame);
    win.append(bar, canvas);
    mainEl.appendChild(win);
    if (!document.documentElement.hasAttribute('data-reduced-motion')) {
      win.animate(
        [{ transform: 'scale(0.965)', opacity: 0 }, { transform: 'none', opacity: 1 }],
        { duration: 260, easing: 'cubic-bezier(0.32, 0.72, 0, 1)', fill: 'both' },
      );
    }
  }
  const canvas = win.querySelector('.canvas');
  canvas.style.setProperty('--app-h', `${inst.height}px`);
  if (inst.status === 'suspended') canvas.setAttribute('data-suspended', '');
  else canvas.removeAttribute('data-suspended');

  countEl.textContent = inst.status === 'suspended' ? 'Paused'
    : inst.status === 'launching' ? 'Starting' : 'Running';

  setFoot([
    action('Back', () => { view = 'launcher'; render(); }, 'primary'),
    inst.status === 'suspended'
      ? action('Resume', () => rt.resume(openId))
      : action('Pause', () => rt.suspend(openId)),
    action('Close app', () => { rt.kill(openId); view = 'launcher'; render(); }, 'danger'),
  ]);
}

function renderPermissions() {
  titleEl.textContent = 'Permissions';
  const installed = [...rt.installed.values()];
  mainEl.textContent = '';

  if (!installed.length) {
    mainEl.appendChild(message('+', 'Nothing to manage',
      'Permissions appear here once you install an app that asks for one.'));
  } else {
    for (const { manifest } of installed) {
      const block = el('div', 'perm-app');
      block.appendChild(el('h3', null, manifest.name));
      if (!manifest.permissions.length) {
        const row = el('div', 'perm-row');
        const c = el('div');
        c.appendChild(el('div', 'perm-name', 'Asks for nothing'));
        c.appendChild(el('div', 'perm-why', 'This app runs without any access to you or your device.'));
        row.appendChild(c);
        block.appendChild(row);
      }
      for (const name of manifest.permissions) {
        const meta = PERMISSIONS[name];
        const state = rt.permissionState(manifest.id, name);
        const row = el('div', 'perm-row');
        const c = el('div');
        c.appendChild(el('div', 'perm-name', meta.label));
        c.appendChild(el('div', 'perm-why', meta.why));
        const btn = el('button', 'perm-state',
          state === 'granted' ? 'Allowed' : state === 'denied' ? 'Blocked' : 'Not asked');
        btn.type = 'button';
        btn.setAttribute('data-state', state);
        btn.setAttribute('aria-label',
          `${meta.label} for ${manifest.name} is ${state === 'granted' ? 'allowed' : state === 'denied' ? 'blocked' : 'not asked'}. Activate to change.`);
        /* Cycles allowed to blocked to not asked, so a wearer can both revoke a
           grant and clear a refusal without hunting for a different control. */
        btn.addEventListener('click', () => {
          const next = state === 'granted' ? 'denied' : state === 'denied' ? 'prompt' : 'granted';
          rt.setPermission(manifest.id, name, next);
        });
        row.append(c, btn);
        block.appendChild(row);
      }
      mainEl.appendChild(block);
    }
  }
  countEl.textContent = '';
  fitAbove(mainEl);
  setFoot([
    action('Back', () => { view = 'launcher'; render(); }, 'primary'),
    installed.length ? action('Reset all', () => installed.forEach(({ manifest }) => rt.revokeAll(manifest.id)), 'danger') : null,
  ]);
}

/* ---------- permission sheet ---------- */

function renderSheet() {
  const p = rt.pendingPrompt;
  const existing = stage.querySelectorAll('.scrim, .sheet');
  if (!p) { existing.forEach((n) => n.remove()); return; }
  if (stage.querySelector('.sheet[data-perm="' + p.name + '"][data-app="' + p.id + '"]')) return;
  existing.forEach((n) => n.remove());

  const scrim = el('div', 'scrim');
  const sheet = el('div', 'sheet');
  sheet.setAttribute('role', 'alertdialog');
  sheet.setAttribute('aria-modal', 'true');
  sheet.setAttribute('data-perm', p.name);
  sheet.setAttribute('data-app', p.id);

  const ask = el('p', 'ask', `Allow ${p.appName} to use ${p.meta.label.toLowerCase()}?`);
  ask.id = 'ask-' + p.name;
  sheet.setAttribute('aria-labelledby', ask.id);
  sheet.appendChild(ask);

  if (p.reason) sheet.appendChild(el('p', 'reason', `${p.appName} says: “${p.reason}”`));

  const why = el('p', 'why', p.meta.why);
  if (p.meta.risk === 'high') why.style.setProperty('--risk-ink', 'var(--warn)');
  sheet.appendChild(why);

  const buttons = el('div', 'buttons');
  const deny = action("Don't allow", () => rt.answerPrompt('denied'));
  const allow = action('Allow', () => rt.answerPrompt('granted'), 'primary');
  buttons.append(deny, allow);
  sheet.appendChild(buttons);

  stage.append(scrim, sheet);

  if (!document.documentElement.hasAttribute('data-reduced-motion')) {
    sheet.animate(
      [{ transform: 'translateY(14px)', opacity: 0 }, { transform: 'none', opacity: 1 }],
      { duration: 260, easing: 'cubic-bezier(0.32, 0.72, 0, 1)', fill: 'both' },
    );
  }
  /* A decision needs the focus, and Escape must mean the safe answer. */
  allow.focus({ preventScroll: true });
  sheet.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); rt.answerPrompt('denied'); }
  });
}

/* ---------- edge states the lab can drive ---------- */

const EDGE = {
  empty() {
    titleEl.textContent = 'Web Apps';
    countEl.textContent = '';
    mainEl.textContent = '';
    mainEl.appendChild(message('+', 'No apps installed',
      'Apps you add appear here. Each one runs sealed off from the system and from every other app.'));
    setFoot([action('Add the sample apps', () => { lab.setState('ready'); installSamples(); }, 'primary')]);
  },
  loading() {
    titleEl.textContent = 'Web Apps';
    countEl.textContent = 'Checking';
    mainEl.textContent = '';
    const list = el('div', 'list');
    for (let i = 0; i < 3; i++) {
      const row = el('div', 'app-row');
      row.style.opacity = String(0.7 - i * 0.18);
      const g = el('div', 'glyph', '');
      g.style.setProperty('--app-accent', 'rgba(255,255,255,0.14)');
      const mid = el('div');
      const n = el('div', 'app-name', '—');
      n.style.color = 'var(--ink-20)';
      mid.appendChild(n);
      mid.appendChild(el('div', 'app-badge', 'Reading manifest'));
      row.append(g, mid, el('div', 'run-dot'));
      row.lastChild.setAttribute('data-hidden', '');
      list.appendChild(row);
    }
    mainEl.appendChild(list);
    setFoot([]);
  },
  error() {
    titleEl.textContent = 'Web Apps';
    countEl.textContent = '1 refused';
    mainEl.textContent = '';
    const body = lastError
      ? lastError
      : 'The package for Portside names a permission this system does not have, and points its entry outside its own folder. It was not installed.';
    mainEl.appendChild(message('!', 'That app could not be installed', body, 'danger'));
    setFoot([
      action('Try again', () => { lab.setState('ready'); installSamples(); }, 'primary'),
      action('Back', () => { lab.setState('ready'); }),
    ]);
  },
  offline() {
    titleEl.textContent = 'Web Apps';
    countEl.textContent = 'No connection';
    mainEl.textContent = '';
    mainEl.appendChild(message('⊘', 'You are offline',
      'Apps already on your glasses still open. Waypoint works fully without a connection; Transit needs one for live departures.', 'warn'));
    setFoot([
      action('Open Waypoint', () => { lab.setState('ready'); open('waypoint'); }, 'primary'),
      action('Back', () => { lab.setState('ready'); }),
    ]);
  },
  denied() {
    titleEl.textContent = 'Transit';
    countEl.textContent = 'Blocked';
    mainEl.textContent = '';
    mainEl.appendChild(message('✗', 'Network is blocked for Transit',
      'Transit reads live departures over the network. You blocked it, so it has nothing to show. Everything else on your glasses is unaffected.', 'danger'));
    setFoot([
      action('Manage permissions', () => { lab.setState('ready'); view = 'permissions'; render(); }, 'primary'),
      action('Back', () => { lab.setState('ready'); }),
    ]);
  },
};

/* ---------- render ---------- */

let edge = null;

/* The gaze reticle's home is the exact centre of the stage. Anything parked
   there is read through a reticle, so scrolling content stops short of it and
   the lower half of the lens stays world. The one exception is a focused app
   window: the wearer is looking at it, and the reticle is on it, not past it. */
const GAZE_HOME = 300;
const GAZE_GUARD = 14;

/* Clipping is not enough: a row half-hidden by overflow still has its glyphs
   laid out across the guard. Rows are dropped until the list genuinely ends
   above it, and whatever did not fit is offered as a page, not silently lost. */
function fitAbove(container) {
  const limit = Math.max(72, GAZE_HOME - GAZE_GUARD - mainEl.offsetTop);
  mainEl.style.maxHeight = `${limit}px`;
  mainEl.style.overflow = 'hidden';
  let dropped = 0;
  while (container.children.length > 1 && container.scrollHeight > limit) {
    container.removeChild(container.lastElementChild);
    dropped++;
  }
  return dropped;
}

function guardCentre(exempt) {
  if (exempt) { mainEl.style.maxHeight = ''; mainEl.style.overflow = 'auto'; return; }
  mainEl.style.maxHeight = `${Math.max(72, GAZE_HOME - GAZE_GUARD - mainEl.offsetTop)}px`;
}

function render() {
  const appOpen = !edge && view === 'app' && !!openId;
  if (edge && EDGE[edge]) { EDGE[edge](); }
  else if (view === 'permissions') renderPermissions();
  else if (appOpen) renderApp();
  else renderLauncher();
  guardCentre(appOpen);
  renderSheet();
}

function open(id) {
  if (!rt.installed.has(id)) return;
  openId = id;
  view = 'app';
  rt.launch(id);
  render();
}

async function installSamples() {
  for (const id of ['transit', 'waypoint']) await rt.install(id);
  render();
}

rt.on('change', () => render());
rt.on('install-failed', ({ id, errors }) => {
  lastError = `${id} was refused: ${errors.map((e) => `${e.field} — ${e.message}`).join(' ')}`;
});
/* App-supplied strings land in the host document, so they are escaped here.
   A platform that sandboxes a frame and then writes its text as HTML has
   handed back everything the sandbox took away. */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

rt.on('notification', (n) => {
  os.banner(`<b>${esc(n.appName)}</b> ${esc(n.title)}<br><span style="opacity:.7">${esc(n.body)}</span>`);
});

/* ---------- lab ---------- */

const lab = mountLab({
  piece: '12-webapps',
  title: 'Web Apps',
  states: ['ready', 'loading', 'empty', 'error', 'offline', 'denied'],
  onState: (s) => {
    edge = s === 'ready' ? null : s;
    if (s === 'ready') { view = 'launcher'; openId = null; }
    render();
  },
  actions: [
    { label: 'Open Transit', run: () => { edge = null; lab.setState?.('ready'); open('transit'); } },
    { label: 'Open Waypoint', run: () => { edge = null; open('waypoint'); } },
    { label: 'Launch an app that hangs', run: async () => { edge = null; await rt.install('stalled'); open('stalled'); } },
    { label: 'Install a broken package', run: async () => { edge = null; await rt.install('badmanifest'); edge = 'error'; render(); } },
    { label: 'Revoke every grant', run: () => { for (const id of rt.installed.keys()) rt.revokeAll(id); } },
  ],
  toggles: [
    { label: 'Network', initial: true, run: (on) => rt.setOnline(on) },
  ],
  onScale: (v) => rt.setDisplay({ textScale: v }),
  onReducedMotion: (on) => rt.setDisplay({ reducedMotion: on }),
});

/* The runtime paints into the window that renderApp builds, so it has no
   container of its own until an app is open. */
rt.setDisplay({ textScale: lab.scale, reducedMotion: lab.reducedMotion });
await installSamples();
if (!edge) render();
</script>
