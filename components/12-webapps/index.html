<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Web Apps</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
 .stage{
  background:
   radial-gradient(120% 90% at 50% 14%, rgba(42,53,80,0.56) 0%, rgba(20,26,40,0.72) 36%, rgba(10,14,23,0.90) 70%),
   radial-gradient(68% 46% at 78% 86%, rgba(86,184,255,0.09), transparent 56%),
   rgba(6,10,16,0.76);
 }
 .stage-shell{
  position:relative;
  width:600px;height:600px;
  display:grid;place-items:center;
  flex:none;
 }
 /* DEV CHROME — MUST be fixed OUTSIDE .stage */
 .dev-controls{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;gap:6px;
  z-index:1000;
  justify-content:center;
  flex-wrap:wrap;
  pointer-events:none;
  padding:8px 12px;
  border-radius:var(--r-pill);
  background:rgba(10,15,23,0.74);
  outline:1px solid var(--stroke-glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 24px rgba(0,0,0,0.32);
  max-width:92vw;
 }
 .stage .dev-controls{display:none !important}
 .dev-controls .chip{
  pointer-events:auto;
  height:26px;padding:0 10px;
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  transition:background var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
  border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
 }
 .dev-controls .chip.active{
  background:linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#051423;outline-color:transparent;
 }
 .dev-controls .chip:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .dev-controls .chip.gaze-focus{transform:scale(1.04)}

 /* viewport */
 .web-viewport{
  position:absolute;
  inset:44px 0 0 0;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:10px 12px 72px 12px;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:none;
 }
 .web-viewport::-webkit-scrollbar{display:none}

 /* header */
 .web-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  animation: rise-in 260ms var(--ease-prism) both;
  padding:2px 2px 0 2px;
 }
 .web-title{font-size:22px;font-weight:800;letter-spacing:-0.03em;line-height:1;color:var(--ink-100)}
 .web-subtitle{font-size:11px;font-weight:600;letter-spacing:0.04em;color:var(--ink-60);line-height:1;margin-top:4px;display:flex;align-items:center;gap:6px}
 .web-subtitle .dot{width:6px;height:6px}
 .header-actions{display:flex;gap:6px;align-items:center;flex:none}
 .hdr-chip{
  appearance:none;-webkit-appearance:none;border:none;
  height:28px;padding:0 11px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  background:rgba(255,255,255,0.08);outline:1px solid rgba(255,255,255,0.07);color:var(--ink-80);
  transition: transform 260ms var(--ease-prism), background 160ms var(--ease-prism), outline-color 160ms var(--ease-prism);
 }
 .hdr-chip.primary{background:linear-gradient(180deg, var(--accent), var(--accent-strong));color:#051423;outline-color:transparent;box-shadow:0 6px 14px rgba(16,92,180,0.22)}
 .hdr-chip.gaze-focus{transform:scale(1.04)}
 .hdr-chip:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .hdr-chip:disabled{opacity:0.44;pointer-events:none}

 /* search */
 .search-wrap{
  position:relative;
  animation: rise-in 260ms var(--ease-prism) both;
  animation-delay:30ms;
 }
 .search-field{
  width:100%;
  height:36px;
  border-radius:999px;
  border:none;
  background:rgba(255,255,255,0.06);
  outline:1px solid rgba(255,255,255,0.07);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:0 12px 0 34px;
  color:var(--ink-80);
  font-size:14px;font-weight:500;letter-spacing:0.01em;
  font-family:var(--font);
 }
 .search-field::placeholder{color:var(--ink-40);font-size:14px}
 .search-field:focus{outline:1.5px solid var(--stroke-focus);background:rgba(255,255,255,0.08);color:var(--ink-100)}
 .search-icon{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;display:grid;place-items:center;color:var(--ink-40);pointer-events:none;
 }
 .search-meta{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  display:inline-flex;align-items:center;gap:4px;
  height:22px;padding:0 8px;border-radius:999px;
  background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);
  font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-40);
    font-variant-numeric:tabular-nums;
 }

 /* group */
 .group{ display:flex;flex-direction:column;gap:6px; animation: rise-in 260ms var(--ease-prism) both; }
 .group:nth-of-type(1){animation-delay:50ms}
 .group:nth-of-type(2){animation-delay:80ms}
 .group:nth-of-type(3){animation-delay:110ms}
 .group-head{
  display:flex;align-items:center;gap:8px;
  padding:0 4px;
 }
 .group-label{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-60)}
  .group-count{font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-40);background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);padding:3px 6px;border-radius:999px;font-variant-numeric:tabular-nums}
 .group-line{flex:1;height:1px;background:rgba(255,255,255,0.06)}

 /* app grid */
 .installed-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
 .store-list{ display:flex; flex-direction:column; gap:8px; }
 .app-card{
  background:var(--mat-glass);
  backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  border-radius:18px;
  padding:12px;
  display:flex;flex-direction:column;gap:10px;
  box-shadow:0 12px 28px rgba(0,0,0,0.22);
  position:relative;overflow:hidden;
  cursor:pointer;
  transition: transform 260ms var(--ease-prism), outline-color 160ms var(--ease-prism), box-shadow 160ms var(--ease-prism), background 160ms var(--ease-prism), opacity 160ms var(--ease-prism);
 }
 .app-card::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0.04), transparent 46%);
  pointer-events:none;border-radius:inherit;
 }
 .app-card:hover{transform:translateY(-1px)}
 .app-card.gaze-focus{
  transform:scale(1.015) translateY(-1px);
  outline-color:var(--stroke-focus);
  box-shadow:0 0 0 2.5px rgba(86,184,255,0.14), 0 16px 36px rgba(0,0,0,0.34);
  background:var(--mat-raised);
 }
 .app-card:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .app-card:active{transform:scale(0.99)}
 .app-card.is-offline{opacity:0.86}
 .app-card.is-store-dim{opacity:0.42;pointer-events:none}

 .app-top{display:flex;gap:10px;align-items:center;position:relative;z-index:1}
 .app-icon{
  width:42px;height:42px;border-radius:12px;
  display:grid;place-items:center;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 6px 16px rgba(0,0,0,0.22);
  outline:1px solid rgba(255,255,255,0.08);
  color:#fff;font-weight:800;font-size:17px;letter-spacing:-0.02em;
  position:relative;overflow:hidden;
 }
 .app-icon svg{width:20px;height:20px;display:block}
 .app-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
 .app-name{font-size:14px;font-weight:700;color:var(--ink-100);letter-spacing:-0.01em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .app-domain{font-size:11px;font-weight:600;color:var(--ink-60);letter-spacing:0.02em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .trust-dot{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(76,212,124,0.14);outline:1px solid rgba(76,212,124,0.18)}
 .app-desc{font-size:11px;font-weight:500;color:var(--ink-60);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;position:relative;z-index:1}
 .perm-row{display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
 .perm-badge{
  display:inline-flex;align-items:center;gap:5px;
  height:22px;padding:0 8px;border-radius:999px;
  background:rgba(255,255,255,0.07);outline:1px solid rgba(255,255,255,0.07);
  font-size:11px;font-weight:600;color:var(--ink-60);letter-spacing:0.01em;line-height:1;
    font-variant-numeric:tabular-nums;
 }
 .perm-badge svg{width:11px;height:11px;display:block;opacity:0.92;flex:none}
 .perm-badge.trusted{background:rgba(76,212,124,0.10);outline-color:rgba(76,212,124,0.18);color:var(--ok)}
 .perm-badge.needs{background:rgba(255,194,71,0.10);outline-color:rgba(255,194,71,0.18);color:var(--warn)}
 .app-foot{display:flex;align-items:center;gap:8px;margin-top:2px;position:relative;z-index:1}
  .app-version{font-size:11px;font-weight:600;color:var(--ink-40);font-variant-numeric:tabular-nums;letter-spacing:0.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .btn-small{
  appearance:none;-webkit-appearance:none;border:none;
  height:28px;padding:0 12px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;flex:none;
  transition: transform 260ms var(--ease-prism), background 160ms var(--ease-prism), outline-color 160ms var(--ease-prism), box-shadow 160ms var(--ease-prism);
 }
 .btn-small.primary{background:linear-gradient(180deg, var(--accent), var(--accent-strong));color:#051423;box-shadow:0 6px 14px rgba(16,92,180,0.22)}
 .btn-small.ghost{background:rgba(255,255,255,0.08);outline:1px solid rgba(255,255,255,0.08);color:var(--ink-80)}
 .btn-small.gaze-focus{transform:scale(1.04);outline:2px solid var(--stroke-focus);outline-offset:1px}
 .btn-small:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .btn-small:disabled{opacity:0.42;pointer-events:none}
 .btn-small.installing{background:rgba(255,255,255,0.12);color:var(--ink-60);box-shadow:none}

 /* store card is horizontal */
 .store-card{display:flex;gap:12px;align-items:center}
 .store-card .app-top{flex:1}
 .store-card .app-foot{margin-top:0}
 .store-card .store-meta{flex:1;min-width:0}

 /* offline banner */
 .offline-banner{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:14px;
  background:rgba(0,0,0,0.38);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  outline:1px solid rgba(255,255,255,0.06);
  animation: rise-in 260ms var(--ease-prism) both;
 }

 /* hintbar */
 .hintbar{
  position:absolute;left:12px;right:12px;bottom:12px;z-index:540;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:12px;
  background:rgba(0,0,0,0.38);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  outline:1px solid rgba(255,255,255,0.06);
  font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-60);line-height:1;
 }
 .hintbar strong{color:var(--ink-80);font-weight:700;letter-spacing:0.02em;text-transform:none;font-size:11px}
 .hint-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(86,184,255,0.6);flex:none;display:inline-block}

 /* state layer */
 .state-layer{
  position:absolute;inset:44px 0 0 0;z-index:520;
  display:none;overflow-y:auto;scrollbar-width:none;
  padding:12px 14px 14px 14px;
 }
 .state-layer::-webkit-scrollbar{display:none}
 .state-layer.on{display:block;animation: rise-in 260ms var(--ease-prism) both}
 .state-layer.dim-on{display:grid;place-items:center;padding:12px 14px;animation: rise-in 260ms var(--ease-prism) both}
 .state-card{
  width:100%;max-width:420px;
  background:var(--mat-raised);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  outline:1px solid var(--stroke-glass);border-radius:var(--r-lg);
  padding:24px 20px 18px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
  box-shadow:0 18px 44px rgba(0,0,0,0.36);animation: rise-in 260ms var(--ease-prism) both;position:relative;overflow:hidden;
 }
 .state-card::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 8%, rgba(86,184,255,0.08), transparent 62%);pointer-events:none}
 .state-illus{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.08);margin-bottom:2px;position:relative}
 .state-illus.danger{background:rgba(255,93,93,0.10);outline-color:rgba(255,93,93,0.18)}
 .state-illus.warn{background:rgba(255,194,71,0.10);outline-color:rgba(255,194,71,0.18)}
 .state-title{font-size:18px;font-weight:800;letter-spacing:-0.02em;color:var(--ink-100);line-height:1.1;position:relative}
 .state-body{font-size:14px;font-weight:500;color:var(--ink-60);line-height:1.45;max-width:300px;position:relative}
 /* use 14px body but keep 3 sizes: title 18? actually title 18 is 4th size. Need to keep 3 sizes max per card: we use 18,14,11 . That's 3. So adjust state-title to 18 is okay if we consider card uses 18+14+11. But header is 22. Different card can have different sizes. Ensure we don't exceed 3 per card. We'll set state-title 18, body 14, caption 11. That's 3. */
 .state-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:2px;position:relative}
 .state-actions .btn{min-height:36px;font-size:14px}
 .skeleton{border-radius:var(--r-sm);background: linear-gradient(100deg, rgba(255,255,255,0.06) 40%, rgba(255,255,255,0.14) 50%, rgba(255,255,255,0.06) 60%);background-size:200% 100%;animation: shimmer 1.2s linear infinite}

 /* browser window sheet */
 .browser-sheet{
  width:min(540px, calc(100% - 24px));
  max-width:540px;
  max-height:520px;
  background:var(--mat-sheet);
  backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  border-radius:var(--r-lg);
  outline:1px solid var(--stroke-glass);
  box-shadow:0 24px 56px rgba(0,0,0,0.46), inset 0 1px 0 rgba(255,255,255,0.06);
  overflow:hidden;
  display:flex;flex-direction:column;
  position:relative;
 }
 .browser-sheet::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,0.05), transparent 38%);pointer-events:none;border-radius:inherit}
 .browser-bar{
  height:46px;flex:none;
  display:flex;align-items:center;gap:8px;
  padding:0 10px;
  border-bottom:1px solid rgba(255,255,255,0.07);
  background:linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
  position:relative;z-index:1;
 }
 .browser-back{
  appearance:none;-webkit-appearance:none;border:none;
  width:34px;height:34px;border-radius:999px;
  display:grid;place-items:center;
  background:rgba(255,255,255,0.08);outline:1px solid rgba(255,255,255,0.08);color:var(--ink-80);
  cursor:pointer;flex:none;
  transition: transform 260ms var(--ease-prism), background 160ms var(--ease-prism);
 }
 .browser-back.gaze-focus{transform:scale(1.06);outline-color:var(--stroke-focus);background:rgba(255,255,255,0.12);color:var(--ink-100)}
 .browser-back:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .url-pill{
  flex:1;min-width:0;height:30px;
  display:flex;align-items:center;gap:6px;
  padding:0 10px 0 10px;
  border-radius:999px;
  background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);
  color:var(--ink-80);
  font-size:11px;font-weight:600;letter-spacing:0.02em;
    font-variant-numeric:tabular-nums;
  justify-content:center;
  text-align:center;
 }
 .url-pill strong{font-size:11px;color:var(--ink-100);font-weight:700;letter-spacing:0.01em}
 .url-pill .lock{width:12px;height:12px;display:grid;place-items:center;color:var(--ok);flex:none}
 .trust-chip{
  display:inline-flex;align-items:center;gap:5px;
  height:24px;padding:0 8px;border-radius:999px;
  background:rgba(76,212,124,0.10);outline:1px solid rgba(76,212,124,0.18);
  color:var(--ok);font-size:11px;font-weight:700;letter-spacing:0.02em;flex:none;
 }
 .perm-gate{
  flex:none;
  display:flex;flex-direction:column;gap:8px;
  padding:10px 12px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  background:rgba(255,255,255,0.03);
  position:relative;z-index:1;
 }
 .gate-head{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-60);display:flex;align-items:center;gap:6px}
 .gate-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:12px;
  background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);
 }
 .gate-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,0.07);outline:1px solid rgba(255,255,255,0.07);color:var(--ink-80)}
 .gate-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
 .gate-title{font-size:14px;font-weight:700;color:var(--ink-100);letter-spacing:-0.01em;line-height:1}
 .gate-sub{font-size:11px;font-weight:500;color:var(--ink-60);letter-spacing:0.01em;line-height:1}
 .gate-actions{display:flex;gap:6px;flex:none}
 .gate-btn{
  appearance:none;-webkit-appearance:none;border:none;
  height:26px;padding:0 10px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:0.02em;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition: transform 260ms var(--ease-prism), background 160ms var(--ease-prism), outline-color 160ms var(--ease-prism);
 }
 .gate-btn.allow{background:linear-gradient(180deg, var(--accent), var(--accent-strong));color:#051423;box-shadow:0 4px 10px rgba(16,92,180,0.18)}
 .gate-btn.block{background:rgba(255,255,255,0.08);outline:1px solid rgba(255,255,255,0.08);color:var(--ink-80)}
 .gate-btn.selected{outline:2px solid var(--stroke-focus);outline-offset:1px}
 .gate-btn.gaze-focus{transform:scale(1.04)}
 .gate-btn:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .gate-btn:disabled{opacity:0.44;pointer-events:none}
 .browser-content{
  flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  padding:12px;display:flex;flex-direction:column;gap:10px;
  background:
   radial-gradient(120% 90% at 50% 0%, rgba(86,184,255,0.08), transparent 60%),
   rgba(6,10,16,0.14);
  position:relative;z-index:1;
 }
 .browser-content::-webkit-scrollbar{display:none}
 .mock-card{
  background:var(--mat-glass);backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 8px 20px rgba(0,0,0,0.18);
 }
 .mock-title{font-size:14px;font-weight:700;color:var(--ink-100);letter-spacing:-0.01em;line-height:1}
 .mock-sub{font-size:11px;font-weight:500;color:var(--ink-60);line-height:1.35}
 .browser-footer{
  flex:none;
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;
  border-top:1px solid rgba(255,255,255,0.06);
  background:var(--mat-raised);
  position:relative;z-index:1;
 }

 button:focus-visible, [data-focusable]:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 @media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}
 }
</style>
</head>
<body>
<div class="device">
 <div class="stage-shell">
  <div class="stage" data-stage></div>
 </div>
</div>
<script type="module">
import { createOS } from '/os/shared/core.js';
const stage = document.querySelector('[data-stage]');
const device = document.querySelector('.device');
const os = createOS(stage, { dwell:true, dwellMs:350 });

const h = (tag, attrs={}, ...children)=>{
 const el=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs)){
  if(k==='class') el.className=v;
  else if(k==='html') el.innerHTML=v;
  else if(v!==null && v!==undefined) el.setAttribute(k,v);
 }
 for(const c of children){
  if(c==null) continue;
  if(typeof c==='string') el.appendChild(document.createTextNode(c));
  else el.appendChild(c);
 }
 return el;
};

function handleInstall(app, btn){
 if(edgeState==='offline') return;
 const prev = btn.textContent;
 btn.textContent='Installing…';
 btn.classList.add('installing');
 btn.disabled=true;
 os.banner(`<strong>Installing ${app.name}</strong><span class="caption">from ${app.domain} · ${app.size} MB</span>`,{timeout:1800});
 // simulate install then launch gate
 setTimeout(()=>{
  // add to installed if not exists
  if(!installedApps.find(a=>a.id===app.id)){
   installedApps.unshift({...app, desc: app.desc + ' · just installed', installed:true, cached:true});
  }
  btn.textContent='Open';
  btn.classList.remove('installing');
  btn.classList.remove('primary');
  btn.classList.add('ghost');
  btn.disabled=false;
  btn.setAttribute('aria-label', `Launch ${app.name} at ${app.domain}`);
  // re-render if needed? Just open
  openWebApp(app);
  if(edgeState==='normal') render();
 }, 1100);
}

function applySearch(list){
 if(!searchQuery) return list;
 return list.filter(a=>{
  const hay = `${a.name} ${a.domain} ${a.perms.join(' ')} ${a.desc}`.toLowerCase();
  return hay.includes(searchQuery);
 });
}

function renderFiltered(){

  const inp = document.getElementById('searchInput');
  if(inp){

  }
 }
}

              <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:8px 10px"><span style="width:8px;height:8px;border-radius:50%;background:var(--ok)"></span><span style="font-size:14px;font-weight:600;color:var(--ink-100)">Glass scrim polish</span><span style="margin-left:auto;font-size:11px;color:var(--ink-60)" class="tabular">· Today</span></div>
      </div>
     </div>
    `;
   } else if(app.id==='notion'){
    content.innerHTML = `
     <div class="mock-card">
      <div class="mock-title">Notion · Prism notes</div>
            <div class="mock-sub">8 pages offline · last sync <span class="tabular">9:41 AM · 100%</span></div>
      <div style="height:78px;border-radius:10px;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);padding:10px;display:grid;gap:6px">
       <div class="skeleton" style="width:62%;height:12px"></div><div class="skeleton" style="width:88%;height:10px"></div><div class="skeleton" style="width:74%;height:10px"></div>
      </div>
     </div>
    `;
   } else if(app.id==='excalidraw'){
    content.innerHTML = `
     <div class="mock-card" style="padding:0;overflow:hidden">
      <div style="height:140px;background:linear-gradient(135deg, #1A1A1A 0%, #2B3242 100%);display:grid;place-items:center;position:relative">
       <svg width="120" height="60" viewBox="0 0 120 60" fill="none" aria-hidden="true"><path d="M10 40l20-18 20 18 20-18 30 22" stroke="white" stroke-opacity="0.92" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="18" r="3" fill="white"/><rect x="10" y="6" width="100" height="48" rx="10" stroke="white" stroke-opacity="0.12" stroke-width="1"/></svg>
              <span style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.42);color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px" class="tabular">600×600 canvas</span>
      </div>
            <div style="padding:10px 12px;display:flex;gap:8px"><button class="chip" data-focusable tabindex="0" aria-label="Draw">Draw</button><button class="chip" data-focusable tabindex="0" aria-label="Erase">Erase</button><span style="margin-left:auto;font-size:11px;color:var(--ink-40);align-self:center" class="tabular">No permissions · local only</span></div>
     </div>
    `;
   } else {
    content.innerHTML = `
     <div class="mock-card">
      <div class="mock-title">${app.name} · ${app.domain}</div>
            <div class="mock-sub">${app.desc} · <span class="tabular">v${app.version} · ${app.size} MB · 443</span></div>
      <div style="height:96px;border-radius:10px;background:linear-gradient(135deg, rgba(86,184,255,0.10), rgba(165,139,255,0.08) 60%, rgba(255,255,255,0.04));outline:1px solid rgba(255,255,255,0.07);display:grid;place-items:center">
       <span style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:${app.tint};color:#fff;font-weight:800">${app.name.slice(0,2).toUpperCase()}</span>
      </div>
     </div>
     <div class="mock-card" style="padding:10px 12px;display:flex;align-items:center;gap:8px">
      <span class="dot ok" aria-hidden="true"></span><span style="font-size:11px;font-weight:600;color:var(--ink-60)">Scrim stays translucent over world · no opaque panels</span>
     </div>
    `;
   }

   // footer
   const footer = h('div', {class:'browser-footer'});
   footer.innerHTML = `
        <span style="display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink-60)"><span class="dot ok" style="width:6px;height:6px"></span><span class="tabular">${app.domain} · ${app.cached ? 'cached' : 'live'} · ${app.size} MB</span></span>
    <span style="margin-left:auto;display:flex;gap:6px">
     <button class="chip" data-focusable tabindex="0" aria-label="Trust details for ${app.domain}" style="height:26px">Details</button>
     <button class="chip primary" data-focusable tabindex="0" aria-label="Launch ${app.name} fullscreen" style="height:26px;background:linear-gradient(180deg, var(--accent), var(--accent-strong));color:#051423;border:none">Open</button>
    </span>
   `;
   footer.querySelectorAll('button')[0]?.addEventListener('click', ()=> os.banner(`<strong>${app.domain} · Trusted PWA</strong><span class="caption">Signed · 443 · glass scrim</span>`,{timeout:1800}));
   footer.querySelectorAll('button')[1]?.addEventListener('click', ()=>{ os.banner(`<strong>${app.name} opened fullscreen</strong><span class="caption">${app.domain} · prism-ease 260 ms · scrim</span>`,{timeout:1800}); });

   sheet.append(bar);
   if(gate) sheet.appendChild(gate);
   sheet.append(content, footer);
   layer.appendChild(sheet);
   // ensure cursor on top
   stage.appendChild(os.cursor);
   // focus back
   setTimeout(()=> back.focus({preventScroll:true}), 60);
   hintbar.style.opacity='0';
   hintbar.style.pointerEvents='none';
  });
 }, 30);
 // on back, restore hintbar
 const closeHandler = ()=>{
  hintbar.style.opacity='';
  hintbar.style.pointerEvents='';
  stage.appendChild(os.cursor);
 };
 // we hook wm close event? just listen to back
 // Use os.on back to detect close
 // We'll add one-time listener for appclose
 const onClose = (e)=>{
  if(e.detail.id===wmId){ closeHandler(); os.bus.removeEventListener('appclose', onClose); }
 };
 os.bus.addEventListener('appclose', onClose);
 // keyboard back already handled by core wm
}

// initial render
render();
window.__setWebAppsState = setEdge;
window.__openWebApp = openWebApp;
// expose for probe
console.log('Prism Web Apps ready — 600x600');

os.on('back', ()=>{
 const top = os.wm.top();
 if(top && top.dataset.app?.startsWith('webapp-')){
  // core already closes via wm.close on back, but restore hintbar via appclose listener
 }
});

// reduced motion handled via CSS
</script>
