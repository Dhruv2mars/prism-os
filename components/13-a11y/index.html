<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Accessibility</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
 .stage{
  background:
   radial-gradient(120% 90% at 50% 16%, rgba(42,53,80,0.56) 0%, rgba(20,26,40,0.72) 36%, rgba(10,14,23,0.90) 70%),
   radial-gradient(68% 46% at 78% 86%, rgba(86,184,255,0.09), transparent 56%),
   rgba(6,10,16,0.76);
  --a11y-scale: 1.25;
  --a11y-outline: rgba(255,255,255,0.12);
 }
 .stage.high-contrast{
  --stroke-glass: rgba(255,255,255,0.22);
  --a11y-outline: rgba(255,255,255,0.26);
  --ink-60: rgba(255,255,255,0.78);
  --ink-40: rgba(255,255,255,0.60);
 }
 .stage.a11y-reduced .pulse-dot,
 .stage.a11y-reduced .wave i,
 .stage.a11y-reduced .shimmerPulse{ animation:none !important; opacity:0.55 !important; }
 .stage-shell{
  position:relative;
  width:600px;height:600px;
  display:grid;place-items:center;
  flex:none;
 }
 /* DEV controls — fixed OUTSIDE .stage */
 .dev-controls{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;gap:6px;
  z-index:1000;
  justify-content:center;
  flex-wrap:wrap;
  pointer-events:none;
  padding:8px 12px;
  border-radius:var(--r-pill);
  background:rgba(10,15,23,0.74);
  outline:1px solid var(--stroke-glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 24px rgba(0,0,0,0.32);
  max-width:92vw;
 }
 .stage .dev-controls{display:none !important}
 .dev-controls .chip{
  pointer-events:auto;
  height:26px;padding:0 10px;
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  transition:background var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
  border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
 }
 .dev-controls .chip.active{
  background:linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#051423;outline-color:transparent;
 }
 .dev-controls .chip:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .dev-controls .chip.gaze-focus{transform:scale(1.04)}

 /* viewport */
 .a11y-viewport{
  position:absolute;
  inset:44px 0 0 0;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px 12px 68px 12px;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:none;
 }
 .a11y-viewport::-webkit-scrollbar{display:none}

 /* header */
 .a11y-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  animation: rise-in var(--dur-base) var(--ease-prism) both;
  padding:0 2px;
 }
 .a11y-title{font-size:22px;font-weight:800;letter-spacing:-0.03em;line-height:1;color:var(--ink-100)}
 .a11y-subtitle{font-size:11px;font-weight:600;letter-spacing:0.04em;color:var(--ink-60);line-height:1;margin-top:4px;display:flex;align-items:center;gap:6px}
 .a11y-subtitle .dot{width:6px;height:6px}
 .header-actions{display:flex;gap:6px;align-items:center;flex:none}
 .hdr-chip{
  appearance:none;-webkit-appearance:none;border:none;
  height:28px;padding:0 11px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  background:rgba(255,255,255,0.08);outline:1px solid rgba(255,255,255,0.07);color:var(--ink-80);
  transition: transform var(--dur-base) var(--ease-prism), background var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
 }
 .hdr-chip.primary{background:linear-gradient(180deg, var(--accent), var(--accent-strong));color:#051423;outline-color:transparent;box-shadow:0 6px 14px rgba(16,92,180,0.22)}
 .hdr-chip.gaze-focus{transform:scale(1.04)}
 .hdr-chip:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}

 /* groups */
 .group{
  display:flex;flex-direction:column;gap:5px;
  animation: rise-in var(--dur-base) var(--ease-prism) both;
 }
 .group:nth-of-type(1){animation-delay:40ms}
 .group:nth-of-type(2){animation-delay:70ms}
 .group:nth-of-type(3){animation-delay:100ms}
 .group:nth-of-type(4){animation-delay:130ms}
 .group:nth-of-type(5){animation-delay:160ms}
 .group-head{
  display:flex;align-items:center;gap:8px;
  padding:4px 4px 0 4px;
 }
 .group-label{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-60)}
 .group-count{font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-40);background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);padding:3px 6px;border-radius:999px}
 .group-line{flex:1;height:1px;background:rgba(255,255,255,0.06)}
 .group-card{
  background:var(--mat-glass);
  backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--a11y-outline);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 12px 28px rgba(0,0,0,0.22);
  display:flex;flex-direction:column;
  transition: outline-color var(--dur-base) var(--ease-prism), background var(--dur-base) var(--ease-prism);
 }

 /* rows */
 .a11y-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 12px;
  cursor:pointer;
  position:relative;
  transition: background var(--dur-fast) var(--ease-prism), transform var(--dur-base) var(--ease-prism);
  min-height:56px;
 }
 .a11y-row + .a11y-row{border-top:1px solid rgba(255,255,255,0.06)}
 .a11y-row:hover{background:rgba(255,255,255,0.04)}
 .a11y-row.gaze-focus{background:rgba(86,184,255,0.08);outline:2px solid var(--stroke-focus);outline-offset:-2px;z-index:1}
 .a11y-row:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px;z-index:2}
 .a11y-row:active{transform:scale(0.99)}
 .row-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,0.07);outline:1px solid rgba(255,255,255,0.08);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);color:var(--ink-80)}
 .row-icon.accent{background:linear-gradient(180deg, var(--accent), var(--accent-strong));color:#04121f;outline-color:transparent;box-shadow:0 4px 12px rgba(16,92,180,0.22)}
 .row-icon.ok{background:linear-gradient(180deg,#4cd47c 0%, #1a8a4a 100%);color:#fff}
 .row-icon.warn{background:linear-gradient(180deg,#ffc247 0%, #ff7a1a 100%);color:#1a0f00}
 .row-icon.purple{background:linear-gradient(180deg,#a58bff 0%, #6a4bff 100%);color:#fff}
 .row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
 .row-title{font-size:14px;font-weight:700;color:var(--ink-100);letter-spacing:-0.01em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .row-sub{font-size:11px;font-weight:500;color:var(--ink-60);letter-spacing:0.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .row-ctrl{flex:none;display:flex;align-items:center;gap:8px}
  .row-value{font-size:11px;font-weight:700;letter-spacing:0.02em;color:var(--ink-60);font-variant-numeric:tabular-nums;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);padding:6px 8px;border-radius:999px;min-width:42px;text-align:center}
 .row-value.accent{color:var(--accent);background:rgba(86,184,255,0.12);outline-color:rgba(86,184,255,0.18)}
 .row-chevron{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink-40);background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06)}

 /* slider row */
 .slider-row{flex-direction:column;align-items:stretch;gap:8px;padding:11px 12px 12px 12px;cursor:default}
 .slider-row:hover{background:transparent}
 .slider-head{display:flex;align-items:center;gap:12px;width:100%}
 .slider-head .row-main{flex:1}
 .scale-chips{display:flex;gap:6px;flex:none}
 .scale-chip{
  appearance:none;-webkit-appearance:none;border:none;
  height:24px;padding:0 10px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.07);outline:1px solid rgba(255,255,255,0.07);color:var(--ink-60);cursor:pointer;
  transition: background var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism);
 }
 .scale-chip.active{background:linear-gradient(180deg, var(--accent), var(--accent-strong));color:#051423;outline-color:transparent;box-shadow:0 4px 10px rgba(16,92,180,0.18)}
 .scale-chip.gaze-focus{transform:scale(1.04);outline:2px solid var(--stroke-focus)}
 .scale-chip:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .slider-track-wrap{display:flex;align-items:center;gap:10px;width:100%}
 .slider-track{flex:1;position:relative;height:28px;display:flex;align-items:center}
 .range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
 .range::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:rgba(255,255,255,0.10);outline:1px solid rgba(255,255,255,0.06)}
 .range::-moz-range-track{height:6px;border-radius:999px;background:rgba(255,255,255,0.10)}
 .range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid rgba(255,255,255,0.9);box-shadow:0 2px 8px rgba(0,0,0,0.32), 0 0 0 4px rgba(86,184,255,0.12);margin-top:-8px;transition:transform 160ms var(--ease-prism), box-shadow 160ms var(--ease-prism)}
 .range:active::-webkit-slider-thumb{transform:scale(1.06);box-shadow:0 4px 14px rgba(0,0,0,0.36), 0 0 0 6px rgba(86,184,255,0.16)}
 .range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.32)}
 .slider-fill{position:absolute;left:0;top:50%;transform:translateY(-50%);height:6px;border-radius:999px;background:linear-gradient(90deg, var(--accent), var(--accent-strong));pointer-events:none;box-shadow:0 0 8px rgba(86,184,255,0.32)}
 .slider-minmax{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-40);padding:0 1px}

 /* live preview card — signature moment */
 .preview-card{
  background:var(--mat-glass);
  backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--a11y-outline);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 12px 28px rgba(0,0,0,0.22);
  display:flex;flex-direction:column;
  transition: outline-color var(--dur-base) var(--ease-prism);
 }
 .preview-header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 12px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  background:linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
 }
 .preview-head-label{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-40);display:flex;align-items:center;gap:6px}
 .live-badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;background:rgba(86,184,255,0.12);outline:1px solid rgba(86,184,255,0.18);font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent)}
 .live-badge .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(86,184,255,0.6);flex:none;animation:pulseLive 1.4s ease-in-out infinite}
 .a11y-reduced .pulse-dot{animation:none !important;opacity:0.5}
 @keyframes pulseLive{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.55;transform:scale(0.78)}}
 .preview-badges{display:flex;gap:6px;align-items:center}
  .preview-badge{font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-60);background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.06);padding:4px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
 .preview-badge.on{color:var(--ink-100);background:rgba(86,184,255,0.12);outline-color:rgba(86,184,255,0.18)}
 .preview-stage{
  position:relative;
  margin:10px 12px 12px 12px;
  border-radius:16px;
  overflow:hidden;
  background:
   radial-gradient(120% 90% at 50% 16%, rgba(42,53,80,0.66) 0%, rgba(20,26,40,0.84) 40%, rgba(10,14,23,0.96) 70%),
   linear-gradient(180deg, rgba(255,255,255,0.04), transparent 54%);
  outline:1px solid rgba(255,255,255,0.08);
  padding:14px 14px 12px 14px;
  display:flex;flex-direction:column;gap:10px;
  min-height:148px;
  transition: outline-color var(--dur-base) var(--ease-prism), filter var(--dur-base) var(--ease-prism);
 }
 .high-contrast .preview-stage{outline-color:rgba(255,255,255,0.20);outline-width:1.5px}
 .preview-stage::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 14%, rgba(86,184,255,0.10), transparent 62%);pointer-events:none}
 .preview-content{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
 .preview-kicker{font-size:calc(10px * var(--a11y-scale));font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--accent)}
 .preview-title{font-size:calc(18px * var(--a11y-scale));font-weight:800;letter-spacing:-0.02em;color:var(--ink-100);line-height:1.1}
 .preview-body{font-size:calc(13px * var(--a11y-scale));font-weight:500;color:var(--ink-80);line-height:1.4}
 .preview-caption{font-size:calc(11px * var(--a11y-scale));font-weight:500;color:var(--ink-60);line-height:1.35;display:flex;align-items:center;gap:6px}
 .preview-metrics{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
  .metric-pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,0.08);outline:1px solid rgba(255,255,255,0.08);font-size:11px;font-weight:700;color:var(--ink-80);font-variant-numeric:tabular-nums;transition:outline-color var(--dur-base) var(--ease-prism)}
 .high-contrast .metric-pill{outline-color:rgba(255,255,255,0.18);background:rgba(255,255,255,0.10)}
 .metric-pill .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulseLive 1.2s ease-in-out infinite;flex:none}
 .wave{display:flex;align-items:center;gap:3px;height:18px}
 .wave i{width:3px;border-radius:999px;background:linear-gradient(180deg, #dff0ff 0%, var(--accent) 48%, var(--accent-strong) 100%);height:var(--h,10px);animation:wavePulse 280ms var(--ease-prism) infinite alternate}
 .wave.muted i{opacity:0.22;animation-play-state:paused}
 .wave.paused i{animation:none !important;opacity:0.36}
 @keyframes wavePulse{from{transform:scaleY(0.52);opacity:0.72}to{transform:scaleY(1);opacity:1}}
 .mono-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,0.07);outline:1px solid rgba(255,255,255,0.08);color:var(--ink-80);transition:background var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism)}
 .mono-icon.on{background:rgba(86,184,255,0.14);outline-color:rgba(86,184,255,0.22);color:var(--ink-100)}

 /* colorblind preview */
 .color-row{display:flex;gap:8px;padding:10px 12px;align-items:center;flex-wrap:wrap}
 .color-chip{
  flex:1;min-width:76px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 8px;border-radius:14px;
  background:rgba(255,255,255,0.05);outline:1px solid rgba(255,255,255,0.06);
  position:relative;overflow:hidden;
  cursor:default;
  transition: transform var(--dur-base) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
 }
 .color-chip.gaze-focus{transform:scale(1.03);outline-color:var(--stroke-focus)}
 .chip-dot{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,0.14), 0 4px 12px rgba(0,0,0,0.16);outline:1px solid rgba(255,255,255,0.08);color:#fff;font-weight:800;font-size:12px;position:relative;overflow:hidden}
 .chip-dot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,0.10), transparent 54%);pointer-events:none;border-radius:inherit}
 .chip-label{font-size:11px;font-weight:700;letter-spacing:0.02em;color:var(--ink-80);text-align:center;line-height:1}
 .chip-sub{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-40);text-align:center;margin-top:-2px}
 .chip-pattern{position:absolute;inset:auto 0 0 0;height:4px;opacity:0.92}
 .color-note{flex-basis:100%;font-size:11px;font-weight:500;color:var(--ink-60);line-height:1.35;padding:0 2px;margin-top:2px;display:flex;align-items:center;gap:6px}
 .color-note strong{color:var(--ink-80);font-weight:700}

 /* focus helper */
 .focus-demo{display:flex;gap:8px;padding:12px 12px;align-items:center;justify-content:center;flex-wrap:wrap}
 .focus-btn{
  appearance:none;-webkit-appearance:none;border:none;
  min-height:36px;padding:0 14px;border-radius:999px;
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.08);outline:1px solid rgba(255,255,255,0.08);color:var(--ink-80);
  font-size:13px;font-weight:700;letter-spacing:0.01em;cursor:pointer;
  transition: transform var(--dur-base) var(--ease-prism), background var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism), box-shadow var(--dur-fast) var(--ease-prism);
 }
 .focus-btn.primary{background:linear-gradient(180deg, var(--accent), var(--accent-strong));color:#051423;outline-color:transparent;box-shadow:0 6px 14px rgba(16,92,180,0.22)}
 .focus-btn.gaze-focus{transform:scale(1.04);outline-color:var(--stroke-focus);box-shadow:0 0 0 2.5px rgba(86,184,255,0.18), 0 0 14px rgba(86,184,255,0.18)}
 .focus-btn:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .focus-legend{display:flex;align-items:center;gap:8px;justify-content:center;padding:0 12px 12px 12px;font-size:11px;font-weight:500;color:var(--ink-60);line-height:1.35;text-align:center}
 .legend-dot{width:14px;height:14px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,0.06);outline:1px solid rgba(86,184,255,0.9);box-shadow:0 0 10px rgba(86,184,255,0.22)}
 .equivalence-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 12px 12px 12px}
 .eq-cell{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 6px;border-radius:12px;
  background:rgba(255,255,255,0.05);outline:1px solid rgba(255,255,255,0.06);
  text-align:center;
 }
 .eq-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,0.07);outline:1px solid rgba(255,255,255,0.08);color:var(--ink-80)}
 .eq-label{font-size:11px;font-weight:700;color:var(--ink-100);letter-spacing:0.01em;line-height:1}
 .eq-sub{font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-40);line-height:1}

 /* hintbar */
 .hintbar{
  position:absolute;left:12px;right:12px;bottom:12px;z-index:540;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:12px;
  background:rgba(0,0,0,0.38);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  outline:1px solid rgba(255,255,255,0.06);
  font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-60);line-height:1;
 }
 .hintbar strong{color:var(--ink-80);font-weight:700;letter-spacing:0.02em;text-transform:none;font-size:11px}
 .hint-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(86,184,255,0.6);flex:none;display:inline-block}

 /* state layer */
 .state-layer{
  position:absolute;inset:44px 0 0 0;z-index:520;
  display:none;overflow-y:auto;scrollbar-width:none;
  padding:12px 14px 14px 14px;
 }

   setTimeout(()=>{ setEdge('normal'); os.banner('<strong>Prefs restored</strong><span class="caption">saved · cached updated</span>',{timeout:1800}); }, 1100);
  });
  stateLayer.querySelectorAll('button')[1].addEventListener('click', ()=>{ setEdge('normal'); os.banner('<strong>Cached prefs active</strong><span class="caption">no change · safe</span>',{timeout:1600}); });
  stage.appendChild(os.cursor);
  return;
 }
 if(id==='offline'){
  viewport.style.display='flex';
  viewport.style.opacity='0.52';
  viewport.style.filter='blur(1px)';
  viewport.style.pointerEvents='none';
  stateLayer.classList.add('dim-on');
  stateLayer.style.display='grid';
  stateLayer.innerHTML=`
   <div class="state-card">
    <div class="state-illus warn" aria-hidden="true">
     <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 9.5a9 9 0 0117 0" stroke="white" stroke-opacity="0.92" stroke-width="1.5" stroke-linecap="round"/><path d="M6 12.5a6 6 0 0112 0" stroke="white" stroke-opacity="0.82" stroke-width="1.5" stroke-linecap="round"/><path d="M8.8 15.5a2.8 2.8 0 016.4 0" stroke="white" stroke-opacity="0.78" stroke-width="1.4" stroke-linecap="round"/><path d="M2 2l20 20" stroke="#ffc247" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <div class="state-title">Offline · cached prefs</div>
        <div class="state-body">You’re offline — showing cached accessibility prefs. Scale <span class="tabular">${scalePct}%</span>, contrast ${highContrast?'high':'standard'}, motion ${reducedMotion?'reduced':'live'} remain. Changes will queue.</div>
    <div style="width:100%;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px">
     <span style="font-size:11px;font-weight:700;color:var(--ink-80)">Cached · 00:43 ago</span><span style="flex:1"></span><span class="dot warn" aria-hidden="true"></span><span class="caption" style="color:var(--ink-60)">offline</span>
    </div>
    <div class="state-actions">
     <button class="btn primary" data-focusable tabindex="0" aria-label="Retry connection">Retry</button>
     <button class="btn" data-focusable tabindex="0" aria-label="Continue offline">Use cached</button>
    </div>
    <p class="caption" style="color:var(--ink-40)">Preview still scales · outline stays · no dead end</p>
   </div>`;
  stateLayer.querySelectorAll('button').forEach(b=>{
   b.addEventListener('click', ()=>{
    const t=b.textContent.trim();
    if(t.includes('Retry')){
     b.textContent='Retrying…';
     setTimeout(()=>{ os.banner('<strong>Still offline</strong><span class="caption">cached prefs still active · queued</span>',{timeout:1800}); b.textContent='Retry'; }, 900);
    } else { setEdge('normal'); os.banner('<strong>Using cached prefs</strong><span class="caption">offline · queued changes</span>',{timeout:1800}); viewport.style.opacity=''; viewport.style.filter=''; viewport.style.pointerEvents=''; }
   });
  });
  stage.appendChild(os.cursor);
  return;
 }
 if(id==='permission'){
  viewport.style.display='flex';
  viewport.style.opacity='0.42';
  viewport.style.filter='blur(1px)';
  viewport.style.pointerEvents='none';
  stateLayer.classList.add('dim-on');
  stateLayer.style.display='grid';
  stateLayer.innerHTML=`
   <div class="state-card">
    <div class="state-illus" aria-hidden="true">
     <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="9.5" width="14" height="10" rx="2.4" stroke="white" stroke-opacity="0.92" stroke-width="1.6"/><path d="M8.5 9.5V7.8a3.5 3.5 0 017 0v1.7" stroke="white" stroke-width="1.5"/><circle cx="12" cy="14.5" r="1.35" fill="white"/><path d="M12 15.85v1.6" stroke="white" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="8" r="2.2" stroke="white" stroke-opacity="0.42" stroke-width="1.3"/></svg>
    </div>
    <div class="state-title">Voice access blocked</div>
    <div class="state-body">Prism needs microphone for “Hey Prism” and mono audio routing to work fully. Captions and visual prefs still work — allow when ready. Gaze and keyboard stay equivalent.</div>
    <div style="width:100%;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px">
     <span class="row-icon" style="width:28px;height:28px">${iconSvg('voice')}</span><div style="flex:1;text-align:left"><div style="font-size:13px;font-weight:700;color:var(--ink-100)">Microphone · blocked</div><div style="font-size:11px;color:var(--ink-60)">Voice = gaze = keyboard — remain equivalent</div></div><span class="dot bad" aria-hidden="true"></span>
    </div>
    <div class="state-actions">
     <button class="btn primary" data-focusable tabindex="0" aria-label="Allow microphone access">Allow access</button>
     <button class="btn ghost" data-focusable tabindex="0" aria-label="Not now, keep blocked">Not now</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.04);outline:1px solid rgba(255,255,255,0.06);border-radius:999px;padding:6px 10px"><span class="caption" style="color:var(--ink-60)">Settings → Privacy → Prism · Microphone</span></div>
   </div>`;
  const allowBtn=stateLayer.querySelector('.btn.primary');
  allowBtn.addEventListener('click', ()=>{
   allowBtn.textContent='Allowing…';
   allowBtn.setAttribute('disabled','true');
   setTimeout(()=>{ viewport.style.opacity=''; viewport.style.filter=''; viewport.style.pointerEvents=''; setEdge('normal'); os.banner('<strong>Voice allowed</strong><span class="caption">Hey Prism + mono cues active · equivalent inputs</span>',{timeout:1800}); }, 900);
  });
  stateLayer.querySelectorAll('button')[1].addEventListener('click', ()=>{ viewport.style.opacity=''; viewport.style.filter=''; viewport.style.pointerEvents=''; setEdge('normal'); os.banner('<strong>Voice kept blocked</strong><span class="caption">visual prefs active · gaze/keyboard equivalent</span>',{timeout:1800}); });
  stage.appendChild(os.cursor);
  return;
 }
}

// init
stage.style.setProperty('--a11y-scale', String(scalePct/100));
render();

// keyboard Esc etc via core bus back
os.on('back', ()=>{
 if(edgeState!=='normal'){ setEdge('normal'); }
});

hardenGaze();

console.log('Prism a11y ready — scale var --a11y-scale, contrast, reduced-motion, mono, colorblind-safe, focus ring, gaze equivalence');
</script>
</body>
</html>
