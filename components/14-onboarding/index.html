<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Onboarding</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
 /* ---- surface over the world: light scrim, glass reads as glass ---- */
 .stage{
  background:
   radial-gradient(120% 90% at 50% 12%, rgba(44,56,84,0.42) 0%, rgba(20,27,42,0.58) 40%, rgba(10,14,22,0.72) 100%);
 }

 /* all layout scales with the system text size */
 .stage-scroll{
  font-size:calc(13px * var(--a11y-scale, 1));
  display:flex;flex-direction:column;
 }

 /* ---- three bands: words on top, the step's object at the centre
        (where the gaze reticle rests), words and actions below.
        Text lives only in the top and bottom bands. ---- */
 .band-top{flex:none;height:9.5em;padding:1.1em 2em 0;position:relative}
 .band-hero{flex:none;height:18.5em;display:grid;place-items:center}
 .band-bottom{flex:1;min-height:0;display:flex;flex-direction:column;padding:0.6em 2em 1.3em}
 /* the access step's hero ring is compact and its list is tall — rebalance */
 .stage-scroll[data-step="1"] .band-top{height:8em}
 .stage-scroll[data-step="1"] .band-hero{height:11.5em}

 .kicker{font-size:0.85em;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-40);line-height:1}
 .band-title{font-size:1.7em;font-weight:700;letter-spacing:-0.02em;line-height:1.15;color:var(--ink-100);margin-top:0.35em}
 .hairline{position:absolute;left:2em;right:2em;bottom:0;height:0.2em;border-radius:999px;background:rgba(255,255,255,0.10);overflow:hidden}
 .hairline > span{display:block;height:100%;width:20%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-strong));transition:width 260ms var(--ease-prism)}

 /* hero materials: translucent over the world, specular rim, two-layer shadow */
 .hero-tile{
  background:linear-gradient(165deg, rgba(32,44,64,0.60), rgba(12,18,28,0.72));
  backdrop-filter:saturate(1.6) blur(22px);
  -webkit-backdrop-filter:saturate(1.6) blur(22px);
  outline:1px solid rgba(255,255,255,0.14);
  border-radius:1.6em;
  box-shadow:0 14px 34px rgba(0,0,0,0.30), 0 3px 9px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.22);
 }
 .hero-stack{display:flex;flex-direction:column;align-items:center;gap:0.8em}

 /* welcome glasses */
 .glasses-svg{width:20em;height:8.5em;display:block}

 /* permissions trust ring */
 .ring-wrap{position:relative;width:8em;height:8em;display:grid;place-items:center}
 .ring-wrap svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
 .ring-track{stroke:rgba(255,255,255,0.14)}
 .ring-fill{stroke:var(--accent);transition:stroke-dashoffset 300ms var(--ease-prism)}
 .ring-core{width:3em;height:3em;border-radius:50%;display:grid;place-items:center;background:rgba(86,184,255,0.14);outline:1px solid rgba(86,184,255,0.26)}
 .ring-core svg{width:1.4em;height:1.4em}

 /* pairing */
 .qr-card{width:10.2em;height:10.2em;background:#fff;border-radius:1.1em;display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,0.32), 0 3px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.6)}
 .qr-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;width:8em;height:8em}
 .qr-cell{border-radius:14%;background:#0c1420}
 .qr-cell.off{background:transparent}
 .qr-cell.accent{background:var(--accent-strong)}
 .code-row{display:flex;gap:0.45em}
 .code-row .digit{
  width:1.6em;height:2em;border-radius:0.5em;
  background:rgba(255,255,255,0.07);outline:1px solid rgba(255,255,255,0.12);
  display:grid;place-items:center;
  font-size:1.3em;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-100);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.10);
 }
 .code-row .digit.hit{background:rgba(86,184,255,0.14);outline-color:rgba(86,184,255,0.3)}

 /* calibration dots */
 .dot-row{display:flex;gap:4.3em;align-items:center}
 .dot-target{
  appearance:none;-webkit-appearance:none;border:none;padding:0;cursor:pointer;
  width:4.3em;height:4.3em;border-radius:50%;
  background:rgba(255,255,255,0.08);
  outline:1px solid rgba(255,255,255,0.16);
  display:grid;place-items:center;position:relative;
  transition:transform 240ms var(--ease-prism), background 200ms var(--ease-prism), outline-color 200ms var(--ease-prism), box-shadow 200ms var(--ease-prism);
 }
 .dot-target::after{content:"";width:1em;height:1em;border-radius:50%;background:rgba(255,255,255,0.92);box-shadow:0 2px 6px rgba(0,0,0,0.25)}
 .dot-target.done{background:rgba(86,184,255,0.18);outline-color:rgba(86,184,255,0.5);box-shadow:0 0 0 2px rgba(86,184,255,0.14), 0 0 16px rgba(86,184,255,0.24)}
 .dot-target.done::after{background:var(--accent)}
 .dot-target.gaze-focus{transform:scale(1.08);outline-color:var(--stroke-focus)}
 .dot-target:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:3px}
 .dot-target .tick{position:absolute;inset:-0.3em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#04121f;opacity:0;transform:scale(0.6);transition:opacity 240ms var(--ease-prism), transform 240ms var(--ease-prism)}
 .dot-target .tick svg{width:55%;height:55%}
 .dot-target.done .tick{opacity:1;transform:scale(1)}

 /* medallions for done + edge states */
 .medal{width:7.4em;height:7.4em;border-radius:50%;display:grid;place-items:center;position:relative}
 .medal.ok{background:rgba(76,212,124,0.14);outline:1px solid rgba(76,212,124,0.3)}
 .medal.bad{background:rgba(255,93,93,0.12);outline:1px solid rgba(255,93,93,0.26)}
 .medal.warn{background:rgba(255,194,71,0.12);outline:1px solid rgba(255,194,71,0.26)}
 .medal.spin{background:rgba(86,184,255,0.10);outline:1px solid rgba(86,184,255,0.26)}
 .medal::before{content:"";position:absolute;inset:-0.7em;border-radius:50%;outline:1px dashed rgba(255,255,255,0.14)}
 .medal svg{width:2.8em;height:2.8em}
 .spin-ring{width:4.6em;height:4.6em;border-radius:50%;border:0.28em solid rgba(86,184,255,0.16);border-top-color:var(--accent);animation:ring-rotate 1.1s linear infinite}
 @keyframes ring-rotate{to{transform:rotate(360deg)}}

 /* bottom band copy */
 .copy{display:flex;flex-direction:column;gap:0.5em;align-items:center;text-align:center;width:100%}
 .copy p{font-size:1em;font-weight:500;color:var(--ink-80);line-height:1.45;max-width:27em}
 .copy .fine{font-size:0.85em;font-weight:600;color:var(--ink-40);letter-spacing:0.02em}
 .status-line{display:inline-flex;align-items:center;gap:0.5em;font-size:1em;font-weight:600;color:var(--ink-80);font-variant-numeric:tabular-nums}
 .state-chip{display:inline-flex;align-items:center;gap:0.45em;height:1.85em;padding:0 0.9em;border-radius:999px;font-size:0.85em;font-weight:700;letter-spacing:0.02em}
 .state-chip.ok{color:#bff1cf;background:rgba(76,212,124,0.13);outline:1px solid rgba(76,212,124,0.24)}
 .state-chip.bad{color:#ffc9c9;background:rgba(255,93,93,0.12);outline:1px solid rgba(255,93,93,0.22)}
 .state-chip.warn{color:#ffe3ab;background:rgba(255,194,71,0.12);outline:1px solid rgba(255,194,71,0.22)}
 .state-chip.info{color:#cfe9ff;background:rgba(86,184,255,0.12);outline:1px solid rgba(86,184,255,0.22)}
 .state-chip .pulse-dot{width:0.45em;height:0.45em;border-radius:50%;animation:soft-pulse 1.3s ease-in-out infinite}
 @keyframes soft-pulse{0%,100%{opacity:1}50%{opacity:0.35}}

 /* permission rows */
 .perm-stack{display:flex;flex-direction:column;gap:0.45em;width:100%}
 .perm-row{
  appearance:none;-webkit-appearance:none;border:none;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:0.8em;width:100%;
  padding:0.45em 0.75em;border-radius:1em;
  background:rgba(255,255,255,0.055);outline:1px solid rgba(255,255,255,0.09);color:var(--ink-100);
  font-family:inherit;
  transition:background 200ms var(--ease-prism), outline-color 200ms var(--ease-prism), transform 240ms var(--ease-prism);
 }
 .perm-row:hover{background:rgba(255,255,255,0.085)}
 .perm-row.gaze-focus{outline-color:var(--stroke-focus);transform:scale(1.015)}
 .perm-row:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .perm-ico{width:1.9em;height:1.9em;border-radius:0.6em;display:grid;place-items:center;flex:none;background:rgba(255,255,255,0.08);outline:1px solid rgba(255,255,255,0.1)}
 .perm-ico svg{width:1.1em;height:1.1em}
 .perm-name{flex:1;font-size:1em;font-weight:600;line-height:1.2}
 .perm-name small{display:block;font-size:0.85em;font-weight:500;color:var(--ink-40);margin-top:0.1em}
 .perm-check{width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,0.08);outline:1px solid rgba(255,255,255,0.12);transition:background 200ms var(--ease-prism), outline-color 200ms var(--ease-prism)}
 .perm-check svg{width:0.85em;height:0.85em;opacity:0;transition:opacity 200ms var(--ease-prism)}
 .perm-row[aria-checked="true"] .perm-check{background:var(--ok);outline-color:transparent}
 .perm-row[aria-checked="true"] .perm-check svg{opacity:1}

 /* actions */
 .actions{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:0.7em}
 .btn{
  appearance:none;-webkit-appearance:none;border:none;cursor:pointer;
  min-height:3em;padding:0 1.3em;border-radius:999px;
  font-family:inherit;font-size:1em;font-weight:700;letter-spacing:0.01em;
  display:inline-flex;align-items:center;justify-content:center;gap:0.5em;
  transition:transform 240ms var(--ease-prism), opacity 200ms var(--ease-prism), box-shadow 200ms var(--ease-prism), background 200ms var(--ease-prism);
 }
 .btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-strong));color:#04121f;box-shadow:0 8px 20px rgba(16,92,180,0.30), inset 0 1px 0 rgba(255,255,255,0.35)}
 .btn.primary.gaze-focus{box-shadow:0 0 0 2.5px var(--stroke-focus), 0 8px 20px rgba(16,92,180,0.30)}
 .btn.ghost{background:rgba(255,255,255,0.07);outline:1px solid rgba(255,255,255,0.1);color:var(--ink-80)}
 .btn.ghost.link{background:none;outline:none;color:var(--ink-40);font-weight:600;padding:0 0.6em}
 .btn.ghost.link:hover{color:var(--ink-80)}
 .btn:disabled{opacity:0.38;pointer-events:none}
 .btn.gaze-focus{transform:scale(1.03)}
 .btn:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .btn:active{transform:scale(0.97)}
 .grow{flex:1}

 /* success moment */
 @keyframes settle{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
 .settle{animation:settle 300ms var(--ease-prism)}

 :root[data-reduced-motion] *, *::before, *::after{
  animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;
 }
</style>
</head>
<body>
<div class="device">
 <div class="stage-shell">
  <div class="stage" data-stage></div>
 </div>
</div>
<script type="module">
import { createOS } from '/os/shared/core.js';
import { mountLab } from '/os/shared/lab.js';

const stage = document.querySelector('[data-stage]');
const os = createOS(stage, { dwell:true, dwellMs:350 });
stage.appendChild(os.statusbar('<span style="color:var(--ink-60);font-size:11px;letter-spacing:0.06em;font-weight:700">Setup</span>'));

const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
};
const rm = () => matchMedia('(prefers-reduced-motion: reduce)').matches
  || document.documentElement.hasAttribute('data-reduced-motion');
const fx = (node, frames, opts) => { if (node && !rm()) node.animate(frames, opts); };

/* ---- surface skeleton: three bands, re-rendered per step or edge state ---- */
const scroller = el('div', 'stage-scroll');
const bandTop = el('header', 'band-top');
const bandHero = el('section', 'band-hero');
const bandBottom = el('section', 'band-bottom');
scroller.append(bandTop, bandHero, bandBottom);
stage.appendChild(scroller);

const kicker = el('div', 'kicker');
const title = el('h1', 'band-title');
const hairline = el('div', 'hairline');
const fill = el('span');
hairline.appendChild(fill);
bandTop.append(kicker, title, hairline);

const hero = el('div', 'hero-stack');
bandHero.appendChild(hero);
const copyBox = el('div', 'copy');
const actions = el('div', 'actions');
bandBottom.append(copyBox, actions);

/* ---- finite timers, all cancelled on every render ---- */
const timers = new Set();
const later = (fn, ms) => { const t = setTimeout(() => { timers.delete(t); fn(); }, ms); timers.add(t); return t; };
const every = (fn, ms) => { const t = setInterval(fn, ms); timers.add(t); return t; };
const clearTimers = () => { for (const t of timers) { clearTimeout(t); clearInterval(t); } timers.clear(); };

/* ---- flow state ---- */
const params = new URLSearchParams(location.search);
let current = Math.min(4, Math.max(0, parseInt(params.get('step') || '0', 10) || 0));
let perms = { camera:false, mic:false, location:false };
let pairing = 'scanning';          /* scanning | found */
let scanStart = 0;
let code = ['4','8','2','9','1','7'];
let codeLeft = 45;
let locked = new Set();
let labApi = null;

const STEPS = [
  { kick:'Step 1 of 5 · Welcome',   name:'Welcome to Prism',          progress:20 },
  { kick:'Step 2 of 5 · Access',    name:'Choose what Prism may see', progress:40 },
  { kick:'Step 3 of 5 · Pair',      name:'Pair your phone',           progress:60 },
  { kick:'Step 4 of 5 · Calibrate', name:'Lock your gaze',            progress:80 },
  { kick:'Step 5 of 5 · Done',      name:'You’re ready',              progress:100 },
];

const svgWrap = (inner) => `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">${inner}</svg>`;
const ICONS = {
  camera: svgWrap('<rect x="3" y="7" width="13" height="10" rx="2.2" stroke="white" stroke-width="1.7"/><circle cx="9.5" cy="12" r="2.4" stroke="white" stroke-width="1.5"/><path d="M16.5 11l4-1.6v5.2l-4-1.6" stroke="white" stroke-width="1.4" stroke-linejoin="round"/>'),
  mic: svgWrap('<rect x="9" y="4.5" width="6" height="10" rx="3" stroke="white" stroke-width="1.6"/><path d="M6.5 11.5a5.5 5.5 0 0011 0M12 17v2.6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>'),
  pin: svgWrap('<path d="M12 20.5s5.5-4.6 5.5-8.7a5.5 5.5 0 10-11 0c0 4.1 5.5 8.7 5.5 8.7z" stroke="white" stroke-width="1.5"/><circle cx="12" cy="11.6" r="1.8" stroke="white" stroke-width="1.3"/>'),
  check: svgWrap('<path d="M5.5 12.5l4 4L18.5 7.5" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'),
  checkDark: svgWrap('<path d="M5.5 12.5l4 4L18.5 7.5" stroke="#04121f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'),
  warnTri: svgWrap('<path d="M12 3.6L21.4 19.4H2.6L12 3.6z" stroke="#ffb3b3" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 9.6v4.4" stroke="#ffb3b3" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="16.7" r="1.2" fill="#ffb3b3"/>'),
  wifiOff: svgWrap('<path d="M3.5 9.6a12 12 0 0117 0M6.2 12.7a8 8 0 0111.6 0M9 15.8a3.8 3.8 0 016 0" stroke="#ffe3ab" stroke-width="1.6" stroke-linecap="round"/><path d="M4 4l16 16" stroke="#ffe3ab" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="18.6" r="1.2" fill="#ffe3ab"/>'),
  camOff: svgWrap('<rect x="3" y="7" width="13" height="10" rx="2.2" stroke="#ffb3b3" stroke-width="1.6"/><path d="M16.5 11l4-1.6v5.2l-4-1.6" stroke="#ffb3b3" stroke-width="1.4" stroke-linejoin="round"/><path d="M3.5 3.5l17 17" stroke="#ff5d5d" stroke-width="1.8" stroke-linecap="round"/>'),
  glasses: `<svg class="glasses-svg" viewBox="0 0 260 110" fill="none" aria-hidden="true">
    <path d="M30 44a44 44 0 0188 0l-8 30H38l-8-30z" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="60" cy="58" r="4.5" fill="#fff"/><circle cx="88" cy="58" r="4.5" fill="#fff"/>
    <path d="M60 58a14 14 0 003 8.5M88 58a14 14 0 01-3 8.5" stroke="#56b8ff" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M142 44a44 44 0 0188 0l-8 30h-72l-8-30z" stroke="rgba(255,255,255,0.45)" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M118 40h24M186 40h24" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="74" cy="26" r="2" fill="#56b8ff"/>
    <path d="M52 92h156" stroke="rgba(255,255,255,0.16)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 6"/>
  </svg>`,
};

function paintChrome(stepIdx){
  const s = STEPS[stepIdx];
  kicker.textContent = s.kick;
  title.textContent = s.name;
  fill.style.width = s.progress + '%';
}
function say(html){ copyBox.innerHTML = html; }
function primary(id, label, extra=''){
  return `<button class="btn primary grow" data-focusable tabindex="0" id="${id}" ${extra}>${label}</button>`;
}
function link(id, label){
  return `<button class="btn ghost link" data-focusable tabindex="0" id="${id}">${label}</button>`;
}
function ghost(id, label){
  return `<button class="btn ghost" data-focusable tabindex="0" id="${id}">${label}</button>`;
}
function medallion(kind, icon){
  return `<div class="medal ${kind}" role="img" aria-label="${labelFor(icon)}">${ICONS[icon]}</div>`;
}
function labelFor(icon){
  return { check:'Complete', warnTri:'Failed', wifiOff:'No connection', camOff:'Camera blocked' }[icon] ?? 'Status';
}

/* ------------------------------- step: welcome ------------------------------ */
function renderWelcome(){
  hero.innerHTML = ICONS.glasses;
  say(`
    <p>A display over one eye, a 20° view, the world behind every pixel.
       Setup takes about <strong>2 minutes</strong>.</p>
    <span class="fine">Gaze to look · hold still to press · swipe back to undo</span>`);
  actions.innerHTML = link('skipWelcome', 'Skip for now') + primary('goWelcome', 'Get started');
  document.getElementById('goWelcome').addEventListener('click', () => goTo(1));
  document.getElementById('skipWelcome').addEventListener('click', () => {
    os.banner('<strong>Setup skipped</strong><span class="caption">You can finish it anytime in Settings.</span>', { timeout: 2200 });
    goTo(4);
  });
}

/* ------------------------------ step: access ------------------------------- */
const PERM_DEFS = [
  { key:'camera',  name:'Camera',     sub:'Photos · QR · world lock',  ico:'camera' },
  { key:'mic',     name:'Microphone', sub:'Wake words · captions',     ico:'mic' },
  { key:'location',name:'Location',   sub:'Nearby · weather',          ico:'pin' },
];
function renderPerms(){
  paintRing();
  say(`<div class="perm-stack" role="group" aria-label="Permissions">
    ${PERM_DEFS.map(p => `
      <button class="perm-row" data-focusable tabindex="0" role="switch"
        aria-checked="${perms[p.key]}" data-perm="${p.key}">
        <span class="perm-ico" aria-hidden="true">${ICONS[p.ico]}</span>
        <span class="perm-name">${p.name}<small>${p.sub}</small></span>
        <span class="perm-check" aria-hidden="true">${ICONS.checkDark}</span>
      </button>`).join('')}
  </div>`);
  actions.innerHTML = link('skipPerms', 'Decide later') + primary('goPerms', 'Allow all three to continue', 'disabled');
  hero.querySelectorAll('[data-perm]').forEach(row => {
    row.addEventListener('click', () => togglePerm(row.dataset.perm));
  });
  document.getElementById('skipPerms').addEventListener('click', () => {
    os.banner('<strong>Access deferred</strong><span class="caption">Apps will ask when they need it.</span>', { timeout: 2000 });
    goTo(2);
  });
  syncPermCta();
}
function ringStats(){
  const granted = PERM_DEFS.filter(p => perms[p.key]).length;
  return { granted, C: 2 * Math.PI * 40 };
}
function paintRing(){
  const { granted, C } = ringStats();
  hero.innerHTML = `
    <div class="ring-wrap" role="img" aria-label="${granted} of 3 permissions granted">
      <svg class="ring" viewBox="0 0 96 96" aria-hidden="true">
        <circle class="ring-track" cx="48" cy="48" r="40" fill="none" stroke-width="5"/>
        <circle class="ring-fill" cx="48" cy="48" r="40" fill="none" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - granted / 3)}"/>
      </svg>
      <div class="ring-core" aria-hidden="true">${ICONS.check}</div>
    </div>`;
}
function togglePerm(key){
  perms[key] = !perms[key];
  const row = hero.querySelector(`[data-perm="${key}"]`);
  row?.setAttribute('aria-checked', String(perms[key]));
  const { granted, C } = ringStats();
  const rf = hero.querySelector('.ring-fill');
  if (rf) rf.style.strokeDashoffset = String(C * (1 - granted / 3));
  hero.querySelector('.ring-wrap')?.setAttribute('aria-label', `${granted} of 3 permissions granted`);
  syncPermCta();
  if (granted === 3) {
    fx(hero.querySelector('.ring-wrap'), [{ transform:'scale(1)' }, { transform:'scale(1.04)' }, { transform:'scale(1)' }], { duration:300, easing:'cubic-bezier(0.32,0.72,0,1)' });
    os.banner('<strong>All access granted</strong><span class="caption">On-device only · revoke anytime in Settings.</span>', { timeout: 2200 });
  }
}
function syncPermCta(){
  const all = perms.camera && perms.mic && perms.location;
  const cta = document.getElementById('goPerms');
  if (!cta) return;
  cta.disabled = !all;
  cta.textContent = all ? 'Continue' : 'Allow all three to continue';
  if (all) cta.addEventListener('click', () => goTo(2), { once:true });
}

/* ------------------------------- step: pair -------------------------------- */
let digitsEl = null, pairStatusEl = null, pairCta = null;
function renderPair(){
  /* deterministic 9x9 mock code: three finder squares, one accent cell */
  const finder = (r, c) => (r < 3 && c < 3) || (r < 3 && c > 5) || (r > 5 && c < 3);
  const on = (r, c) => {
    if (finder(r, c)) {
      const border = r % 3 === 0 || c % 3 === 0;
      const inner = r % 3 === 1 && c % 3 === 1;
      return border || inner ? 1 : 0;
    }
    return (r * 9 + c) % 3 === 0 || (r * 7 + c * 5) % 4 === 0 ? 1 : 0;
  };
  const cells = [];
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
    cells.push(`<i class="qr-cell ${on(r, c) ? '' : 'off'} ${r === 4 && c === 4 ? 'accent' : ''}"></i>`);
  }
  hero.innerHTML = `
    <div class="qr-card hero-tile" role="img" aria-label="QR code: open the Prism app on your phone and scan">
      <div class="qr-grid" aria-hidden="true">${cells.join('')}</div>
    </div>`;
  say(`<div class="code-row" role="img" aria-label="Pairing code ${code.slice(0,3).join('')} ${code.slice(3).join('')}">
        ${code.map(d => `<span class="digit" aria-hidden="true">${d}</span>`).join('')}
       </div>
       <span class="status-line" role="status" id="pairStatus"></span>
       <span class="fine">Open the Prism app on your phone, then scan or type the code.</span>`);
  actions.innerHTML = ghost('pairTrouble', 'No phone nearby?') + primary('goPair', 'Pairing…', 'disabled');
  pairStatusEl = document.getElementById('pairStatus');
  pairCta = document.getElementById('goPair');
  document.getElementById('pairTrouble').addEventListener('click', () => labApi.setState('offline'));
  pairCta.addEventListener('click', () => { if (pairing === 'found') goTo(3); });
  syncPair();
  if (pairing === 'scanning') startScan();
  else startCountdown();
}
function startScan(){
  scanStart = Date.now();
  const tick = every(() => {
    const secs = Math.floor((Date.now() - scanStart) / 1000);
    if (pairStatusEl) pairStatusEl.textContent = `Searching nearby · ${secs} s`;
    if (secs >= 3) { clearInterval(tick); finishPair(); }
  }, 1000);
  if (pairStatusEl) pairStatusEl.textContent = 'Searching nearby · 0 s';
}
function startCountdown(){
  codeLeft = 45;
  const tick = every(() => {
    codeLeft -= 1;
    if (codeLeft <= 0) { clearInterval(tick); rotateCode(); startCountdown(); return; }
    if (pairStatusEl) pairStatusEl.textContent = `Connected · code refreshes in ${codeLeft} s`;
  }, 1000);
  if (pairStatusEl) pairStatusEl.textContent = `Connected · code refreshes in ${codeLeft} s`;
}
function finishPair(){
  pairing = 'found';
  syncPair();
  fx(hero.querySelector('.qr-card'), [{ transform:'scale(1)' }, { transform:'scale(1.03)' }, { transform:'scale(1)' }], { duration:300, easing:'cubic-bezier(0.32,0.72,0,1)' });
  os.banner('<strong>Phone paired</strong><span class="caption">Secure link · code verified on device.</span>', { timeout: 2200 });
}
function rotateCode(){
  code = Array.from({ length:6 }, () => String(Math.floor(Math.random() * 10)));
  digitsEl?.forEach((d, i) => {
    d.textContent = code[i];
    fx(d, [{ transform:'scale(0.9)' }, { transform:'scale(1)' }], { duration:200, easing:'cubic-bezier(0.32,0.72,0,1)' });
  });
  copyBox.querySelector('.code-row')?.setAttribute('aria-label', `Pairing code ${code.slice(0,3).join('')} ${code.slice(3).join('')}`);
}
function syncPair(){
  if (!pairCta) return;
  if (pairing === 'found') {
    pairCta.disabled = false;
    pairCta.textContent = 'Continue';
    digitsEl?.forEach(d => d.classList.add('hit'));
  } else {
    pairCta.disabled = true;
    pairCta.textContent = 'Pairing…';
    digitsEl?.forEach(d => d.classList.remove('hit'));
  }
}

/* ---------------------------- step: calibration ---------------------------- */
let calibStatusEl = null, calibCta = null;
function renderCalib(){
  paintDots();
  say(`<p>Look at each dot and hold still — the same press you’ll use everywhere.</p>
       <span class="status-line" role="status" id="calibStatus"></span>`);
  calibStatusEl = document.getElementById('calibStatus');
  actions.innerHTML = primary('goCalib', 'Continue', 'disabled');
  calibCta = document.getElementById('goCalib');
  calibCta.addEventListener('click', () => goTo(4));
  hero.querySelectorAll('[data-dot]').forEach(btn => {
    btn.addEventListener('click', () => lockDot(btn.dataset.dot, btn));
  });
  syncCalib();
}
function paintDots(){
  hero.innerHTML = `
    <div class="dot-row" role="group" aria-label="Three calibration dots, hold your gaze on each">
      ${[0,1,2].map(i => `
        <button class="dot-target ${locked.has(String(i)) ? 'done' : ''}" data-focusable tabindex="0"
          aria-label="Calibration dot ${i + 1} of 3${locked.has(String(i)) ? ', locked' : ''}"
          aria-pressed="${locked.has(String(i))}" data-dot="${i}">
          <span class="tick" aria-hidden="true">${ICONS.checkDark}</span>
        </button>`).join('')}
    </div>`;
}
function lockDot(id, btn){
  if (locked.has(id)) return;
  locked.add(id);
  btn.classList.add('done');
  btn.setAttribute('aria-pressed', 'true');
  btn.setAttribute('aria-label', `Calibration dot ${Number(id) + 1} of 3, locked`);
  fx(btn, [{ transform:'scale(1)' }, { transform:'scale(1.08)' }, { transform:'scale(1)' }], { duration:260, easing:'cubic-bezier(0.32,0.72,0,1)' });
  syncCalib();
  if (locked.size === 3) {
    os.banner('<strong>Gaze locked</strong><span class="caption">Calibration stored on device.</span>', { timeout: 2000 });
    later(() => { if (labApi?.state === 'ready' && current === 3) goTo(4); }, 800);
  }
}
function syncCalib(){
  if (calibStatusEl) calibStatusEl.textContent = `${locked.size} of 3 locked · hold each dot`;
  if (calibCta) calibCta.disabled = locked.size !== 3;
}

/* -------------------------------- step: done -------------------------------- */
function renderDone(){
  hero.innerHTML = medallion('ok', 'check');
  say(`<p>Gaze, voice and capture are live. Your home is one glance away.</p>
       <span class="state-chip ok"><span class="pulse-dot" style="background:var(--ok)"></span>3 of 3 access · paired · calibrated</span>`);
  actions.innerHTML = link('review', 'Review setup') + primary('enterPrism', 'Enter Prism');
  document.getElementById('review').addEventListener('click', () => goTo(0));
  document.getElementById('enterPrism').addEventListener('click', (e) => {
    fx(e.currentTarget, [{ transform:'scale(1)' }, { transform:'scale(1.03)' }, { transform:'scale(1)' }], { duration:300, easing:'cubic-bezier(0.32,0.72,0,1)' });
    os.banner('<strong>Welcome to Prism</strong><span class="caption">Say “Hey Prism” whenever you need me.</span>', { timeout: 2600 });
  });
}

/* ------------------------------- edge states ------------------------------- */
function renderEdge(state){
  if (state === 'loading') {
    kicker.textContent = 'Setup · one moment';
    title.textContent = 'Preparing your Prism';
    hero.innerHTML = `<div class="spin-ring" role="img" aria-label="Preparing"></div>`;
    say(`<p>Fetching your pairing code and calibration profile.</p>
         <span class="state-chip info"><span class="pulse-dot" style="background:var(--accent)"></span>Contacting your phone</span>`);
    actions.innerHTML = link('cancelLoad', 'Cancel');
    document.getElementById('cancelLoad').addEventListener('click', () => labApi.setState('ready'));
    later(() => {
      if (labApi?.state === 'loading') {
        labApi.setState('ready');
        os.banner('<strong>Setup ready</strong><span class="caption">Starting at welcome.</span>', { timeout: 1800 });
      }
    }, 2400);
    return;
  }
  if (state === 'empty') {
    kicker.textContent = 'Setup · nothing pending';
    title.textContent = 'Already set up';
    hero.innerHTML = medallion('ok', 'check');
    say(`<p>This pair of glasses already has access, a phone and a calibration profile.</p>
         <span class="state-chip ok">Configured · nothing to do</span>`);
    actions.innerHTML = link('replay', 'Replay setup') + primary('enter2', 'Enter Prism');
    document.getElementById('replay').addEventListener('click', () => resetFlow());
    document.getElementById('enter2').addEventListener('click', () => {
      os.banner('<strong>Welcome back</strong><span class="caption">Home is one glance away.</span>', { timeout: 2000 });
    });
    return;
  }
  if (state === 'error') {
    kicker.textContent = 'Pairing · failed';
    title.textContent = 'Pairing didn’t finish';
    hero.innerHTML = medallion('bad', 'warnTri');
    say(`<p>Your phone wasn’t reachable over Bluetooth. Nothing changed — the QR and code stay valid.</p>
         <span class="state-chip bad">PR-PAIR-503 · phone unreachable</span>
         <span class="fine">Keep the phone within arm’s reach, then retry.</span>`);
    actions.innerHTML = link('dismissErr', 'Dismiss') + primary('retryErr', 'Retry pairing');
    document.getElementById('dismissErr').addEventListener('click', () => labApi.setState('ready'));
    document.getElementById('retryErr').addEventListener('click', () => {
      pairing = 'scanning';
      labApi.setState('ready');
      goTo(2);
      os.banner('<strong>Searching again</strong><span class="caption">Bluetooth · nearby devices.</span>', { timeout: 1800 });
    });
    return;
  }
  if (state === 'offline') {
    kicker.textContent = 'Pairing · offline';
    title.textContent = 'No phone nearby';
    hero.innerHTML = medallion('warn', 'wifiOff');
    say(`<p>Bluetooth is up but no phone answered. Queue pairing and finish it later in Settings.</p>
         <span class="state-chip warn"><span class="pulse-dot" style="background:var(--warn)"></span>Bluetooth on · out of range</span>`);
    actions.innerHTML = link('pairLater', 'Pair later') + primary('tryAgain', 'Try again');
    document.getElementById('pairLater').addEventListener('click', () => {
      labApi.setState('ready');
      goTo(3);
      os.banner('<strong>Pairing queued</strong><span class="caption">Finish anytime in Settings → Phone.</span>', { timeout: 2200 });
    });
    document.getElementById('tryAgain').addEventListener('click', () => {
      pairing = 'scanning';
      labApi.setState('ready');
      goTo(2);
    });
    return;
  }
  if (state === 'denied') {
    kicker.textContent = 'Access · camera off';
    title.textContent = 'Camera is blocked';
    hero.innerHTML = medallion('bad', 'camOff');
    say(`<p>Without the camera Prism can’t take photos or scan codes. Everything else works.</p>
         <span class="state-chip bad">Camera denied · mic and location unaffected</span>`);
    actions.innerHTML = link('withoutCam', 'Continue without') + primary('allowCam', 'Allow camera');
    document.getElementById('allowCam').addEventListener('click', () => {
      perms.camera = true;
      labApi.setState('ready');
      goTo(1);
      os.banner('<strong>Camera allowed</strong><span class="caption">Capture and QR are live · on-device.</span>', { timeout: 2000 });
    });
    document.getElementById('withoutCam').addEventListener('click', () => {
      labApi.setState('ready');
      goTo(2);
      os.banner('<strong>Continuing without camera</strong><span class="caption">Allow it later in Settings → Privacy.</span>', { timeout: 2200 });
    });
    return;
  }
}

/* --------------------------------- routing --------------------------------- */
const RENDER = [renderWelcome, renderPerms, renderPair, renderCalib, renderDone];

function renderStep(){
  clearTimers();
  hero.innerHTML = '';
  copyBox.innerHTML = '';
  actions.innerHTML = '';
  paintChrome(current);
  scroller.dataset.step = String(current);
  RENDER[current]();
}
function goTo(i){
  current = Math.max(0, Math.min(4, i));
  if (labApi && labApi.state !== 'ready') labApi.setState('ready');
  else renderStep();
}
function resetFlow(){
  perms = { camera:false, mic:false, location:false };
  pairing = 'scanning';
  locked = new Set();
  current = 0;
  labApi.setState('ready');
  os.banner('<strong>Setup reset</strong><span class="caption">Back to welcome.</span>', { timeout: 1600 });
}
function renderState(state){
  if (state === 'ready') renderStep();
  else {
    clearTimers();
    hero.innerHTML = '';
    copyBox.innerHTML = '';
    actions.innerHTML = '';
    paintChrome(current);
    renderEdge(state);
  }
}

/* ------------------------------ hardware input ------------------------------ */
os.on('back', () => {
  if (labApi && labApi.state !== 'ready') { labApi.setState('ready'); return; }
  if (current > 0) goTo(current - 1);
});
os.on('swipeleft', () => {
  if (labApi && labApi.state !== 'ready') return;
  if (current === 1 && !(perms.camera && perms.mic && perms.location)) {
    os.banner('<strong>Allow access first</strong><span class="caption">Or choose “Decide later”.</span>', { timeout: 1600 });
    return;
  }
  if (current === 2 && pairing !== 'found') {
    os.banner('<strong>Pairing first</strong><span class="caption">Scan the code, or queue it for later.</span>', { timeout: 1600 });
    return;
  }
  if (current === 3 && locked.size !== 3) {
    os.banner('<strong>Hold each dot</strong><span class="caption">All three lock your gaze.</span>', { timeout: 1600 });
    return;
  }
  if (current < 4) goTo(current + 1);
});
os.on('swiperight', () => { if (labApi && labApi.state === 'ready' && current > 0) goTo(current - 1); });
os.on('capture', () => {
  const map = ['goWelcome', 'goPerms', 'goPair', 'goCalib', 'enterPrism'];
  document.getElementById(map[current])?.click();
});

/* ------------------------------- lab harness ------------------------------- */
labApi = mountLab({
  piece: '14-onboarding',
  title: 'Onboarding',
  states: ['ready', 'loading', 'empty', 'error', 'offline', 'denied'],
  onState: renderState,
  actions: [
    { label: 'Finish pairing now', run: () => {
        if (pairing !== 'scanning') return;
        if (current === 2 && labApi.state === 'ready') finishPair();
        else pairing = 'found';
      } },
    { label: 'Rotate pairing code', run: () => { if (current === 2 && labApi.state === 'ready') rotateCode(); } },
    { label: 'Grant all access', run: () => { PERM_DEFS.forEach(p => perms[p.key] = true); if (current === 1 && labApi.state === 'ready') renderStep(); } },
    { label: 'Reset flow', run: resetFlow },
  ],
});
</script>
