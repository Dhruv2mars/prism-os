<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism OS — Performance HUD</title>
<link rel="stylesheet" href="/os/shared/design-system.css">
<style>
 .stage{
  background:
   radial-gradient(120% 90% at 50% 14%, rgba(42,53,80,0.56) 0%, rgba(20,26,40,0.72) 36%, rgba(10,14,23,0.90) 70%),
   radial-gradient(68% 46% at 78% 86%, rgba(86,184,255,0.09), transparent 56%),
   rgba(6,10,16,0.76);
 }
 .stage-shell{
  position:relative;
  width:600px;height:600px;
  display:grid;place-items:center;
  flex:none;
 }
 /* DEV CHROME — fixed OUTSIDE .stage */
 .dev-controls{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;gap:6px;
  z-index:1000;
  justify-content:center;
  flex-wrap:wrap;
  pointer-events:none;
  padding:8px 12px;
  border-radius:var(--r-pill);
  background:rgba(10,15,23,0.74);
  outline:1px solid var(--stroke-glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 24px rgba(0,0,0,0.32);
  max-width:92vw;
 }
 .stage .dev-controls{display:none !important}
 .dev-controls .chip{
  pointer-events:auto;
  height:26px;padding:0 10px;
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  transition:background var(--dur-fast) var(--ease-prism), color var(--dur-fast) var(--ease-prism), transform var(--dur-fast) var(--ease-prism), outline-color var(--dur-fast) var(--ease-prism);
  border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
 }
 .dev-controls .chip.active{
  background:linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#051423;outline-color:transparent;
 }
 .dev-controls .chip:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .dev-controls .chip.gaze-focus{transform:scale(1.04)}

 /* HUD viewport */
 .hud-viewport{
  position:absolute;
  inset:44px 0 0 0;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px 12px 84px 12px;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:none;
 }
 .hud-viewport::-webkit-scrollbar{display:none}

 /* hero FPS card — focal */
 .hero-card{
  position:relative;
  flex:none;
  align-self:stretch;
  min-height:0;
  background:var(--mat-raised);
  backdrop-filter:var(--blur-heavy);
  -webkit-backdrop-filter:var(--blur-heavy);
  outline:1px solid rgba(86,184,255,0.14);
  border-radius:22px;
  padding:14px 14px 12px 14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.06);
  animation: rise-in 260ms var(--ease-prism) both;
 }
 .hero-card::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(90% 60% at 50% 0%, rgba(86,184,255,0.08), transparent 62%);
  pointer-events:none;
 }
 .hero-card *{position:relative;z-index:1}
 .hero-top{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex:none;
 }
 .hud-kicker{
  font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--ink-60);
  display:flex;align-items:center;gap:8px;
 }
 .hud-kicker .dot-thermal{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor;transition:background 260ms var(--ease-prism), color 260ms var(--ease-prism)}
 .dot-thermal.ok{color:var(--ok);background:var(--ok)}
 .dot-thermal.warn{color:var(--warn);background:var(--warn);box-shadow:0 0 10px rgba(255,194,71,0.5)}
 .dot-thermal.bad{color:var(--danger);background:var(--danger);box-shadow:0 0 10px rgba(255,93,93,0.5)}
 .thermal-label{font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-60)}
 .thermal-label.warn{color:var(--warn)}
 .thermal-label.bad{color:var(--danger)}
 .throttle-pill{
  display:inline-flex;align-items:center;gap:6px;
  height:24px;padding:0 10px;border-radius:999px;
  font-size:10px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;
  background:rgba(255,194,71,0.12);outline:1px solid rgba(255,194,71,0.22);color:var(--warn);
  transition:all 260ms var(--ease-prism);
 }
 .throttle-pill.bad{background:rgba(255,93,93,0.12);outline-color:rgba(255,93,93,0.22);color:var(--danger)}
 .throttle-pill.ok{opacity:0.0;transform:translateY(-4px);pointer-events:none}
 .hero-main{
  display:flex;align-items:baseline;gap:10px;
  flex:none;
 }
 .fps-val{
  font-size:44px;font-weight:800;letter-spacing:-0.04em;line-height:0.95;color:var(--ink-100);
    font-variant-numeric:tabular-nums;
  transition:color 260ms var(--ease-prism), transform 260ms var(--ease-prism);
 }
 .fps-val.drop{color:var(--danger)}
 .fps-unit{font-size:14px;font-weight:700;letter-spacing:0.06em;color:var(--ink-40);margin-left:2px}
 .fps-meta{
  margin-left:auto;
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;
 }
 .fps-sub{font-size:11px;font-weight:600;color:var(--ink-60);letter-spacing:0.02em;line-height:1}
  .fps-sub strong{color:var(--ink-80);font-weight:700;font-variant-numeric:tabular-nums}
  .fps-delta{font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-40);font-variant-numeric:tabular-nums}
 .fps-delta.good{color:var(--ok)}
 .fps-delta.warn{color:var(--warn)}
 .fps-delta.bad{color:var(--danger)}
 .spark-wrap{
  position:relative;
  flex:none;
  min-height:34px;
  height:34px;
  border-radius:10px;
  background:rgba(255,255,255,0.04);
  outline:1px solid rgba(255,255,255,0.06);
  overflow:hidden;
  cursor:crosshair;
 }
 .spark-wrap.scrubbable:hover{outline-color:rgba(86,184,255,0.18)}
 .spark-svg{
  width:100%;height:100%;display:block;
 }
 .spark-poly{
  fill:none;
  stroke:var(--accent);
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
  transition: d 260ms var(--ease-prism), stroke 260ms var(--ease-prism), opacity 260ms var(--ease-prism);
  filter:drop-shadow(0 0 6px rgba(86,184,255,0.35));
 }
 .spark-poly.warn{stroke:var(--warn);filter:drop-shadow(0 0 6px rgba(255,194,71,0.35))}
 .spark-poly.bad{stroke:var(--danger);filter:drop-shadow(0 0 6px rgba(255,93,93,0.35))}
 .spark-grid{
  position:absolute;inset:0;display:flex;align-items:stretch;pointer-events:none;opacity:0.24;
 }
 .spark-grid span{flex:1;border-right:1px dashed rgba(255,255,255,0.07)}
 .spark-grid span:last-child{border:none}
 .scrub-line{
  position:absolute;top:0;bottom:0;width:1px;background:rgba(86,184,255,0.9);box-shadow:0 0 8px rgba(86,184,255,0.6);
  opacity:0;pointer-events:none;transition:opacity 160ms var(--ease-prism);
 }
 .scrub-dot{
  position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--accent);
  box-shadow:0 2px 8px rgba(0,0,0,0.32), 0 0 10px rgba(86,184,255,0.6);
  transform:translate(-50%,-50%);opacity:0;pointer-events:none;transition:opacity 160ms var(--ease-prism);
 }
 .scrub-tip{
  position:absolute;bottom:100%;transform:translateX(-50%);
  background:rgba(10,15,23,0.92);outline:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:5px 8px;border-radius:10px;
    font-size:11px;font-weight:700;letter-spacing:-0.01em;color:var(--ink-100);font-variant-numeric:tabular-nums;
  white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 160ms var(--ease-prism), transform 160ms var(--ease-prism);
  box-shadow:0 8px 22px rgba(0,0,0,0.32);
 }
 .spark-wrap.is-scrubbing .scrub-line,.spark-wrap.is-scrubbing .scrub-dot,.spark-wrap.is-scrubbing .scrub-tip{opacity:1}
 .spark-axis{
  display:flex;justify-content:space-between;align-items:center;
  font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-40);margin-top:4px;
  flex:none;
 }
  .spark-axis strong{font-variant-numeric:tabular-nums;color:var(--ink-60);font-weight:700}

 /* metrics grid 2x2 */
 .metric-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  flex:none;
  align-self:stretch;
 }
 .metric-card{
  background:var(--mat-glass);
  backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  border-radius:18px;
  padding:12px 12px 10px 12px;
  display:flex;flex-direction:column;gap:8px;
  box-shadow:0 12px 28px rgba(0,0,0,0.18);
  position:relative;overflow:hidden;
  transition:transform 260ms var(--ease-prism), outline-color 160ms var(--ease-prism), background 160ms var(--ease-prism);
  animation: rise-in 260ms var(--ease-prism) both;
  min-height:0;
 }
 .metric-card:nth-child(1){animation-delay:40ms}
 .metric-card:nth-child(2){animation-delay:70ms}
 .metric-card:nth-child(3){animation-delay:100ms}
 .metric-card:nth-child(4){animation-delay:130ms}
 .metric-card.gaze-focus{outline-color:var(--stroke-focus);background:rgba(86,184,255,0.06);transform:scale(1.01)}
 .metric-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
 }
 .metric-label{
  font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-60);display:flex;align-items:center;gap:6px;
 }
 .metric-icon{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,0.07);outline:1px solid rgba(255,255,255,0.07);color:var(--ink-80)}
 .metric-icon.accent{background:linear-gradient(180deg, var(--accent), var(--accent-strong));color:#04121f;outline-color:transparent;box-shadow:0 4px 10px rgba(16,92,180,0.22)}
 .metric-icon.warn{background:linear-gradient(180deg,#ffc247,#ff9a1a);color:#1a0f00}
 .metric-icon.danger{background:linear-gradient(180deg,#ff5d5d,#d93030);color:#fff}
  .metric-value{font-size:20px;font-weight:800;letter-spacing:-0.02em;line-height:1;color:var(--ink-100);font-variant-numeric:tabular-nums;transition:color 260ms var(--ease-prism)}
 .metric-value small{font-size:11px;font-weight:700;letter-spacing:0.06em;color:var(--ink-40);margin-left:2px}
 .metric-sub{font-size:11px;font-weight:600;color:var(--ink-60);line-height:1;letter-spacing:0.01em;display:flex;align-items:center;gap:6px}
 .metric-sub .dot{width:6px;height:6px}
 .spark-mini{
  height:26px;
  min-height:26px;
 }

 /* histogram */
 .histo-card{
  background:var(--mat-glass);
  backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  border-radius:18px;
  padding:12px 12px 10px 12px;
  display:flex;flex-direction:column;gap:8px;
  box-shadow:0 12px 28px rgba(0,0,0,0.18);
  animation: rise-in 260ms var(--ease-prism) both;
  animation-delay:160ms;
  position:relative;overflow:hidden;
  flex:none;align-self:stretch;min-height:0;
 }
 .histo-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
 .histo-title{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-60);display:flex;align-items:center;gap:6px}
 .histo-bars{
  display:flex;align-items:flex-end;gap:3px;
  height:52px;
  padding:6px 6px 0 6px;
  background:rgba(255,255,255,0.04);
  outline:1px solid rgba(255,255,255,0.06);
  border-radius:12px;
  overflow:hidden;
 }
 .histo-bar{
  flex:1;
  background:rgba(86,184,255,0.18);
  border-radius:4px 4px 0 0;
  position:relative;
  min-height:2px;
  transition:height 260ms var(--ease-prism), background 260ms var(--ease-prism), opacity 260ms var(--ease-prism);
 }
 .histo-bar i{
  position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(180deg, var(--accent), var(--accent-strong));
  border-radius:4px 4px 0 0;
  transition:height 260ms var(--ease-prism), background 260ms var(--ease-prism);
  box-shadow:0 -2px 8px rgba(86,184,255,0.25);
 }
 .histo-bar.warn i{background:linear-gradient(180deg, #ffc247, #ff9a1a);box-shadow:0 -2px 8px rgba(255,194,71,0.25)}
 .histo-bar.bad i{background:linear-gradient(180deg, #ff5d5d, #c62828);box-shadow:0 -2px 8px rgba(255,93,93,0.25)}
 .histo-bar.dropPulse{animation: barPulse 420ms var(--ease-prism)}
 @keyframes barPulse{0%{transform:scaleY(1)}35%{transform:scaleY(1.10)}100%{transform:scaleY(1)}}
 .histo-legend{
  display:flex;gap:8px;align-items:center;justify-content:space-between;
  font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-40);
 }
 .legend-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
 .legend-row{display:flex;gap:6px;align-items:center}

 /* sim controls strip — inside stage */
 .sim-card{
  background:var(--mat-glass);
  backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  outline:1px solid var(--stroke-glass);
  border-radius:18px;
  padding:12px;
  display:flex;flex-direction:column;gap:10px;
  box-shadow:0 12px 28px rgba(0,0,0,0.18);
  animation: rise-in 260ms var(--ease-prism) both;
  animation-delay:180ms;
  flex:none;align-self:stretch;min-height:0;
 }
 .sim-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
 .sim-title{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-40)}
 .sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .sim-row{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.05);outline:1px solid rgba(255,255,255,0.06);
  padding:10px 10px;border-radius:14px;
  transition:background 160ms var(--ease-prism), outline-color 160ms var(--ease-prism);
  cursor:pointer;
 }
 .sim-row.gaze-focus{outline-color:var(--stroke-focus);background:rgba(86,184,255,0.08)}
 .sim-row:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .sim-label{font-size:11px;font-weight:700;color:var(--ink-80);letter-spacing:0.02em;flex:1;min-width:0;line-height:1}
 .sim-sub{font-size:10px;font-weight:600;color:var(--ink-40);letter-spacing:0.04em;text-transform:uppercase;margin-top:2px}
 .seg{
  display:inline-flex;gap:2px;padding:3px;border-radius:999px;
  background:rgba(255,255,255,0.07);outline:1px solid rgba(255,255,255,0.07);
 }
 .seg-btn{
  appearance:none;-webkit-appearance:none;border:none;
  height:26px;padding:0 10px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  color:var(--ink-60);background:transparent;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  transition:background 160ms var(--ease-prism), color 160ms var(--ease-prism), transform 160ms var(--ease-prism), box-shadow 160ms var(--ease-prism);
 }
 .seg-btn[aria-pressed="true"]{background:linear-gradient(180deg,var(--accent),var(--accent-strong));color:#051423;box-shadow:0 4px 12px rgba(16,92,180,0.22)}
 .seg-btn.gaze-focus{transform:scale(1.04)}
 .seg-btn:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .battery-toggle-row{display:flex;align-items:center;gap:10px}
 .stress-btn{
  appearance:none;-webkit-appearance:none;border:none;
  height:40px;border-radius:999px;padding:0 16px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:13px;font-weight:800;letter-spacing:0.01em;
  background:linear-gradient(180deg, #ff7a7a, #ff3b3b);color:#fff;
  box-shadow:0 8px 18px rgba(255,60,60,0.22);cursor:pointer;
  transition:transform 260ms var(--ease-prism), box-shadow 160ms var(--ease-prism), opacity 160ms var(--ease-prism);
  flex:1;
 }
 .stress-btn:disabled{opacity:0.42;pointer-events:none}
 .stress-btn.gaze-focus{transform:scale(1.03);box-shadow:0 0 0 2.5px var(--stroke-focus), 0 10px 22px rgba(16,92,180,0.18)}
 .stress-btn:active{transform:scale(0.97)}
 .stress-btn:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 .stress-hint{font-size:11px;font-weight:600;color:var(--ink-40);text-align:center;line-height:1.3}

 /* hintbar inside stage */
 .hintbar{
  position:absolute;left:12px;right:12px;bottom:10px;z-index:540;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:12px;
  background:rgba(0,0,0,0.38);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  outline:1px solid rgba(255,255,255,0.06);
  font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-60);line-height:1;
 }
 .hintbar strong{color:var(--ink-80);font-weight:700;letter-spacing:0.02em;text-transform:none;font-size:11px}
 .hint-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(86,184,255,0.6);flex:none;display:inline-block}

 /* state layer edge states — inside stage */
 .state-layer{
  position:absolute;inset:44px 0 0 0;z-index:520;
  display:none;overflow-y:auto;scrollbar-width:none;
  padding:12px 12px 72px 12px;
 }
 .state-layer::-webkit-scrollbar{display:none}
 .state-layer.on{display:block;animation: rise-in 260ms var(--ease-prism) both}
 .state-layer.dim-on{display:grid;place-items:center;padding:12px 12px 72px 12px;animation: rise-in 260ms var(--ease-prism) both}
 .state-card{
  width:100%;max-width:420px;
  background:var(--mat-raised);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  outline:1px solid var(--stroke-glass);border-radius:var(--r-lg);
  padding:24px 20px 18px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
  box-shadow:0 18px 44px rgba(0,0,0,0.36);animation: rise-in 260ms var(--ease-prism) both;position:relative;overflow:hidden;
 }
 .state-card::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 8%, rgba(86,184,255,0.08), transparent 62%);pointer-events:none}
 .state-illus{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.08);margin-bottom:2px;position:relative}
 .state-illus.danger{background:rgba(255,93,93,0.10);outline-color:rgba(255,93,93,0.18)}
 .state-illus.warn{background:rgba(255,194,71,0.10);outline-color:rgba(255,194,71,0.18)}
 .state-title{font-size:18px;font-weight:800;letter-spacing:-0.02em;color:var(--ink-100);line-height:1.1;position:relative}
 .state-body{font-size:13px;font-weight:500;color:var(--ink-60);line-height:1.45;max-width:300px;position:relative}
 .state-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:2px;position:relative}
 .state-actions .btn{min-height:36px;font-size:13px}
 .cached-strip{
  width:100%;max-width:420px;
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:10px 12px;
  font-size:11px;font-weight:600;color:var(--ink-60);text-align:left;
 }
 .offline-dim{
  position:absolute;inset:0;background:rgba(4,7,11,0.28);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);pointer-events:none;
 }

 button:focus-visible, [data-focusable]:focus-visible{outline:2.5px solid var(--stroke-focus);outline-offset:2px}
 @media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}
 }
</style>
</head>
<body>
<div class="device">
 <div class="stage-shell">
  <div class="stage" data-stage></div>
 </div>
</div>
<script type="module">
import { createOS } from '/os/shared/core.js';
import { hardenGaze } from '/os/shared/lab.js';
const stage = document.querySelector('[data-stage]');
const device = document.querySelector('.device');
const os = createOS(stage, { dwell:true, dwellMs:350 });
// os.statusbar() — required HUD shell
stage.appendChild(os.statusbar('<span style="color:var(--ink-60);font-size:11px;letter-spacing:0.04em;font-weight:700">Performance · Live</span>'));

const h = (tag, attrs={}, ...children)=>{
 const el=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs)){
  if(k==='class') el.className=v;
  else if(k==='html') el.innerHTML=v;
  else if(v!==null && v!==undefined) el.setAttribute(k,v);
 }
 for(const c of children){
  if(c==null) continue;
  if(typeof c==='string') el.appendChild(document.createTextNode(c));
  else el.appendChild(c);
 }
 return el;
};

/* helpers */
function clamp(v,min,max){ return Math.max(min, Math.min(max,v)); }
function avg(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function pointsFor(arr, w, h, min, max){
 if(arr.length<2) return "";
 const pts=[];
 for(let i=0;i<arr.length;i++){
  const x=(i/(arr.length-1))*w;
  const norm=(arr[i]-min)/(max-min);
  const y=h - clamp(norm,0,1)*h;
  pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
 }
 return pts.join(" ");
}
function histoBuckets(times){
 // map times 0-42ms into 12 buckets
 const buckets = Array(12).fill(0);
 const counts = Array(12).fill(0);
 times.forEach(t=>{
  const idx = clamp(Math.floor((t/36)*12),0,11);
  buckets[idx] += t;
  counts[idx]++;
 });
 // avg per bucket or 0
 return buckets.map((sum,i)=> counts[i]? sum/counts[i] : 0);
}

function thermalMeta(t){
 if(t==='nominal') return {temp:36 + Math.round(Math.random()*4), label:'Nominal', sub:'no throttle', dot:'ok', pill:'ok', pillText:'Throttling · Off'};
 if(t==='warn') return {temp:52 + Math.round(Math.random()*3), label:'Warn', sub:'mild · -12%', dot:'warn', pill:'warn', pillText:'Throttling · Mild'};
 return {temp:68 + Math.round(Math.random()*5), label:'Bad', sub:'active · -28%', dot:'bad', pill:'bad', pillText:'Throttling · Active'};
}

 document.getElementById('fpsMinMax').textContent = `${Math.round(Math.min(...fpsHistory))} – ${Math.round(Math.max(...fpsHistory))} FPS`;

 document.getElementById('thermVal').textContent = tm.temp;

/* scrub logic — earned detail */
function attachScrub(wrapId, polyId, history, unit, formatter){
 const wrap=document.getElementById(wrapId);
 const line=document.getElementById(wrapId.replace('Wrap','Line').replace('wrap','Line'));
 // Actually id mapping: fpsSparkWrap -> fpsScrubLine etc. Use specific ids
 const map={
  fpsSparkWrap:{line:'fpsScrubLine',dot:'fpsScrubDot',tip:'fpsScrubTip'},
  memSparkWrap:{line:'memScrubLine',dot:'memScrubDot',tip:'memScrubTip'},
  battSparkWrap:{line:'battScrubLine',dot:'battScrubDot',tip:'battScrubTip'},
  latSparkWrap:{line:'latScrubLine',dot:'latScrubDot',tip:'latScrubTip'},
 };
 const ids=map[wrapId];
 if(!ids) return;
 const scrubLine=document.getElementById(ids.line);
 const scrubDot=document.getElementById(ids.dot);
 const scrubTip=document.getElementById(ids.tip);
 const svg=wrap.querySelector('svg');
 let active=false;
 function showAt(clientX){
  const rect=wrap.getBoundingClientRect();
  const x= clamp(clientX - rect.left, 0, rect.width);
  const pct= x/rect.width;
  const idx= clamp(Math.round(pct*(history().length-1)),0,history().length-1);
  const val= history()[idx];
  const age = history().length-1-idx;
  const svgRect=svg.getBoundingClientRect();
  // compute y for dot from normalized
  let min,max;
  if(wrapId==='fpsSparkWrap'){ min=18; max=96; }
  else if(wrapId==='memSparkWrap'){ min=280; max=720; }
  else if(wrapId==='battSparkWrap'){ min=42; max=100; }
  else { min=8; max=64; }
  const norm=(val-min)/(max-min);
  const y = (1-clamp(norm,0,1))*wrap.clientHeight;
  scrubLine.style.left=x+'px';
  scrubDot.style.left=x+'px';
  scrubDot.style.top=y+'px';
  scrubTip.style.left=x+'px';
  scrubTip.textContent = formatter(val, age, idx);
  // keep tip inside
  requestAnimationFrame(()=>{
   const tipRect=scrubTip.getBoundingClientRect();
   const wrapRect=wrap.getBoundingClientRect();
   let tx = x;
   if(tipRect.left < wrapRect.left+4) tx = (tipRect.width/2)+4;
   else if(tipRect.right > wrapRect.right-4) tx = wrapRect.width - (tipRect.width/2)-4;
   scrubTip.style.left=tx+'px';
  });
  wrap.classList.add('is-scrubbing');
 }
 wrap.addEventListener('pointermove', (e)=>{
  showAt(e.clientX);
  active=true;
 });
 wrap.addEventListener('pointerenter', (e)=>{ showAt(e.clientX); });
 wrap.addEventListener('pointerleave', ()=>{
  wrap.classList.remove('is-scrubbing');
  active=false;
 });
 wrap.addEventListener('click', (e)=>{
  showAt(e.clientX);
  wrap.animate([{transform:'scale(1)'},{transform:'scale(1.01)'},{transform:'scale(1)'}],{duration:260,easing:'cubic-bezier(0.32,0.72,0,1)'});
 });
 // keyboard scrub via arrows
 wrap.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
   e.preventDefault();
   const rect=wrap.getBoundingClientRect();
   // simulate move 8% left/right
   const curLine = parseFloat(scrubLine.style.left)|| rect.width/2;
   const delta = e.key==='ArrowLeft' ? -rect.width/10 : rect.width/10;
   const nx = clamp(curLine+delta,0,rect.width);
   showAt(rect.left+nx);
  }
 });
}
attachScrub('fpsSparkWrap', 'fpsPoly', ()=>fpsHistory, 'FPS', (v,age)=> `${Math.round(v)} FPS · -${age}s`);
attachScrub('memSparkWrap','memPoly', ()=>memHistory,'MB', (v,age)=> `${Math.round(v)} MB · -${age}s`);
attachScrub('battSparkWrap','battPoly', ()=>battHistory,'%', (v,age)=> `${Math.round(v)}% · -${age}s`);

/* simulation ticks */
function simStep(){
 // base by load
 let fpsBase, memAdd, latBaseLocal;
 if(load==='low'){
  fpsBase = stressing ? 28 + Math.random()*6 : 88 + (thermal==='bad'? -14 : thermal==='warn'? -8 : 0) + (Math.random()*4-2);
  memAdd = 398 + Math.random()*24 + (thermal==='bad'? 30:0);
  latBaseLocal = 16 + Math.random()*5 + (thermal==='bad'? 18 : thermal==='warn'? 9 : 0) + (stressing? 22:0);
 } else {
  fpsBase = stressing ? 24 + Math.random()*8 : 62 + (thermal==='bad'? -18 : thermal==='warn'? -10 : 0) + (Math.random()*8-4);
  memAdd = 560 + Math.random()*48 + (thermal==='bad'? 40:0);
  latBaseLocal = 32 + Math.random()*10 + (thermal==='bad'? 16 : thermal==='warn'? 8 : 0) + (stressing? 18:0);
 }
 // clamp fps
 fpsBase = clamp(fpsBase, 18, 96);
 fpsHistory.push(fpsBase);
 if(fpsHistory.length>30) fpsHistory.shift();
 memHistory.push(memAdd);
 if(memHistory.length>30) memHistory.shift();
 latHistory.push(clamp(latBaseLocal,8,64));
 if(latHistory.length>30) latHistory.shift();
 battHistory.push(clamp(battery, 38, 100));
 if(battHistory.length>30) battHistory.shift();

 // frame times: derived from fps
 const ft = 1000 / fpsBase;
 // add jitter
 const jitter = (Math.random()*4-2) + (stressing ? 12 : 0) + (thermal==='bad'? 6 : 0);
 const newFT = clamp(ft + jitter, 6, 42);
 frameTimes.push(newFT);
 if(frameTimes.length>24) frameTimes.shift();

 renderAll();
}

}

     <div class="state-title">Sensors blocked</div>
     <div class="state-body">Prism needs performance access to show HUD — frame rate, thermal and battery stay on-device. Allow to see live graphs with glass scrub.</div>
     <div class="state-actions">
      <button class="btn primary" data-focusable tabindex="0" aria-label="Allow performance sensors">Allow access</button>
      <button class="btn ghost" data-focusable tabindex="0" aria-label="Not now, dismiss">Not now</button>
     </div>
     <p class="caption" style="color:var(--ink-40)">Settings → Privacy → Performance</p>
     <div style="width:100%;background:rgba(255,255,255,0.06);outline:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;text-align:left">
      <span class="dot warn" aria-hidden="true"></span><span style="font-size:12px;font-weight:600;color:var(--ink-80)">Performance blocked</span><button class="chip" data-focusable tabindex="0" aria-label="Open Settings" style="margin-left:auto;height:28px">Open Settings</button>
     </div>
    </div>
   </div>
  `;
  stateLayer.querySelectorAll('button').forEach(b=>{
   b.addEventListener('click', ()=>{
    if(b.textContent.includes('Allow access')){
     b.textContent='Allowing…';
     setTimeout(()=>{ setEdge('normal'); os.banner('<strong>Access granted</strong><span class="caption">sensors live · 90 FPS</span>',{timeout:1800}); b.textContent='Allow access'; }, 700);
    } else if(b.textContent.includes('Not now')){
     setEdge('normal');
    } else if(b.textContent.includes('Open Settings')){
     b.textContent='Opening…';
     setTimeout(()=>{ setEdge('normal'); os.banner('<strong>Settings</strong><span class="caption">Privacy · Performance</span>',{timeout:1600}); b.textContent='Open Settings'; }, 700);
    }
   });
  });
  return;
 }
}

// expose for probe
window.__setHUDVariant = setEdge;
window.__hud = { setEdge, getState: ()=>({thermal, load, battery, batteryDrain, fpsHistory}) };

setEdge('normal');

// Tab handling include dev controls
document.addEventListener('keydown', (e)=>{
 if(e.key!=='Tab') return;
 const all=[...document.querySelectorAll('[data-focusable],button,a,[role="button"],[role="tab"],input,[role="switch"]')].filter(el=> el.offsetParent!==null && !el.hasAttribute('disabled') && el.getAttribute('aria-hidden')!=='true');
 if(all.length<2) return;
 const active=document.activeElement;
 const idx=all.indexOf(active);
 if(idx===-1) return;
 const forward=!e.shiftKey;
 e.preventDefault();
 e.stopPropagation();
 e.stopImmediatePropagation();
 const next=forward ? (idx+1)%all.length : (idx-1+all.length)%all.length;
 all[next].focus({preventScroll:true});
 all.forEach(el=> el.classList.remove('gaze-focus'));
 all[next].classList.add('gaze-focus');
 setTimeout(()=> all[next].classList.remove('gaze-focus'), 900);
}, true);

// gaze focus class for dev chips (pointermove already via core)
devRow.querySelectorAll('.chip').forEach(c=> c.addEventListener('pointerenter', ()=> c.classList.add('gaze-focus')));

// ensure focus ring visible starting at viewport first focusable
setTimeout(()=> {
 const first = viewport.querySelector('[data-focusable]');
 if(first) first.focus({preventScroll:true});
}, 300);

hardenGaze();

console.log('Prism HUD ready — FPS , thermal dot, battery/mem/lat spark, histo, throttling, scrub delight, 6 edge states, probe clean');
</script>
