<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prism runtime harness</title>
<style>
  body { margin: 0; background: #0a0e14; }
  #frames { position: relative; width: 520px; height: 340px; }
  iframe.app-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- A bare host for the app runtime with no design on it at all. Its only job
     is to let tools/test-runtime.mjs drive the platform directly, so a runtime
     failure is never confused with a layout failure on the Web Apps surface. -->
<div id="frames"></div>
<script type="module">
  import { AppRuntime } from '/os/shared/app-runtime.js';
  const rt = new AppRuntime({ container: document.getElementById('frames') });
  const log = [];
  for (const ev of ['installed', 'install-failed', 'launching', 'ready', 'unresponsive',
                    'permission-request', 'prompt-closed', 'permission-changed', 'notification',
                    'badge', 'suspended', 'resumed', 'killed', 'uninstalled', 'call', 'online-changed']) {
    rt.on(ev, (d) => {
      log.push({ ev, id: d?.id ?? d?.appId ?? null, name: d?.name ?? d?.method ?? null,
                 text: d?.text ?? d?.title ?? null, state: d?.state ?? d?.decision ?? null });
    });
  }
  window.rt = rt;
  window.rtLog = log;
  window.rtReady = true;
</script>
</body>
</html>
